services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: uniportal-db
    environment:
      POSTGRES_USER: ${DB_USER:-uniportal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${DB_NAME:-university_portal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-py/alembic/versions:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-uniportal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uniportal-network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: uniportal-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uniportal-network

  # Python FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: uniportal-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-uniportal}:${DB_PASSWORD:-postgres_dev_password}@postgres:5432/${DB_NAME:-university_portal}}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/1}
      API_PORT: ${API_PORT:-8080}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-dev_secret_key_change_in_production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend-py:/app
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - uniportal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: uniportal-celery-worker
    command: celery -A app.tasks worker -l info --concurrency=4
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-uniportal}:${DB_PASSWORD:-postgres_dev_password}@postgres:5432/${DB_NAME:-university_portal}}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./backend-py:/app
    networks:
      - uniportal-network
    restart: unless-stopped

  # Celery Beat Scheduler
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: uniportal-celery-beat
    command: celery -A app.tasks beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-uniportal}:${DB_PASSWORD:-postgres_dev_password}@postgres:5432/${DB_NAME:-university_portal}}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/1}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./backend-py:/app
    networks:
      - uniportal-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: uniportal-web
    environment:
      VITE_API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api}
      NODE_ENV: ${FRONTEND_ENV:-development}
    depends_on:
      - backend
    volumes:
      - ./artifacts:/app/artifacts
      - ./lib:/app/lib
      - ./scripts:/app/scripts
      - /app/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"
    networks:
      - uniportal-network
    restart: unless-stopped

  # Optional: Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: uniportal-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - uniportal-network
    restart: unless-stopped

networks:
  uniportal-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local
