services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: uniportal-db
    environment:
      POSTGRES_USER: ${DB_USER:-dev_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Nepal123}
      POSTGRES_DB: ${DB_NAME:-uni_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-py/alembic/versions:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      # test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME -h localhost -p 5432 || exit 1"]
      test: ["CMD-SHELL", "pg_isready -U dev_user -d uni_db -h localhost -p 5432 || exit 1"]

      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uniportal-network
    env_file:
      - ./.env

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: uniportal-redis
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uniportal-network
    env_file:
      - ./.env

  # Python FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: uniportal-api
    command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:${PORT:-8000} --timeout 120

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend-py:/app
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - uniportal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    env_file:
      - ./backend-py/.env

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: uniportal-celery-worker
    command: celery -A app.tasks.celery_app worker -l info --concurrency=4
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./backend-py:/app
    networks:
      - uniportal-network
    restart: unless-stopped
    env_file:
      - ./backend-py/.env

  # Celery Beat Scheduler
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: uniportal-celery-beat
    command: celery -A app.tasks.celery_app beat -l info
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./backend-py:/app
    networks:
      - uniportal-network
    restart: unless-stopped
    env_file:
      - ./backend-py/.env

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: uniportal-web
    
    command: sh -c "pnpm run dev --host"

    depends_on:
      - backend
    volumes:
      - ./artifacts:/app/artifacts
      - ./artifacts/university-portal:/app
      # - ./artifacts/university-portal/dist:/app/dist
      - ./lib:/app/lib
      - ./scripts:/app/scripts
      - /app/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"
    networks:
      - uniportal-network
    restart: unless-stopped
    env_file:
      - ./.client.env

  # Optional: Nginx Reverse Proxy
  nginx:
    image: nginx:latest
    ports:
      - 80:80
    volumes:
# Update this line to point to nginx.conf
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./artifacts/university-portal/dist:/var/www/client:ro
    depends_on:
      - backend

networks:
  uniportal-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local
