# Birmingham City University (BCU)
# Hostname: www.bcu.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Slug: bcu
#
# ── ARCHITECTURE (verified on the live site) ──────────────────────────────────
# Server-rendered HTML CMS (.NET / Optimizely). NOT a JS SPA for discovery —
# every course link is present in the static HTML of the search results page.
# No JSON/Algolia/SearchStax/GraphQL course API is exposed; the search is a
# plain server-rendered, query-string-paginated page.
#
# Course catalogue  : 386 courses (all levels, 2025/26 + 2026/27 entry)
# Listing endpoint  : /courses/search   (facets: type=level, mode=attendance)
#                       type=1 Foundation | 2 UG | 3 PG-Taught | 5 PG-Research
#                       8 Short/CPD       | 9 Apprenticeships
# Pagination        : ?page=N  — perpage is CAPPED server-side at 20
#                       (tested perpage=500 → still 20/page, "Page 1 of 20")
#                       386 / 20  ⇒  20 result pages
# Course detail URL : /courses/<slug>-YYYY-YY
#                       e.g. /courses/acting-ba-hons-2026-27
#                            /courses/accounting-and-finance-msc-2026-27
#
# ── ROOT CAUSE of the previous 0-staged run ───────────────────────────────────
# Two independent faults, both fatal:
#
#  (1) DISCOVERY starvation. BFS was seeded from the home-page probe at
#      /courses/search?type=2 and spent its entire 25-page budget crawling
#      FACET permutations from the nav (?type=1/3/5/9, ?mode=1/3/5, ?jan=1,
#      ?int=1). Each facet only renders page 1 (20 items) and BFS never
#      paginated (?page=2..20), so only ~10 unique course-detail pages were
#      ever collected out of 386.
#
#  (2) BROKEN URL FILTERS in the old per-uni YAML.
#        "block_url_patterns: dropped 124 URL(s)"  → over-broad, ate real courses
#        "URL filter dropped 3/3 URLs (100%)"      → allow_url_patterns did not
#        match the real course shape, dropping even /business-school/courses/...
#      Net: Discovered 4 → Found 0 → Staged 0.
#
# ── FIX ───────────────────────────────────────────────────────────────────────
# Seed every page of the UNFILTERED all-courses search so all 386 courses appear
# as static links in one deterministic crawl, and replace the URL filter with a
# single inclusion pattern that matches the real year-suffixed detail URL.
# No block_url_patterns needed — the allow pattern alone removes search/nav/news.

discovery:

  # Deterministically crawl all 20 result pages of the full catalogue.
  # perpage is ignored by the server, so each page must be requested explicitly.
  seed_urls:
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=1
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=2
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=3
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=4
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=5
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=6
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=7
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=8
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=9
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=10
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=11
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=12
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=13
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=14
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=15
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=16
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=17
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=18
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=19
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=20

  bfs_page_budget: 30        # 20 seed listing pages + headroom
  max_candidates: 600        # comfortably above the 386 course-detail links

  # The site's flat sitemap.xml is alphabetical site-wide content (news, about-us,
  # corporate pages) and carries no usable course index — it previously injected
  # 22 stray candidates that had to be blocked. The seeds above are authoritative.
  always_sitemap_supplement: false

  # Keep ONLY real course-detail pages. The year-of-entry suffix (-YYYY-YY) is the
  # reliable marker for a genuine course page and cleanly excludes the search,
  # /courses/choices, /courses/prospectus, /courses/short-courses and nav pages.
  # Substring match also catches school-prefixed URLs (e.g. /business-school/courses/...).
  allow_url_patterns:
    - '/courses/[a-z0-9-]+-20\d{2}-\d{2}/?$'

# ── EXTRACTION ────────────────────────────────────────────────────────────────
# Extraction never ran in the previous job (0 courses reached it), so NO
# extraction overrides are added speculatively. Only the two structurally-certain
# facts for a UK university are set: currency, and the correct central fee page
# (the scraper had auto-mis-detected the accommodation page and parsed 0 records).
# Re-run, inspect staged rows, then add fee/English/study_mode overrides only if
# a real symptom appears.

extraction:
  fees:
    default_currency: GBP
    central_page: "https://www.bcu.ac.uk/international/fees-costs-and-scholarships/international-fees"