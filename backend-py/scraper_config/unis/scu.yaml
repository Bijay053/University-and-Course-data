# Southern Cross University — www.scu.edu.au
#
# DISCOVERY — year-versioned URLs in static HTML (updated 2026-07)
# ─────────────────────────────────────────────────────────────────────────────
# https://www.scu.edu.au/study/courses/ has TWO distinct course-link sections:
#
#   Section A (HTML comment — INVISIBLE to HTMLParser):
#     122 base URLs like .../associate-degree-in-law-paralegal-studies-2206351/
#     with numeric anchor text (course codes like "2206351").
#     These live inside an HTML comment spanning positions ~81895-96977:
#       <!-- Close
#       <section class="masthead-no-image ...">
#         <ul class="list-unstyled"><li><a href=".../slug/">code</a></li>...
#       </section>
#       Default -->
#     Python's HTMLParser skips <a> tags inside <!-- ... --> comments, so
#     _LinkExtractor finds ZERO base URLs.  force_candidate_url_patterns cannot
#     help here — the hrefs never reach the BFS loop.
#
#   Section B (visible HTML — after position ~97000):
#     Year-versioned URLs like .../slug/2026/ and .../slug/2027/ with full
#     course names as anchor text.  These are NOT in a comment and ARE
#     extracted correctly by _LinkExtractor.
#
# The BFS therefore discovers only year-versioned URLs (~112 x 2027 URLs and
# ~8-113 x 2026 URLs depending on fetch transport/TLS fingerprint).
#
# Remedy: accept both 2026 and 2027 year URLs.  The DB recipe
# (scrape_config.recipe.course_year) deduplicates by slug_without_year,
# preferring 2027 — the current academic year offering.  The old
# block_url_patterns: ["/2027/"] has been cleared from the DB recipe since
# it was discarding the only effectively-discoverable course URLs.
#
# Course detail pages (fees, IELTS, intakes) are JS-rendered and require
# browser extraction — handled by the extraction phase as usual.
#
# Fee note: SCU publishes fees ANNUALLY on
#   https://www.scu.edu.au/study/international-courses-and-fees/
# Every fee shown is a per-year amount.  fee_calculation_mode=full_course_to_annual
# ensures that when Gemini/regex finds a Full Course total it is divided by
# duration to yield the annual figure.  max_annual_fee discards any Annual fee
# that exceeds A$80k — those are total-course costs misidentified as per-year.

discovery:
  always_browser_discover: false
  always_sitemap_supplement: false
  # One BFS page is enough — the listing page is static and all course links
  # (year-versioned 2026/2027) appear in the visible HTML after the HTML
  # comment section closes at ~position 97000.
  seed_urls:
    - https://www.scu.edu.au/study/courses/
  allow_url_patterns:
    - /study/courses/
  block_url_patterns:
    - /study/units/
    - /study/courses/search
  bfs_page_budget: 1
  _min_expected_courses: 110

extraction:
  fees:
    # SCU fees are per-year — when Gemini finds only a Full Course total,
    # divide by duration to get the annual figure.
    fee_calculation_mode: "full_course_to_annual"
    # Must be False so the Full Course → Annual conversion in
    # fee_calculation_mode can see the original 'Full Course' term.
    fee_prevent_full_course_rollup: false
    # Discard any 'Annual' fee above A$80k — these are total course costs
    # that Gemini mistakenly returned as per-year (e.g. A$117k for Counselling).
    max_annual_fee: 80000
  filters:
    domestic_only:
      enabled: false
  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
