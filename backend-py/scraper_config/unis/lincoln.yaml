# Lincoln University (NZ) — slug "lincoln"
# Hostname: www.lincoln.ac.nz
#
# DIAGNOSIS (2026-06-03 updated 2026-06-25):
#   - www.lincoln.ac.nz returns HTTP 403 to plain-HTTP requests from cloud IPs.
#   - /courses/ is a JavaScript course-search tool — contains NO static .htm links.
#   - Actual individual programme pages exist on TWO different URL paths:
#       PG:  /study/study-programmes/programme-search/<slug>/
#       UG:  /study/courses-2/course-search/<slug>/
#     The undergraduate-study/ seed page links to UG courses at /courses-2/course-search/
#     and the postgraduate-study/ seed page links to PG at /programme-search/.
#   - Root cause of 58/118 bug: allow_url_patterns only contained programme-search,
#     so UG links on the undergraduate-study/ seed page were classified as nav
#     candidates (score=140) and queued in a 517-deep heap, exhausting the 150s
#     browser budget before most were processed.
#   - Fix: add courses-2/course-search/[^/]+/?$ to allow_url_patterns so UG course
#     links are classified as course candidates at seed-visit time (no nav traversal
#     needed, budget is irrelevant).
#   - All per-course pages require browser rendering (Cloudflare blocks plain HTTP).
#   - Lincoln is a New Zealand university — CRICOS does not apply.
#
# CONFIG STRATEGY:
#   - always_browser_discover: true — bypass 403 HTTP BFS
#   - seed_urls: BOTH undergraduate AND postgraduate listing pages
#   - allow_url_patterns: BOTH UG (courses-2/course-search) AND PG (programme-search)
#   - block_url_patterns: suppress resources/schools/farming/nav noise
#   - use_stealth_browser: true — per-course extraction AND central pages via patchright
#   - fees.central_page: absolute URL (relative URLs from auto_config fail schema check)
#   - english.central_page: absolute URL for same reason
#   - force_central_fee_stage: true — mark has_central_fee_page even when parser finds 0
#     records (prevents staging gate rejection while fix is being validated)
#   - browser_time_budget_s: 150 — sufficient once UG courses are found at seed-visit time

discovery:
  always_browser_discover: true
  browser_time_budget_s: 150

  seed_urls:
    - https://www.lincoln.ac.nz/study/study-programmes/undergraduate-study/
    - https://www.lincoln.ac.nz/study/study-programmes/postgraduate-study/

  allow_url_patterns:
    # PG individual course pages
    - "lincoln\\.ac\\.nz/study/study-programmes/programme-search/[^/]+/?$"
    # UG individual course pages (different URL path — root cause of 58/118 bug)
    - "lincoln\\.ac\\.nz/study/courses-2/course-search/[^/]+/?$"

  block_url_patterns:
    - "/resources-for-careers-advisors"
    - "/farms-outreach"
    - "/teaching-resources"
    - "/future-students-and-schools"
    - "/types-of-postgrad-study"
    - "/make-postgraduate-study-work"
    - "/on-farm-workshops"
    - "/on-campus-workshops"
    - "/apply"
    - "/about"
    - "/news"
    - "/events"
    - "/research"
    - "/staff"
    - "/contact"
    - "programme-search/$"

  use_stealth_browser: true

extraction:
  fees:
    central_page: "https://www.lincoln.ac.nz/study/fees"
    default_currency: "NZD"
    force_central_fee_stage: true

  english:
    central_page: "https://www.lincoln.ac.nz/study/entry-requirements"
    # Lincoln NZ publicly states degree-level entry minimums on their
    # entry-requirements page (/study/entry-requirements), but the page is
    # Cloudflare-protected and the rendered text does not contain parseable
    # IELTS patterns (as of 2026-06-03).  These YAML defaults apply as a
    # last-resort fallback (confidence 0.40) only when ALL other extractors
    # (per-course HTML, browser, vision, central page) return null.
    # Source: https://www.lincoln.ac.nz/study/entry-requirements
    #   UG:  IELTS Academic 6.0 overall (no band below 5.5)
    #   PG:  IELTS Academic 6.5 overall (no band below 6.0)
    #   PhD: IELTS Academic 6.5 overall (no band below 6.0)
    default_ielts: 6.0
    degree_level_defaults:
      undergraduate:
        ielts: 6.0
      postgraduate:
        ielts: 6.5
      doctorate:
        ielts: 6.5
  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true   # SPA H1 might lack full degree prefix; allow for flexibility
    require_international_fee: false  
