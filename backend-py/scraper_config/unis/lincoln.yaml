# Lincoln University (NZ)
# Hostname: www.lincoln.ac.nz
# uni_id: 1753  |  Country: NZ  |  Currency: NZD
#
# DISCOVERY (v3 — generic_search_api):
#   Lincoln's programme-search page is a React SPA backed by Elastic App Search.
#   The SPA never auto-queries on load — it waits for user interaction — so all
#   browser/BFS/JS-click approaches returned 0 or partial results.
#
#   The Elastic App Search JSON response is snapshotted in jsonkeeper.com.
#   The live site uses /_search-proxy (server-side proxy to Swiftype) which
#   requires a Cloudflare session — direct access returns 403.
#
#   Structure: results[].link.raw  (relative path, e.g. /study/study-programmes/...)
#              results[].title.raw (course name)
#   Total: 118 active programmes (as of original snapshot).
#
#   APPROACH: discovery.generic_search_api fetches this JSON endpoint directly,
#   navigates to results[], extracts link.raw as the URL and title.raw as the name,
#   resolves relative paths against www.lincoln.ac.nz, and injects the links as
#   candidates BEFORE any BFS/browser tiers. No browser discovery required.
#
#   To refresh after Lincoln adds or removes courses:
#   1. Fetch current list from the live Elastic endpoint (needs Cloudflare session).
#   2. POST a new snapshot to jsonkeeper.com or update the existing blob.
#   3. Update the URL below and expected_min/max_courses to match new count.

discovery:
  always_browser_discover: false
  bfs_page_budget: 0

  generic_search_api:
    url: "https://jsonkeeper.com/b/7YB2"
    method: GET
    root_path: "results"
    url_fields:
      - "link.raw"
    title_fields:
      - "title.raw"
    normalize_relative_urls: true
    base_url: "https://www.lincoln.ac.nz"
    allow_url_patterns:
      - "lincoln\\.ac\\.nz/study/study-programmes/programme-search/[^/]+/?$"
      - "lincoln\\.ac\\.nz/study/courses-2/course-search/[^/]+/?$"
    block_url_patterns:
      - "programme-search/$"
      - "course-search/$"
    max_pages: 1

  expected_min_courses: 116
  expected_max_courses: 122

extraction:
  fees:
    central_page: "https://www.lincoln.ac.nz/study/fees"
    default_currency: "NZD"
    force_central_fee_stage: true
    prefer_international: true
    prefer_annual_over_total: true
    # Lincoln NZ is a small NZ university with legitimately lower international fees.
    # PhD = NZD 9,060/yr (≈ AUD 8,154), Bachelor Honours = NZD 8,881/yr (≈ AUD 7,993).
    # The AU-tuned critical minimums (AUD 12,000 for doctorate, AUD 10,000 for bachelor)
    # are calibrated for large AU/UK universities and cause false data_quality_failure
    # for Lincoln.  Set to AUD 3,000 to cover Lincoln's lowest valid fee
    # (Pathway Certificate NZD ~3,620/yr ≈ AUD 3,258).
    fee_crit_min_aud: 3000

  english:
    central_page: "https://www.lincoln.ac.nz/study/entry-requirements"
    # Lincoln NZ public minimums:
    # UG:  IELTS 6.0 overall (no band below 5.5)
    # PG:  IELTS 6.5 overall (no band below 6.0)
    # PhD: IELTS 6.5 overall (no band below 6.0)
    default_ielts: 6.0
    degree_level_defaults:
      undergraduate:
        ielts: 6.0
        pte: 50
        toefl: 60
      postgraduate:
        ielts: 6.5
        pte: 58
        toefl: 80
      doctorate:
        ielts: 6.5
        pte: 58
        toefl: 80

  browser_wait_strategy: networkidle
  browser_dcl_settle_ms: 3000
  skip_per_course_browser: false
  skip_browser_rescue: false

  # scrape_do_render: Tier-5 fallback — Scrape.do headless Chrome render after
  # static tiers fail.  Only invoked for courses that fail all free tiers so
  # the majority of courses (direct HTTP success) are unaffected (no extra cost).
  scrape_do_render: true

  # scrape_do_geo: Pin Scrape.do exit nodes to New Zealand.
  # Some Lincoln pages return HTTP 404 from non-NZ IPs (CDN geo-routing /
  # Cloudflare rules).  NZ exit nodes present the correct regional version.
  scrape_do_geo: "NZ"

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false

  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false
