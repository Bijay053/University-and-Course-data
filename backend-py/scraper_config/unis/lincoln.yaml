# Lincoln University (NZ) — slug "lincoln"
# Hostname: www.lincoln.ac.nz
#
# ROOT CAUSE (confirmed 2026-06-26, definitive):
#   Lincoln uses Elastic App Search React UI for TWO separate SPA listings:
#   (A) /study/study-programmes/programme-search/ — 118 programmes across 8 pages
#   (B) /study/courses-2/course-search/ — UG individual courses (separate catalogue)
#
#   CRITICAL: Both SPAs do NOT auto-query Elastic on page load.
#   They render an empty search form and wait for the user to click "Search".
#   This is why:
#     - The seed page returns 0 courses regardless of wait time.
#     - The pagination container is never found (appears only after results load).
#     - seed_page_settle_s alone does NOT fix this — the SPA is idle, not slow.
#
#   HISTORY of all failed approaches:
#     1. XHR interceptor: never fires (SPA doesn't query on load) → 0
#     2. elastic_api_bootstrap: page 2+ 403 CF + NameError closure → 0
#     3. evaluate-failure guard: underlying API still 403 → 0
#     4. seed_page_click_pagination (3s settle): no pagination container → 0
#        (container appears ONLY after search results are shown)
#     5. BFS areas-of-specialisation: finds 57 PG courses reliably, misses
#        ~61 UG courses at courses-2/course-search/ (also SPA, same problem)
#
#   DEFINITIVE FIX (2026-06-26): seed_page_trigger_js
#   After settling on the seed page, evaluate JS that clicks the Search button.
#   This submits an empty Elastic query → SPA renders all 15 results on page 1
#   → rc-pagination component appears → pagination clicks pages 2-8 → 118 links.
#
# BELT-AND-SUSPENDERS:
#   All /study/areas-of-specialisation/<area>/ pages are added as seeds too.
#   These are STATIC HTML (no JS required), reliably find ~57 PG courses even
#   if both SPAs fail. They run AFTER the SPA seeds so if SPA works, early_stop
#   fires before reaching them (saving time).
#
# ══ LANCASTER LESSON ════════════════════════════════════════════════════════
# Lancaster works because it uses static HTTP for discovery (SSR JSON prop) and
# reserves browser only for per-course extraction. Lincoln's SPAs genuinely need
# browser for discovery (unlike Lancaster / WGTN), but the same extraction
# principle applies: browser_wait_strategy + skip_per_course_browser: false.

discovery:
  always_browser_discover: true
  browser_time_budget_s: 600   # 2 SPA seeds × (3+5)s + 8 pag pages × 3s + nav
  browser_early_stop_courses: 150  # 118 courses + margin

  seed_urls:
    # PRIMARY: SPA listing all 118 programmes (PG + UG mix). trigger_js below
    # clicks Search button → results appear → pagination clicks pages 2-8.
    - https://www.lincoln.ac.nz/study/study-programmes/programme-search/
    # SECONDARY: UG individual courses listing (separate SPA). Same trigger approach.
    - https://www.lincoln.ac.nz/study/courses-2/course-search/
    # FALLBACK: Static HTML area pages — reliably find PG courses without JS trigger.
    # Seeded directly so BFS visits them early if SPAs fail.
    - https://www.lincoln.ac.nz/study/areas-of-specialisation/agriculture-horticulture-and-viticulture/
    - https://www.lincoln.ac.nz/study/areas-of-specialisation/business/
    - https://www.lincoln.ac.nz/study/areas-of-specialisation/environment/
    - https://www.lincoln.ac.nz/study/areas-of-specialisation/food-wine-and-beer/
    - https://www.lincoln.ac.nz/study/areas-of-specialisation/landscape-architecture/
    - https://www.lincoln.ac.nz/study/areas-of-specialisation/property-and-valuation/
    - https://www.lincoln.ac.nz/study/areas-of-specialisation/science/
    - https://www.lincoln.ac.nz/study/areas-of-specialisation/tourism/
    - https://www.lincoln.ac.nz/study/areas-of-specialisation/technology/

  # Clicked on every seed page after the 3s default settle.
  # For SPA seeds: clicks the Search/submit button so Elastic renders all results
  # and the rc-pagination component appears. After JS fires, the code waits 5s.
  # For static area-of-specialisation pages: harmless (no search button present).
  seed_page_trigger_js: |
    (function() {
      var selectors = [
        '.sui-search-box__submit',
        'button[type="submit"]',
        '[aria-label="Search"]',
        'button.search-button',
        'button[class*="search"]',
        'form button'
      ];
      for (var i = 0; i < selectors.length; i++) {
        var btn = document.querySelector(selectors[i]);
        if (btn) { btn.click(); return; }
      }
      var inp = document.querySelector(
        '.sui-search-box__text-input, input[type="search"], input[name="q"]'
      );
      if (inp) {
        inp.dispatchEvent(new KeyboardEvent('keydown',
          {key: 'Enter', keyCode: 13, which: 13, bubbles: true}));
        inp.dispatchEvent(new KeyboardEvent('keyup',
          {key: 'Enter', keyCode: 13, which: 13, bubbles: true}));
      }
    })();

  # After trigger JS fires and the code waits 5s, click pages 2-8.
  # At this point the SPA should have rendered page 1 results + pagination.
  seed_page_click_pagination:
    max_pages: 8    # 8 pages × ~15 courses = 118 total
    settle_s: 3.0   # seconds to wait after each page button click

  allow_url_patterns:
    # PG programme pages (programme-search SPA)
    - "lincoln\\.ac\\.nz/study/study-programmes/programme-search/[^/]+/?$"
    # UG course pages (course-search SPA)
    - "lincoln\\.ac\\.nz/study/courses-2/course-search/[^/]+/?$"
    # Belt-and-suspenders: individual course pages under area specialisation listings
    - "lincoln\\.ac\\.nz/study/areas-of-specialisation/[^/]+/[^/]+/?$"

  # Final URL gate before extraction — mirrors Lancaster's course_detail_url_patterns.
  course_detail_url_patterns:
    - '/study/study-programmes/programme-search/[^/]+/?$'
    - '/study/courses-2/course-search/[^/]+/?$'
    - '/study/areas-of-specialisation/[^/]+/[^/]+/?$'

  block_url_patterns:
    - "/resources-for-careers-advisors"
    - "/farms-outreach"
    - "/teaching-resources"
    - "/future-students-and-schools"
    - "/types-of-postgrad-study"
    - "/make-postgraduate-study-work"
    - "/on-farm-workshops"
    - "/on-campus-workshops"
    - "/apply"
    - "/about"
    - "/news"
    - "/events"
    - "/research"
    - "/staff"
    - "/contact"
    - "programme-search/$"           # PG listing hub (not a course page)
    - "courses-2/course-search/$"    # UG listing hub (not a course page)
    - "/areas-of-specialisation/$"   # area index page (not a course)
    - "/star-programme"
    - "/programmes-starting-soon"
    - "/english-language"
    - "/study-abroad"
    - "/student-exchange"

  use_stealth_browser: true

extraction:
  fees:
    central_page: "https://www.lincoln.ac.nz/study/fees"
    default_currency: "NZD"
    force_central_fee_stage: true

  english:
    central_page: "https://www.lincoln.ac.nz/study/entry-requirements"
    # Lincoln NZ publicly states degree-level entry minimums:
    # UG:  IELTS Academic 6.0 overall (no band below 5.5)
    # PG:  IELTS Academic 6.5 overall (no band below 6.0)
    # PhD: IELTS Academic 6.5 overall (no band below 6.0)
    default_ielts: 6.0
    degree_level_defaults:
      undergraduate:
        ielts: 6.0
      postgraduate:
        ielts: 6.5
      doctorate:
        ielts: 6.5

  # Lancaster pattern: browser available for per-course extraction rescue.
  # Lincoln course pages may need JS to render full details (fees, IELTS).
  browser_wait_strategy: networkidle
  browser_dcl_settle_ms: 3000
  skip_per_course_browser: false
  skip_browser_rescue: false

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
