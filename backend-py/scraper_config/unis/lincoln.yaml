# Lincoln University (NZ)
# Hostname: www.lincoln.ac.nz
# uni_id: 1753  |  Country: NZ  |  Currency: NZD
#
# DISCOVERY (2026-06-29 v2 — API-seeded):
#   Lincoln's programme-search page is an Elastic App Search SPA that never
#   auto-queries on load, making all browser/BFS/JS-click approaches unreliable
#   (history: XHR interceptor, elastic_api_bootstrap, pagination click, BFS
#   fallback — all returned 0 or partial results).
#
#   The live Elastic App Search JSON API endpoint was captured and snapshotted:
#     https://jsonkeeper.com/b/7YB2
#   It returns 118 programmes (total_pages: 1) with all links under results[].link.raw.
#
#   APPROACH: discovery.extra_course_urls injects all 118 URLs directly as
#   candidates after the (minimal) BFS phase. No browser discovery required.
#   Each course page is then fetched individually for fee/IELTS/duration extraction.
#
#   If Lincoln adds new courses, re-fetch the API JSON and update extra_course_urls.
#   API source: https://jsonkeeper.com/b/7YB2  (118 results, page 1/1)

discovery:
  always_browser_discover: false
  bfs_page_budget: 1
  expected_min_courses: 110
  expected_max_courses: 130

  seed_urls:
    - https://www.lincoln.ac.nz/study/study-programmes/programme-search/

  allow_url_patterns:
    - "lincoln\\.ac\\.nz/study/study-programmes/programme-search/[^/]+/?$"
    - "lincoln\\.ac\\.nz/study/courses-2/course-search/[^/]+/?$"

  block_url_patterns:
    - "programme-search/$"
    - "course-search/$"
    - "/apply"
    - "/about"
    - "/news"
    - "/events"
    - "/research"
    - "/staff"
    - "/contact"

  # All 118 programme URLs sourced from the Elastic App Search JSON API snapshot
