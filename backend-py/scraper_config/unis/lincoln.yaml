# Lincoln University (NZ) — slug "lincoln"
# Hostname: www.lincoln.ac.nz
#
# DIAGNOSIS (2026-06-03, updated 2026-06-25):
#   - www.lincoln.ac.nz returns HTTP 403 to plain-HTTP requests from cloud IPs.
#   - All 118 courses live at /study/study-programmes/programme-search/<slug>/.
#     The SPA at programme-search/ exposes them via Elastic App Search through a
#     server-side proxy at:
#       POST /_search-proxy/api/as/v1/engines/--dummy-value--/search.json
#     The proxy adds the API key server-side; no auth token is needed from the browser.
#
#   - Root cause of 17-27/118 bug (TWO separate problems, now fixed):
#     1. The SPA does NOT auto-query Elastic App Search on page load — it waits for
#        user interaction (typing in the search box).  So the XHR interceptor NEVER
#        fires during the seed visit.  Result: 0 courses from XHR, BFS nav takes over,
#        finds 27 before the 150s time budget expires.
#     2. Even if the XHR had fired, the pagination detector checked root-level keys for
#        `total_results` but Elastic App Search stores it at `meta.page.total_results`
#        (nested), so only page 1 (15 results) would have been collected.
#
#   - Root cause of 39/118 bug (third problem, fixed 2026-06-25):
#     The elastic_api_bootstrap code called `_from_item()` which is a closure defined
#     INSIDE `_extract_courses_from_xhr_json()` at indent 8.  The bootstrap code runs
#     at indent 48 in the outer scope → NameError on every item → caught by the
#     per-page `except Exception: break` handler → 0 courses from all 4 queries.
#     Only the XHR interceptor (which calls _extract_courses_from_xhr_json correctly)
#     captured 39 courses — from bachelor query page 1 only (1 JSON API endpoint).
#     Fix: replaced the broken _from_item() per-item loop with a call to
#     _extract_courses_from_xhr_json(_eas_data) (in scope at indent 4), deduped by
#     resolved URL, appended to outer results list.
#
#   - Fix: discovery.elastic_api_bootstrap config (new in browser_discover_generic.py).
#     After the seed page loads in the patchright browser (giving Cloudflare clearance),
#     the scraper POSTs to the Elastic API directly via page.evaluate() — inheriting
#     the CF clearance cookies — and paginates through all result pages.
#     Once bootstrap finishes, _seeds_filled=True → BFS is skipped entirely.
#
#   - A small number of UG courses at /study/courses-2/course-search/<slug>/ would
#     have been missed by BFS nav; allow_url_patterns covers both paths for any
#     courses the Elastic API might return with that URL structure.
#   - All per-course pages require browser rendering (Cloudflare blocks plain HTTP).
#   - Lincoln is a New Zealand university — CRICOS does not apply.
#
# CONFIG STRATEGY:
#   - always_browser_discover: true — bypass 403 HTTP BFS
#   - seed_urls: programme-search/ — browser navigates here for CF clearance
#   - elastic_api_bootstrap: POSTs to /_search-proxy/... directly after seed loads
#   - allow_url_patterns: BOTH UG (courses-2/course-search) AND PG (programme-search)
#   - block_url_patterns: suppress resources/schools/farming/nav noise
#   - use_stealth_browser: true — per-course extraction AND central pages via patchright
#   - fees.central_page: absolute URL (relative URLs from auto_config fail schema check)
#   - english.central_page: absolute URL for same reason
#   - force_central_fee_stage: true — mark has_central_fee_page even when parser finds 0
#     records (prevents staging gate rejection while fix is being validated)
#   - browser_time_budget_s: 150 — budget only limits BFS nav; bootstrap runs first

discovery:
  always_browser_discover: true
  browser_time_budget_s: 300  # 150s exhausted with only 1 course; give BFS fallback room

  seed_urls:
    # NEW primary seed (2026-06-26): Lincoln restructured their site — the UG course
    # search is now at /study/courses-2/course-search/ (appeared as BFS nav score=120).
    # This is tried FIRST so the Elastic bootstrap fires from the new SPA page.
    - https://www.lincoln.ac.nz/study/courses-2/course-search/
    # Keep old PG seed as fallback — PG courses may still live at programme-search/
    - https://www.lincoln.ac.nz/study/study-programmes/programme-search/

  # After the seed page loads (Cloudflare clearance), POST directly to the
  # Elastic App Search proxy.  The SPA does not auto-query on page load so
  # the XHR interceptor never fires — this bootstrap replaces it.
  #
  # KEY FINDINGS (2026-06-25 direct HTTP tests):
  #   - Endpoint IS accessible via plain HTTP POST (no browser needed for auth)
  #   - BUT: empty-string query → HTTP 400 "bool query malformed" — proxy rejects it
  #   - AND: pagination (page 2+) → HTTP 403 Cloudflare rate-limiting for plain HTTP
  #   - Fix: use non-empty degree-level queries; paginate from WITHIN the patchright
  #     browser (which has CF clearance cookies) via page.evaluate() fetch calls
  #   - Response fields: link (relative URL), menu_title (course name)
  #   - Each query is ranked by relevance → programme pages score highest → all courses
  #     of that degree type appear on page 1 (size=100), 2 pages covers all 118 total
  elastic_api_bootstrap:
    api_url: "/_search-proxy/api/as/v1/engines/--dummy-value--/search.json"
    queries:
      - "bachelor"                       # Bachelor of Agriculture, Commerce, Science …
      - "master"                         # Master of Applied Science, Commerce …
      - "diploma certificate graduate"   # PG Diploma, Graduate Certificate …
      - "doctorate"                      # Doctor of Philosophy
    page_size: 100    # Elastic App Search max
    max_pages: 3      # per query; 118 total courses across 4 queries = ≤2 pages each

  allow_url_patterns:
    # PG individual course pages
    - "lincoln\\.ac\\.nz/study/study-programmes/programme-search/[^/]+/?$"
    # UG individual course pages (different URL path — root cause of 58/118 bug)
    - "lincoln\\.ac\\.nz/study/courses-2/course-search/[^/]+/?$"

  block_url_patterns:
    - "/resources-for-careers-advisors"
    - "/farms-outreach"
    - "/teaching-resources"
    - "/future-students-and-schools"
    - "/types-of-postgrad-study"
    - "/make-postgraduate-study-work"
    - "/on-farm-workshops"
    - "/on-campus-workshops"
    - "/apply"
    - "/about"
    - "/news"
    - "/events"
    - "/research"
    - "/staff"
    - "/contact"
    - "programme-search/$"        # old PG listing hub (not a course page)
    - "courses-2/course-search/$" # new UG listing hub (not a course page)

  use_stealth_browser: true

extraction:
  fees:
    central_page: "https://www.lincoln.ac.nz/study/fees"
    default_currency: "NZD"
    force_central_fee_stage: true

  english:
    central_page: "https://www.lincoln.ac.nz/study/entry-requirements"
    # Lincoln NZ publicly states degree-level entry minimums on their
    # entry-requirements page (/study/entry-requirements), but the page is
    # Cloudflare-protected and the rendered text does not contain parseable
    # IELTS patterns (as of 2026-06-03).  These YAML defaults apply as a
    # last-resort fallback (confidence 0.40) only when ALL other extractors
    # (per-course HTML, browser, vision, central page) return null.
    # Source: https://www.lincoln.ac.nz/study/entry-requirements
    #   UG:  IELTS Academic 6.0 overall (no band below 5.5)
    #   PG:  IELTS Academic 6.5 overall (no band below 6.0)
    #   PhD: IELTS Academic 6.5 overall (no band below 6.0)
    default_ielts: 6.0
    degree_level_defaults:
      undergraduate:
        ielts: 6.0
      postgraduate:
        ielts: 6.5
      doctorate:
        ielts: 6.5
  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true   # SPA H1 might lack full degree prefix; allow for flexibility
    require_international_fee: false  
