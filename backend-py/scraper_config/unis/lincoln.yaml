# Lincoln University (NZ)
# Hostname: www.lincoln.ac.nz
# uni_id: 1753  |  Country: NZ  |  Currency: NZD
#
# DISCOVERY (v3 — generic_search_api):
#   Lincoln's programme-search page is a React SPA backed by Elastic App Search.
#   The SPA never auto-queries on load — it waits for user interaction — so all
#   browser/BFS/JS-click approaches returned 0 or partial results.
#
#   The Elastic App Search JSON response is snapshotted in jsonblob.com.
#   The live site uses /_search-proxy (server-side proxy to Swiftype) which
#   requires a Cloudflare session — direct access returns 403.
#
#   Structure: results[].link.raw  (relative path, e.g. /study/study-programmes/...)
#              results[].title.raw (course name)
#   Total as of 2026-07-02: 107 active programmes (11 discontinued since the
#   original jsonkeeper snapshot of 118 were verified 404 and removed).
#
#   APPROACH: discovery.generic_search_api fetches this JSON endpoint directly,
#   navigates to results[], extracts link.raw as the URL and title.raw as the name,
#   resolves relative paths against www.lincoln.ac.nz, and injects the links as
#   candidates BEFORE any BFS/browser tiers. No browser discovery required.
#
#   To refresh after Lincoln adds or removes courses:
#   1. Fetch current list: https://jsonblob.com/api/jsonBlob/019f218a-3abb-7f1b-9d1a-5469041f82dd
#   2. Run a scrape and check imported vs total_found; any gap = newly dead URLs.
#   3. Remove dead URLs from the JSON and POST a new entry to jsonblob.com/api/jsonBlob.
#   4. Update the URL below and expected_min/max_courses to match new count.

discovery:
  always_browser_discover: false
  bfs_page_budget: 0

  generic_search_api:
    url: "https://jsonblob.com/api/jsonBlob/019f218a-3abb-7f1b-9d1a-5469041f82dd"
    method: GET
    root_path: "results"
    url_fields:
      - "link.raw"
    title_fields:
      - "title.raw"
    normalize_relative_urls: true
    base_url: "https://www.lincoln.ac.nz"
    allow_url_patterns:
      - "lincoln\\.ac\\.nz/study/study-programmes/programme-search/[^/]+/?$"
      - "lincoln\\.ac\\.nz/study/courses-2/course-search/[^/]+/?$"
    block_url_patterns:
      - "programme-search/$"
      - "course-search/$"
    max_pages: 1

  expected_min_courses: 105
  expected_max_courses: 115

extraction:
  fees:
    central_page: "https://www.lincoln.ac.nz/study/fees"
    default_currency: "NZD"
    force_central_fee_stage: true
    prefer_international: true
    prefer_annual_over_total: true

  english:
    central_page: "https://www.lincoln.ac.nz/study/entry-requirements"
    # Lincoln NZ public minimums:
    # UG:  IELTS 6.0 overall (no band below 5.5)
    # PG:  IELTS 6.5 overall (no band below 6.0)
    # PhD: IELTS 6.5 overall (no band below 6.0)
    default_ielts: 6.0
    degree_level_defaults:
      undergraduate:
        ielts: 6.0
        pte: 50
        toefl: 60
      postgraduate:
        ielts: 6.5
        pte: 58
        toefl: 80
      doctorate:
        ielts: 6.5
        pte: 58
        toefl: 80

  browser_wait_strategy: networkidle
  browser_dcl_settle_ms: 3000
  skip_per_course_browser: false
  skip_browser_rescue: false

  # 8/117 courses failed all free-tier fetches (httpx → cffi → Wayback →
  # Scrape.do static) in the 2026-07-02 run, likely because those specific
  # pages have heavier Cloudflare protection or JS-gating.  scrape_do_render
  # adds tier-5: Scrape.do headless Chrome render after static fails.
  # render=True is only invoked when earlier tiers all fail, so the 73
  # courses that succeed with direct HTTP and the 44 that succeed with
  # Scrape.do static are unaffected (no extra cost).
  scrape_do_render: true

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false

  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false
