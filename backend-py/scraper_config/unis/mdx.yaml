# Middlesex University
# Hostname: www.mdx.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Slug: mdx

hostname_guard: www.mdx.ac.uk

discovery:
  # Preserved from the production operator recipe during migration from the
  # former ID-specific file to this hostname-owned recipe.
  sitemap_url: "https://www.mdx.ac.uk/sitemap.xml"
  always_sitemap_supplement: true
  allow_url_patterns:
    - '/courses/(?:undergraduate|postgraduate)/[^/?#]+/?$'

extraction:
  fees:
    default_currency: GBP

  english:
    central_page: "https://www.mdx.ac.uk/study/english-language-requirements"

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false