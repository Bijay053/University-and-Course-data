# Crown Institute of Higher Education - CIHE
# Hostname: www.cihe.edu.au
# Country: Australia  |  Currency: AUD
# Slug: cihe
# Auto-generated: 2026-07-29
#
# This stub was created automatically on the first scrape of this university.
# Review and expand it to improve discovery and extraction quality.
# See scraper_config/defaults.yaml for all available options.
#
# ── Course name extraction ────────────────────────────────────────────────────
#
# CIHE pages are built on Elementor. H1 structure is inconsistent:
#
#   ALL pages: <h1 class="ch__mainheader__sitelogo__title"> — site logo
#              ("Real skills Real impact Meaningful careers") — WRONG
#
#   Some pages also have:
#     <h1 class="entry-title" itemprop="headline">Bachelor of Accounting</h1>
#     (correct, proper case)
#
#   Other pages only have:
#     <h2 class="elementor-heading-title">GRADUATE CERTIFICATE IN
#      BUSINESS ADMINISTRATION</h2>  (correct content, uppercased — cleaned OK)
#
# soup.find("h1") always returns the logo H1 (first in DOM). The combined
# CSS selector below targets entry-title first (preferred, already proper case),
# then falls back to any Elementor H1/H2 heading title:
#
#   h1.entry-title                → "Bachelor of Accounting"  ✓
#   h1.elementor-heading-title    → for pages where entry-title absent
#   h2.elementor-heading-title    → "GRADUATE CERTIFICATE IN BUSINESS ADMIN" ✓
#
# Uppercased Elementor text is normalised to title-case by course_name_cleaner.
discovery:
  allow_url_patterns:
  - /[^/]+/[^/]+/?$
  block_url_patterns:
  - /apply
  - /contact
  - /news
  - /events
  - /blog
  - /about
  - /research
  - /alumni
  - /outreach
  - /parents
  - /jobs
  - /careers
  - /accommodation
  - /life-on-campus
  - /fees-and-funding$
  - /international/living
extraction:
  course_name:
    h1_css_selector: "h1.entry-title, h1.elementor-heading-title, h2.elementor-heading-title"
  fees:
    default_currency: AUD
  filters:
    online_only:
      enabled: false
  staging:
    reject_if_missing:
    - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
