discovery:
  allow_url_patterns:
  - /[^/]+/[^/]+/?$
  block_url_patterns:
  - /apply
  - /contact
  - /news
  - /events
  - /blog
  - /about
  - /research
  - /alumni
  - /outreach
  - /parents
  - /jobs
  - /careers
  - /accommodation
  - /life-on-campus
  - /fees-and-funding$
  - /international/living
extraction:
  # H1[0] is the site logo ("Real skills / Real impact / Meaningful careers").
  # H1[1] class="entry-title" is the clean schema.org headline, e.g.
  # "Bachelor of Accounting". H1[2] is the Elementor visual heading with
  # split styled spans ("BACHELOR OF" + "ACCOUNTING"). Target H1[1].
  h1_css_selector: "h1.entry-title"
  fees:
    default_currency: AUD
  filters:
    online_only:
      enabled: false
  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false