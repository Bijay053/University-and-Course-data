  force_candidate_url_patterns:
    # Course pages sit at exactly /study/<school>/<course-slug>/
    - excelsia\.edu\.au/study/[^/]+/[^/]+/?$
  block_url_patterns:
    - /study/assessment
    - /study/brochure
    - /study/early-offer
    - /study/excelsia-supported
    - /study/faq
