extraction:
  # Site is a JS SPA — every page returns a 202 empty shell via plain httpx.
  # scrape_do_render sends each course page through Scrape.do headless Chrome
  # so the React app hydrates and the real H1/fee/IELTS/duration/delivery
  # content becomes available to the extractors.
  # wait_for_ms=5000: React needs >3s to hydrate on slower-loading pages.
  # At the default 3000ms some pages snapshot mid-hydration: title="excelsia.edu.au"
  # (bare domain before React sets it), H1 empty, no fee/IELTS content.
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  scrape_do_wait_for_ms: 8000
  course_name:
    # Title format varies by page: some use a pipe, others a dash, and the
    # institution name differs between new/old branding. Strip both so that
    # the <title> fallback (triggered when React hasn't yet hydrated the H1)
    # still produces the correct course name rather than "Excelsia.edu.au".
    strip_title_suffixes:
      - " | Excelsia College"
      - " - Excelsia University College"
      - " | Excelsia University College"
      - " - Excelsia College"
  fees:
    default_currency: AUD
  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
    dedup_use_full_url: true
