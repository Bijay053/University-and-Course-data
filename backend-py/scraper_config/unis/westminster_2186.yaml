# University of Westminster
# Hostname: www.westminster.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Discovery: Pre-seeded all 71 pagination pages (841 courses ÷ 12/page).
# BFS used only as a mop-up pass after seed pages are processed.
#
# Root cause of original 193-course undercount:
#   BFS budget (60 pages) was consumed by Drupal facet-filter variant URLs
#   (mode_of_study:xxx, course_start_date:xxx, course_type:3551) and non-course
#   /study/ hub pages (accommodation, student-life, etc.) — leaving only 3-4
#   pagination pages reached before budget exhausted.
# Fix: all 71 pages pre-seeded as seed_urls; filter-variant and non-course
#   /study/ paths explicitly blocked so BFS budget is spent on course pages only.

discovery:
  always_sitemap_supplement: true
  # Budget just needs to cover seed pages + any adjacent course detail links.
  # Filter variants and non-course /study/ paths are blocked below.
  bfs_page_budget: 100
  max_candidates: 1200

  # 841 courses ÷ 12 per page = 71 pages (page=0 … page=70).
  # page=0 is identical to the base URL — included for safety.
  seed_urls:
