  allow_url_patterns:
    - '/course-search'
    - '/study/'
    - '/courses/'
    - '/business-services/workforce-development/'
    - '/business-and-community/workforce-development/'

  block_url_patterns:
    # ── Non-course /study/ hub pages that waste BFS budget ───────────────────
    - '/study/subjects'
    - '/study/open-days'
    - '/study/fees-and-funding'
    - '/study/accommodation'
    - '/study/student-life'
    - '/study/language-tests'
    - '/study/degree-apprenticeships-for-applicants'
    - '/study/postgraduate/research-degrees'  # separate seed below if needed
    # ── Drupal facet-filter variant URLs — subsets of the 841, waste budget ──
    - 'mode_of_study'          # blocks &f[x]=mode_of_study:xxx variants
    - 'course_start_date'      # blocks &f[x]=course_start_date:xxx variants
    - 'course_type%3A3551'     # blocks distance-learning filter variant
    - 'f%5B2%5D'               # blocks any URL with a 3rd facet filter
    # ── Standard non-course paths ────────────────────────────────────────────
    - '/news'
    - '/events'
    - '/about'
    - '/staff'
    - '/research/'
    - '/alumni'
    - '/business/'
    - '\.pdf$'

extraction:
  fees:
    default_currency: 'GBP'
    prefer_international: true
    prefer_annual_over_total: true
    reject_keywords:
      - 'Home student'
      - 'Home fee'
      - 'UK student'
      - 'UK fee'
      - 'Domestic'
      - 'Part time'
      - 'Part-time'

  english:
    trust_vision_ocr: false
    default_ielts: 6.0
    default_pte: 60
    default_toefl: 80

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | University of Westminster'
      - ' - University of Westminster'
      - ' | University of Westminster, London'

  filters:
    online_only:
      enabled: false

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
