# University of Westminster
# Hostname: www.westminster.ac.uk
# Country: United Kingdom  |  Currency: GBP
#
# Discovery: sitemap-based (all 841 course URLs are on sitemap.xml?page=1).
#   Westminster's Drupal search pagination is non-deterministic — the same course
#   URL appears at different page positions between requests, so seeding the 85
#   search pages misses ~324 courses through BFS deduplication.
#   Sitemap page 1 contains exactly 841 /-courses/20.../ URLs, stable and
#   authoritative. BFS kept only for mop-up (apprenticeship paths not in sitemap).
#
# Course URL format: /{subject}-courses/{year}/{month}/{mode}/{slug}
# e.g. /accounting-and-finance-courses/2026-27/september/full-time/accounting-and-finance-bsc-honours

discovery:
  # Sitemap page 1 contains all 841 course URLs — point directly to it.
  sitemap_url: "https://www.westminster.ac.uk/sitemap.xml?page=1"
  always_sitemap_supplement: true

  # Minimal BFS just to catch any apprenticeship/workforce paths not in sitemap.
  bfs_page_budget: 10
  max_candidates: 1200

  seed_urls:
    - 'https://www.westminster.ac.uk/course-search?course=&f%5B0%5D=course_type%3A26&f%5B1%5D=course_type%3A926'
    - 'https://www.westminster.ac.uk/business-services/workforce-development/'
    - 'https://www.westminster.ac.uk/business-and-community/workforce-development/'

  # Westminster actual course URL pattern:
  #   /{subject}-courses/{year}/{month}/{mode}/{course-slug}
  # Apprenticeships live under /business-services/... and /business-and-community/...
  # /course-search is needed only for BFS crawl.
  allow_url_patterns:
    - '/course-search'
    - '-courses/20'                                  # /{subject}-courses/{year}/...
    - '/business-services/workforce-development/'
    - '/business-and-community/workforce-development/'

  block_url_patterns:
    # ── Drupal facet-filter variant URLs (waste budget) ──────────────────────
    - 'mode_of_study'
    - 'course_start_date'
    - 'course_type%3A3551'
    - 'f%5B2%5D'
    # ── Single-filter search pages (UG-only / PG-only) ───────────────────────
    - 'course_type%3A26$'    # /course-search?...f[0]=course_type:26  (UG-only listing)
    - 'course_type%3A926$'   # /course-search?...f[0]=course_type:926 (PG-only listing)
    # ── Standard non-course paths ────────────────────────────────────────────
    - '/news'
    - '/events'
    - '/about'
    - '/staff'
    - '/research/'
    - '/alumni'
    - '/business/'
    - '\.pdf$'

extraction:
  fees:
    default_currency: 'GBP'
    prefer_international: true
    prefer_annual_over_total: true
    # UK part-time international fees can legitimately be GBP 3,000-7,000/yr
    # (roughly half the full-time annual fee for a 2-year PT programme).
    # The default AU-tuned critical minimum (AUD 12,000 ≈ GBP 6,150) incorrectly
    # blocks these as data_quality_failure.  Setting 6,000 AUD (≈ GBP 3,077)
    # moves genuinely-low fees to annual_fee_too_low_warning (review queue)
    # instead of data_quality_failure (hidden from operators entirely).
    fee_crit_min_aud: 6000
    reject_keywords:
      - 'Home student'
      - 'Home fee'
      - 'UK student'
      - 'UK fee'
      - 'Domestic'
      - 'Part time'
      - 'Part-time'

  english:
    trust_vision_ocr: false
    default_ielts: 6.0
    default_pte: 60
    default_toefl: 80

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | University of Westminster'
      - ' - University of Westminster'
      - ' | University of Westminster, London'

  filters:
    online_only:
      enabled: false

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
