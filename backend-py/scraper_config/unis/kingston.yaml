# Kingston University London
# Hostname: www.kingston.ac.uk
#
# Cloudflare WAF site — cffi (TLS impersonation) bypasses it successfully.
# Parallelism MUST stay low (≤2) — page 11+ triggers 429 at higher concurrency.
# Wayback disabled: archive.org has no useful snapshots and adds latency for nothing.
#
# ── WHY ONLY 3 SEED URLS (NOT 28) ────────────────────────────────────────────
# Pre-seeding all 13 UG + 13 PG + 2 Foundation pages causes two problems:
#
#  1. RATE LIMITING (429): All 28 pages sit at the FRONT of the BFS queue and
#     are fetched consecutively. Pages 7, 8, 9 arrive within ~1 second and
#     Kingston's WAF trips (429). With just 3 roots, BFS interleaves UG/PG
#     pagination naturally: UG1 → PG1 → F1 → UG2 → PG2 → ... giving each
#     server 2–4 seconds between consecutive requests to the same path.
#
#  2. MISSING FOUNDATION COURSES: Default max_pages=25. With 28 seeds, the BFS
#     exhausts its budget at PG page 12 (position 25) before ever visiting
#     Foundation pages (positions 27–28). Only 8 foundation courses found (from
#     sitemap probes, not BFS). With 3 seeds, Foundation is visited 3rd — all
#     its courses are found, and remaining budget handles pagination.
#
# BFS naturally discovers next-page links from each listing page, so pagination
# is covered without pre-seeding. bfs_page_budget raised to 35 to cover
# the ~27 listing pages (13 UG + 13 PG + 1–2 Foundation) the BFS needs to visit.
#
# NOTE: Kingston's pagination uses capital letters: /Courses?Page=4 (not page=4).
# listing_only_patterns uses (?i) to match both forms case-insensitively.
# ─────────────────────────────────────────────────────────────────────────────

discovery:
  seed_urls:
    - https://www.kingston.ac.uk/study/undergraduate/courses
    - https://www.kingston.ac.uk/study/postgraduate/courses
    - https://www.kingston.ac.uk/study/foundation/courses

  # Raise BFS page budget to cover all listing pages discovered naturally.
  # 13 UG pages + 13 PG pages + 1-2 Foundation pages = ~28 listing pages.
  # Set to 35 for buffer (some subject/category pages may also be visited).
  bfs_page_budget: 35

  # Mark paginated listing pages as listing-only: BFS visits them to harvest
  # course links but does NOT add them to the course candidate set.
  # (?i) = case-insensitive → matches both /courses?page= AND /Courses?Page=
  # The (\?|/?$) suffix matches roots and pagination but NOT course detail URLs
  # like /courses/introduction-to-computing-bsc/ (which have a slug after /courses/).
  listing_only_patterns:
    - '(?i)/courses(\?|/?$)'

  allow_url_patterns:
    - '/undergraduate/'
    - '/postgraduate/'
    - '/foundation/'

  block_url_patterns:
    - '/news'
    - '/events'
    - '/staff/'
    - '/about'
    - '/contact'
    - '/linkassets/'

  use_wayback: false

extraction:
  max_parallel_fetch: 2
  # cffi (TLS impersonation) already bypasses the Cloudflare WAF and returns
  # full-content HTML.  Headless-browser rescue (Playwright) hits the same
  # CF challenge page as plain HTTP and returns 0 B — it adds ~30 s per course
  # with zero benefit.  At max_parallel_fetch=2 with 400 courses, browser
  # rescue firing on every page would inflate the job from ~25 min to 2+ hours.
  skip_browser_rescue: true
  skip_per_course_browser: true

  filters:
    domestic_only:
      enabled: false

    online_only:
      enabled: false

  fees:
    default_currency: "GBP"
    prefer_international: true
    prefer_annual_over_total: true
    fee_year: "2025"
    fee_term: "year"

    reject_keywords:
      - "Domestic"
      - "Home student"
      - "UK student"

  english:
    source: course_page
    source_xpath: "//div[contains(@class, 'contentblock') and contains(.//h2, 'Entry requirements')]"

    ielts:
      raw_xpath: ".//p[contains(., 'IELTS')]"
      remove_tags: true
      patterns:
        overall:
          - 'score\sof\s.?(\d\.?\d)'
          - 'of\s*(\d\.?\d*)'
        each:
          - 'no\selement\sbelow\s*(\d\.?\d*)'
          - '(\d\.?\d*)\sin\sall'
      apply_each_to:
        - ielts_reading
        - ielts_writing
        - ielts_listening
        - ielts_speaking

  degree_from_url:
    rules:
      - match_keyword: "undergraduate"
        value: "undergraduate"
      - match_keyword: "postgraduate"
        value: "postgraduate"

  selectors:
    course_list:
      xpath: "//div[contains(@class, 'course-text-box')]//a/@href"

    course_name:
      xpath: "//h1/text()"

    city:
      value: "London"

    study_load:
      xpath: "//div[contains(@class, 'big-data-table')]//table[contains(@class, 'pretty') and contains(.//tr/th, 'Mode')]//tr//td[count(//th[contains(., 'Mode')]/preceding-sibling::*)+1]/text()"
      multi: true
      join: ", "

    duration:
      primary:
        xpath: "//div[contains(@class, 'big-data-table')]//table[contains(@class, 'pretty') and contains(.//tr, 'Duration')]//tr[2]//td[count(//th[contains(., 'Duration') or contains(., 'Attendance')]/preceding-sibling::*)+1]/text()"
        duration_raw_xpath: "//div[contains(@class, 'big-data-table')]//table[contains(@class, 'pretty') and contains(.//tr, 'Duration')]//tr//td[count(//th[contains(., 'Duration')]/preceding-sibling::*)+1]/text()"
      fallback:
        xpath: "//div[contains(@class, 'big-data-table')]//table[contains(@class, 'pretty') and contains(.//tr, 'Attendance')]//tr[2]//td[count(//th[contains(., 'Attendance')]/preceding-sibling::*)+1]/text()"
        duration_raw_xpath: "//div[contains(@class, 'big-data-table')]//table[contains(@class, 'pretty') and contains(.//tr, 'Attendance')]//tr[2]//td[count(//th[contains(., 'Attendance')]/preceding-sibling::*)+1]/text()"

    intake_month:
      xpath: "//div[contains(@class, 'big-data-table')]//table[contains(@class, 'pretty') and contains(//tr, 'Start date')]//tr[2]//td[count(//th[contains(., 'Start date')]/preceding-sibling::*)+1]"

    course_description:
      xpath: "//div[contains(@class, 'site-course-overview-left-inner')]"

    other_requirements:
      xpath: "//div[contains(@class, 'contentblock') and contains(.//h2, 'Entry requirements')]"

    career:
      xpath: "//div[contains(@class, 'contentblock') and contains(.//h2, 'After you graduate')]"

    fee_international:
      xpath: "//div[contains(@class, 'contentblock') and contains(.//h2, 'fees')]//div[contains(@class, 'site-expand-box-heading') and contains(.//h3, '2025/26')]/following-sibling::div[1]//td[contains(., 'nternational')]/following-sibling::td/text() | //div[contains(@class, 'contentblock') and contains(.//h2, 'ees')]//div[contains(@class, 'site-expand-box-heading') and contains(.//h3, '2025/26')]/following-sibling::div[1]//h3[contains(., 'nternational')]//following-sibling::ul//li/text()"
      multi: true
      first_as_fee_int: true

    course_structure:
      primary:
        xpath: "//div[contains(@class, 'site-modules-block-tab') and contains(@data-tab, 'list')]"
        tab_navigation:
          tab_label_xpath: ".//h3/text()"
          tab_target_attr: "data-tab"
          tab_content_xpath: "//div[contains(@id, '{tab_id}')]"
      fallback:
        xpath: "//div[contains(@class, 'contentblock') and contains(.//h2, 'What you will')]"

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
