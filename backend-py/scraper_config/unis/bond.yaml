# Bond University
# Hostname: bond.edu.au  (no www prefix)
#
# Discovery strategy: Bond's internal Elasticsearch index (open, no auth)
#   POST https://bond.edu.au/api/v1/elasticsearch/bond_prod_default/_search
#   with student_type filter → 221 international courses (168 /program/ + 52
#   /microcredential/) in a single request.  No scraping or BFS needed.
#
# Why not sitemap: bond.edu.au/sitemap.xml?page=N returns HTTP 403 from
#   datacenter IPs (Cloudflare IP-block on sitemap children).  The index
#   root (sitemap.xml) resolves but its 13 child pages all 403, so the
#   supplement produces 0 additional URLs.
#
# Why not program-finder BFS: bond.edu.au/study/program-finder is a React
#   SPA that fires XHR *after* Scrape.do's render window closes.  Even with
#   scrape_do_render: true the rendered HTML contains 0 course-card anchors.
#   The only BFS-visible courses are ~13 static featured cards on the
#   homepage — hence the previous "only 11 staged" symptom.
#
# Fees and IELTS: JS-rendered (XHR-loaded) on course pages; Playwright and
#   Gemini both see empty content.  Bond publishes a stable central English-
#   requirements page which is hard-coded below so every course stages with
#   IELTS/PTE/TOEFL values.

discovery:
  # ── Primary: Elasticsearch API ────────────────────────────────────────────
  # generic_search_api runs BEFORE BFS (orchestrator line ~1815: "if not links").
  # Returns all 221 international-student courses in a single POST.
  generic_search_api:
    enabled: true
    method: POST
    url: "https://bond.edu.au/api/v1/elasticsearch/bond_prod_default/_search"
    headers:
      content-type: "application/json"

    # Body confirmed live 2026-08-09: 221 hits with student_type filter.
    body:
      query:
        term:
          student_type: "International students"
      size: 500
      _source:
        - url
        - title

    # Response shape: hits.hits[*]._source.url (array) / .title (array)
    root_path: "hits.hits"
    url_fields:
      - "_source.url.0"       # url is a list; .0 unwraps the first element
    title_fields:
      - "_source.title.0"     # title is a list; .0 unwraps the first element

    # Relative URLs (e.g. "/program/bachelor-of-laws") → absolute.
    base_url: "https://bond.edu.au"
    normalize_relative_urls: true

    # Keep only course overview pages; filter out the 1 stray
    # /translational-simulation URL and any depth-3+ sub-pages.
    allow_url_patterns:
      - '^https://bond\.edu\.au/program/[^/]+/?$'
      - '^https://bond\.edu\.au/microcredential/[^/]+/?$'

  # ── BFS fallback (if ES index changes / returns 0) ────────────────────────
  # The orchestrator falls through to BFS when generic_search_api returns 0.
  # Keep scrape_do_render so the rendered program-finder pages are attempted
  # (though XHR timing makes them unreliable; this is a last-resort only).
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  use_wayback: false
  bfs_page_budget: 22

  seed_urls:
    - "https://bond.edu.au/study/program-finder?student_type%5B%5D=International+students&page=1"

  # Program finder pages are listing pages only — not course candidates.
  listing_only_patterns:
    - '/study/program-finder'

  force_candidate_url_patterns:
    - '^https://bond\.edu\.au/program/[^/]+/?$'
    - '^https://bond\.edu\.au/microcredential/[^/]+/?$'

  block_url_patterns:
    - '/program/[^/]+/[^/]+'
    - '/microcredential/[^/]+/[^/]+'

  # Sitemap child pages return 403 from datacenter IPs — disable supplement.
  # (sitemap.xml index resolves; sitemap.xml?page=N all 403.)
  sitemap_url: "https://bond.edu.au/sitemap.xml"
  always_sitemap_supplement: false

  expected_min_courses: 200

extraction:
  english:
    central_page: "https://bond.edu.au/international-students/english-language-requirements"

  filters:
    domestic_only:
      enabled: true   # Preserve current prod behaviour: filter runs for all unis.
