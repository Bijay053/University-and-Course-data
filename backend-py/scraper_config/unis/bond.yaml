# Bond University
# Hostname: bond.edu.au  (no www prefix)
#
# Bug history / rationale:
#   - Fees and IELTS requirements are JS-rendered (XHR-loaded).  Playwright and
#     Gemini both see empty content for these fields on individual course pages.
#   - Bond publishes a stable central English-requirements page.  Hard-coding it
#     here ensures every Bond course stages with IELTS/PTE/TOEFL values.
#   - Previously injected via hardcoded if-block in orchestrator.py lines ~836-845.
#     YAML takes priority; the orchestrator if-block remains as a safety net
#     until Week-2 migration removes it.
#
# Discovery fix (2026-07-17):
#   - Bond's program finder (bond.edu.au/study/program-finder) is a React SPA;
#     BFS from the homepage only finds ~13 featured courses visible in static HTML.
#   - generic_search_api (ES endpoint) was the first attempt but is gated by
#     `if not links` in the orchestrator — BFS fills `links` first so the API
#     was never called.
#   - Fix: use Bond's own sitemap index (sitemap.xml lists 5 child sitemaps).
#     The sitemap discovery code recurses one level into sitemap-index files,
#     fetching all 5 child pages and yielding 240 depth-2 /program/ and
#     /microcredential/ URLs.  always_sitemap_supplement ensures it runs even
#     when BFS has already found some links.
#   - Depth-3 sub-pages (7 total: FAQ, entry-assessment, prerequisites, enquiry)
#     are blocked so only the main course overview pages enter the extraction queue.

discovery:
  sitemap_url: "https://bond.edu.au/sitemap.xml"
  always_sitemap_supplement: true
  expected_min_courses: 150
  force_candidate_url_patterns:
    - '^https://bond\.edu\.au/program/[^/]+/?$'
    - '^https://bond\.edu\.au/microcredential/[^/]+/?$'
  block_url_patterns:
    - '/program/[^/]+/[^/]+'       # depth-3+ sub-pages (FAQ, prerequisites, enquiry)
    - '/microcredential/[^/]+/[^/]+'

extraction:
  english:
    central_page: "https://bond.edu.au/international-students/english-language-requirements"

  filters:
    domestic_only:
      enabled: true   # Preserve current prod behaviour: filter runs for all unis.
