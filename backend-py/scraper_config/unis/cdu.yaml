# Charles Darwin University
# Hostname: www.cdu.edu.au
#
# Bug history / rationale:
#   - Course listing pages are JS-rendered (Angular SPA injected into
#     #js-automated-course-list-<id> anchors).  BFS static HTML only finds
#     category overview pages (/study/accounting, /study/arts, ...) and never
#     reaches actual course detail pages.
#   - Sitemap supplement is the fix: CDU's sitemap contains direct course page URLs.
#   - Current catalogue pages use /study/course/<slug>-<code>?year=2026.

locked_config_paths:
  - discovery

discovery:
  sitemap_url: "https://www.cdu.edu.au/sitemap.xml"
  always_sitemap_supplement: false
  skip_sitemap_fallback: false
  bfs_page_budget: 0
  skip_browser_discovery: true
  allow_url_patterns:
    - '^https?://(?:www\.)?cdu\.edu\.au/study/course/[^/?]+(?:\?year=20\d{2})?$'
  course_detail_url_patterns:
    - '^https?://(?:www\.)?cdu\.edu\.au/study/course/[^/?]+(?:\?year=20\d{2})?$'

extraction:
  filters:
    domestic_only:
      enabled: true   # Preserve current prod behaviour: filter runs for all unis.
