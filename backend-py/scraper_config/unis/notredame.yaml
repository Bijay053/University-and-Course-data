# University of Notre Dame Australia
# Hostname: www.notredame.edu.au
#
# Cloudflare Enterprise Bot Management — IP-level block
# ======================================================
# Notre Dame runs Cloudflare Enterprise with Bot Management, which blocks
# all cloud datacenter IPs (AWS, GCP, Hetzner, DigitalOcean, Replit, etc.)
# at the network layer, regardless of browser fingerprinting or stealth
# configuration.  Verified 2026-05-29:
#
#   curl -I (Chrome UA)          → HTTP 403, cf-mitigated: challenge
#   curl_cffi chrome124          → HTTP 403  (TLS impersonation not enough)
#   patchright + Xvfb headed     → HTTP 403  (IP blocked before JS runs)
#
# SOLUTION (implemented 2026-05-29) — fully free, no paid proxy needed:
# -----------------------------------------------------------------------
# 1. DISCOVERY via Wayback CDX:
#    CDX prefix "www.notredame.edu.au/programs/*" returns real course URLs
#    (e.g. /programs/arts-and-sciences/postgraduate/master-of-architecture).
#    The top-level wildcard /* was broken — non-course pages (/about/,
#    /careers/, /contact/, …) exhausted the 10 000-row CDX limit in SURT
#    order before any /programs/ URLs were returned (0 course URLs found).
#    Targeting /programs/* yields ~150 course pages directly.
#    Configured via _HOST_CDX_URL_PREFIX in wayback_discover.py.
#
# 2. EXTRACTION via Wayback archived HTML:
#    fetch_html() → httpx 403 → curl_cffi 403 → fetch_html_wayback()
#    CDX lookup finds most-recent snapshot timestamp, then fetches
#    https://web.archive.org/web/{timestamp}id_/{url} (raw HTML, no toolbar).
#    Archived data is typically 1-4 weeks old — acceptable for stable
#    course-catalogue content (degree names, fee tables, IELTS requirements).
#
# Course URL pattern: www.notredame.edu.au/programs/<faculty>/<level>/<slug>
#   e.g. /programs/arts-and-sciences/postgraduate/master-of-architecture

discovery:
  use_wayback: true
  use_stealth_browser: false
  always_sitemap_supplement: false
  # scrape_do_fallback: true is NOT set — scrape.do returns 502 for Notre Dame
  # (Cloudflare Enterprise also blocks residential-proxy datacenter exit nodes).
  # The 60s timeout per attempt would make every page 60× slower with no benefit.
  scrape_do_fallback: false

extraction:
  fees:
    default_currency: "AUD"
    # Notre Dame publishes fees via a JavaScript calculator on a central fee
    # page (/study/fees-costs-and-scholarships/tuition-fees) — not embedded
    # in individual course pages.  The archived static HTML of that page has
    # no structured table (0 rows), so per-course fee extraction always fails.
    # Setting force_central_fee_stage=true marks every course payload with
    # has_central_fee_page=True so courses bypass the no_international_fee
    # staging-gate reject and land in the review queue instead.
    force_central_fee_stage: true
    central_page: "https://www.notredame.edu.au/study/fees-costs-and-scholarships/tuition-fees"
  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false
