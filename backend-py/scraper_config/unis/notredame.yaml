# University of Notre Dame Australia
# Hostname: www.notredame.edu.au  (uni_id=1165)
#
# Cloudflare Enterprise Bot Management — IP-level block
# ======================================================
# www.notredame.edu.au blocks all cloud datacenter IPs (httpx, cffi,
# Playwright) with 403.  Wayback archived HTML is used for per-course
# extraction.  For discovery the sitemap is now used via Scrape.do render=True.
#
# ── DISCOVERY STRATEGY (updated) ─────────────────────────────────────────────
# The sitemap at https://www.notredame.edu.au/sitemap.xml is accessible via
# Scrape.do render=True and contains 436 /programs/ URLs.
# Filtering to 3-segment paths (faculty/level/degree-slug) yields ~212 real
# degree pages; /courses/ middle-segment paths are unit/subject listings and
# are excluded via block_url_patterns.
#
# Old approach (CDX): Wayback CDX prefix /programs/* was timing out —
# the BFS homepage attempt consumed ~60-90s of the 300s budget going through
# the full cf_ladder, leaving no time for CDX lookup to complete.
# New approach: bfs_page_budget=0 + sitemap_url + scrape_do_skip_fallbacks
# → discovery finishes in ~20-30s total.
#
# ── EXTRACTION STRATEGY ───────────────────────────────────────────────────────
# Per-course pages: httpx/cffi → 403.  Wayback archived HTML typically
# 1-4 weeks old — acceptable for stable degree-catalogue content.
#
# Course URL pattern: /programs/<faculty>/<level>/<degree-slug>
#   e.g. /programs/arts-and-sciences/postgraduate/master-of-architecture

discovery:
  # Point directly at the main sitemap — contains 436 /programs/ URLs.
  sitemap_url: https://www.notredame.edu.au/sitemap.xml

  # REQUIRED — Scrape.do render=True is the only transport that fetches
  # Notre Dame content.  skip_fallbacks goes: static (may 502) → render=True.
  scrape_do_skip_fallbacks: true

  # Skip BFS entirely — homepage is CF-blocked on all transports and
  # consuming 60-90s of the 300s budget before the sitemap is ever tried.
  bfs_page_budget: 0

  # 3-segment /programs/{faculty}/{level}/{degree-slug} — actual degree pages.
  # Sub-pages (4+ segments like /psychology-research-projects) are excluded
  # by the $ anchor.
  allow_url_patterns:
    - '/programs/[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+$'

  # Exclude unit/subject listing pages that sit under /programs/.../courses/
  block_url_patterns:
    - '/programs/[^/]+/courses/'

  # CDX no longer needed for discovery (sitemap covers all degree pages).
  # Keep use_wayback: true so per-request Wayback fallback still fires for
  # per-course extraction fetches via http_fetcher.
  use_wayback: true

  # Already using sitemap_url directly — no supplement needed.
  always_sitemap_supplement: false

  use_stealth_browser: false

extraction:
  fees:
    default_currency: "AUD"
    # Notre Dame publishes fees via a JavaScript calculator on a central fee
    # page (/study/fees-costs-and-scholarships/tuition-fees) — not embedded
    # in individual course pages.  The archived static HTML of that page has
    # no structured table (0 rows), so per-course fee extraction always fails.
    # Setting force_central_fee_stage=true marks every course payload with
    # has_central_fee_page=True so courses bypass the no_international_fee
    # staging-gate reject and land in the review queue instead.
    force_central_fee_stage: true
    central_page: "https://www.notredame.edu.au/study/fees-costs-and-scholarships/tuition-fees"

  # Skip the sparse-static rescue browser refetch.
  # Cloudflare Enterprise blocks Playwright too (rendered=0B) — the rescue
  # was adding ~30 s of wasted Playwright timeout per course, inflating a
  # 210-course job from ~6 min to 106 min with zero extra data recovered.
  skip_browser_rescue: true

  filters:
    domestic_only:
      enabled: false
    online_only:
      # International students on student visas require on-campus delivery.
      enabled: true
