# University of Notre Dame Australia
# Hostname: www.notredame.edu.au  (uni_id=1165)
#
# Cloudflare Enterprise Bot Management — IP-level block
# ======================================================
# www.notredame.edu.au blocks all cloud datacenter IPs (httpx, cffi,
# Playwright) with 403.  Wayback archived HTML is used for per-course
# extraction.  For discovery the sitemap + Wayback CDX are used.
#
# ── DISCOVERY STRATEGY ────────────────────────────────────────────────────────
# Notre Dame has THREE campuses: Fremantle (Perth), Sydney, and Broome.
# Program URLs come in two shapes:
#
#   Non-campus (in sitemap):
#     /programs/{faculty}/{level}/{degree-slug}        ← 3 path segments
#     e.g. /programs/school-of-business/postgraduate/master-of-business-administration
#
#   Campus-prefixed (in Wayback CDX):
#     /programs/{campus}/{faculty}/{level}/{degree-slug}   ← 4 path segments
#     e.g. /programs/fremantle/school-of-arts-and-sciences/postgraduate/master-of-arts
#     e.g. /programs/sydney/school-of-nursing-and-midwifery/postgraduate/doctor-of-nursing
#
# Wayback CDX analysis (2026-08):
#   3-seg non-campus URLs:  ~350 (covered by sitemap + CDX)
#   4-seg campus URLs:      ~357 (only in CDX — were ALL missed before this fix)
#   Total expected:         ~700 course pages
#
# The old allow_url_patterns only matched 3-segment paths, missing every
# campus-prefixed URL.  Adding the campus 4-seg pattern restores ~357 courses.
#
# ── EXTRACTION STRATEGY ───────────────────────────────────────────────────────
# Per-course pages: httpx/cffi → 403.  Wayback archived HTML typically
# 1-4 weeks old — acceptable for stable degree-catalogue content.

discovery:
  # Point directly at the main sitemap — contains non-campus /programs/ URLs.
  sitemap_url: https://www.notredame.edu.au/sitemap.xml

  # REQUIRED — Scrape.do render=True is the only transport that fetches
  # Notre Dame content.  skip_fallbacks goes: static (may 502) → render=True.
  scrape_do_skip_fallbacks: true

  # Skip BFS entirely — homepage is CF-blocked on all transports.
  bfs_page_budget: 0

  # Two URL shapes — both anchored with $ to exclude sub-pages:
  #
  #   Shape 1 (non-campus): /programs/{faculty}/{level}/{degree-slug}
  #   Shape 2 (campus):     /programs/{campus}/{faculty}/{level}/{degree-slug}
  #     campus ∈ {fremantle, sydney, broome}
  #
  # [^/]+ in the final segment allows degree slugs containing commas
  # (e.g. bachelor-of-philosophy,-politics-and-economics).
  allow_url_patterns:
    - '/programs/[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+/[^/]+$'
    - '/programs/(?:fremantle|sydney|broome)/[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+/[^/]+$'

  # Exclude unit/subject listing pages (.../courses/) and CMS snippet pages.
  block_url_patterns:
    - '/programs/[^/]+/courses/'
    - '/programs/re-usable-snippets/'

  # CDX provides the campus-prefixed URLs not in the sitemap.
  use_wayback: true

  # Already using sitemap_url directly — no supplement needed.
  always_sitemap_supplement: false

  use_stealth_browser: false

extraction:
  fees:
    default_currency: "AUD"
    # Notre Dame publishes fees via a JavaScript calculator on a central fee
    # page (/study/fees-costs-and-scholarships/tuition-fees) — not embedded
    # in individual course pages.  The archived static HTML of that page has
    # no structured table (0 rows), so per-course fee extraction always fails.
    # Setting force_central_fee_stage=true marks every course payload with
    # has_central_fee_page=True so courses bypass the no_international_fee
    # staging-gate reject and land in the review queue instead.
    force_central_fee_stage: true
    central_page: "https://www.notredame.edu.au/study/fees-costs-and-scholarships/tuition-fees"

  # Skip the sparse-static rescue browser refetch.
  # Cloudflare Enterprise blocks Playwright too (rendered=0B) — the rescue
  # was adding ~30 s of wasted Playwright timeout per course, inflating a
  # 210-course job from ~6 min to 106 min with zero extra data recovered.
  skip_browser_rescue: true

  filters:
    domestic_only:
      enabled: false
    online_only:
      # International students on student visas require on-campus delivery.
      enabled: true
