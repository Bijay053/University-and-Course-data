# University of Notre Dame Australia
# Hostname: www.notredame.edu.au  (uni_id=1165)
#
# Cloudflare Enterprise Bot Management — IP-level block
# ======================================================
# www.notredame.edu.au blocks all cloud datacenter IPs (httpx, cffi,
# Playwright) with 403.  Wayback archived HTML is used for per-course
# extraction.  For discovery the sitemap + Wayback CDX are used.
#
# ── DISCOVERY STRATEGY ────────────────────────────────────────────────────────
# Notre Dame has THREE campuses: Fremantle (Perth), Sydney, and Broome.
# Program URLs come in two shapes:
#
#   Non-campus (in sitemap):
#     /programs/{faculty}/{level}/{degree-slug}        ← 3 path segments
#     e.g. /programs/school-of-business/postgraduate/master-of-business-administration
#
#   Campus-prefixed (in Wayback CDX):
#     /programs/{campus}/{faculty}/{level}/{degree-slug}   ← 4 path segments
#     e.g. /programs/fremantle/school-of-arts-and-sciences/postgraduate/master-of-arts
#     e.g. /programs/sydney/school-of-nursing-and-midwifery/postgraduate/doctor-of-nursing
#
# Wayback CDX analysis (2026-08):
#   3-seg non-campus URLs:  ~350 (covered by sitemap + CDX)
#   4-seg campus URLs:      ~357 (only in CDX — were ALL missed before this fix)
#   Total expected:         ~700 course pages
#
# The old allow_url_patterns only matched 3-segment paths, missing every
# campus-prefixed URL.  Adding the campus 4-seg pattern restores ~357 courses.
#
# ── EXTRACTION STRATEGY ───────────────────────────────────────────────────────
# Per-course pages: httpx/cffi → 403.  Wayback archived HTML typically
# 1-4 weeks old — acceptable for stable degree-catalogue content.

discovery:
  # Point directly at the main sitemap — contains non-campus /programs/ URLs.
  sitemap_url: https://www.notredame.edu.au/sitemap.xml

  # REQUIRED — Scrape.do render=True is the only transport that fetches
  # Notre Dame content.  skip_fallbacks goes: static (may 502) → render=True.
  scrape_do_skip_fallbacks: true

  # Skip the doomed ~57 s scrape.do static attempt on the sitemap and go
  # straight to render=True (headless Chrome).  Sitemap via render=True
  # returns 474 program URLs in ~9.6 s; static always gets ROTATION_FAILED.
  scrape_do_render: true

  # Skip BFS entirely — homepage is CF-blocked on all transports.
  bfs_page_budget: 0

  # Two URL shapes — both anchored with $ to exclude sub-pages:
  #
  #   Shape 1 (non-campus): /programs/{faculty}/{level}/{degree-slug}
  #   Shape 2 (campus):     /programs/{campus}/{faculty}/{level}/{degree-slug}
  #     campus ∈ {fremantle, sydney, broome}
  #
  # [^/]+ in the final segment allows degree slugs containing commas
  # (e.g. bachelor-of-philosophy,-politics-and-economics).
  allow_url_patterns:
    - '/programs/[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+/[^/]+$'
    - '/programs/(?:fremantle|sydney|broome)/[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+/[^/]+$'

  # Exclude unit/subject listing pages (.../courses/), CMS snippet pages,
  # and CPD/professional-development webinar registration pages (not degrees).
  # Webinar URLs match the 4-segment campus pattern but are event pages, e.g.:
  #   /programs/fremantle/school-of-nursing-and-midwifery/cpd-webinar-acdr
  #   /programs/fremantle/school-of-nursing-and-midwifery/drcd-webinar-acdr
  block_url_patterns:
    - '/programs/[^/]+/courses/'
    - '/programs/re-usable-snippets/'
    - '-webinar-'

  # CDX provides the campus-prefixed URLs not in the sitemap.
  use_wayback: true

  # Sitemap (render=true) gives non-campus URLs; CDX gives campus URLs.
  always_sitemap_supplement: false

  use_stealth_browser: false

  # Notre Dame's Wayback-first strategy means courses with no archived snapshot
  # are expected failures — Cloudflare blocks all live fetches, so if Wayback
  # has no copy of a URL it cannot be fetched at all.  Raise the failure-guard
  # threshold from the default 30% to 60% so a normal Wayback-miss rate (~35%)
  # doesn't trigger failed_degraded and protect-live-data mode.
  failure_guard_threshold: 0.60

extraction:
  fees:
    default_currency: "AUD"
    # Notre Dame publishes fees via a JavaScript calculator on a central fee
    # page (/study/fees-costs-and-scholarships/tuition-fees) — not embedded
    # in individual course pages.  The archived static HTML of that page has
    # no structured table (0 rows), so per-course fee extraction always fails.
    # Setting force_central_fee_stage=true marks every course payload with
    # has_central_fee_page=True so courses bypass the no_international_fee
    # staging-gate reject and land in the review queue instead.
    force_central_fee_stage: true
    central_page: "https://www.notredame.edu.au/study/fees-costs-and-scholarships/tuition-fees"

  english:
    # Notre Dame IELTS requirements are loaded via JS on course pages and are
    # absent from Wayback-archived HTML.  Degree-level defaults are sourced
    # from the official English language requirements page:
    # https://www.notredame.edu.au/study/admission-requirements/english-language-requirements
    # UG standard: IELTS 6.0 overall, no band below 6.0
    # PG standard: IELTS 6.5 overall, no band below 6.0
    # Some health/education programs require 7.0 — those override per-course.
    default_ielts: 6.0
    degree_level_defaults:
      undergraduate:
        ielts: 6.0
        pte: 50
        toefl: 64
      postgraduate:
        ielts: 6.5
        pte: 58
        toefl: 79
      doctorate:
        ielts: 6.5
        pte: 58
        toefl: 79
    # When the Wayback page DOES contain a per-course IELTS value (e.g. a
    # nursing course with IELTS 7.0), keep it — don't let the default overwrite.
    course_english_priority: true

  # Skip the sparse-static rescue browser refetch.
  # Cloudflare Enterprise blocks Playwright too (rendered=0B) — the rescue
  # was adding ~30 s of wasted Playwright timeout per course, inflating a
  # 210-course job from ~6 min to 106 min with zero extra data recovered.
  skip_browser_rescue: true

  # Skip the per-course Playwright browser pass entirely.
  # www.notredame.edu.au is Cloudflare Enterprise — the browser pool returns
  # empty responses (0 B) for every course URL.  Without this flag,
  # maybe_browser_refetch() fires on every course whose IELTS is null (all
  # 690 of them), consuming ~10–30 s of Playwright timeout per course with
  # zero benefit.  IELTS defaults are supplied by english.degree_level_defaults
  # above, so the browser pass contributes nothing.
  skip_per_course_browser: true

  # Scrape.do render=True is currently faster and returns HTML equivalent to
  # Wayback for live Notre Dame pages.  Go directly to that proven transport,
  # skipping the doomed static/httpx/cffi tiers.  Because discovery.use_wayback
  # remains true, fetch_html() automatically uses the cached archive snapshot
  # as a last resort when a rendered live request fails.
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  force_wayback_first: false

  # Keep provider concurrency conservative. Four rendered requests in parallel
  # materially reduce wall time without creating a large transient recovery
  # queue; archive fallback shares this same bounded course semaphore.
  max_parallel_fetch: 4

  # Only transient archive/network failures enter recovery. URLs with no
  # 200-status snapshot are permanent misses and are reported immediately.
  # These limits are a final safety net if Archive.org degrades mid-run.
  recovery_sweep_max_items: 80
  recovery_sweep_time_budget_seconds: 300
  recovery_sweep_delay_seconds: 0.5

  filters:
    domestic_only:
      enabled: false
    online_only:
      # International students on student visas require on-campus delivery.
      enabled: true
