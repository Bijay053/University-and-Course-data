# University of Notre Dame Australia
# Hostname: www.notredame.edu.au
#
# Bug history / rationale:
#   - 2026-05-29 attempt 1: scrape_url=https://www.notredame.edu.au/ → 0 found.
#     Homepage navigation goes through a Funnelback search interface, no
#     direct course links in static HTML.
#   - 2026-05-29 attempt 2: scrape_url=https://search.nd.edu.au/s/search.html
#     → 0 found. Funnelback results are JS-rendered; stealth browser path
#     also returned 0 links.
#   - 2026-05-29 attempt 3: try /programs/ as entry point, since the real
#     course detail pages live at www.notredame.edu.au/programs/<area>/...
#     If this also returns 0, the underlying issue is likely that Notre
#     Dame's catalogue is only enumerable via Funnelback's JSON API and
#     needs a per-uni discovery module (engineering task, not YAML).

discovery:
  use_stealth_browser: true
  always_sitemap_supplement: true
  must_contain:
    - "/programs/"

extraction:
  fees:
    default_currency: "AUD"
  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false