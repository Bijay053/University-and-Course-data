# University of Notre Dame Australia
# Hostname: www.notredame.edu.au
#
# Bug history / rationale:
#   - First scrape: all discovery tiers returned 0 (BFS, sitemap, alt paths,
#     stealth browser, Wayback). Site likely unreachable from the scraper or
#     URL pattern unknown. Adding Wayback fallback + extra entry URL probes
#     in case Notre Dame uses a non-standard course path.

discovery:
  use_stealth_browser: true
  always_sitemap_supplement: true
  use_wayback: true
  fallback_subdomains:
    - study.{domain}
    - international.{domain}

extraction:
  fees:
    default_currency: "AUD"
  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false