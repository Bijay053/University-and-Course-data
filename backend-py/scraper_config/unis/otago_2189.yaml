# University of Otago
# Hostname: www.otago.ac.nz
# Country: New Zealand  |  Currency: NZD
#
# Architecture (2026-06-29 v4):
#   The entire otago.ac.nz domain is behind Cloudflare — static HTTP gets 403 everywhere,
#   including the sitemap. Discovery uses render_listing_pages (scrape.do headless Chrome).
#
# KEY INSIGHT: /study/qualifications renders ALL 192 qualifications in ONE fetch.
#   Previous v2 config also added two subjects-listing pages to render_listing_pages.
#   Those subjects-listing pages link to 133 individual subject detail pages, which the
#   orchestrator then renders as additional listing pages — causing the same 133-page
#   crawl as the original v1. Use ONLY the catalog page.
#
# WHY 41 COURSES WERE MISSING from job_1ffa3984e2b4 (191 found, 150 staged):
#   Root cause 1 — skip_browser_rescue=true set by auto_config_generator:
#     auto_config_generator sets skip_browser_rescue=True when it detects STRATEGY_WAYBACK
#     or STRATEGY_PROXY. That flag blocks browser rescue when a per-course static fetch
#     returns a Cloudflare challenge page (1MB of HTML, but zero visible text).
#     Without browser rescue, those 41 courses get no fallback and are dropped.
#     Fix: skip_browser_rescue: false (explicit override wins over auto_config).
#
#   Root cause 2 — Gemini called with empty text → 20s timeout per course:
#     When text_len=0 (Cloudflare challenge page), Gemini was still called, timed out
#     after 20s, and then the circuit breaker tripped — cascading to more skips.
#     Fix: skip_ai_when_text_empty: true — skips Gemini immediately if text=="" AND
#     triggers a browser retry (scrape.do render=True) to get past Cloudflare.
#
#   Root cause 3 — BFS crawling 5 pages unnecessarily:
#     The BFS from /study/qualifications follows links to /study and /study/departments,
#     wasting time. The catalog page alone gives all 192 candidates.
#     Fix: bfs_page_budget: 1 — crawl only the seed URL itself via BFS.

discovery:
  always_sitemap_supplement: false
  bfs_page_budget: 1
  max_candidates: 500
  expected_min_courses: 150

  seed_urls:
    - 'https://www.otago.ac.nz/study/qualifications'

  # Single catalog page — lists all 192 qualifications in one render (~30 seconds).
  # Do NOT add the subjects-listing pages here; they cascade into 133 subject detail
  # renders via the render_listing_pages loop.
  render_listing_pages:
    - 'https://www.otago.ac.nz/study/qualifications'

  allow_url_patterns:
    - '/study/qualifications/'
    - '/study/dipgrad/'

  block_url_patterns:
    - '/news'
    - '/events'
    - '/about'
    - '/staff'
    - '/people/'
    - '/research/'
    - '/alumni'
    - '\.pdf$'
    - '/courses/papers'
    - '/courses/subjects'
    - '/apply/'
    - '/graduate-research/'
    - '/postgraduate-study/'
    - '/study/masters$'
    - '/study/qualifications$'
    - '/study/qualifications/apply-for-a-programme/'

extraction:
  fees:
    default_currency: 'NZD'
    prefer_international: true
    prefer_annual_over_total: true
    reject_keywords:
      - 'Domestic'
      - 'New Zealand citizen'
      - 'NZ student'
      - 'Part time'
      - 'Part-time'

  english:
    trust_vision_ocr: false
    central_page: 'https://www.otago.ac.nz/international/future-students/entrance-requirements/english-language-requirements'
    degree_level_defaults:
      undergraduate:
        ielts: 6.0
        pte: 50
        toefl: 80
      postgraduate:
        ielts: 6.5
        pte: 58
        toefl: 90

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | University of Otago'
      - ' - University of Otago'
      - ' | University of Otago, New Zealand'

  filters:
    online_only:
      enabled: false

  # Override auto_config_generator which sets skip_browser_rescue=true for
  # STRATEGY_WAYBACK / STRATEGY_PROXY detections. Otago needs browser rescue:
  # when a per-course static fetch returns a Cloudflare challenge (1MB HTML,
  # zero visible text), the browser retry fetches the real rendered page.
  skip_browser_rescue: false

  # When static text is empty (Cloudflare challenge page), skip Gemini immediately
  # instead of timing out after 20 s per course (which also trips the circuit breaker).
  # The code then auto-triggers a per-course browser retry to get past Cloudflare.
  skip_ai_when_text_empty: true

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
    dedup_use_full_url: false
