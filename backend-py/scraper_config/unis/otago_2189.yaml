  # Subject pages link to qualification pages at /study/qualifications/{slug} and /study/dipgrad/.
  # The /subjects-courses/ pattern allows subject intermediary pages to be traversed.
  # Strip ?subject=... query params via dedup_use_full_url: false (set in staging below).
  allow_url_patterns:
    - '/study/qualifications/'
    - '/study/dipgrad/'
    - '/subjects-courses/'

  block_url_patterns:
    - '/news'
    - '/events'
    - '/about'
    - '/staff'
    - '/people/'
    - '/research/'
    - '/alumni'
    - '\.pdf$'
    - '/courses/papers'
    - '/courses/subjects'
    - '/apply/'
    - '/graduate-research/'
    - '/postgraduate-study/'
    - '/study/masters$'
    - '/study/qualifications$'

extraction:
  fees:
    default_currency: 'NZD'
    prefer_international: true
    prefer_annual_over_total: true
    # International fees on Otago course pages are published in structured
    # <meta name="internationalFeesMin" content="..."> / <meta name="internationalFeesMax" ...>
    # The scraper picks these up automatically via the meta-tag fee extractor.
    reject_keywords:
      - 'Domestic'
      - 'New Zealand citizen'
      - 'NZ student'
      - 'Part time'
      - 'Part-time'

  english:
    trust_vision_ocr: false
    central_page: 'https://www.otago.ac.nz/international/future-students/entrance-requirements/english-language-requirements'
    degree_level_defaults:
      undergraduate:
        ielts: 6.0
        pte: 50
        toefl: 80
      postgraduate:
        ielts: 6.5
        pte: 58
        toefl: 90

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | University of Otago'
      - ' - University of Otago'
      - ' | University of Otago, New Zealand'

  filters:
    online_only:
      enabled: false

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
    # dedup on URL path only (strip ?subject=... query params which differ per
    # subject page but refer to the same qualification).
    dedup_use_full_url: false
