# University of Otago
# Hostname: www.otago.ac.nz
# Country: New Zealand  |  Currency: NZD
#
# Architecture (2026-06-29 v2):
#   The entire otago.ac.nz domain is behind Cloudflare — static HTTP gets 403 everywhere,
#   including the sitemap. Discovery uses render_listing_pages (scrape.do headless Chrome).
#
# KEY INSIGHT: /study/qualifications renders to list ALL 192 qualifications in one fetch.
#   Previous v1 config rendered 133 individual subject pages sequentially (~45 min).
#   This version uses ONE catalog page → discovery completes in ~30 seconds.
#
# Three-level navigation:
#   Level 0: /study/qualifications catalog → 192 qualification links
#   Level 1: /study/qualifications/{slug} course detail pages
#              → <meta name="internationalFeesMin" content="43260">
#              → <meta name="internationalFeesMax" content="54390">
#              → <meta name="location" content="Dunedin">
#              → <meta name="studyLevel" content="Postgraduate">
#   Per-course browser rescue handles Cloudflare on individual course pages.

discovery:
  always_sitemap_supplement: false
  bfs_page_budget: 5
  max_candidates: 500
  expected_min_courses: 150

  seed_urls:
    - 'https://www.otago.ac.nz/study/qualifications'

  # Just 3 render pages instead of 135.
  # /study/qualifications = single catalog page listing all 192 qualifications.
  # The two international/subjects seed pages are kept as supplementary in case
  # the catalog misses any international-only courses.
  render_listing_pages:
    - 'https://www.otago.ac.nz/study/qualifications'
    - 'https://www.otago.ac.nz/international/future-students/subjects-courses/subjects'
    - 'https://www.otago.ac.nz/international/future-students/subjects-courses/postgraduate-study/subjects'

  allow_url_patterns:
    - '/study/qualifications/'
    - '/study/dipgrad/'

  block_url_patterns:
    - '/news'
    - '/events'
    - '/about'
    - '/staff'
    - '/people/'
    - '/research/'
    - '/alumni'
    - '\.pdf$'
    - '/courses/papers'
    - '/courses/subjects'
    - '/apply/'
    - '/graduate-research/'
    - '/postgraduate-study/'
    - '/study/masters$'
    - '/study/qualifications$'
    - '/study/qualifications/apply-for-a-programme/'

extraction:
  fees:
    default_currency: 'NZD'
    prefer_international: true
    prefer_annual_over_total: true
    reject_keywords:
      - 'Domestic'
      - 'New Zealand citizen'
      - 'NZ student'
      - 'Part time'
      - 'Part-time'

  english:
    trust_vision_ocr: false
    central_page: 'https://www.otago.ac.nz/international/future-students/entrance-requirements/english-language-requirements'
    degree_level_defaults:
      undergraduate:
        ielts: 6.0
        pte: 50
        toefl: 80
      postgraduate:
        ielts: 6.5
        pte: 58
        toefl: 90

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | University of Otago'
      - ' - University of Otago'
      - ' | University of Otago, New Zealand'

  filters:
    online_only:
      enabled: false

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
    dedup_use_full_url: false
