# University of Otago
# Hostname: www.otago.ac.nz
# Country: New Zealand  |  Currency: NZD
#
# Architecture (2026-06-29):
#   The entire otago.ac.nz domain is behind Cloudflare — static HTTP gets 403 everywhere,
#   including the sitemap. Discovery therefore uses render_listing_pages (scrape.do headless
#   Chrome) to render all 133 subject pages and harvest /study/qualifications/ course links.
#
# Three-level navigation:
#   Level 0: Seed pages — subjects listing (all 133 UG subjects, plus PG which overlaps)
#   Level 1: Subject pages  → course cards linking to /study/qualifications/{slug}
#   Level 2: Course detail  → /study/qualifications/{slug}
#              → structured <meta> tags: internationalFeesMin/Max, location, studyLevel, etc.
#              → per-course browser rescue handles Cloudflare at extraction time
#
# Note: both seed URLs link to the SAME 133 subject pages. All 133 are enumerated directly
# in render_listing_pages so the orchestrator renders them individually, bypassing Cloudflare.
# The BFS budget is kept minimal because BFS static-HTTP is universally 403 on this domain.

discovery:
  # Sitemap is Cloudflare-blocked — cannot use
  always_sitemap_supplement: false

  # Tiny BFS budget — BFS gets 403 on all otago.ac.nz pages.
  # Kept non-zero only as a safety net for any future Cloudflare relaxation.
  bfs_page_budget: 5
  max_candidates: 2000

  expected_min_courses: 200

  seed_urls:
    - 'https://www.otago.ac.nz/international/future-students/subjects-courses/subjects'
    - 'https://www.otago.ac.nz/international/future-students/subjects-courses/postgraduate-study/subjects'

  # render_listing_pages: all 133 subject pages + the two seed listing pages.
  # The orchestrator renders each one with scrape.do headless Chrome, extracts all
  # hrefs matching allow_url_patterns, and adds them as course candidates.
  # Enumerated 2026-06-29 by rendering the subjects-listing page via scrape.do.
  render_listing_pages:
    - 'https://www.otago.ac.nz/international/future-students/subjects-courses/subjects'
    - 'https://www.otago.ac.nz/international/future-students/subjects-courses/postgraduate-study/subjects'
