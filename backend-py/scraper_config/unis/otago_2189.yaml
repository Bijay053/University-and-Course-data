# University of Otago
# Hostname: www.otago.ac.nz
# Country: New Zealand  |  Currency: NZD
#
# Architecture (2026-06-29 v3):
#   The entire otago.ac.nz domain is behind Cloudflare — static HTTP gets 403 everywhere,
#   including the sitemap. Discovery uses render_listing_pages (scrape.do headless Chrome).
#
# KEY INSIGHT: /study/qualifications renders ALL 192 qualifications in ONE fetch.
#   Previous v2 config also added two subjects-listing pages to render_listing_pages.
#   Those subjects-listing pages link to 133 individual subject detail pages, which the
#   orchestrator then renders as additional listing pages — causing the same 133-page
#   crawl as the original v1. Use ONLY the catalog page.
#
# Three-level navigation:
#   Level 0: /study/qualifications catalog → 192 qualification links (single render)
#   Level 1: /study/qualifications/{slug} course detail pages
#              → <meta name="internationalFeesMin" content="43260">
#              → <meta name="internationalFeesMax" content="54390">
#              → <meta name="location" content="Dunedin">
#              → <meta name="studyLevel" content="Postgraduate">
#   Per-course browser rescue handles Cloudflare on individual course pages.
#
# WHY 46 COURSES WERE MISSING from job_fef5eafb89e4 (192 found, 146 staged):
#   - 1 correctly blocked: /apply-for-a-programme/ (application form, not a course)
#   - ~13 correctly flagged domestic-only: BA, Social Work, PGDipSEM, Teaching, etc.
#     (pages say "not available to international students" — staged with rejected status)
#   - ~32 transient Cloudflare blocks on individual course pages: Music, MArts coursework,
#     MBBS, various PGCert/PGDip health specialties. These pages DO have international fees
#     and no domestic restriction — they were simply blocked at extraction time. Will be
#     captured on the next scrape attempt.

discovery:
  always_sitemap_supplement: false
  bfs_page_budget: 5
  max_candidates: 500
  expected_min_courses: 150

  seed_urls:
    - 'https://www.otago.ac.nz/study/qualifications'

  # Single catalog page — lists all 192 qualifications in one render (~30 seconds).
  # Do NOT add the subjects-listing pages here; they cascade into 133 subject detail
  # renders via the render_listing_pages loop.
  render_listing_pages:
    - 'https://www.otago.ac.nz/study/qualifications'

  allow_url_patterns:
    - '/study/qualifications/'
    - '/study/dipgrad/'

  block_url_patterns:
    - '/news'
    - '/events'
    - '/about'
    - '/staff'
    - '/people/'
    - '/research/'
    - '/alumni'
    - '\.pdf$'
    - '/courses/papers'
    - '/courses/subjects'
    - '/apply/'
    - '/graduate-research/'
    - '/postgraduate-study/'
    - '/study/masters$'
    - '/study/qualifications$'
    - '/study/qualifications/apply-for-a-programme/'

extraction:
  fees:
    default_currency: 'NZD'
    prefer_international: true
    prefer_annual_over_total: true
    reject_keywords:
      - 'Domestic'
      - 'New Zealand citizen'
      - 'NZ student'
      - 'Part time'
      - 'Part-time'

  english:
    trust_vision_ocr: false
    central_page: 'https://www.otago.ac.nz/international/future-students/entrance-requirements/english-language-requirements'
    degree_level_defaults:
      undergraduate:
        ielts: 6.0
        pte: 50
        toefl: 80
      postgraduate:
        ielts: 6.5
        pte: 58
        toefl: 90

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | University of Otago'
      - ' - University of Otago'
      - ' | University of Otago, New Zealand'

  filters:
    online_only:
      enabled: false

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
    dedup_use_full_url: false
