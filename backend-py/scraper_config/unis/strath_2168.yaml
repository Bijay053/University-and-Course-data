# University of Strathclyde  (prod uni_id=2168)
# Hostname: www.strath.ac.uk
# Country: United Kingdom  |  Currency: GBP
#
# Discovery notes (2026-06-17):
#   The /courses/ listing page contains ~562 <article class="searchitem"> elements
#   in its STATIC HTML.  All courses are server-rendered; no JS needed.
#   Each article links to an individual degree page such as
#   /courses/undergraduate/accounting/ (= "Accounting BA Hons").
#
#   Problem: _is_category_landing() flagged all ~556 article links as category
#   hubs (3-segment path, no degree qualifier) → they were pushed to the BFS
#   drill-in queue, not the candidate set → only 6 candidates per /courses/ visit.
#
#   Fix: force_candidate_url_patterns promotes them directly to the candidate set,
#   bypassing _is_category_landing().  bfs_page_budget=30 is enough: /courses/
#   is the only seed page + a small buffer.
#
# IMPORTANT: block "/research/" also kills /courses/research/ — use the
#            hostname-scoped form "strath.ac.uk/research/" instead.

discovery:
  seed_urls:
    - https://www.strath.ac.uk/courses/

  force_candidate_url_patterns:
    - '/courses/undergraduate/[^/]+/?$'
    - '/courses/postgraduatetaught/[^/]+/?$'
    - '/courses/research/[^/]+/?$'

  allow_url_patterns:
    - '/courses/undergraduate/[^/]+/?$'
    - '/courses/postgraduatetaught/[^/]+/?$'
    - '/courses/research/[^/]+/?$'

  block_url_patterns:
    - "/studywithus/"
    - "/whystrathclyde/"
    - "/workwithus/"
    - "strath.ac.uk/research/"     # blocks top-level /research/ but NOT /courses/research/
    - "/staff/"
    - "/news/"
    - "/events/"
    - "/about/"
    - "/contact/"
    - "/media/"
    - "/professionalservices/"
    - "/strathclydesport/"
    - "cookie"

  bfs_page_budget: 30        # /courses/ single seed + small buffer; no drill-in needed
  max_candidates: 700

  always_browser_discover: false
  skip_browser_discovery: true

extraction:
  study_mode:
    # Strath pages contain "apply online"/"online student services" boilerplate
    # on every course, triggering the bare \bonline\b fallback at conf=0.50.
    # Suppress it so Gemini or the location-derived logic sets the correct mode.
    online_only_requires_strong_evidence: true

  max_parallel_fetch: 8

  force_detail_pages:
    - '(?i)/courses/undergraduate/[^/]+/?$'
    - '(?i)/courses/postgraduatetaught/[^/]+/?$'
    - '(?i)/courses/research/[^/]+/?$'

  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false

  fees:
    default_currency: GBP
    prefer_international: true
    prefer_annual_over_total: true
    fee_year: "2025"
    fee_term: "year"
    reject_keywords:
      - "Home"
      - "UK"
      - "Scottish"
      - "Channel Islands"
      - "Isle of Man"

  english:
    # Spider hardcodes IELTS by URL/degree logic rather than scraping — replicate that here.
    # Science or engineering undergrad = 6.0 overall, all others = 6.5 overall.
    # All sub-scores fixed at 5.5 regardless.
    source: static
    ielts_overall_default: "6.5"
    ielts_overall_science_engineering_ug: "6.0"
    ielts_speaking: "5.5"
    ielts_listening: "5.5"
    ielts_reading: "5.5"
    ielts_writing: "5.5"

    # Rule: use 6.0 if URL contains 'science' OR (URL contains 'engineer' AND degree is undergraduate)
    ielts_override_rules:
      - condition: "url_contains=science"
        ielts_overall: "6.0"
      - condition: "url_contains=engineer AND degree_level=undergraduate"
        ielts_overall: "6.0"

  selectors:
    course_list:
      # Matches the spider: //article[contains(@class, 'searchitem')]
      xpath: "//article[contains(@class, 'searchitem')]"

    course_name:
      # All page types (UG/PGT/research) wrap the title in span.course-title inside H1.
      # "//h1/text()" hits nav H1s (wrong); this span selector is precise for all types.
      xpath: "//h1/span[@class='course-title']/text() | //main//h1/span[@class='course-title']/text()"

    course_link:
      xpath: ".//a/@href"

    degree:
      # UG/PGT: graduation icon div.  Research: superscript span in H1 (e.g. "MPhil, PhD").
      xpath: ".//div[contains(./i/@class, 'graduation')] | //h1/span[@class='superscript']/text()"

    city:
      value: "Glasgow"              # spider hardcodes "Glassgow" (typo) — corrected here

    study_load:
      # Spider: //div[contains(@class, 'mode-of-attendance-container')]//div[contains(@class, 'mode-of-attendance-container')]
      xpath: "//div[contains(@class, 'mode-of-attendance-container')]//div[contains(@class, 'mode-of-attendance-container')]"

    duration:
      # Spider: //div[contains(@class, 'key-facts-body')]//div[contains(., 'duration')]
      xpath: "//div[contains(@class, 'key-facts-body')]//div[contains(., 'duration')]"

    intake_month:
      # Spider: //div[contains(@class, 'start-date-container')]/span[contains(@class, 'start-date')]/text()
      xpath: "//div[contains(@class, 'start-date-container')]/span[contains(@class, 'start-date')]/text()"

    fee_year_label:
      # Spider: //div[contains(@id, 'feesfunding')]//ul[contains(@id, 'tabmaster_fees_tabs')]//a[contains(@id, 'tab')]/text()
      xpath: "//div[contains(@id, 'feesfunding')]//ul[contains(@id, 'tabmaster_fees_tabs')]//a[contains(@id, 'tab')]/text()"

    fee_international:
      primary:
        # Spider: //div[contains(@id, 'feesfunding')]//tr/th[contains(., 'nternational')]/following-sibling::td//text()[contains(., '£')]
        xpath: "//div[contains(@id, 'feesfunding')]//tr/th[contains(., 'nternational')]/following-sibling::td//text()[contains(., '£')]"

    course_description:
      # Spider: //div[contains(./h2/text(), 'Why this course')]
      xpath: "//div[contains(./h2/text(), 'Why this course')]"

    course_structure:
      # Spider: //div[contains(@id, 'coursecontent')]
      xpath: "//div[contains(@id, 'coursecontent')]"

    other_requirements:
      # Spider: //div[contains(@id, 'entryrequirement')]
      xpath: "//div[contains(@id, 'entryrequirement')]"

    career:
      # Spider: //div[contains(@id, 'careers')]
      xpath: "//div[contains(@id, 'careers')]"

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: false
    require_international_fee: false