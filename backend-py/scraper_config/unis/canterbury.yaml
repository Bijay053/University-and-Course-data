# University of Canterbury
# Hostname: www.canterbury.ac.nz
# Country: New Zealand
# Currency: NZD

discovery:
  seed_urls:
    - https://www.canterbury.ac.nz/study/academic-study/qualifications

  always_sitemap_supplement: true
  sitemap_url: https://www.canterbury.ac.nz/sitemap.xml

  bfs_page_budget: 40
  max_candidates: 260
  expected_min_courses: 180

  must_contain:
    - /study/academic-study/qualifications/

  allow_url_patterns:
    - '^https://www\.canterbury\.ac\.nz/study/academic-study/qualifications/[a-z0-9-]+/?$'

  block_url_patterns:
    - '/study/academic-study/qualifications/?$'
    - '/study/getting-started/'
    - '/study/study-support-info/'
    - '/study/academic-study/subjects'
    - '/study/academic-study/arts'
    - '/study/academic-study/business'
    - '/study/academic-study/education'
    - '/study/academic-study/engineering'
    - '/study/academic-study/health'
    - '/study/academic-study/law'
    - '/study/academic-study/science'
    - '/communities/'
    - '/news/'
    - '/events/'
    - '/scholarships'
    - '\?'
    - '\.pdf$'

  always_browser_discover: false
  skip_browser_discovery: true
  use_wayback: false

extraction:
  fees:
    central_page: https://www.canterbury.ac.nz/study/getting-started/study-and-living-costs/study-costs/international-tuition-fees
    default_currency: NZD
    prefer_annual_over_total: true
    prefer_year_one_over_total: true
    max_annual_fee: 80000
    reject_keywords:
      - Domestic students
      - Domestic tuition fees
      - StudyLink
      - CSP
      - Commonwealth Supported
      - Student Services Levy
      - SSL
    prefer_international: true

  english:
    central_page: https://www.canterbury.ac.nz/study/getting-started/admission-and-enrolment/english-language-requirements
    course_english_priority: true
    default_ielts: 6.0
    default_pte: 50
    default_toefl: 80
    trust_vision_ocr: false
    trust_tier1_vision_ocr_english: false

  intake:
    start_dates_only: true
    start_dates_window_chars: 900

  filters:
    domestic_only:
      enabled: true
    online_only:
      enabled: true

  text_cleaning:
    location:
      strip_patterns:
        - '\s*Pressing this button will open your email client\.?'
        - '\s*Pressing this button will start a call\.?'
        - '\s*Download \(application/pdf.*$'
        - '\s*Contact us.*$'

    duration:
      reject_sentence_patterns:
        - 'can be studied part-time for up to \d+ years'
        - 'up to \d+ years'
        - 'part-time for up to \d+ years'

    global_substring_blocklist:
      - Pressing this button will open your email client
      - Pressing this button will start a call
      - Download
      - Contact us
      - Ask a question
      - Check your eligibility
      - Fees estimator
      - Student Services Levy

  course_name:
    strip_title_suffixes:
      - " | University of Canterbury"
      - " - University of Canterbury"
      - " : University of Canterbury"
      - " | UC"

  staging:
    reject_if_missing:
      - course_name

  default_course_location: Christchurch

  prefer_blended_over_on_campus: true
  skip_browser_rescue: true
  skip_per_course_browser: true
  max_parallel_fetch: 4