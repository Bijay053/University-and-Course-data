# University of Canterbury
# Hostname: www.canterbury.ac.nz
# Country: New Zealand  |  Currency: NZD
#
# Discovery: Funnelback search API — two separate endpoints for UG and PG subjects.
#   UG: f.Subject+Level|ucSubjectLevel=Undergraduate+subject  → 179 subjects
#   PG: f.Subject+Level|ucSubjectLevel=Postgraduate+subject   →  78 subjects
#   Combined: 257 subject pages, each describing a discipline's qualifications.
#
# The API returns /study/academic-study/subjects/<slug> URLs.
# These subject pages are the canonical course-discovery pages on the UC site.
# allow_url_patterns accepts /subjects/ so all 257 pass through without BFS fallback.

discovery:
  auto_api_discovery: false

  generic_search_api:
    enabled: true
    method: GET
    # Primary: Undergraduate subjects (179 results at num_ranks=300)
    url: "https://search.canterbury.ac.nz/s/search.json?s=%21PadreNull&MBL=300&num_ranks=300&profile=all-subjects-results-page&f.Subject+Level%7CucSubjectLevel=Undergraduate+subject&collection=uoc2%7Esp-aem-all-subjects&sort=title"
    # Secondary: Postgraduate subjects (78 results at num_ranks=300)
    additional_urls:
      - "https://search.canterbury.ac.nz/s/search.json?s=%21PadreNull&MBL=300&num_ranks=300&profile=all-subjects-results-page&f.Subject+Level%7CucSubjectLevel=Postgraduate+subject&collection=uoc2%7Esp-aem-all-subjects&sort=title"
    root_path: "response.resultPacket.results"
    url_fields:
      - "liveUrl"
      - "url"
      - "clickTrackingUrl"
    title_fields:
      - "title"
      - "name"
    normalize_relative_urls: true
    base_url: "https://www.canterbury.ac.nz"
    # The API returns /subjects/ URLs — accept both subjects and qualifications
    allow_url_patterns:
      - "/study/academic-study/subjects/"
      - "/study/academic-study/qualifications/"
    max_pages: 1
    fetch_via_browser: true
    browser_seed_url: "https://www.canterbury.ac.nz/study/academic-study/subjects"

  seed_urls:
    - https://www.canterbury.ac.nz/study/academic-study/qualifications
    - https://www.canterbury.ac.nz/study/academic-study/subjects

  always_sitemap_supplement: true
  sitemap_url: https://www.canterbury.ac.nz/sitemap.xml

  bfs_page_budget: 80
  max_candidates: 700
  expected_min_courses: 200

  must_contain:
    - /study/academic-study/

  allow_url_patterns:
    - "/study/academic-study/qualifications/"
    - "/study/academic-study/subjects/"

  block_url_patterns:
    - '^https://www\.canterbury\.ac\.nz/study/academic-study/qualifications/?$'
    - '^https://www\.canterbury\.ac\.nz/study/academic-study/subjects/?$'
    - '/study/academic-study/arts'
    - '/study/academic-study/business'
    - '/study/academic-study/education'
    - '/study/academic-study/engineering'
    - '/study/academic-study/health'
    - '/study/academic-study/law'
    - '/study/academic-study/science'
    - '/study/getting-started/'
    - '/study/study-support-info/'
    - '/communities/'
    - '/news/'
    - '/events/'
    - '/scholarships'
    - '\?'
    - '\.pdf$'

  always_browser_discover: false
  skip_browser_discovery: true
  use_wayback: false

extraction:
  skip_browser_rescue: true
  skip_per_course_browser: true
  max_parallel_fetch: 4

  fees:
    central_page: https://www.canterbury.ac.nz/study/getting-started/study-and-living-costs/study-costs/international-tuition-fees
    default_currency: NZD
    prefer_annual_over_total: true
    prefer_year_one_over_total: true
    prefer_international: true
    max_annual_fee: 90000
    # UC uses a standardised per-point rate: all programmes at the same
    # degree level pay the same fee.  A bucket (degree-level-only) match
    # from the central fee page IS the correct fee, so allow it with a
    # scrape warning rather than leaving the field blank.
    allow_bucket_match: true

    reject_keywords:
      - Domestic students
      - Domestic tuition fees
      - StudyLink
      - CSP
      - Commonwealth Supported

  english:
    central_page: https://www.canterbury.ac.nz/study/getting-started/admission-and-enrolment/english-language-requirements
    course_english_priority: true
    trust_vision_ocr: false
    trust_tier1_vision_ocr_english: false

    default_ielts: 6.0
    default_pte: 50
    default_toefl: 80

  intake:
    start_dates_only: true
    start_dates_window_chars: 500

  filters:
    domestic_only:
      enabled: true
    online_only:
      enabled: false

  text_cleaning:
    location:
      strip_patterns:
        - '\s*Pressing this button will open your email client\.?'
        - '\s*Pressing this button will start a call\.?'
        - '\s*Download \(application/pdf.*$'
        - '\s*Contact us.*$'
        - '\s*Ask a question.*$'
        - '\s*Check your eligibility.*$'

    duration:
      reject_sentence_patterns:
        - 'can be studied part-time for up to \d+ years'
        - 'up to \d+ years part-time'
        - 'part-time for up to \d+ years'

    global_substring_blocklist:
      - Pressing this button will open your email client
      - Pressing this button will start a call
      - Download
      - Contact us
      - Ask a question
      - Check your eligibility
      - Fees estimator
      - Student Services Levy
      - SSL
      # "UC Online" is Canterbury's online learning brand — appears in the site
      # navigation on every page. Without this block, the \bonline\b regex in
      # the study_mode extractor fires on the nav text and falsely marks all
      # bachelor programmes as mode='Online'.
      - UC Online

  course_name:
    strip_title_suffixes:
      - " | University of Canterbury"
      - " - University of Canterbury"
      - " : University of Canterbury"
      - " | UC"

  staging:
    reject_if_missing:
      - course_name

  default_course_location: Christchurch
  prefer_blended_over_on_campus: true
