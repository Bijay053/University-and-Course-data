# University of Canterbury
# Hostname: www.canterbury.ac.nz
# Country: New Zealand  |  Currency: NZD
#
# hostname_guard prevents this YAML from being applied to Canterbury Christ
# Church University (www.canterbury.ac.uk), which shares the same slug
# "canterbury".  The id-specific filename (canterbury_1750.yaml) is the
# primary disambiguation; hostname_guard is a defence-in-depth safety net.
hostname_guard: "canterbury.ac.nz"

# Discovery: Funnelback search API for qualification (degree) pages.
# Subject pages describe majors/minors and do not contain the fields required
# for publishable courses.

discovery:
  auto_api_discovery: false

  generic_search_api:
    enabled: true
    method: GET
    url: "https://search.canterbury.ac.nz/s/search.json?s=%21PadreNull&MBL=300&num_ranks=300&profile=qualifications-results-page&collection=uoc2%7Esp-aem-qualifications&sort=title"
    root_path: "response.resultPacket.results"
    url_fields:
      - "liveUrl"
      - "url"
      - "clickTrackingUrl"
    title_fields:
      - "title"
      - "name"
    normalize_relative_urls: true
    base_url: "https://www.canterbury.ac.nz"
    allow_url_patterns:
      - "/study/academic-study/qualifications/"
    max_pages: 1
    fetch_via_browser: true
    browser_seed_url: "https://www.canterbury.ac.nz/study/academic-study/qualifications"

  seed_urls:
    - https://www.canterbury.ac.nz/study/academic-study/qualifications

  always_sitemap_supplement: false
  sitemap_url: https://www.canterbury.ac.nz/sitemap.xml

  # Direct page requests return 406. Funnelback supplies the full link set;
  # avoid wasting the discovery budget on known-dead BFS and sitemap probes.
  bfs_page_budget: 0
  max_candidates: 700
  expected_min_courses: 200

  must_contain:
    - /study/academic-study/

  allow_url_patterns:
    - "/study/academic-study/qualifications/"

  block_url_patterns:
    - '/study/academic-study/subjects/'
    - '^https://www\.canterbury\.ac\.nz/study/academic-study/qualifications/?$'
    - '^https://www\.canterbury\.ac\.nz/study/academic-study/subjects/?$'
    - '/study/academic-study/arts'
    - '/study/academic-study/business'
    - '/study/academic-study/education'
    - '/study/academic-study/engineering'
    - '/study/academic-study/health'
    - '/study/academic-study/law'
    - '/study/academic-study/science'
    - '/study/getting-started/'
    - '/study/study-support-info/'
    - '/communities/'
    - '/news/'
    - '/events/'
    - '/scholarships'
    - '\?'
    - '\.pdf$'

  always_browser_discover: false
  skip_browser_discovery: true
  use_wayback: false

extraction:
  # Canterbury blocks direct httpx with HTTP 406. Its AEM pages are
  # server-rendered, so Scrape.do static mode is the authoritative first fetch.
  scrape_do_static: true
  skip_browser_rescue: true
  skip_per_course_browser: true
  max_parallel_fetch: 8

  fees:
    central_page: https://www.canterbury.ac.nz/study/getting-started/study-and-living-costs/study-costs/international-tuition-fees
    default_currency: NZD
    prefer_annual_over_total: true
    prefer_year_one_over_total: true
    prefer_international: true
    max_annual_fee: 90000
    allow_bucket_match: true

    reject_keywords:
      - Domestic students
      - Domestic tuition fees
      - StudyLink
      - CSP
      - Commonwealth Supported

  english:
    central_page: https://www.canterbury.ac.nz/study/getting-started/admission-and-enrolment/english-language-requirements
    course_english_priority: true
    trust_vision_ocr: false
    trust_tier1_vision_ocr_english: false

    degree_level_defaults:
      undergraduate:
        ielts: 6.0
        pte: 50
        toefl: 80
      postgraduate:
        ielts: 6.5
        pte: 58
        toefl: 90
      doctorate:
        ielts: 6.5
        pte: 58
        toefl: 90

  intake:
    start_dates_only: true
    start_dates_window_chars: 500

  filters:
    domestic_only:
      enabled: true
    online_only:
      enabled: false

  text_cleaning:
    location:
      strip_patterns:
        - '\s*Pressing this button will open your email client\.?'
        - '\s*Pressing this button will start a call\.?'
        - '\s*Download \(application/pdf.*$'
        - '\s*Contact us.*$'
        - '\s*Ask a question.*$'
        - '\s*Check your eligibility.*$'

    duration:
      reject_sentence_patterns:
        - 'can be studied part-time for up to \d+ years'
        - 'up to \d+ years part-time'
        - 'part-time for up to \d+ years'

    global_substring_blocklist:
      - Pressing this button will open your email client
      - Pressing this button will start a call
      - Download
      - Contact us
      - Ask a question
      - Check your eligibility
      - Fees estimator
      - Student Services Levy
      - SSL
      - UC Online

  course_name:
    strip_title_suffixes:
      - " | University of Canterbury"
      - " - University of Canterbury"
      - " : University of Canterbury"
      - " | UC"

  staging:
    reject_if_missing:
      - course_name

    skip_degree_qualifier_check: true
    require_international_fee: false
    dedup_use_full_url: true    

  default_course_location: Christchurch
  prefer_blended_over_on_campus: true