# University of Waikato
# Hostname: www.waikato.ac.nz
# CMS: SilverStripe / Elastic App Search
# Country: New Zealand  |  Currency: NZD
#
# Discovery strategy: Elastic App Search (body-POST, not query-string params)
#
# HOW TO IDENTIFY engine name + Bearer token:
#   1. DevTools → Network → filter XHR/Fetch
#   2. Navigate to https://www.waikato.ac.nz/int/study/qualifications/
#   3. Find POST to .../_search/api/as/v1/engines/<ENGINE>/search.json
#   4. Copy <ENGINE> from the URL and the "Bearer <TOKEN>" from Authorization header
#   5. Store token as WAIKATO_EAS_TOKEN secret — never commit literal tokens

discovery:
  auto_api_discovery: false

  generic_search_api:
    enabled: true
    method: POST
    url: "https://www.waikato.ac.nz/_search/api/as/v1/engines/--engine--/search.json"

    headers:
      authorization: "Bearer ${WAIKATO_EAS_TOKEN}"
      content-type: "application/json"
      x-swiftype-client: "elastic-app-search-javascript"
      x-swiftype-client-version: "8.13.0"

    # JSON body template — pagination fields are updated per request by body_pagination
    body:
      query: ""
      page:
        current: 1
        size: 100
      filters:
        all:
          - type: "qualification"

    # Body-based pagination: page number and size live inside the JSON body,
    # NOT as query-string parameters (which is what the old page_number_param
    # approach produced — sending ?page.current=2 instead of body["page"]["current"]=2)
    page_size: 100
    body_pagination:
      current_path: page.current           # updates body["page"]["current"] per request
      size_path: page.size                 # updates body["page"]["size"]
      total_pages_path: meta.page.total_pages      # stop when current_page >= total
      total_results_path: meta.page.total_results  # logged for diagnostics

    root_path: "results"

    url_fields:
      - "url.raw"
      - "url"
      - "link.raw"
      - "path.raw"

    title_fields:
      - "title.raw"
      - "title"
      - "name.raw"
      - "name"

    normalize_relative_urls: true
    base_url: "https://www.waikato.ac.nz"

    max_pages: 10

    allow_url_patterns:
      - "/int/study/qualifications/"

  seed_urls:
    - https://www.waikato.ac.nz/int/study/qualifications/

  always_sitemap_supplement: false
  sitemap_url: https://www.waikato.ac.nz/sitemap.xml

  bfs_page_budget: 80
  max_candidates: 500
  expected_min_courses: 100

  must_contain:
    - /int/study/qualifications/

  allow_url_patterns:
    - "/int/study/qualifications/"

  block_url_patterns:
    - '^https://www\.waikato\.ac\.nz/int/study/qualifications/?$'
    - '/int/study/qualifications/undergraduate/?$'
    - '/int/study/qualifications/postgraduate/?$'
    - '/int/study/qualifications/research/?$'
    - '/int/study/qualifications/certificates-and-diplomas/?$'
    - '/int/about/'
    - '/int/research/'
    - '/int/study/apply/'
    - '/int/study/fees'
    - '/int/study/scholarships'
    - '/int/study/key-university'
    - '/int/study/prospectus'
    - '/int/study/why-choose'
    - '/int/study/work-integrated'
    - '/int/study/student-success'
    - '/int/study/options/'
    - '/int/study/papers/'
    - '/int/study/upskilling/'
    - '/int/study/get-started/'
    - '/int/study/subjects/'
    - '/search'
    - '/news'
    - '/events'
    - '\?'
    - '\.pdf$'

  always_browser_discover: false
  skip_browser_discovery: true
  use_wayback: false

extraction:
  fees:
    default_currency: NZD

  english:
    default_ielts: 6.0
    default_pte: 50
    default_toefl: 80
    trust_vision_ocr: false

  intake:
    start_dates_only: true

  filters:
    domestic_only:
      enabled: false

    online_only:
      enabled: true

  text_cleaning:
    global_substring_blocklist:
      - Apply now
      - Enquire now
      - Contact us
      - Request information
      - Download brochure

  course_name:
    strip_title_suffixes:
      - " | University of Waikato"
      - " - University of Waikato"
      - " | Te Whare Wānanga o Waikato"

  staging:
    reject_if_missing:
      - course_name

  browser_wait_strategy: domcontentloaded
  browser_dcl_settle_ms: 5000

  skip_browser_rescue: true
  skip_per_course_browser: true

  max_parallel_fetch: 4
