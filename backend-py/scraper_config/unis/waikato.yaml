# University of Waikato
# Hostname: www.waikato.ac.nz
# CMS: SilverStripe / Elastic App Search (via server-side proxy)
# Country: New Zealand  |  Currency: NZD
#
# Discovery strategy: Elastic App Search via browser (session-bound proxy)
#
# HOW IT WORKS:
#   The site runs a server-side reverse proxy at /_search/ that:
#     1. Maps --engine-- → the real engine name (search-uow1-prod-main)
#     2. Injects the real Authorization: Bearer token server-side
#   The browser client uses --engine-- as a literal URL segment.
#   No Bearer token secret is needed — the proxy adds it.
#   Incapsula/Imperva session cookies ARE required, so fetch_via_browser: true.
#
# CONFIRMED via DevTools (2026-06-02):
#   Engine: search-uow1-prod-main (from meta.engine.name in response)
#   URL:    https://www.waikato.ac.nz/_search/api/as/v1/engines/--engine--/search.json
#   Total:  110 qualifications (meta.page.total_results)
#   URL field in response: page_link.raw (relative, e.g. /study/qualifications/bachelor-of-arts/)

discovery:
  auto_api_discovery: false

  generic_search_api:
    enabled: true
    method: POST
    url: "https://www.waikato.ac.nz/_search/api/as/v1/engines/--engine--/search.json"

    headers:
      content-type: "application/json"
      x-swiftype-client: "elastic-app-search-javascript"
      x-swiftype-client-version: "8.13.0"

    # Exact body used by the site's JavaScript (confirmed via DevTools payload tab)
    body:
      query: ""
      filters:
        all:
          - source_class:
              - "App\\Pages\\QualificationPage"
      page:
        current: 1
        size: 100
      sort:
        - _score: "desc"
        - title: "asc"

    # Body-based pagination — updates body["page"]["current"] per request
    page_size: 100
    body_pagination:
      current_path: page.current
      size_path: page.size
      total_pages_path: meta.page.total_pages
      total_results_path: meta.page.total_results

    root_path: "results"

    # Confirmed from real API response: URLs are in page_link.raw (relative paths)
    url_fields:
      - "page_link.raw"
      - "url.raw"
      - "link.raw"

    title_fields:
      - "title.raw"
      - "title"

    # page_link.raw returns relative paths like /study/qualifications/bachelor-of-arts/
    normalize_relative_urls: true
    base_url: "https://www.waikato.ac.nz"

    allow_url_patterns:
      - "/study/qualifications/"

    max_pages: 10

    # Incapsula/Imperva session cookies are required — browser mode navigates
    # to the qualifications page first so the server issues its session cookie,
    # then calls the API via JS fetch (which inherits those cookies).
    fetch_via_browser: true
    browser_seed_url: "https://www.waikato.ac.nz/int/study/qualifications/"

  seed_urls:
    - https://www.waikato.ac.nz/int/study/qualifications/

  always_sitemap_supplement: false
  sitemap_url: https://www.waikato.ac.nz/sitemap.xml

  bfs_page_budget: 80
  max_candidates: 500
  expected_min_courses: 100

  must_contain:
    - /study/qualifications/

  allow_url_patterns:
    - "/study/qualifications/"

  block_url_patterns:
    - '^https://www\.waikato\.ac\.nz/study/qualifications/?$'
    - '/study/qualifications/undergraduate/?$'
    - '/study/qualifications/postgraduate/?$'
    - '/study/qualifications/research/?$'
    - '/int/about/'
    - '/int/research/'
    - '/int/study/apply/'
    - '/int/study/fees'
    - '/int/study/scholarships'
    - '/int/study/key-university'
    - '/int/study/prospectus'
    - '/int/study/why-choose'
    - '/int/study/work-integrated'
    - '/int/study/student-success'
    - '/int/study/options/'
    - '/int/study/papers/'
    - '/int/study/upskilling/'
    - '/int/study/get-started/'
    - '/int/study/subjects/'
    - '/search'
    - '/news'
    - '/events'
    - '\?'
    - '\.pdf$'

  always_browser_discover: false
  skip_browser_discovery: true
  use_wayback: false

extraction:
  fees:
    default_currency: NZD

  english:
    default_ielts: 6.0
    default_pte: 50
    default_toefl: 80
    trust_vision_ocr: false

  intake:
    start_dates_only: true

  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: true

  text_cleaning:
    global_substring_blocklist:
      - Apply now
      - Enquire now
      - Contact us
      - Request information
      - Download brochure

  course_name:
    strip_title_suffixes:
      - " | University of Waikato"
      - " - University of Waikato"
      - " | Te Whare Wānanga o Waikato"
      - " | Apply to Study"

  staging:
    reject_if_missing:
      - course_name

  browser_wait_strategy: domcontentloaded
  browser_dcl_settle_ms: 5000

  skip_browser_rescue: true
  skip_per_course_browser: true

  max_parallel_fetch: 4
