# University of Waikato
# Hostname: www.waikato.ac.nz
# CMS: SilverStripe
# Country: New Zealand
# Currency: NZD
#
# Qualification pages:
# https://www.waikato.ac.nz/int/study/qualifications/
#
# Important:
# Waikato qualification pages are rendered via JS.
# If your platform ignores seed_urls and starts browser discovery from
# https://www.waikato.ac.nz then this is a code issue, not a YAML issue.

discovery:
  seed_urls:
    - https://www.waikato.ac.nz/int/study/qualifications/

  bfs_page_budget: 100
  max_candidates: 500
  expected_min_courses: 100

  must_contain:
    - /int/study/qualifications/

  allow_url_patterns:
    - '^https://www\.waikato\.ac\.nz/int/study/qualifications/(?:bachelor|master|doctor|phd|diploma|certificate|graduate|postgraduate|honours|conjoint)[a-z0-9-]*/?$'

  block_url_patterns:
    - '^https://www\.waikato\.ac\.nz/int/study/qualifications/?$'
    - '/int/study/qualifications/undergraduate/?$'
    - '/int/study/qualifications/postgraduate/?$'
    - '/int/study/qualifications/research/?$'
    - '/int/study/qualifications/certificates-and-diplomas/?$'

    - '/int/about/'
    - '/int/research/'
    - '/int/study/apply/'
    - '/int/study/fees'
    - '/int/study/scholarships'
    - '/int/study/key-university'
    - '/int/study/prospectus'
    - '/int/study/why-choose'
    - '/int/study/work-integrated'
    - '/int/study/student-success'
    - '/int/study/options/'
    - '/int/study/papers/'
    - '/int/study/upskilling/'
    - '/int/study/get-started/'
    - '/int/study/subjects/'
    - '/search'
    - '/news'
    - '/events'
    - '\?'
    - '\.pdf$'

  always_sitemap_supplement: true
  sitemap_url: https://www.waikato.ac.nz/sitemap.xml

  always_browser_discover: false
  skip_browser_discovery: true

  use_wayback: false

extraction:
  fees:
    default_currency: NZD

  english:
    default_ielts: 6.0
    default_pte: 50
    default_toefl: 80

  intake:
    start_dates_only: true

  filters:
    domestic_only:
      enabled: false

    online_only:
      enabled: true

  text_cleaning:
    global_substring_blocklist:
      - Apply now
      - Enquire now
      - Contact us
      - Request information
      - Download brochure

  course_name:
    strip_title_suffixes:
      - " | University of Waikato"
      - " - University of Waikato"
      - " | Te Whare Wānanga o Waikato"

  staging:
    reject_if_missing:
      - course_name

  browser_wait_strategy: domcontentloaded
  browser_dcl_settle_ms: 5000

  skip_browser_rescue: true
  skip_per_course_browser: true

  max_parallel_fetch: 4