# La Trobe University
# Hostname: www.latrobe.edu.au
#
# Bug history / rationale:
#
#   - 2026-05-12: scrape staged only ~6 rows, all category landing pages.
#     Root cause: BFS classifier promoted marketing pages instead of real
#     course pages.  Fix: allow_url_patterns + always_sitemap_supplement.
#
#   - 2026-07-24: CLOUDFLARE ENTERPRISE BLOCK.
#     plain httpx / curl_cffi / Wayback / Scrape.do static → all fail (403/0B).
#     Only Scrape.do render=true works (verified on sitemap + course pages).
#     Fix: scrape_do_skip_fallbacks + scrape_do_render for both phases.
#
#   - 2026-07-26: DISCOVERY UNDERCOUNTING — sitemap approach found only ~225
#     of the 395 courses visible at the Funnelback course-search page:
#       https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses
#                                        &query=&searchtype=global
#                                        &collection=latr%7Esp-latrobe
#     Root cause: (1) sitemap.xml contains ~215 real course paths + ~177
#     category pages — sitemap itself is an undercount vs the search index.
#     (2) allow_url_patterns required a specific degree-type prefix
#     (bachelor-/master-/...) missing for many valid courses.
#
#     Fix: replace sitemap discovery entirely with pre-seeded Funnelback
#     pagination URLs (same approach as ECU — see ecu.yaml).
#     - 40 seed URLs @ 10 results/page cover all 400 slots (>= 395 courses).
#     - Scrape.do render=true fetches each seed page.
#     - _unwrap_funnelback_redirect() in discovery.py converts each search
#       result's /s/redirect?...&url=<encoded> href to a direct /courses/<slug>
#       URL before any allow/block filter runs.
#     - allow_url_patterns broadened to /courses/[a-z][a-z-]+- so any
#       hyphenated course slug is accepted; the existing guards (should_stage_course,
#       _DEGREE_QUALIFIER_RE disabled via skip_degree_qualifier_check) handle
#       quality filtering downstream.
#     - skip_sitemap_fallback: true disables the sitemap supplement entirely.
#     - bfs_page_budget: 50 (>= 40 seeds, each seed is a depth-0 BFS page).
#     - max_candidates: 450 (headroom above 395).
#     - block_url_patterns includes /search to prevent cross-linking from
#       rendered search pages back into the BFS queue (seeds are depth=0 and
#       bypass block checks; only cross-links from rendered seed pages are
#       blocked, so seeds themselves are always fetched).
#
#   - 2026-07-26 (2nd attempt — WRONG FIX): tried num_ranks=20 with step=20
#     to halve seeds from 40 → 20.  Broke the Funnelback result page format:
#     the server ignored num_ranks=20 or returned a different HTML template,
#     yielding 0 /s/redirect? course links per page.  Discovered=1 (a single
#     cross-link category page), staged=0.  REVERTED.
#
#   - 2026-07-26 (correct fix): restore the original 40-seed @ 10/page approach
#     (no num_ranks param — use server default of 10) and address the 300s
#     timeout by overriding discovery_phase_timeout_s: 600 per-uni instead.
#     Budget maths: ceil(40/4) × 35s/render = 350s → fits in 600s; 250s
#     headroom remains for BFS cross-links.  No other university is affected.
#
#   - Per-course pages are JS-heavy (Adobe Target prehide shell on static fetch).
#     extraction.scrape_do_render + skip_browser_rescue mirrors the Herts/
#     Kingston/Cardiff pattern: residential browser pool serves full page;
#     datacenter Playwright also 403s on CF Enterprise.

discovery:
  # Route ALL fetches straight to Scrape.do render=true.
  # Static / cffi / Wayback all fail on latrobe.edu.au (CF Enterprise).
  scrape_do_skip_fallbacks: true
  scrape_do_render: true
  use_wayback: false

  # Disable sitemap — Funnelback seeds cover more courses than the sitemap.
  skip_sitemap_fallback: true
  always_sitemap_supplement: false

  # La Trobe's 40 Funnelback seed pages, each fetched via Scrape.do
  # render=true (~30s each), need more than the global 300s cap.
  # ceil(40/4) × 35s = 350s — 600s gives 250s headroom for BFS cross-links.
  discovery_phase_timeout_s: 600

  # Must be >= number of seed pages (40). Each seed is a BFS depth-0 page.
  bfs_page_budget: 50

  # Funnelback course search — 395 courses @ 10 results/page = 40 pages.
  # start_rank increments by 10 (standard Funnelback default, no num_ranks
  # param — adding num_ranks=N to the URL breaks the result HTML format and
  # yields 0 course links per page).
  # Seeds are fetched via Scrape.do render=true; _unwrap_funnelback_redirect()
  # converts /s/redirect?...&url=<enc> hrefs to direct /courses/<slug> URLs.
  seed_urls:
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&start_rank=1
