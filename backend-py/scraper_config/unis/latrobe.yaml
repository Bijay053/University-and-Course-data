# La Trobe University
# Hostname: www.latrobe.edu.au
#
# Bug history / rationale:
#
#   - 2026-05-12: scrape staged only ~6 rows, all category landing pages.
#     Root cause: BFS classifier promoted marketing pages instead of real
#     course pages.  Fix: allow_url_patterns + always_sitemap_supplement.
#
#   - 2026-07-24: CLOUDFLARE ENTERPRISE BLOCK.
#     plain httpx / curl_cffi / Wayback / Scrape.do static → all fail (403/0B).
#     Only Scrape.do render=true works (verified on sitemap + course pages).
#     Fix: scrape_do_skip_fallbacks + scrape_do_render for both phases.
#
#   - 2026-07-26: DISCOVERY UNDERCOUNTING — sitemap approach found only ~225
#     of the 395 courses visible at the Funnelback course-search page:
#       https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses
#                                        &query=&searchtype=global
#                                        &collection=latr%7Esp-latrobe
#     Root cause: (1) sitemap.xml contains ~215 real course paths + ~177
#     category pages — sitemap itself is an undercount vs the search index.
#     (2) allow_url_patterns required a specific degree-type prefix
#     (bachelor-/master-/...) missing for many valid courses.
#
#     Fix: replace sitemap discovery entirely with pre-seeded Funnelback
#     pagination URLs (same approach as ECU — see ecu.yaml).
#     - Funnelback seed URLs with num_ranks=20 return 20 results per page
#       (standard Funnelback parameter; default is 10 per page).
#     - 20 seed URLs with start_rank step of 20 cover all 400 slots
#       (>= 395 courses).
#     - Scrape.do render=true fetches each seed page.
#     - _unwrap_funnelback_redirect() in discovery.py converts each search
#       result's /s/redirect?...&url=<encoded> href to a direct /courses/<slug>
#       URL before any allow/block filter runs.
#     - allow_url_patterns broadened to /courses/[a-z][a-z-]+- so any
#       hyphenated course slug is accepted; the existing guards (should_stage_course,
#       _DEGREE_QUALIFIER_RE disabled via skip_degree_qualifier_check) handle
#       quality filtering downstream.
#     - skip_sitemap_fallback: true disables the sitemap supplement entirely.
#     - bfs_page_budget: 25 (>= 20 seeds, each seed is a depth-0 BFS page).
#     - max_candidates: 450 (headroom above 395).
#     - block_url_patterns includes /search to prevent cross-linking from
#       rendered search pages back into the BFS queue (seeds are depth=0 and
#       bypass block checks; only cross-links from rendered seed pages are
#       blocked, so seeds themselves are always fetched).
#
#   - 2026-07-26 (2nd fix): DISCOVERY TIMEOUT — 40 seeds × ~30s Scrape.do
#     render / 4 concurrent = 10 batches × 30s = 300s, right at the budget
#     limit.  Any slow render causes "Discovery phase exceeded 300s deadline".
#     Fix: add num_ranks=20 to all seed URLs, step start_rank by 20 instead
#     of 10 → 20 seeds / 4 concurrent = 5 batches × 30s = 150s.  Safe.
#     Budget maths: ceil(20/4) × 30s = 150s → 150s headroom remaining for BFS.
#
#   - Per-course pages are JS-heavy (Adobe Target prehide shell on static fetch).
#     extraction.scrape_do_render + skip_browser_rescue mirrors the Herts/
#     Kingston/Cardiff pattern: residential browser pool serves full page;
#     datacenter Playwright also 403s on CF Enterprise.

discovery:
  # Route ALL fetches straight to Scrape.do render=true.
  # Static / cffi / Wayback all fail on latrobe.edu.au (CF Enterprise).
  scrape_do_skip_fallbacks: true
  scrape_do_render: true
  use_wayback: false

  # Disable sitemap — Funnelback seeds cover more courses than the sitemap.
  skip_sitemap_fallback: true
  always_sitemap_supplement: false

  # Must be >= number of seed pages (20). Each seed is a BFS depth-0 page.
  bfs_page_budget: 25

  # Funnelback course search — 395 courses @ 20 results/page = 20 pages.
  # num_ranks=20 requests 20 results per page (standard Funnelback parameter).
  # start_rank increments by 20 to match.
  # Seed URLs are fetched via Scrape.do render=true; _unwrap_funnelback_redirect()
  # converts /s/redirect?...&url=<enc> hrefs to direct /courses/<slug> URLs.
  # Timing: 20 seeds / 4 concurrent = 5 batches × ~30s = 150s — well within
  # the 300s discovery_phase_timeout_s budget (was 40 seeds = 10 batches ≈ 300s).
  seed_urls:
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=1
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=21
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=41
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=61
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=81
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=101
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=121
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=141
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=161
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=181
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=201
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=221
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=241
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=261
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=281
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=301
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=321
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=341
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=361
    - https://www.latrobe.edu.au/search?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&num_ranks=20&start_rank=381

  # Accept any hyphenated course slug under /courses/.
  # Broader than the old prefix-list — lets guards handle quality filtering.
  # /courses/[a-z][a-z-]+- requires at least one word + hyphen, which all
  # named course pages have; bare category pages (/courses/engineering) are
  # excluded naturally (no trailing hyphen word).
  allow_url_patterns:
    - "/courses/[a-z][a-z-]+-"

  block_url_patterns:
    # Block search/listing/marketing pages from cross-linking into the BFS queue.
    # Seeds are depth=0 and bypass this check; only cross-links from rendered
    # seed pages are subject to blocking.
    - "/search"
    - "/courses/a-z"
    - "/courses/diplomas$"
    - "/courses/packages$"
    - "/study/"
    - "/international/study"
    - "/news/"
    - "/about-us/"
    - "/events/"

  # Headroom above 395 courses.
  max_candidates: 450

extraction:
  # Scrape.do headless Chrome (residential IP) bypasses CF Enterprise 403.
  scrape_do_render: true
  scrape_do_skip_fallbacks: true

  # Datacenter Playwright also 403s on CF Enterprise.
  skip_browser_rescue: true
  skip_per_course_browser: true

  # La Trobe offers "Professional Certificate", "Undergraduate Certificate",
  # "Juris Doctor" etc. whose titles may lack canonical degree words, and
  # Scrape.do sometimes returns an Adobe Target prehide shell with no H1.
  # Discovery already filtered to course URLs — guard is redundant here.
  skip_degree_qualifier_check: true

  # 3 concurrent render calls balances throughput vs Scrape.do rate limits.
  max_parallel_fetch: 3

  filters:
    domestic_only:
      enabled: true
    # La Trobe is a multi-campus on-campus university.  The prehide JS shell
    # means no location/campus text is extractable, so no_location_online_override
    # stamps study_mode=Online on every course.  Disabling online_only filter
    # prevents mass rejection; operators correct study_mode post-staging.
    online_only:
      enabled: false

  fees:
    central_page: "https://www.latrobe.edu.au/international/applying/fees"
    fees_pdf_url: ""

  english:
    central_page: ""
    requirements_pdf_url: ""

  staging:
    # International fees are not extractable automatically:
    # - Central fee page JS table requires client-side interaction (0 records parsed).
    # - Per-course pages also fail even with render=true.
    # Operators review fee data manually after staging.
    require_international_fee: false
