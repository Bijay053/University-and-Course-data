# La Trobe University
# Hostname: www.latrobe.edu.au
#
# Bug history / rationale:
#
#   - 2026-07-24: CLOUDFLARE ENTERPRISE BLOCK on latrobe.edu.au.
#     Only Scrape.do render=true works for per-course extraction.
#
#   - 2026-07-26 (attempt 1 — WRONG): num_ranks=20 added to seed URLs.
#     Broke the latrobe.edu.au Funnelback result HTML format — server
#     returned 0 /s/redirect? course links → discovered=1, staged=0.
#
#   - 2026-07-26 (attempt 2 — WRONG): discovery_phase_timeout_s:600 +
#     scrape_do_wait_for_ms:8000 on latrobe.edu.au/search? seeds.
#     The latrobe.edu.au search page loads its Funnelback results via
#     AJAX after the initial render. Even with 8s wait, results may not
#     appear reliably (only 9 identical nav links per page, not results).
#
#   - 2026-07-26 (CORRECT FIX): switch seed_urls to the direct Squiz
#     Cloud Funnelback endpoint:
#       https://latr-search.funnelback.squiz.cloud/s/search.html?...
#     This IS the Funnelback search server itself — results are in the
#     INITIAL HTML RESPONSE (server-side rendered), no AJAX needed.
#     The latrobe.edu.au/search? page was a custom wrapper that uses JS
#     to AJAX-load results from this endpoint.
#
#     Discovery flow:
#     1. Scrape.do render=true fetches each squiz.cloud seed page.
#     2. BFS extracts links using _resolve(href, base=squiz_url,
#        origin=latrobe_origin). Funnelback result links are relative
#        /s/redirect?...&url=https%3A%2F%2Fwww.latrobe.edu.au%2Fcourses%2F...
#     3. _unwrap_funnelback_redirect() converts /s/redirect?url=<enc>
#        → https://www.latrobe.edu.au/courses/<slug>
#     4. Origin check passes (starts with latrobe.edu.au origin).
#     5. allow_url_patterns matches /courses/<hyphenated-slug>.
#     6. 395 course URLs accumulated across 8 pages (num_ranks=50).
#
#     Budget: 8 seeds / 4 concurrent × ~30s/render = ~60s discovery.

discovery:
  # Route ALL fetches straight to Scrape.do render=true.
  # Squiz Cloud also has CF protection (plain httpx → 403).
  scrape_do_skip_fallbacks: true
  scrape_do_render: true
  use_wayback: false

  # Disable sitemap — Funnelback covers 395 courses; sitemap undercounts.
  skip_sitemap_fallback: true
  always_sitemap_supplement: false

  # Safety margin — actual seed fetch takes ~60s (8/4 × 30s).
  discovery_phase_timeout_s: 600

  # bfs_page_budget must be >= number of seeds (8) plus BFS margin.
  bfs_page_budget: 15

  # Direct Squiz Cloud Funnelback endpoint — server-side rendered HTML,
  # no AJAX. num_ranks=50 → 8 pages cover all 395 La Trobe courses.
  # start_rank increments by 50 (num_ranks per page).
  # DO NOT change the domain back to latrobe.edu.au/search? — that page
  # AJAX-loads its results and needs waitFor time that is unreliable.
  seed_urls:
    - https://latr-search.funnelback.squiz.cloud/s/search.html?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&start_rank=1&num_ranks=50
    - https://latr-search.funnelback.squiz.cloud/s/search.html?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&start_rank=51&num_ranks=50
    - https://latr-search.funnelback.squiz.cloud/s/search.html?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&start_rank=101&num_ranks=50
    - https://latr-search.funnelback.squiz.cloud/s/search.html?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&start_rank=151&num_ranks=50
    - https://latr-search.funnelback.squiz.cloud/s/search.html?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&start_rank=201&num_ranks=50
    - https://latr-search.funnelback.squiz.cloud/s/search.html?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&start_rank=251&num_ranks=50
    - https://latr-search.funnelback.squiz.cloud/s/search.html?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&start_rank=301&num_ranks=50
    - https://latr-search.funnelback.squiz.cloud/s/search.html?f.Tabs%7Clatr%7Eds-courses=Courses&query=&searchtype=global&collection=latr%7Esp-latrobe&start_rank=351&num_ranks=50

  # Accept any hyphenated course slug under /courses/.
  allow_url_patterns:
    - "/courses/[a-z][a-z-]+-"

  block_url_patterns:
    - "/courses/a-z"
    - "/courses/diplomas$"
    - "/courses/packages$"

  # Headroom above 395 courses.
  max_candidates: 450

extraction:
  # Scrape.do headless Chrome (residential IP) bypasses CF Enterprise 403.
  scrape_do_render: true
  scrape_do_skip_fallbacks: true

  # Datacenter Playwright also 403s on CF Enterprise.
  skip_browser_rescue: true
  skip_per_course_browser: true

  skip_degree_qualifier_check: true

  # 3 concurrent render calls balances throughput vs Scrape.do rate limits.
  max_parallel_fetch: 3

  filters:
    domestic_only:
      enabled: true
    online_only:
      enabled: false

  fees:
    central_page: "https://www.latrobe.edu.au/international/applying/fees"
    fees_pdf_url: ""

  english:
    central_page: ""
    requirements_pdf_url: ""

  staging:
    require_international_fee: false
