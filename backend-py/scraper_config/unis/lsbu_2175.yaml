# London South Bank University
# Hostname: www.lsbu.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Discovery: Seeded search results to BFS discovery
# Notes: Heavily blocked marketing/stories to prevent scraping alumni profiles.

locked_config_paths:
  - discovery.generic_search_api
  - discovery.use_wayback
  - extraction.scrape_do_skip_fallbacks
  - extraction.scrape_do_request_timeout_seconds
  - extraction.scrape_do_wayback_after_first_failure
  - extraction.scrape_do_wayback_timeout_seconds
  - extraction.skip_browser_rescue
  - extraction.skip_per_course_browser

discovery:
  # The current site exposes its course catalogue through this Funnelback
  # collection. CDX contains retired aliases and search shells, not a current
  # course inventory. An explicit provider also bypasses old discovery caches.
  generic_search_api:
    url: 'https://lsbu-search.funnelback.squiz.cloud/s/search.json'
    fetch_via_scrape_do: true
    scrape_do_render: true
    require_all_urls: true
    params:
      collection: 'lsbu~ds-courses-new'
      query: '!padrenull'
      scope: 'www.lsbu.ac.uk/study/course-finder/'
      num_ranks: '100'
    root_path: 'response.resultPacket.results'
    url_fields: [liveUrl]
    title_fields: ['listMetadata.courseName.0', title]
    allow_url_patterns:
      - '^https://www\.lsbu\.ac\.uk/study/course-finder/[a-z0-9-]+/?$'
    page_size: 100
    page_size_param: num_ranks
    offset_param: start_rank
    offset_start: 1
    max_pages: 10
  # Keep direct-site fallback bounded if the current API is unavailable.
  # Do not spend the discovery budget probing Cloudflare-blocked sitemaps.
  skip_sitemap_fallback: true   # skip sitemap probe + supplement (CF-blocked, slow)
  always_sitemap_supplement: false  # gated by skip_sitemap_fallback anyway; explicit
  bfs_page_budget: 5
  # null means fallback-only discovery, while still allowing bounded page replay.
  # true would merge historic CDX aliases into the successful current API result.
  use_wayback: null
  skip_browser_discovery: true

  allow_url_patterns:
    - '/study/course-finder/[a-z0-9-]+$'  # Forces strict matching of course pages only
  
  block_url_patterns:
    - '/stories-finder/'
    - '/our-schools/'
    - '/order-a-prospectus/'
    - 'entry-requirements'
    - 'fees-and-funding'
    - '/news'
    - '/events'
    - '/about'
    - '/staff'
    - '/research'

extraction:
  # Cardiff-style: skip doomed httpx/cffi (all datacenter IPs get CF-502) and
  # go straight to Scrape.do headless Chrome (residential proxy, render=True).
  # skip_browser_rescue: Playwright is also a datacenter IP — no point running it.
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  # Do not spend the entire 90s course deadline retrying the same blocked
  # proxy route. Try live once, then the already-discovered archive snapshot.
  # An archive miss permits one final bounded live attempt, not the generic
  # rendered/static retry ladder. Unresolved pages remain explicit failures.
  scrape_do_request_timeout_seconds: 20
  scrape_do_wayback_after_first_failure: true
  # Archive replay has a shared single-slot queue and 25s x 3 retries.
  # Bound queue + request time so it cannot consume the whole course deadline.
  scrape_do_wayback_timeout_seconds: 15
  skip_browser_rescue: true
  # The separate missing-English browser pass ran on 77 courses in the logged
  # scrape and filled zero fields. Do not spend the extraction deadline on it.
  skip_per_course_browser: true
  # Avoid overloading the rendered proxy with 12 simultaneous 2 MB course pages.
  max_parallel_fetch: 6

  study_mode:
    # LSBU's page-wide rule classified campus courses (including Adult Nursing
    # and Physiotherapy) as Online from non-course text. Keep the global
    # online-only gate, but require course-owned delivery evidence.
    suppress_nav_rule: true
    online_only_requires_strong_evidence: true

  fees:
    default_currency: 'GBP'
    prefer_international: true
    prefer_annual_over_total: true
    reject_keywords:
      - 'Home student'
      - 'Home fee'
      - 'UK student'
      - 'UK fee'
      - 'Domestic'
      - 'per module'
      - 'part-time'

  english:
    trust_vision_ocr: false
    default_ielts: 6.0
    default_pte: 60
    default_toefl: 80

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | London South Bank University'
      - ' - London South Bank University'
      - ' | LSBU'
      - ' - LSBU'

  filters:
    online_only:
      enabled: false
  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false