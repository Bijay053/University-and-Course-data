# London South Bank University
# Hostname: www.lsbu.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Discovery: Seeded search results to BFS discovery
# Notes: Heavily blocked marketing/stories to prevent scraping alumni profiles.

discovery:
  # LSBU is fully Cloudflare-blocked: httpx, cffi, Scrape.do static all fail.
  # The sitemap probe (4 URLs × ~75s each = ~300s) exhausts the discovery
  # budget before the orchestrator's wayback_discover() can run.
  #
  # Fix: skip_sitemap_fallback=True causes discover_course_links() to return
  # quickly (~15s — BFS tries homepage, gets CF-502, quits with 0 candidates).
  # The orchestrator then calls wayback_discover() via use_wayback=True, which
  # queries web.archive.org/cdx/search/cdx and finds ~384 cached course URLs.
  skip_sitemap_fallback: true   # skip sitemap probe + supplement (CF-blocked, slow)
  always_sitemap_supplement: false  # gated by skip_sitemap_fallback anyway; explicit
  bfs_page_budget: 5  # homepage CF-blocked; quit fast so orchestrator CDX runs
  use_wayback: true   # orchestrator wayback_discover() finds ~384 LSBU URLs via CDX
  skip_browser_discovery: true

  allow_url_patterns:
    - '/study/course-finder/[a-z0-9-]+$'  # Forces strict matching of course pages only
  
  block_url_patterns:
    - '/stories-finder/'
    - '/our-schools/'
    - '/order-a-prospectus/'
    - 'entry-requirements'
    - 'fees-and-funding'
    - '/news'
    - '/events'
    - '/about'
    - '/staff'
    - '/research'

extraction:
  # Cardiff-style: skip doomed httpx/cffi (all datacenter IPs get CF-502) and
  # go straight to Scrape.do headless Chrome (residential proxy, render=True).
  # skip_browser_rescue: Playwright is also a datacenter IP — no point running it.
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  skip_browser_rescue: true

  fees:
    default_currency: 'GBP'
    prefer_international: true
    prefer_annual_over_total: true
    reject_keywords:
      - 'Home student'
      - 'Home fee'
      - 'UK student'
      - 'UK fee'
      - 'Domestic'
      - 'per module'
      - 'part-time'

  english:
    trust_vision_ocr: false
    default_ielts: 6.0
    default_pte: 60
    default_toefl: 80

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | London South Bank University'
      - ' - London South Bank University'
      - ' | LSBU'
      - ' - LSBU'

  filters:
    online_only:
      enabled: false
  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false