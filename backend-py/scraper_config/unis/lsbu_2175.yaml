# London South Bank University
# Hostname: www.lsbu.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Discovery: Seeded search results to BFS discovery
# Notes: Heavily blocked marketing/stories to prevent scraping alumni profiles.

discovery:
  always_sitemap_supplement: true
  # seed_urls REMOVED — the previous Funnelback course-finder URLs were:
  #   (a) Cloudflare-blocked (403 from all tiers)
  #   (b) JavaScript-rendered AJAX pages — static HTML contains no course links
  #   (c) Each URL burned ~90s in the httpx→cffi→Wayback→Scrape.do retry chain,
  #       exhausting the 300s discovery budget before always_sitemap_supplement ran.
  #
  # Discovery now relies on always_sitemap_supplement: true, which issues a
  # Wayback CDX query for www.lsbu.ac.uk/study/course-finder/* and finds ~384
  # cached course URLs in ~10s — no per-URL retry chain needed.
  bfs_page_budget: 5  # homepage is CF-blocked; small budget so BFS quits fast
  use_wayback: true   # enables per-URL Wayback fallback in extraction phase
  skip_browser_discovery: true

  allow_url_patterns:
    - '/study/course-finder/[a-z0-9-]+$'  # Forces strict matching of course pages only
  
  block_url_patterns:
    - '/stories-finder/'
    - '/our-schools/'
    - '/order-a-prospectus/'
    - 'entry-requirements'
    - 'fees-and-funding'
    - '/news'
    - '/events'
    - '/about'
    - '/staff'
    - '/research'

extraction:
  fees:
    default_currency: 'GBP'
    prefer_international: true
    prefer_annual_over_total: true
    reject_keywords:
      - 'Home student'
      - 'Home fee'
      - 'UK student'
      - 'UK fee'
      - 'Domestic'
      - 'per module'
      - 'part-time'

  english:
    trust_vision_ocr: false
    default_ielts: 6.0
    default_pte: 60
    default_toefl: 80

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | London South Bank University'
      - ' - London South Bank University'
      - ' | LSBU'
      - ' - LSBU'

  filters:
    online_only:
      enabled: false
  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false