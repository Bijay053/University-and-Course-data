# University of Stirling
# Hostname: www.stir.ac.uk
# Country: United Kingdom | Currency: GBP
# CMS: JavaScript SPA for course listings. The provided seed URLs are dynamic search pages.
# Discovery: BFS starting from level-filtered search pages. Course content is loaded via JavaScript.

discovery:
  always_sitemap_supplement: true        # Keeps sitemap as safety net for additional URLs
  seed_urls:
    - "https://www.stir.ac.uk/courses/?f.Level%7Clevel=postgraduate+%28research%29&query="
    - "https://www.stir.ac.uk/courses/?f.Level%7Clevel=undergraduate&query="
    - "https://www.stir.ac.uk/courses/?f.Level%7Clevel=postgraduate+%28taught%29&query="
  # Define patterns for individual course pages
  allow_url_patterns:
    - '/courses/ug/'
    - '/courses/pg-taught/'
    - '/courses/postgraduate-research-degrees/'    
    - "https://www.stir.ac.uk/courses/?f.Level%7Clevel=postgraduate+%28research%29&query="
    - "https://www.stir.ac.uk/courses/?f.Level%7Clevel=undergraduate&query="
    - "https://www.stir.ac.uk/courses/?f.Level%7Clevel=postgraduate+%28taught%29&query="                
  block_url_patterns:
    - '/news'
    - '/events'
    - '/about'
    - '/staff/'
    - '/research/centres/'                    # Block general research centers/projects, focus on degree programs
  expected_min_courses: 400                  # Estimate for a university of this size in the UK
  browser_time_budget_s: 1800                # Allow more time for browser-based SPA discovery
  browser_early_stop_courses: 500            # Stop early if a sufficient number of unique course URLs are found

extraction:
  browser_wait_strategy: networkidle         # Wait for JavaScript network activity to settle on course pages
  browser_dcl_settle_ms: 2000                # Additional settle time after DOMContentLoaded for SPA content

  fees:
    default_currency: "GBP"
    prefer_international: true               # Prioritise international fees
    prefer_annual_over_total: true           # Prefer annual fee over total course fee
    prefer_year_one_over_total: true         # Prefer year one fee if available
    central_page: "https://www.stir.ac.uk/study/international/fees-and-funding/" # Central fees page
    reject_keywords:                         # Drop any fee entry that mentions domestic student terms
      - "Home student"
      - "Home fee"
      - "UK student"
      - "UK fee"
      - "Domestic"

  english:
    central_page: "https://www.stir.ac.uk/study/international/entry-requirements/english-language-requirements/" # Central English requirements page
    trust_vision_ocr: false                  # UK sites often use decorative images for IELTS, prefer text extraction
    default_ielts: 6.0                       # Default IELTS score for UK universities
    default_pte: 60                          # Default PTE score for UK universities
    default_toefl: 80                        # Default TOEFL score for UK universities

  intake:
    start_dates_only: true                   # Focus on actual course start dates, ignore application deadlines

  course_name:
    strip_title_suffixes:                    # Clean common university name suffixes from course titles
      - " | University of Stirling"
      - " - University of Stirling"
      - " — University of Stirling"
      - "| University of Stirling"            # Without leading space
      - " | Stirling"

  filters:
    online_only:
      enabled: false                         # Do not filter out online-only courses for international students (common for UK)

  text_cleaning:
    duration:
      reject_sentence_patterns:              # Reject phrases referring to maximum candidature, not program length
        - 'up to \d+(?:\.\d+)? (?:years?|months?)'
        - 'maximum of \d+ (?:years?|months?)'
        - 'candidature.*\d+ years'

  staging:
    reject_if_missing:
      - course_name                          # Course must have a name to be valid
    skip_degree_qualifier_check: true        # SPA pages might omit degree prefixes in H1, allow for flexibility
    require_international_fee: false         # Fees may be loaded dynamically; stage for human review if missing initially