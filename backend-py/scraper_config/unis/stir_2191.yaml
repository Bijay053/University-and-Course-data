# University of Stirling
# Hostname: www.stir.ac.uk
# Country: United Kingdom | Currency: GBP
# CMS: JavaScript SPA for course listings. The provided seed URLs are dynamic search pages.
# Discovery: BFS starting from level-filtered search pages. Course content is loaded via JavaScript.
discovery:
  always_sitemap_supplement: true
  seed_urls:
  - https://www.stir.ac.uk/courses/
  allow_url_patterns:
  - /[^/]+/[^/]+/[^/]+/?$
  block_url_patterns:
  - /apply
  - /contact
  - /news
  - /events
  - /blog
  - /about
  - /research
  - /alumni
  - /outreach
  - /parents
  - /jobs
  - /careers
  - /accommodation
  - /life-on-campus
  - /fees-and-funding$
  - /international/living
  expected_min_courses: 400
  browser_time_budget_s: 1800
  browser_early_stop_courses: 500
extraction:
  browser_wait_strategy: networkidle
  browser_dcl_settle_ms: 2000
  fees:
    default_currency: GBP
    prefer_international: true
    prefer_annual_over_total: true
    prefer_year_one_over_total: true
    central_page: https://www.stir.ac.uk/study/international/fees-and-funding/
    reject_keywords:
    - Home student
    - Home fee
    - UK student
    - UK fee
    - Domestic
  english:
    central_page: https://www.stir.ac.uk/study/international/entry-requirements/english-language-requirements/
    trust_vision_ocr: false
    default_ielts: 6.0
    default_pte: 60
    default_toefl: 80
  intake:
    start_dates_only: true
  course_name:
    strip_title_suffixes:
    - ' | University of Stirling'
    - ' - University of Stirling'
    - ' — University of Stirling'
    - '| University of Stirling'
    - ' | Stirling'
  filters:
    online_only:
      enabled: false
  text_cleaning:
    duration:
      reject_sentence_patterns:
      - up to \d+(?:\.\d+)? (?:years?|months?)
      - maximum of \d+ (?:years?|months?)
      - candidature.*\d+ years
  staging:
    reject_if_missing:
    - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
