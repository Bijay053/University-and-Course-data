# University of Sheffield
# Hostname: www.sheffield.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Discovery: Authoritative directory seeding with strict biography blocklists
# Notes: Heavily blocked /phd/students and /candidates to prevent API 503 circuit-breaker trips.

discovery:
  always_sitemap_supplement: true
  bfs_page_budget: 80
  max_candidates: 1000
  expected_min_courses: 300

  seed_urls:
    - 'https://www.sheffield.ac.uk/undergraduate/courses'
    - 'https://www.sheffield.ac.uk/postgraduate/taught/courses'

  allow_url_patterns:
    - '/undergraduate/courses/'
    - '/postgraduate/taught/'
    - '/courses/'

  block_url_patterns:
    - '/phd/students/'
    - '/phd/candidates/'
    - '/phd/profiles'
    - '/phd-alumni'
    - '/people/'
    - '/staff/'
    - '/departments/'
    - '/news'
    - '/events'
    - '/about'
    - '/research/'
    - '\.pdf$'

extraction:
  fees:
    default_currency: 'GBP'
    prefer_international: true
    prefer_annual_over_total: true
    reject_keywords:
      - 'Home student'
      - 'Home fee'
      - 'UK student'
      - 'UK fee'
      - 'Domestic'
      - 'Part time'
      - 'Part-time'

  english:
    trust_vision_ocr: false
    central_page: 'https://www.sheffield.ac.uk/international/applying/english-language-requirements'
    default_ielts: 6.5
    default_pte: 61
    default_toefl: 88

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | The University of Sheffield'
      - ' - The University of Sheffield'
      - ' | Sheffield'

  filters:
    online_only:
      enabled: false