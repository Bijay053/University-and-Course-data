# University of Sheffield
# Hostname: www.sheffield.ac.uk
# Country: United Kingdom  |  Currency: GBP
#
# ══ DISCOVERY FIX HISTORY ═══════════════════════════════════════════════════
#
# Problem (previous config):
#   allow_url_patterns: ['/undergraduate/courses/', '/postgraduate/courses/', '/phd/']
#
#   This caused TWO simultaneous failures:
#
#   1. TOO RESTRICTIVE — dropped 27 real courses at department-direct paths
#      that contain neither '/undergraduate/courses/' nor '/postgraduate/courses/'
#      nor '/phd/'. Sheffield has dept-direct courses like:
#        /management/mba
#        /law/llm
#        /<dept>/<course-slug>
#
#   2. TOO PERMISSIVE — '/phd/' as substring allowed PhD student/candidate
#      PROFILE pages through:
#        /<dept>/postgraduate/phd/students/<name>
#        /<dept>/phd/candidates/<name>
#        /<dept>/phd/profiles
#      These are researcher bios with no fee/IELTS data. Wasted Gemini calls
#      on every profile (cost $0.0003 each × 20+ profiles = Gemini budget waste)
#
#   3. Also let through /undergraduate/courses/home (UG search listing page, not a course)
#
#   Result: 222 courses extracted (user expected 330 based on Python script).
#
# Fix:
#   - REMOVED allow_url_patterns entirely — no whitelist restriction
#   - EXPANDED block_url_patterns to cover ALL noise types seen in logs:
#     /phd/students/, /phd/candidates/, /phd/profiles, /courses/home, etc.
#   - Sheffield's sitemap (already enabled via always_sitemap_supplement: true)
#     contains ~531 URLs. With the whitelist removed and noise blocked, the
#     ~330 real courses should pass through to extraction.

discovery:
  always_sitemap_supplement: true
  seed_urls:
    # Funnelback search seed — returns courses with start year 2025 pagination.
    # BFS follows pagination links to discover more courses.
    - "https://www.sheffield.ac.uk/find?f.Tabs%7Cuos%7Eds-courses-undergraduate-new%2Cuos%7Eds-courses%2Cuos%7Eds-courses-postgraduate=Courses&query=&f.Start+year%7CcourseYear=2025"
    # Direct listing hubs — BFS can follow links from here to individual courses
    - "https://www.sheffield.ac.uk/undergraduate/courses"
    - "https://www.sheffield.ac.uk/postgraduate/courses"

  # ── allow_url_patterns ────────────────────────────────────────────────────
  # Derived from University_of_Sheffield_Updated xlsx (329 courses).
  # Every single course in the export is at exactly one of these two shapes:
  #
  #   /undergraduate/courses/2025/<slug>         (177 UG courses)
  #   /postgraduate/taught/courses/2025/<slug>   (152 PG taught courses)
  #
  # IMPORTANT — patterns must be PATH-BASED (no hostname prefix).
  # The BFS allow-override check (discovery.py line 927) runs against
  # _url_parsed.path only.  Including 'sheffield\.ac\.uk/' in the pattern
  # means BFS never matches it (path has no hostname), so the pattern is a
  # no-op as a BFS allow-override and also matches listing pages in Phase A.5b.
  # Phase A.5b (orchestrator.py line 2913) does search the full URL, so
  # path-only patterns work correctly in both places.
  #
  # Previous pattern 3 (/<dept>/(ug|pg)/courses/<slug>) was removed because:
  #   - Zero courses in the xlsx follow that format
  #   - It was matching Sheffield Business School listing pages like
  #     /management/postgraduate/courses/our-marketing-courses, causing
  #     Phase A.5b to keep 21/25 wrong listing pages → 0 courses staged.
  #
  allow_url_patterns:
    - "https://www.sheffield.ac.uk/undergraduate/courses"
    - "https://www.sheffield.ac.uk/postgraduate/courses"
    - "/undergraduate/courses/"
    - "/postgraduate/courses/"
    - "/undergraduate/courses"
    - "/postgraduate/courses"

  block_url_patterns:
    # ── PhD noise (most important — these were extracted as "courses" in logs) ──
    - '/phd/students'          # /<dept>/postgraduate/phd/students/<name>
    - '/phd/candidates'        # /<dept>/phd/candidates/<name> (geography-planning pattern)
    - '/phd/profiles'          # /<dept>/phd/profiles (listing pages)
    - '/phd/scholarships'      # scholarship sub-pages
    - '/phd/projects'          # individual research project listings
    - '/phd/search'            # PhD search listing (not a programme page)
    # ── Course listing pages (not individual courses) ──
    - '/undergraduate/courses/home'     # UG course search home page
    - '/undergraduate/courses/?$'       # bare UG listing page (regex: no slug after /)
    - '/postgraduate/courses/?$'        # bare PG listing page
    # ── Standard noise ──
    - '/news'
    - '/events'
    - '/about'
    - '/staff'
    - '/research'
    - '/contact'
    - '/apply'
    - '/visit'
    - '/open-days'
    - '/international/'
    - '/accommodation'
    - '/finance'
    - '/fees'
    - '/scholarships'
    - '/sport'
    - '/health'
    - '/wellbeing'
    - '/careers'
    - '/library'
    - '/alumni'
    - '/governance'
    - '/jobs'
    - '/vacancies'
    - '/su/'
    - '/students/'
    # ── Sheffield-specific structural noise ──
    - '/schools/home'
    - '/schools/teachers-advisors'
    - '/schools/activities'
    - '/schools/programmes'
    - '/schools/partnerships'
    - '/schools/contact'
    - '/departments/academic'
    - '/departments/faculties'
    - '/study/home'
    - '/study/teaching'
    - '/study/facilities'
    - '/study/ranking'
    - '/study/career'
    - '/study/su'
    - '/study/clubs-societies-sport'
    - '/study/support'
    - '/study/online-events'
    - '/undergraduate/visit'

  expected_min_courses: 300   # Confirmed ~330 from Python script; 500 was too high

extraction:
  # Sheffield course pages: mostly server-rendered but some content loads via JS.
  # networkidle waits for XHR calls before capturing HTML.
  browser_wait_strategy: networkidle
  browser_dcl_settle_ms: 1500

  fees:
    default_currency: "GBP"
    prefer_international: true
    prefer_annual_over_total: true
    prefer_year_one_over_total: true
    central_page: "https://www.sheffield.ac.uk/postgraduate/taught/fees"
    reject_keywords:
      - "Home student"
      - "Home fee"
      - "UK student"
      - "UK fee"
      - "Domestic"

  english:
    central_page: "https://www.sheffield.ac.uk/international/applying/english-language-requirements"
    course_english_priority: true
    trust_vision_ocr: false
    default_ielts: 6.0
    default_pte: 60
    default_toefl: 80

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - " | The University of Sheffield"
      - " - The University of Sheffield"
      - " — The University of Sheffield"
      - "| The University of Sheffield"
      - " | University of Sheffield"
      - " - University of Sheffield"

  filters:
    online_only:
      enabled: false

  text_cleaning:
    duration:
      reject_sentence_patterns:
        - 'up to \d+(?:\.\d+)? (?:years?|months?)'
        - 'maximum of \d+ (?:years?|months?)'
        - 'candidature.*\d+ years'

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
