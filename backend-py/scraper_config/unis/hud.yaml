# University of Huddersfield
# Hostname: www.hud.ac.uk
#
# Bug history / rationale:
#   2026-05-29 — Both www.hud.ac.uk and courses.hud.ac.uk are React SPAs behind
#     Cloudflare. HTTP BFS finds only nav/research pages; Playwright browser
#     discovery was unreliable and slow.
#   2026-05-29 — The old Scrapy spider used courses.hud.ac.uk/json/2025-26/...
#     which now returns a 24KB SPA shell, not JSON.
#   2026-05-29 — SOLVED: the SPA itself queries a SearchStax-hosted Solr core
#     client-side. We query that core directly (discovery.searchstax below).
#     It returns all ~790 course docs with structured fields PLUS the full
#     page-text `content` (IELTS + entry reqs), so NO page fetching is needed.
#     See backend-py/app/services/scraper/searchstax_hud.py.

discovery:
  # Fetch the full course catalogue straight from the SearchStax Solr core.
  # When this block is present the orchestrator skips HTML/browser discovery
  # AND per-course extraction entirely.
  searchstax:
    endpoint: https://searchcloud-1-eu-west-2.searchstax.com/29847/huddersfielddevelopment-4954/emselect
    # The SPA ships this read token to every browser, but we still treat it as
    # a credential: it is read ONLY from the HUD_SEARCHSTAX_TOKEN secret — no
    # literal is committed to the repo. Set the secret in every environment.
    # Operators should rotate it periodically in the SearchStax console.
    token_env: HUD_SEARCHSTAX_TOKEN
    filter_query: "sectionType_s:course"
    page_size: 100
    fee_year: 2025
    currency: GBP
    central_fee_page: https://www.hud.ac.uk/study/fees/

extraction:

  # ── Fees ──────────────────────────────────────────────────────────────────
  fees:
    default_currency: "GBP"
    # Fees are band-derived from a central subject schedule inside the
    # provider (searchstax_hud.py) and the provider sets has_central_fee_page
    # on every payload, so we do NOT set `central_page` here — fetching it
    # only yields a Cloudflare 403 and adds nothing.
    force_central_fee_stage: true

  # ── English requirements ───────────────────────────────────────────────────
  english:
    default_ielts: 6.0

  # ── Filters ───────────────────────────────────────────────────────────────
  filters:
    domestic_only:
      enabled: false

    online_only:
      enabled: false

  # ── Concurrency ───────────────────────────────────────────────────────────
  max_parallel_fetch: 5

  default_course_location: "Huddersfield"
