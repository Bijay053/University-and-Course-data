# University of Huddersfield
# Hostname: www.hud.ac.uk
#
# Bug history / rationale:
#   2026-05-29 — Both www.hud.ac.uk and courses.hud.ac.uk are React SPAs.
#     HTTP BFS finds only nav/research pages (none are real taught courses).
#     always_browser_discover=true uses Playwright to render the JS and find
#     actual course links across both domains.
#   2026-05-29 — The old Scrapy spider used courses.hud.ac.uk/json/2025-26/sort:title
#     which now returns a 24KB SPA shell, not JSON. Browser rendering is the
#     only viable discovery path.
#   2026-05-29 — Fees are on a central schedule page, not individual course pages.

discovery:
  # Use Playwright to render the JS-heavy SPA and discover course links.
  # Without this, BFS only sees the 24KB HTML shell with no course links.
  always_browser_discover: true

  # Raise budget so the browser can sweep category listing pages.
  bfs_page_budget: 80
  max_candidates: 500

  # Block known non-course pages that the classifier picks up as candidates.
  block_url_patterns:
    - '/postgraduate/fees'
    - '/postgraduate/funding'
    - '/postgraduate/research/graduate-school'
    - '/postgraduate/research/writing-a-research-proposal'
    - '/postgraduate/research/research-scholarships'
    - '/open-days/'
    - '/how-to-apply'
    - '/student-life'
    - '/contact'

extraction:

  # ── Fees ──────────────────────────────────────────────────────────────────
  fees:
    default_currency: "GBP"

    # The fee schedule lives on a central page, NOT on individual course pages.
    # Bands (2025-26 international): UG £16,500 / £17,600 / £18,700;
    #                                PG £17,600 / £18,700 per year.
    central_page: https://www.hud.ac.uk/study/fees/

    # Allow courses through staging even when no per-page fee was found.
    force_central_fee_stage: true

  # ── English requirements ───────────────────────────────────────────────────
  english:
    default_ielts: 6.0

  # ── Filters ───────────────────────────────────────────────────────────────
  filters:
    domestic_only:
      enabled: false

    online_only:
      enabled: false

  # ── Concurrency ───────────────────────────────────────────────────────────
  max_parallel_fetch: 5

  default_course_location: "Huddersfield"
