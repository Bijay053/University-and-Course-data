# Stanley College
# Hostname: www.stanleycollege.edu.au
# Country: Australia  |  Currency: AUD
# Slug: stanleycollege
#
# Two domains host course pages:
#   www.stanleycollege.edu.au/courses/  — VET + bachelor-major pages (23 courses)
#   highereducation.stanleycollege.edu.au/course/  — HE degrees (6 courses)
# Search page (?s=) spans both and confirms 28 courses across 2 result pages.
# Both domains serve static HTML (200, full content) — no SPA rendering needed.
# All 29 course URLs pinned as seeds because BFS from scrape_url only sees page 1
# of the search results and misses the 4 bachelor-major pages on page 2.

