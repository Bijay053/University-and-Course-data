# University of Plymouth
# Hostname: www.plymouth.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Discovery: Restricted BFS discovery to strict course directories
# Notes: Blocked heavy pollution from /study/cpd, /schools, and /apprenticeships. Disabled online_only filter to prevent valid UK blended courses from being dropped.

discovery:
  always_sitemap_supplement: true
  seed_urls:
    - 'https://www.plymouth.ac.uk/courses'
  allow_url_patterns:
    - '/courses/undergraduate/'
    - '/courses/postgraduate/'
  block_url_patterns:
    - '/news'
    - '/events'
    - '/about'
    - '/staff'
    - '/research'
    - '/schools'
    - '/study/cpd'
    - '/study/apprenticeships'
    - '/business-partners/'

extraction:
  fees:
    default_currency: 'GBP'
    prefer_international: true
    prefer_annual_over_total: true
    reject_keywords:
      - 'Home student'
      - 'Home fee'
      - 'UK student'
      - 'UK fee'
      - 'Domestic'
      - 'Part time'
      - 'Part-time'

  english:
    trust_vision_ocr: false
    default_ielts: 6.0
    default_pte: 60
    default_toefl: 80

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | University of Plymouth'
      - ' - University of Plymouth'

  filters:
    online_only:
      enabled: false