# University of Plymouth
# Hostname: www.plymouth.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Discovery: Restricted BFS discovery to strict course directories
# Notes: Blocked heavy pollution from /study/cpd, /schools, and /apprenticeships.
#        Disabled online_only filter to prevent valid UK blended courses from being dropped.
#
# IMPORTANT — sub-page pollution fix (2026-06-20):
#   Plymouth course pages have sub-pages for student profiles, industry stories, etc.
#   URL pattern: /courses/undergraduate/<course-slug>/<sub-page-slug>
#   These are NOT courses (e.g. /courses/undergraduate/beng-civil-engineering/mark-wray-graduate-profile).
#   Without anchoring, allow_url_patterns matched both the course level AND its sub-pages,
#   causing 491 links discovered — mostly graduate profiles — with only 46.6% completeness.
#   Fix: [^/?]+/?$ anchors the pattern to stop at the course slug level; sub-page
#   URLs contain an extra / and fail the end-anchor.

discovery:
  always_sitemap_supplement: true
  seed_urls:
    - 'https://www.plymouth.ac.uk/courses'
  allow_url_patterns:
    # Match /courses/undergraduate/<course-slug>/ only — NOT deeper sub-pages.
    # [^/?]+ = one course-slug segment (no slash or query-string chars).
    # /?$ = optional trailing slash then end-of-string (or end-of-path component).
    - '/courses/undergraduate/[^/?]+/?$'
    - '/courses/postgraduate/[^/?]+/?$'
  block_url_patterns:
    - '/news'
    - '/events'
    - '/about'
    - '/staff'
    - '/research'
    - '/schools'
    - '/study/cpd'
    - '/study/apprenticeships'
    - '/business-partners/'
    # Belt-and-suspenders: explicitly block known sub-page slug patterns even if
    # the allow anchor above already stops them.
    - '-graduate-profile'
    - '-student-voice-'
    - 'connecting-with-the-industry'
    - 'connecting-with-industry'

extraction:
  fees:
    default_currency: 'GBP'
    prefer_international: true
    prefer_annual_over_total: true
    reject_keywords:
      - 'Home student'
      - 'Home fee'
      - 'UK student'
      - 'UK fee'
      - 'Domestic'
      - 'Part time'
      - 'Part-time'

  english:
    trust_vision_ocr: false
    default_ielts: 6.0
    default_pte: 60
    default_toefl: 80

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | University of Plymouth'
      - ' - University of Plymouth'

  filters:
    online_only:
      enabled: false
  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
