# University of Huddersfield
# Hostname: www.hud.ac.uk
#
# Bug history / rationale:
#   2026-05-29 — BFS on www.hud.ac.uk discovers only nav/research pages (9 junk
#     candidates).  All real course pages live on the courses.hud.ac.uk subdomain
#     at URLs like /2025-26/{study_mode}/{study_level}/{urltitle}.
#     Fix: block_url_patterns drops all www.hud.ac.uk non-year pages so BFS ends
#     with 0 candidates (<5), which triggers the fallback_subdomains probe of
#     courses.hud.ac.uk.  allow_url_patterns then keeps only /2025-26/… URLs.
#   2026-05-29 — Fees are NOT on individual course pages.  The university
#     publishes fee bands on a central schedule page (hud.ac.uk/study/fees/).
#     force_central_fee_stage: true lets courses pass staging without a per-page fee.

discovery:
  # When BFS on www.hud.ac.uk finds < 5 valid candidates, probe this subdomain.
  # All 500+ courses are served from courses.hud.ac.uk, not www.hud.ac.uk.
  fallback_subdomains:
    - courses.{domain}

  # Accept only URLs that look like real course pages: /2025-26/full-time/…
  # This drops the junk www.hud.ac.uk candidates so the fallback above fires.
  allow_url_patterns:
    - '/\d{4}-\d{2}/'

  # Block known non-course pages that BFS self-classifies as candidates.
  block_url_patterns:
    - '/postgraduate/research/'
    - '/postgraduate/fees'
    - '/postgraduate/funding'
    - '/postgraduate/types-of-study'
    - '/postgraduate/research/graduate-school'
    - '/postgraduate/research/writing-a-research-proposal'
    - '/postgraduate/research/research-scholarships'
    - '/study/'
    - '/undergraduate/'
    - '/open-days/'

  # Raise budget so BFS can walk enough of courses.hud.ac.uk to seed the catalog.
  bfs_page_budget: 80
  max_candidates: 500

extraction:

  # ── Fees ──────────────────────────────────────────────────────────────────
  fees:
    default_currency: "GBP"

    # The fee schedule lives on a central page, NOT on individual course pages.
    # Bands (2025-26 international): UG £16,500 / £17,600 / £18,700;
    #                                PG £17,600 / £18,700 per year.
    central_page: https://www.hud.ac.uk/study/fees/

    # Allow courses through staging even when no per-page fee was found.
    force_central_fee_stage: true

  # ── English requirements ───────────────────────────────────────────────────
  english:
    # IELTS is in the Entry Requirements section of each course page.
    # The spider finds it at //div[@id='entry']//text()[contains(., 'IELTS')].
    # Let the standard extractor run; add a default only as a last resort.
    default_ielts: 6.0

  # ── Filters ───────────────────────────────────────────────────────────────
  filters:
    domestic_only:
      enabled: false

    online_only:
      enabled: false

  # ── Concurrency ───────────────────────────────────────────────────────────
  max_parallel_fetch: 5

  # Spider always sets city = "Huddersfield".
  default_course_location: "Huddersfield"
