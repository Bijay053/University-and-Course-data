  allow_url_patterns:
    # Edinburgh course URLs follow the pattern:
    #   /programmes/{type}/{numeric-id}-{slug}
    # e.g. /programmes/postgraduate-research/510-analysis
    # Listing/pagination pages (/programmes/postgraduate-research?page=N) do
    # NOT have a numeric segment, so they are excluded as course candidates
    # while still being crawled by BFS for link discovery (they are in seed_urls).
    - '/programmes/undergraduate/\d+'
    - '/programmes/postgraduate-research/\d+'
    - '/programmes/postgraduate-taught/\d+'

  block_url_patterns:
    - '/news'
    - '/events'
    - '/about'
    - '/staff'
    - '/alumni'
    - '\.pdf$'
    # Fees sidebar and login-redirect pages linked from course pages — these
    # produce "Tuition Fees" and "Redirecting" course names when extracted.
    - '/undergraduate-fees'
    - '/user/login'

extraction:
  fees:
    default_currency: GBP
    prefer_international: true
    prefer_annual_over_total: true
    reject_keywords:
      - 'Home student'
      - 'Home fee'
      - 'UK student'
      - 'UK fee'
      - 'Domestic'
      - 'Scottish'

  english:
    trust_vision_ocr: false
    course_english_priority: true

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | The University of Edinburgh'
      - ' - The University of Edinburgh'

  filters:
    online_only:
      enabled: false

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
    dedup_use_full_url: true
