# University of Edinburgh
# Hostname: study.ed.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Discovery: Seeded BFS via specific programme directories
# Notes: Standard UK pattern applied with Scottish fee exclusions.
#        Online-only filter disabled to protect blended courses.
#
# Pagination (as of 2026-06-24):
#   Undergraduate:        73 pages  (page=0 … page=72)   724 results
#   Postgraduate Research: 19 pages  (page=0 … page=18)  187 results
#   Postgraduate Taught:   29 pages  (page=0 … page=28)  281 results
#   Total listing entries: ~1,192  (pre-dedup)
#
# BFS does not auto-follow ?page=N query-param pagination, so all 121
# listing pages are pre-seeded (same pattern as UOW 70-page pre-seed).
# bfs_page_budget: 200 covers the full seed set (121 pages + headroom for
# UG page crawling — raised from 130 after UG unblock added 73 real fetches).
#
# IMPORTANT — candidates cap: the default BFS candidate cap of 1,000 was
# hit after PG Taught page=10, cutting off pages 11–27 (≈170 courses).
# max_candidates is raised to 1,400 to capture all ~1,191 listing entries.

discovery:
  always_sitemap_supplement: true
  # 73 UG + 19 PGR + 29 PGT = 121 listing pages; 200 gives headroom for any
  # course-page traversal BFS picks up via sidebar links.
  bfs_page_budget: 200
  max_candidates: 1400

  # UG listing pages (/programmes/undergraduate and ?query=&page=N variants)
  # are blocked by guards.py _BLOCK_URL_LAST_SEGMENTS["undergraduate"] because
  # their last path segment is literally "undergraduate".  This field tells BFS
  # to crawl them for course links but NOT add them to the extraction candidate
  # pool (i.e. they will never be staged as courses themselves).
  allow_blocked_listing_patterns:
    - '/programmes/undergraduate'

