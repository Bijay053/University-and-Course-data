# University of Edinburgh
# Hostname: study.ed.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Discovery: Seeded BFS via specific programme directories
# Notes: Standard UK pattern applied with Scottish fee exclusions.
#        Online-only filter disabled to protect blended courses.
#
# Pagination (as of 2026-06-24):
#   Undergraduate:        73 pages  (page=0 … page=72)
#   Postgraduate Research: 19 pages  (page=0 … page=18)
#   Postgraduate Taught:   28 pages  (page=0 … page=27)
#
# BFS does not auto-follow ?page=N query-param pagination, so all 120
# listing pages are pre-seeded (same pattern as UOW 70-page pre-seed).
# bfs_page_budget is raised to 130 to cover the full seed set.

