# ACU — Australian Catholic University
# Hostname: www.acu.edu.au
# Courses live at /course/<slug>
# Sitemap lists /handbook/handbook-YYYY/course/<slug> which _dedup_year_variants
# rewrites to /course/<slug> — no extra YAML needed for that rewrite.
#
# Cloudflare Enterprise blocks plain httpx on ALL fetches (API, course pages,
# BFS listing, and sitemaps). On 2026-08-21 Scrape.do static also returned
# ROTATION_FAILED, while Scrape.do render returned complete API JSON and course
# HTML. Discovery and extraction therefore both use the rendered proxy.
# www.acu.edu.au is already in _ALWAYS_SITEMAP_SUPPLEMENT_HOSTS in discovery.py
# so the sitemap is always probed regardless of BFS outcome.
#
# Root cause of 0-courses runs: job_77fd305d5d72 got 0 bytes on all 4 standard
# sitemap probes because plain httpx was used (scrape_do_skip_fallbacks not set).

discovery:
  # ── API-first discovery (2026-07-08) ─────────────────────────────────────
  # The find-a-course results grid is a Vue SPA: course-search-result pages
  # contain ZERO server-rendered course links, so BFS/browser discovery can
  # never see the catalogue.  The grid's Vue app (coursesearchresult.js) reads
  # data-dataURL="/webapi/GetCourseResult/get" from #courses-search-results
  # and axios-GETs it with CourseType + sr (Sitecore search-root GUID, from
  # the sr="..." attribute on the same element). We call that JSON API
  # directly — one request per CourseType slice. Live verification on
  # 2026-08-21 returned 109 UG + 109 PG + 5 Research + 18 Other rows,
  # filtered/deduplicated to 197 eligible course URLs.
  # NOT paginated — each call returns the full slice (the grid's "show more"
  # is client-side batching of already-fetched rows).
  # Direct /webapi/ requests now return Cloudflare 403. Rendered Scrape.do
  # still returns the complete JSON catalogue.
  generic_search_api:
    url: "https://www.acu.edu.au/webapi/GetCourseResult/get?CourseType=Undergraduate&sr=%7B8E9AA42C-FDB2-49CE-AE29-7B34CBD33CAB%7D"
    additional_urls:
      - "https://www.acu.edu.au/webapi/GetCourseResult/get?CourseType=Postgraduate&sr=%7B8E9AA42C-FDB2-49CE-AE29-7B34CBD33CAB%7D"
      - "https://www.acu.edu.au/webapi/GetCourseResult/get?CourseType=Research&sr=%7B8E9AA42C-FDB2-49CE-AE29-7B34CBD33CAB%7D"
      - "https://www.acu.edu.au/webapi/GetCourseResult/get?CourseType=Other&sr=%7B8E9AA42C-FDB2-49CE-AE29-7B34CBD33CAB%7D"
    fetch_via_scrape_do: true
    scrape_do_render: true
    # Every endpoint is a distinct catalogue slice. If one provider call
    # exhausts retries, discard the partial list and let sitemap fallback run.
    require_all_urls: true
    root_path: "CoursesResults"
    url_fields: ["URL"]
    title_fields: ["CourseName", "PageTitle"]
    allow_url_patterns:
      - '/course/'
    block_url_patterns:
      - '/short-courses'
      - '/professional-development'
      - '/microcredential'
    normalize_relative_urls: true
    base_url: "https://www.acu.edu.au"
  scrape_do_skip_fallbacks: true
  # Pin the course-listing seed explicitly (job_edd918ab4c88, 2026-07-08):
  # seed_urls[0] becomes the BFS start URL, so discovery no longer depends on
  # home-page detection to find the listing.  This URL matches the global
  # "/study-at-" marketing_page prefix rule (added for UOW) — crawl seeds are
  # exempt from URL classification (see discovery.py seed exemption).
  seed_urls:
    - 'https://www.acu.edu.au/study-at-acu/find-a-course/'
  allow_url_patterns:
    - '/course/'
  block_url_patterns:
    - '/short-courses'
    - '/professional-development'
    - '/microcredential'
    - '/handbook/handbook-201'
    - '/handbook/handbook-202[0-3]'
  browser_time_budget_s: 120
  browser_early_stop_courses: 200
  expected_min_courses: 80

extraction:
  # Direct HTTP and local datacenter Playwright are both blocked. Go straight
  # to the verified residential browser tier, and never repeat a 60-second
  # local browser rescue after that provider path has already failed.
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  scrape_do_wait_for_ms: 1500
  # ACU's template intentionally has no H1 (course_name comes from <title>).
  # Do not mistake that known template shape for incomplete hydration and
  # issue a second paid render at 3000 ms.
  skip_render_hydration_retry: true
  scrape_do_local_concurrency: 8
  max_parallel_fetch: 8
  skip_browser_rescue: true
  skip_per_course_browser: true
  skip_ai_when_text_empty: true

  english:
    # Fee + IELTS are visible text in rendered ACU pages. Avoid image OCR once
    # those two core fields have already been extracted.
    skip_vision_when_core_found: true

  # Static course pages have NO <h1>; the only name candidate is the page
  # <title>, which carries the CMS suffix "… | ACU courses" (verified live
  # 2026-07-08). Strip it before cleaning so staged names are pure degree
  # names. endswith-literal match, applied to RAW title pre-_clean().
  course_name:
    strip_title_suffixes:
      - " | ACU courses"
      - " | ACU Courses"
      - "| ACU courses"
      - "| ACU Courses"
