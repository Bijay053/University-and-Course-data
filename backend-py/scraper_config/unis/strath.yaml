# University of Strathclyde
# Hostname: www.strath.ac.uk
# Country: United Kingdom  |  Currency: GBP
#
# Discovery notes (2026-06-17):
#   The /courses/ listing page contains ~562 <article class="searchitem"> elements
#   in its STATIC HTML — all courses are server-rendered, no JS fetch needed.
#   Each article links to an individual degree page such as
#   /courses/undergraduate/accounting/ (= "Accounting BA Hons") or
#   /courses/research/chemistry/ (= "Chemistry MPhil, PhD").
#
#   Problem: _is_category_landing() returns True for 3-segment paths with no
#   degree qualifier in the slug, so ALL ~556 article links were being pushed to
#   the BFS drill-in queue (not the candidate set), causing only 6 candidates
#   to come from /courses/ and BFS spending 900 pages visiting subject groups.
#
#   Fix: force_candidate_url_patterns (discovery-level) promotes these URLs
#   directly to the candidate set, bypassing the _is_category_landing() redirect.
#   allow_url_patterns is kept so BFS can still VISIT them if queued elsewhere.
#   bfs_page_budget lowered to 30: /courses/ is the one seed page + a small
#   buffer for any /studywithus/ nav pages that slip through before blocking.
#
# IMPORTANT: block "/research/" would also block /courses/research/ — use the
#            hostname-scoped form "strath.ac.uk/research/" instead.

discovery:
  seed_urls:
    - https://www.strath.ac.uk/courses/

  # force_candidate_url_patterns: these 3-segment paths look like category hubs
  # to _is_category_landing() but ARE individual degree detail pages on Strath.
  # This promotes all ~562 /courses/ listing articles directly to the candidate
  # set in a single BFS page visit (matching the original Scrapy spider behaviour).
  force_candidate_url_patterns:
    - '/courses/undergraduate/[^/]+/?$'
    - '/courses/postgraduatetaught/[^/]+/?$'
    - '/courses/research/[^/]+/?$'

  # allow_url_patterns: allow BFS to also VISIT these pages if they get queued
  # (e.g. from a sibling-course nav link on a detail page).  Kept separate from
  # force_candidate_url_patterns — they serve different roles.
  allow_url_patterns:
    - '/courses/undergraduate/[^/]+/?$'
    - '/courses/postgraduatetaught/[^/]+/?$'
    - '/courses/research/[^/]+/?$'

  block_url_patterns:
    - "/studywithus/"
    - "/whystrathclyde/"
    - "/workwithus/"
    - "strath.ac.uk/research/"     # blocks top-level /research/ but NOT /courses/research/
    - "/staff/"
    - "/news/"
    - "/events/"
    - "/about/"
    - "/contact/"
    - "/media/"
    - "/professionalservices/"
    - "/strathclydesport/"
    - "cookie"

  bfs_page_budget: 30        # /courses/ single seed page + small buffer; no drill-in needed
  max_candidates: 700

  always_browser_discover: false
  skip_browser_discovery: true

extraction:
  study_mode:
    # Strath pages contain "apply online"/"online student services" boilerplate
    # on every course, triggering the bare \bonline\b fallback at conf=0.50.
    # Suppress it so Gemini or the location-derived logic sets the correct mode.
    online_only_requires_strong_evidence: true

  max_parallel_fetch: 8

  force_detail_pages:
    - '(?i)/courses/undergraduate/[^/]+/?$'
    - '(?i)/courses/postgraduatetaught/[^/]+/?$'
    - '(?i)/courses/research/[^/]+/?$'

  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false

  fees:
    default_currency: GBP
    prefer_international: true
    prefer_annual_over_total: true
    fee_year: "2025"
    fee_term: "year"
    reject_keywords:
      - "Home"
      - "UK"
      - "Scottish"
      - "Channel Islands"
      - "Isle of Man"

  english:
    source: static
    ielts_overall_default: "6.5"
    ielts_overall_science_engineering_ug: "6.0"
    ielts_speaking: "5.5"
    ielts_listening: "5.5"
    ielts_reading: "5.5"
    ielts_writing: "5.5"
    ielts_override_rules:
      - condition: "url_contains=science"
        ielts_overall: "6.0"
      - condition: "url_contains=engineer AND degree_level=undergraduate"
        ielts_overall: "6.0"

  selectors:
    course_list:
      xpath: "//article[contains(@class, 'searchitem')]"

    course_name:
      # All page types (UG/PGT/research) wrap the title in span.course-title inside H1.
      # "//h1/text()" hits nav H1s; "//h1/span[@class='course-title']" is precise.
      xpath: "//h1/span[@class='course-title']/text() | //main//h1/span[@class='course-title']/text()"

    course_link:
      xpath: ".//a/@href"

    degree:
      # UG/PGT pages: graduation icon div.  Research pages: superscript span in H1.
      xpath: ".//div[contains(./i/@class, 'graduation')] | //h1/span[@class='superscript']/text()"

    city:
      value: "Glasgow"

    study_load:
      xpath: "//div[contains(@class, 'mode-of-attendance-container')]//div[contains(@class, 'mode-of-attendance-container')]"

    duration:
      xpath: "//div[contains(@class, 'key-facts-body')]//div[contains(., 'duration')]"

    intake_month:
      xpath: "//div[contains(@class, 'start-date-container')]/span[contains(@class, 'start-date')]/text()"

    fee_year_label:
      xpath: "//div[contains(@id, 'feesfunding')]//ul[contains(@id, 'tabmaster_fees_tabs')]//a[contains(@id, 'tab')]/text()"

    fee_international:
      primary:
        xpath: "//div[contains(@id, 'feesfunding')]//tr/th[contains(., 'nternational')]/following-sibling::td//text()[contains(., '£')]"

    course_description:
      xpath: "//div[contains(./h2/text(), 'Why this course')]"

    course_structure:
      xpath: "//div[contains(@id, 'coursecontent')]"

    other_requirements:
      xpath: "//div[contains(@id, 'entryrequirement')]"

    career:
      xpath: "//div[contains(@id, 'careers')]"

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: false
    require_international_fee: false
