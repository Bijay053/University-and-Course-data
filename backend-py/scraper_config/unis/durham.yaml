# Durham University (UK)
# Hostname: www.durham.ac.uk
#
# Scraping method: SearchStax Solr API — full payload extraction from Solr docs
# ---------------------------------------------------------------------------------
# Durham's course listing is a JavaScript SPA that queries a SearchStax-hosted
# Solr core client-side.  Standard BFS/sitemap discovery finds nothing useful
# because the listing pages require JS execution.  The Solr core is queried
# directly — this is the same endpoint the browser SPA uses.
#
# Individual course pages are protected by Cloudflare Turnstile — all three
# fetch tiers (HTTP, browser, scrape.do) are rejected.  Previously this meant
# 0/256 staged.  Now we use field_map_as_payload=true: course metadata is
# extracted directly from the Solr doc fields, with NO per-course page fetch.
#
# Fields available in Durham's Solr (verified 2026-06-04):
#   Degreename_t           → course name
#   Degreetype_ss          → degree abbreviation (BA (Hons), MSc, etc.)
#   DegreeCourseLevel_ss   → Undergraduate / Postgraduate
#   DegreeStudyOptions_ss  → Full Time / Part Time
#   DegreeDuration_ss      → 3 years full-time / 1 year full-time
#   DegreeStartDate_ss     → September 2026, January 2027, etc.
#   Department_ss          → subject department / category
#
# NOT available in Solr (JS-rendered on page):
#   international_fee      → supplied by degree_level_defaults (see extraction.fees)
#   ielts_overall          → null (courses land in review queue for manual check)
#
# Solr endpoint (found via browser Network tab):
#   https://searchcloud-1-eu-west-2.searchstax.com/29847/durhamuniv-1610/emselect
# Auth:      Authorization: Token <DURHAM_SEARCHSTAX_TOKEN>
# Filter:    sectiontype_ss:course  → 312 courses (from 29,422 total docs)

discovery:
  # Override any allow_url_patterns / block_url_patterns stored in the DB
  # from previous scrape configs — those were for BFS mode and are irrelevant
  # now that Solr provides the full link list directly.  Empty lists clear them.
  allow_url_patterns: []
  block_url_patterns: []

  searchstax:
    endpoint: "https://searchcloud-1-eu-west-2.searchstax.com/29847/durhamuniv-1610/emselect"

    # Token resolution order (first non-empty wins):
    #   1. authorization_token literal below  (leave null to skip)
    #   2. env var named by token_env         ← preferred for production
    #   3. global SEARCHSTAX_TOKEN env var
    authorization_token: "75c41a510e054668f69fae93cf05b755ba027b7c"
    token_env: DURHAM_SEARCHSTAX_TOKEN

    # Solr filter: restrict to course documents only (312 from 29,422 total).
    # Durham uses sectiontype_ss (multi-valued) not sectionType_s (single).
    filter_query: "sectiontype_ss:course"

    # Full payload extraction from Solr fields — no per-course page fetch.
    # course pages are Cloudflare-blocked (all tiers: HTTP, browser, scrape.do).
    links_only: false
    field_map_as_payload: true

    # Drop pure Part-time courses; strip Part-time from Full-time/Part-time combos.
    exclude_part_time: true

    # Course location hardcoded since it is not in the Solr index.
    location_override: "Durham, UK"

    # Durham Solr uses PascalCase field names — maps logical keys to Solr fields.
    field_map:
      url:          courseUrl_t
      name:         Degreename_t
      degree_type:  Degreetype_ss
      degree_level: DegreeCourseLevel_ss
      study_mode:   DegreeStudyOptions_ss
      duration:     DegreeDuration_ss
      intake_dates: DegreeStartDate_ss
      category:     Department_ss

    page_size: 100
    fee_year: 2026
    currency: GBP

extraction:
  max_parallel_fetch: 8

  filters:
    domestic_only:
      enabled: true
    online_only:
      enabled: false

  fees:
    default_currency: "GBP"
    prefer_international: true
    prefer_annual_over_total: true
    fee_year: "2026"
    fee_term: "year"
    reject_keywords:
      - "Domestic"
      - "Home student"
      - "UK student"

    # Durham's course pages load the fee amount via JavaScript — the static
    # HTML has the "Tuition fees" heading but the £ value is injected by the
    # browser SPA.  Without scrape.do quota (residential proxy that renders JS)
    # the fee is never visible in the scraped HTML.
    #
    # These YAML defaults are applied as a last-resort fallback when
    # international_fee is still null after all extractors run.  Values are
    # Durham's published 2025/26 international fees.  Update annually.
    #
    # Sources:
    #   UG:  https://www.durham.ac.uk/study/undergraduate/fees-and-funding/
    #   PG:  https://www.durham.ac.uk/study/postgraduate/fees/
    degree_level_defaults:
      undergraduate: 26400
      postgraduate: 24000

    # Allow courses to stage even when international_fee is null (they will
    # land in the review queue rather than being silently dropped).
    force_central_fee_stage: true

  english:
    # Course pages are Cloudflare-blocked so per-course extraction never runs.
    # degree_level_defaults supply IELTS/PTE/TOEFL for every staged course.
    # Source: https://www.durham.ac.uk/study/international/applying/english-language-requirements/
    # Most UG and PG programmes: IELTS 6.5 overall, 6.0 in each component.
    default_ielts: 6.5
    degree_level_defaults:
      undergraduate:
        ielts: 6.5
        pte: 61
        toefl: 92
      postgraduate:
        ielts: 6.5
        pte: 61
        toefl: 92

    source: course_page
    source_xpath: "//div[contains(./h2/@id, 'entry-requirements')]"
    ielts:
      raw_xpath: ".//p[contains(., 'IELTS')]"
      remove_tags: true
      patterns:
        overall:
          - 'score\sof\s.?(\d\.?\d)'
          - 'of\s*(\d\.?\d*)'
        each:
          - 'no\selement\sbelow\s*(\d\.?\d*)'
          - '(\d\.?\d*)\sin\sall'
      apply_each_to:
        - ielts_reading
        - ielts_writing
        - ielts_listening
        - ielts_speaking

  study_mode:
    # Durham is a physical campus university. The bare \bonline\b rule-pass
    # fires on nav text like "Apply online" and mis-tags every course as
    # "Online". Suppress it so Gemini reads the actual course content.
    suppress_nav_rule: true
    source_xpath: "//div[contains(@class, 'u-text-large u-font-bolder u-mb-2') and contains(text(), 'Location')]/following-sibling::p[1]"
    rules:
      - match_keywords:
          - "Blended"
        value: "Hybrid"
      - default: "On Campus"

  selectors:
    course_name:
      primary:
        xpath: "//div[contains(@class, 'u-text-large u-font-bolder u-mb-2') and contains(text(), 'Degree')]/following-sibling::p[1]"
      fallback:
        xpath: "//h1"

    city:
      xpath: "//div[contains(@class, 'u-text-large u-font-bolder u-mb-2') and contains(text(), 'Location')]/following-sibling::p[1]"

    course_description:
      xpath: "//div[h2[contains(@id, 'course-details')]]"

    course_structure:
      xpath: "//div[h2[contains(text(), 'tructure')]] | //div[h3[contains(text(), 'tructure')]]"

    other_requirements:
      xpath: "//div[contains(./h2/@id, 'entry-requirements')]"

    career:
      xpath: "//div[contains(./h2/@id, 'career')]"

    fee_international:
      xpath: "//div[contains(./h2/@id, 'fee')]//th[contains(., 'International')]/following-sibling::td/text()"

  staging:
    reject_if_missing:
      - course_name
