# ─────────────────────────────────────────────────────────────────────────────
# UNIVERSITY OF SUNSHINE COAST (UniSC)
# Hostname: www.unisc.edu.au  |  uni_id: 2235
# Country: Australia  |  Currency: AUD
# ─────────────────────────────────────────────────────────────────────────────
#
# URL structure
# ─────────────────────────────────────────────────────────────────────────────
# Individual course pages live at depth 4 under /study/courses-and-programs/:
#
#   UG: /study/courses-and-programs/bachelor-degrees-undergraduate-programs/<slug>
#   PG: /study/courses-and-programs/postgraduate-degrees/<slug>
#   Category cross-links (same pages, different nav path):
#       /study/courses-and-programs/<category>/<slug>
#
# Depth-3 pages (e.g. /study/courses-and-programs/postgraduate-degrees) are
# listing/category pages — they contain course links in static HTML but are not
# individual course pages themselves.
#
# Depth-5+ pages (e.g. .../bachelor-of-arts/arts-majors-and-minors) are
# sub-pages of individual courses — not courses themselves.
#
# The site uses AngularJS (Umbraco CMS). Course links ARE in the static HTML
# of the category listing pages, so no browser/JS rendering is needed for
# discovery.  Per-course fee data is Angular-rendered (ng-hide/ng-show) so
# may require Gemini extraction or browser fallback.
#
# Discovery approach
# ─────────────────────────────────────────────────────────────────────────────
# Seed the BFS with the main courses-and-programs page PLUS the two specific
# listing pages. XMLsitemap is also enabled as a supplement because BFS from
# 2 seeds only finds ~76-106 of the ~131 expected international courses —
# courses under rarely-linked study-area sub-categories are missed.
# XMLsitemap has 120 UG + 72 PG = 192 depth-4 URLs which fills the gaps.
# Together BFS + sitemap targets both undergraduate and postgraduate.
#
# IMPORTANT — correct slug note
# ─────────────────────────────────────────────────────────────────────────────
# hostname www.unisc.edu.au → slug = "unisc" → this file (unisc_2235.yaml)
# is loaded. A legacy file usc.yaml exists but is NEVER loaded (wrong slug).
# All UniSC config changes must be made here.
#
# Filter overrides (user requirement: extract ALL courses)
# ─────────────────────────────────────────────────────────────────────────────
# The user explicitly wants all UG + PG international courses staged
# even if:
#   - No international fee is found (domestic_only filter disabled)
#   - Delivery is online-only (online_only filter disabled)
#   - Name does not contain a standard degree qualifier (DQ check disabled)
# ─────────────────────────────────────────────────────────────────────────────

hostname_guard: "www.unisc.edu.au"
locked_config_paths:
  - discovery.seed_urls
  - discovery.allow_url_patterns
  - discovery.block_url_patterns
  - discovery.sitemap_url
  - discovery.always_sitemap_supplement

discovery:
  # Start BFS from the main courses listing page and both category pages.
  # The main page links to the UG and PG listing pages; seeding all three
  # ensures BFS reaches both undergraduate and postgraduate course links.
  seed_urls:
    - "https://www.unisc.edu.au/study/courses-and-programs"
    - "https://www.unisc.edu.au/study/courses-and-programs/bachelor-degrees-undergraduate-programs"
    - "https://www.unisc.edu.au/study/courses-and-programs/postgraduate-degrees"

  # Allow only depth-4 pages: /study/courses-and-programs/<category>/<slug>
  # The pattern is end-anchored with `$` so depth-5+ URLs (commencement
  # session sub-pages, course-library unit pages) do NOT match.
  # Breakdown of the end-anchored pattern:
  #   /study/courses-and-programs/  — fixed prefix
  #   [a-z][a-z-]+/                 — category segment (2+ alpha/hyphen chars)
  #   [a-z][a-z-]+                  — course slug (2+ alpha/hyphen chars)
  #   $                             — end of URL path (no trailing sub-paths)
  # The trailing /? allows for an optional trailing slash.
  allow_url_patterns:
    - "/study/courses-and-programs/[a-z][a-z-]+/[a-z][a-z-]+/?$"

  block_url_patterns:
    # Non-course depth-4 pages:
    # "undergraduate-elective-courses" and "postgraduate-elective-courses"
    # are unit-level elective lists, not individual course programmes.
    - "elective-courses"
    # "browse-postgraduate-<subject>" are category browse pages, not courses.
    - "/browse-"
    # Non-course depth-4 pages
    - "/study/courses-and-programs/headstart/"
    - "/study/courses-and-programs/uni-pathways"
    - "/study/courses-and-programs/[a-z-]+/explore-"
    # Subsidised programs listing page (not an individual course)
    - "subsidised-postgraduate-programs"
    # Junk pages: semester/trimester schedule pages scraped as "courses"
    - "trimester"
    - "semester"
    # Search results page (not a course)
    - "/search"
    # Category/browse pages that pass depth-4 filter but aren't courses
    - "postgraduate-business"
    - "-majors-and-minors"
    - "tertiary-preparation"
    # Unit/subject code pages (e.g. des212-visual-communication-and-culture,
    # bsc301-applied-science-project) — individual subjects, NOT degree programs.
    # Unit slugs start with 2-4 alpha chars followed by 3 digits.
    - "/[a-z]{2,4}[0-9]{3}[^/]*$"
    # Course/unit library pages under a different URL tree
    - "/course-library/"
    # Commencement/intake session sub-pages under individual course pages
    # e.g. .../master-of-management/sunshine-coast-session-7-commencement
    - "commencement"
    - "-session-[0-9]"

    # Generic site noise
    - "/news/"
    - "/about/"
    - "/research/"
    - "/international/apply"
    - "/study/fees"
    - "/study/scholarships"
    - "/study/how-to-apply"
    - "/study/life-at-unisc"
    - "/study/student-support"
    - "/study/work-placements"
    - "/study/open-day"
    - "/study/calendars"

  # Higher budget to let BFS walk through all study-area category sub-pages
  # (arts, business, communication, …, technology = ~17 pages) which each
  # carry additional course links not on the two main seed pages.
  bfs_page_budget: 100

  # XMLsitemap supplement: BFS from seeds only finds ~76-89 of the expected
  # courses (courses in rarely-linked study-area sub-categories are missed).
  # XMLsitemap at /XMLsitemap has 120 UG + 72 PG = 192 depth-4 URLs which
  # fills the gap. The allow/block patterns above filter it to real courses.
  sitemap_url: "https://www.unisc.edu.au/XMLsitemap"
  always_sitemap_supplement: true

extraction:
  fees:
    default_currency: AUD
    # Fee data is Angular ng-show gated — static HTML may not expose
    # international fees.  No central fee PDF known yet.
    central_page: ""
    fees_pdf_url: ""

  english:
    # Central English requirements page (Gemini/pattern extraction)
    central_page: "https://www.unisc.edu.au/study/how-to-apply/english-language-requirements"

  course_name:
    # UniSC's Umbraco CMS appends site branding to the <title> element.
    # When H1 extraction fails, the raw title "Bachelor of X | Unisc |
    # University of the Sunshine Coast, Queensland, Australia" is used.
    # Strip all known suffix forms so only the degree name remains.
    strip_title_suffixes:
      - " | Unisc | University of the Sunshine Coast, Queensland, Australia"
      - " | UniSC | University of the Sunshine Coast, Queensland, Australia"
      - " | University of the Sunshine Coast, Queensland, Australia"
      - " | Unisc"
      - " | UniSC"
      - " | University of the Sunshine Coast"

  filters:
    # ── User requirement: extract ALL international courses ──────────────────
    # Do NOT drop courses that lack explicit international-fee data.
    # UniSC's Angular-rendered fee panel means many courses appear to have
    # no fee in static HTML — this is a rendering issue, not a data gap.
    domestic_only:
      enabled: false

    # Do NOT drop online-only courses — UniSC serves international students
    # online and the user explicitly wants these included.
    online_only:
      enabled: false

  staging:
    # Degree-qualifier check is ENABLED (default).  UniSC uses standard degree
    # names: Bachelor of X, Master of Y, Graduate Certificate in Z.  The check
    # correctly rejects unit/subject code pages (Des212, Bus301 …) that slip
    # through the block_url_patterns filter.
    skip_degree_qualifier_check: false
