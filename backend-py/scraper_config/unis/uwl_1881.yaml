# University of West London
# Hostname: www.uwl.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Slug: uwl
#
# SITE NOTES (www.uwl.ac.uk):
# - Angular SPA — course pages served as unrendered template shells in static HTML.
#   Fees/intakes/dates appear as {{ formatCurrencyValue(...) }} / {{ startYearMonth.name }}
#   until JS executes.  scrape_do_render: true forces headless Chrome via Scrape.do.
# - Individual course pages follow the URL pattern /course/<level>/<slug> (singular).
#   Listing/search pages use /courses/ (plural) and must be excluded from extraction.
# - allow_url_patterns is set in YAML and must override admin_config (update DB too —
#   see comment at bottom of file for the SQL command to clear the stale admin_config).
# - Discovery seeds: search/?level= pages return a handful of pre-rendered links but
#   the full catalogue requires JS-rendered pagination.  BFS page budget raised to 50
#   so that links discovered from the few pre-rendered search pages can be followed.

discovery:
  allow_url_patterns:
    - "^/course/(undergraduate|postgraduate|research)/[^/]+/?$"
  block_url_patterns:
    - "^/courses/"
    - "^/study/"
    - "/apply"
    - "/contact"
    - "/news"
    - "/events"
    - "/blog"
    - "/about"
    - "/research"
    - "/alumni"
    - "/outreach"
    - "/parents"
    - "/jobs"
    - "/careers"
    - "/accommodation"
    - "/life-on-campus"
    - "/fees-and-funding$"
    - "/international/living"
  seed_urls:
    - "https://www.uwl.ac.uk/courses/search?query=&f%5B0%5D=level%3AUndergraduate&per_page=100"
    - "https://www.uwl.ac.uk/courses/search?query=&f%5B0%5D=level%3APostgraduate&per_page=100"
    - "https://www.uwl.ac.uk/courses/search?query=&f%5B0%5D=level%3AResearch&per_page=100"
  bfs_page_budget: 50

extraction:
  scrape_do_render: true
  fees:
    default_currency: GBP

# PRODUCTION FIX — run this on prod to clear the stale admin_config allow_url_patterns:
#
#   sudo -u postgres psql -d university_portal -c "
#     UPDATE universities
#     SET scrape_config = jsonb_set(
#       scrape_config,
#       '{admin_config,discovery,allow_url_patterns}',
#       '[\"^/course/(undergraduate|postgraduate|research)/[^/]+/?\\$\"]'
#     )
#     WHERE id=1881;"
