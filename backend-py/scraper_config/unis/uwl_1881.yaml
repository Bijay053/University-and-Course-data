# University of West London
# Hostname: www.uwl.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Slug: uwl
#
# SITE NOTES (www.uwl.ac.uk):
# - Angular SPA — course pages served as unrendered template shells in static HTML.
#   Fees/intakes/dates appear as {{ formatCurrencyValue(...) }} / {{ startYearMonth.name }}
#   until JS executes.  scrape_do_render: true forces headless Chrome via Scrape.do.
# - Individual course pages follow the URL pattern /course/<level>/<slug> (singular).
#   Listing/search pages use /courses/ (plural) and must be excluded from extraction.
# - The course search at /courses/search?query= is Angular SPA paginated: ~37 courses
#   per page, 336 total across ~9-10 pages (page=0..11 covers all courses with buffer).
#   render_listing_pages fetches each page via Scrape.do render to harvest all links.
# - Cloudflare 403 blocks direct httpx + cffi on course pages.
#   With scrape_do_render: true, the fetch chain skips Wayback (also an SPA shell)
#   and goes straight to Scrape.do headless Chrome (tier 2.5).
#
# DB admin_config fix applied (2026-06-08) — corrected allow_url_patterns:
#   ^/course/(undergraduate|postgraduate|research)/[^/]+/?$

discovery:
  allow_url_patterns:
    - "^/course/(undergraduate|postgraduate|research)/[^/]+/?$"
  block_url_patterns:
    - "^/courses/"
    - "^/study/"
    - "/apply"
    - "/contact"
    - "/news"
    - "/events"
    - "/blog"
    - "/about"
    - "/research"
    - "/alumni"
    - "/outreach"
    - "/parents"
    - "/jobs"
    - "/careers"
    - "/accommodation"
    - "/life-on-campus"
    - "/fees-and-funding$"
    - "/international/living"
  # Skip BFS and Playwright entirely — Angular SPA returns unrendered {{}} templates
  # in static HTML so every non-rendered fetch yields 0 course links.
  # always_browser_discover:true skips the BFS condition; skip_browser_discovery:true
  # skips Playwright — leaving render_listing_pages as the sole discovery path.
  always_browser_discover: true
  skip_browser_discovery: true
  # Rendered discovery: each search page returns ~37 courses. 12 pages covers 336+.
  render_listing_pages:
    - "https://www.uwl.ac.uk/courses/search?query=&page=0"
    - "https://www.uwl.ac.uk/courses/search?query=&page=1"
    - "https://www.uwl.ac.uk/courses/search?query=&page=2"
    - "https://www.uwl.ac.uk/courses/search?query=&page=3"
    - "https://www.uwl.ac.uk/courses/search?query=&page=4"
    - "https://www.uwl.ac.uk/courses/search?query=&page=5"
    - "https://www.uwl.ac.uk/courses/search?query=&page=6"
    - "https://www.uwl.ac.uk/courses/search?query=&page=7"
    - "https://www.uwl.ac.uk/courses/search?query=&page=8"
    - "https://www.uwl.ac.uk/courses/search?query=&page=9"
    - "https://www.uwl.ac.uk/courses/search?query=&page=10"
    - "https://www.uwl.ac.uk/courses/search?query=&page=11"
  expected_min_courses: 300

extraction:
  scrape_do_render: true
  fees:
    default_currency: GBP

