# University of West London
# Hostname: www.uwl.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Slug: uwl
#
# SITE NOTES (www.uwl.ac.uk):
# - Angular SPA — course pages served as unrendered template shells in static HTML.
#   Fees/intakes/dates appear as {{ formatCurrencyValue(...) }} / {{ startYearMonth.name }}
#   until JS executes.  scrape_do_render: true forces headless Chrome via Scrape.do.
# - Individual course pages use the pattern /academic-schools/<school>/<level>/<slug>.
#   Search/listing pages use /courses/ (plural) and are excluded from extraction.
# - The course search at /courses/search?query= is Angular paginated: ~37 courses per
#   page, 336 total (page=0..11 covers all with buffer). render_listing_pages renders
#   each page via Scrape.do headless Chrome to harvest all /academic-schools/... links.
# - Cloudflare 403 blocks direct httpx + cffi; scrape_do_render: true routes all
#   individual course page fetches through Scrape.do headless Chrome.
# - BFS and Playwright discovery are skipped (always_browser_discover+skip_browser_discovery)
#   since every static/unrendered fetch returns Angular {{}} templates with 0 links.
#
# HISTORY:
#   2026-06-08 v1: allow_url_patterns set to /course/<level>/<slug> — WRONG (that path
#                  pattern is not used; actual URLs are /academic-schools/<school>/<level>/<slug>)
#   2026-06-08 v2: corrected to /academic-schools/[^/]+/(level)/[^/]+; block patterns
#                  all prefix-anchored so they cannot fire mid-path.

discovery:
  # UWL actual course URL shape (confirmed via Wayback CDX):
  #   /academic-schools/<school>/<level>/<course-slug>
  allow_url_patterns:
    - "^/academic-schools/[^/]+/(undergraduate|postgraduate|research|research-degrees)/[^/]+/?$"
  # All patterns are prefix-anchored (^) so they cannot match mid-path segments
  # e.g. the old unanchored '/research' would drop /academic-schools/school/research/slug
  block_url_patterns:
    - "^/courses/"
    - "^/study/"
    - "^/apply"
    - "^/contact"
    - "^/news"
    - "^/events"
    - "^/blog"
    - "^/about"
    - "^/alumni"
    - "^/outreach"
    - "^/parents"
    - "^/jobs"
    - "^/careers"
    - "^/accommodation"
    - "^/life-on-campus"
    - "^/fees-and-funding"
    - "^/international/living"
  # Skip BFS and Playwright — Angular SPA returns unrendered {{}} templates in static
  # HTML so every non-rendered fetch yields 0 course links.
  # always_browser_discover:true skips the BFS condition; skip_browser_discovery:true
  # skips Playwright — leaving render_listing_pages as the sole discovery path.
  always_browser_discover: true
  skip_browser_discovery: true
  # Rendered discovery: each search page returns ~37 courses. 12 pages covers 336+.
  render_listing_pages:
    - "https://www.uwl.ac.uk/courses/search?query=&page=0"
    - "https://www.uwl.ac.uk/courses/search?query=&page=1"
    - "https://www.uwl.ac.uk/courses/search?query=&page=2"
    - "https://www.uwl.ac.uk/courses/search?query=&page=3"
    - "https://www.uwl.ac.uk/courses/search?query=&page=4"
    - "https://www.uwl.ac.uk/courses/search?query=&page=5"
    - "https://www.uwl.ac.uk/courses/search?query=&page=6"
    - "https://www.uwl.ac.uk/courses/search?query=&page=7"
    - "https://www.uwl.ac.uk/courses/search?query=&page=8"
    - "https://www.uwl.ac.uk/courses/search?query=&page=9"
    - "https://www.uwl.ac.uk/courses/search?query=&page=10"
    - "https://www.uwl.ac.uk/courses/search?query=&page=11"
  expected_min_courses: 300

extraction:
  scrape_do_render: true
  fees:
    default_currency: GBP

