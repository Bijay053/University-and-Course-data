# University of West London  |  university_id=1881
# Hostname: www.uwl.ac.uk  |  slug: uwl
# Loaded as: scraper_config/unis/uwl_1881.yaml  (id-specific file takes priority over uwl.yaml)
# Country: United Kingdom  |  Currency: GBP
#
# SITE NOTES:
# - Angular SPA — static HTML returns Angular {{}} templates with 0 data.
#   scrape_do_render:true routes ALL page fetches through Scrape.do headless Chrome.
# - Live course URL pattern (confirmed from rendered search page 2026-06-08):
#     /course/(undergraduate|postgraduate|research)/<slug>
#   Wayback CDX has OLD archived URLs (/academic-schools/...) — these no longer exist.
# - Course search at /courses/search?query=&page=N: ~37 courses per page, ~336 total.
#   render_listing_pages fetches pages 0-11 via Scrape.do render to harvest all links.
# - BFS and Playwright skipped (both return 0 on unrendered Angular templates).
#
# CRITICAL — allow_url_patterns regex rule:
#   The post-discovery filter applies re.search() against the FULL URL string
#   (https://www.uwl.ac.uk/course/...).  Do NOT use a leading ^ anchor —
#   it anchors to the start of the string which is "https://" not "/".
#   Use a plain path substring like "/course/(undergraduate|...)" with no ^ prefix.

discovery:
  # No ^ anchor — re.search() tests the full URL string (https://www.uwl.ac.uk/course/...)
  allow_url_patterns:
    - "/course/(undergraduate|postgraduate|research)/[^/]+/?$"
  block_url_patterns:
    - "/courses/"
    - "/apply"
    - "/contact"
    - "/news"
    - "/events"
    - "/blog"
    - "/about"
    - "/alumni"
    - "/outreach"
    - "/parents"
    - "/jobs"
    - "/careers"
    - "/accommodation"
    - "/life-on-campus"
    - "/fees-and-funding"
    - "/international/living"
  # Skip BFS and Playwright — Angular SPA returns unrendered templates in static HTML.
  always_browser_discover: true
  skip_browser_discovery: true
  # Wayback CDX is useless for UWL: archive.org only has old /academic-schools/...
  # URLs that no longer exist on the live site.  Skipping saves the ~2-min CDX wait.
  use_wayback: false
  # Rendered discovery: 12 pages × ~37 results covers all 336+ courses.
  render_listing_pages:
    - "https://www.uwl.ac.uk/courses/search?query=&page=0"
    - "https://www.uwl.ac.uk/courses/search?query=&page=1"
    - "https://www.uwl.ac.uk/courses/search?query=&page=2"
    - "https://www.uwl.ac.uk/courses/search?query=&page=3"
    - "https://www.uwl.ac.uk/courses/search?query=&page=4"
    - "https://www.uwl.ac.uk/courses/search?query=&page=5"
    - "https://www.uwl.ac.uk/courses/search?query=&page=6"
    - "https://www.uwl.ac.uk/courses/search?query=&page=7"
    - "https://www.uwl.ac.uk/courses/search?query=&page=8"
    - "https://www.uwl.ac.uk/courses/search?query=&page=9"
    - "https://www.uwl.ac.uk/courses/search?query=&page=10"
    - "https://www.uwl.ac.uk/courses/search?query=&page=11"
  expected_min_courses: 300

extraction:
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  max_parallel_fetch: 8
  fees:
    default_currency: GBP

