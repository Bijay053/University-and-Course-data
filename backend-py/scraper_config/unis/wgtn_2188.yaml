# Victoria University of Wellington (Te Herenga Waka)
# Hostname: www.wgtn.ac.nz
# Country: New Zealand  |  Currency: NZD
# Slug: wgtn  |  uni_id: 2188
#
# DIAGNOSIS HISTORY:
#
# Attempt 1 (seed_page_settle_s=10s on /international/study-options/postgraduate):
#   - Seed found only 2 links (both wrong: overview hub links, not course links).
#   - 10s extra wait doesn't help — /international/study-options/postgraduate is NOT
#     a course-card listing; it's an overview page with a handful of sub-section links.
#   - BFS then hit taster-lectures, harvested 20 "Minors in the Bachelor of X" pages.
#   - Root cause for bad 20: allow_url_patterns matched undergraduate/flexible-study/ba-minors
#     because [^/?#]+ is a substring match and "flexible-study" satisfied the first segment.
#
# Attempt 2 (add /international/study-options/ to seeds):
#   - Those pages are pure React SPA (static shell = "Loading…", rendered=0B from browser).
#   - Even per-course browser visit returns empty — extraction is impossible on those URLs.
#   - Dropping them entirely.
#
# ROOT CAUSE SUMMARY:
#   Wrong seed URLs + allow_url_patterns too broad → 22 wrong pages → 0 usable staged courses.
#
# INDIVIDUAL COURSE URL STRUCTURE (confirmed from live log):
#   /study/programmes-courses/<level>/<subject>/<course-slug>
#   e.g. /study/programmes-courses/postgraduate/architecture/master-of-architecture-professional
#   e.g. /study/programmes-courses/undergraduate/commerce/bachelor-of-commerce
#
# THE FIX:
#   Seeds: the static SSR level-hub pages (/study/programmes-courses/postgraduate/ and
#          /study/programmes-courses/undergraduate/) which list all subject areas as <a href>.
#          BFS follows: level-hub → subject-hub → individual course pages.
#          No SPA, no settle time needed, no trigger JS required.
#   allow_url_patterns: require exactly 2 segments after the level:
#          study/programmes-courses/(postgraduate|undergraduate)/<subject>/<course-slug>
#          Explicitly exclude flexible-study (minors container) as the subject segment.
#   block_url_patterns: block nav noise including all /international/study-options/ (SPA, broken).
#
# MINORS PAGES (to never re-stage):
#   All live at /study/programmes-courses/undergraduate/flexible-study/<name>-minors.
#   Blocked by: (a) "flexible-study" excluded from subject segment in allow_url_patterns;
#               (b) "/flexible-study" in block_url_patterns prevents BFS from visiting that sub-tree.

discovery:
  always_browser_discover: true
  browser_time_budget_s: 400
  browser_early_stop_courses: 250

  seed_urls:
    # Static SSR level-hub pages — no SPA, no settle time needed.
    # Each lists all subject areas as plain <a href> links.
    # BFS follows: /postgraduate/ → /postgraduate/architecture/ →
    #              /postgraduate/architecture/master-of-architecture-professional
    - https://www.wgtn.ac.nz/study/programmes-courses/postgraduate/
    - https://www.wgtn.ac.nz/study/programmes-courses/undergraduate/

  allow_url_patterns:
    # Individual programme pages: requires 2 non-empty, non-slash segments after the level.
    # This accepts /postgraduate/<subject>/<course> but rejects /postgraduate/<subject>/ (hub).
    # Negative lookahead excludes flexible-study (minors) and short-courses as the subject.
    - "wgtn\\.ac\\.nz/study/programmes-courses/(postgraduate|undergraduate)/(?!flexible-study/?|short-courses/?)[^/?#]+/[^/?#]+"

  block_url_patterns:
    # Non-programme pages: prevent BFS from visiting and from being added as course links.
    - "/study/programmes-courses/undergraduate/taster-lectures"
    - "/study/programmes-courses/undergraduate/how-degrees-work"
    - "/study/programmes-courses/undergraduate/minors"
    - "/study/programmes-courses/short-courses"
    - "/study/programmes-courses/subjects"
    - "/study/programmes-courses/study-in-trimester"
    - "/study/programmes-courses/limited-entry"
    - "/study/programmes-courses/VicStart"
    - "/study/programmes-courses/courses"
    - "/study/programmes-courses/_edit"
    - "/flexible-study"          # blocks entire minors sub-tree from BFS
    # Block broken SPA section entirely (static shell = "Loading…", rendered=0B)
    - "/international/study-options"
    # General noise
    - "/study/course-planning"
    - "/study/apply-enrol"
    - "/_edit"
    - "/about"
    - "/news"
    - "/research"
    - "/staff"
    - "/contact"
    - "/library"
    - "/alumni"
    - "/governance"
    - "/news-events"
    - "/key-dates"
    - "/maori"
    - "/pasifika"
    - "/disability"
    - "/wellington"
    - "/giving"
    - "/victoria-university-of-wellington-foundation"

  use_stealth_browser: true

extraction:
  fees:
    default_currency: NZD

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
    dedup_use_full_url: true
