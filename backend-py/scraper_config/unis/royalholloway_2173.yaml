# Royal Holloway University
# Hostname: www.royalholloway.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Slug: royalholloway
#
# Course URL pattern: /studying-here/(undergraduate|postgraduate|central-london-campus)/<dept>/<course-slug>
# Research degrees are under /studying-here/postgraduate/ (e.g. /postgraduate/mathematics/mathematics-phd)

discovery:
  # Only accept 4-segment course paths under studying-here.
  # Blocks /ug-prospectus, /pg-prospectus, /fees-and-funding/*, etc.
  # central-london-campus added for the London campus courses (1 course was missing without it).
  allow_url_patterns:
    - 'royalholloway\.ac\.uk/studying-here/(undergraduate|postgraduate|central-london-campus)/[^/]+/[^/]+'

extraction:
  fees:
    default_currency: GBP
  filters:
    # Disabled: study_mode extractor picks up "Online" from page text at conf=0.50
    # on courses that are actually On Campus — this caused 12/44 courses to be
    # rejected as online_only. Royal Holloway courses are campus-based.
    online_only:
      enabled: false
  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
