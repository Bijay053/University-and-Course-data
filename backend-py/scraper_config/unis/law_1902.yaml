discovery:
  course_detail_url_patterns:
  - /study/undergraduate/[^/]+/[^/]+/
  - /study/postgraduate/[^/]+/[^/]+/

extraction:
  english:
    central_page_ug: https://www.law.ac.uk/study/undergraduate/entry-requirements/
    # central_page_pg removed: the single PG entry-requirements page covers ALL
    # programmes including BPC/SQE (IELTS 7.5) and LLM/MA/MSc (IELTS 6.5).
    # Fetching it stamps every LLM with 7.5, which is wrong.
    # Instead, use per-degree-level defaults so LLM/MA/MSc get 6.5.
    degree_level_defaults:
      postgraduate:
        ielts: 6.5

  filters:
    online_only:
      enabled: false  # UoL markets online LLMs to international students

  staging:
    skip_degree_qualifier_check: true  # SQE/LPC/BPC courses use vocational names

  text_cleaning:
    location:
      reject_values:
      - Fees
      - Course fees
      - Tuition fees
      - Funding
      - Apply
      - Entry requirements
      - Study mode
      - Duration
      - Start dates
      - Key facts
      - How to apply
      - Newcastle University
      allowed_values:
      - Birmingham
      - Bristol
      - Leeds
      - London Bloomsbury
      - London Moorgate
      - Manchester
      - Nottingham
      - Newcastle
      - Online
      - Hong Kong
