# University of Law
# Hostname: www.law.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Discovery: JSON/REST API course catalogue extraction
# Notes: Adapted from the provided Scrapy spider. Courses are pulled directly from the /api/coursesearch/find endpoint.

discovery:
  seed_urls:
    - https://law.ac.uk/api/coursesearch/find?page=1&size=200
  always_sitemap_supplement: true
  generic_search_api:
    enabled: true
    method: GET
    url: 'https://law.ac.uk/api/coursesearch/find'
    root_path: 'Courses'
    url_fields: [Url]
    title_fields: [Name, Award]
    normalize_relative_urls: true
    base_url: 'https://www.law.ac.uk'
    page_size: 100
    max_pages: 20

extraction:
  fees:
    default_currency: 'GBP'
    prefer_international: true
    prefer_annual_over_total: true
    reject_keywords:
      - 'Home student'
      - 'Home fee'
      - 'UK student'
      - 'UK fee'
      - 'Domestic'

  english:
    trust_vision_ocr: false
    default_ielts: 6.0
    default_pte: 60
    default_toefl: 80

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | University of Law'
      - ' - University of Law'

  filters:
    online_only:
      enabled: false