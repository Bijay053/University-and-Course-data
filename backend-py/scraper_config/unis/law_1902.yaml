discovery:
  course_detail_url_patterns:
  - /study/undergraduate/[^/]+/[^/]+/
  - /study/postgraduate/[^/]+/[^/]+/
extraction:
  english:
    central_page_ug: https://www.law.ac.uk/study/undergraduate/entry-requirements/
    central_page_pg: https://www.law.ac.uk/study/postgraduate/entry-requirements/
  text_cleaning:
    location:
      reject_values:
      - Fees
      - Course fees
      - Tuition fees
      - Funding
      - Apply
      - Entry requirements
      - Study mode
      - Duration
      - Start dates
      - Key facts
      - How to apply
      - Newcastle University
      allowed_values:
      - Birmingham
      - Bristol
      - Leeds
      - London Bloomsbury
      - London Moorgate
      - Manchester
      - Nottingham
      - Newcastle
      - Online
      - Hong Kong
