# University of Law
# Hostname: www.law.ac.uk
# Country: United Kingdom  |  Currency: GBP

discovery:
  # The paginated API is the authoritative catalogue. Do not crawl its JSON
  # page URLs again as HTML or run sitemap/BFS after it returns all pages.
  always_sitemap_supplement: false

  # The stored auto-config was learned from an online course and only allowed
  # URLs ending in /online/. Override it with the real campus-course shape.
  # This deliberately excludes the separate online variant nested one segment
  # below each campus course URL.
  allow_url_patterns:
    - '/study/(?:undergraduate|postgraduate)/[^/?#]+/[^/?#]+/?(?:[?#].*)?$'

  generic_search_api:
    enabled: true
    method: GET
    url: 'https://law.ac.uk/api/coursesearch/find'
    root_path: 'Courses'
    url_fields: ['Url']
    title_fields: ['Name', 'Award']
    normalize_relative_urls: true
    base_url: 'https://www.law.ac.uk'
    # FIX 1: API hard-returns 20 per page — set this to match reality
    page_size: 20
    # FIX 2: API reports TotalPages=9, set max_pages to cover all + buffer
    max_pages: 10
    # FIX 3: tell the paginator which field holds total page count
    total_pages_field: 'TotalPages'
    total_results_field: 'TotalResults'
    page_number_param: 'page'
    first_page: 1

extraction:
  # Static course HTML already contains the fee, duration, intake and mode.
  # Browser rendering adds no fields and consumed most of the 90-second course
  # deadline in the failed run.
  skip_browser_rescue: true
  skip_per_course_browser: true
  # A failed static page was previously replayed sequentially for up to five
  # minutes. AU18's API remains authoritative, so leave an individual failure
  # visible for operator review instead of making the whole job appear stuck.
  recovery_sweep_max_items: 0
  recovery_sweep_time_budget_seconds: 0

  fees:
    default_currency: 'GBP'
    prefer_international: true
    prefer_annual_over_total: true
    reject_keywords:
      - 'Home student'
      - 'Home fee'
      - 'UK student'
      - 'UK fee'
      - 'Domestic'

  english:
    trust_vision_ocr: false
    skip_vision_when_core_found: true
    # These institution-wide scores are authoritative. Apply them after local
    # extraction so missing English does not trigger Gemini/browser/fallback.
    apply_defaults_before_remote_enrichment: true
    default_ielts: 6.0
    default_pte: 60
    default_toefl: 80

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | University of Law'
      - ' - University of Law'

  filters:
    online_only:
      enabled: true

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false