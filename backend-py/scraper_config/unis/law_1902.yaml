# University of Law
# Hostname: www.law.ac.uk
# Country: United Kingdom  |  Currency: GBP
#
# Discovery: REST JSON API at https://law.ac.uk/api/coursesearch/find
#   ?page=1&size=200 returns all 172 courses in a single response.
#   Root key: "Courses"  — each item has: Url, Name, Award, Level.Name,
#   Method.Name (On Campus / Online), StudyModes[].Name, Campuses[].Name
#
# Previous issues fixed:
#   1. API was returning only 20 courses — missing size=200 and page param
#   2. always_sitemap_supplement added 137 sitemap URLs including non-course
#      pages (/sqe-pass-rates, /information-for-firms etc.)
#   3. allow_url_patterns in extraction was dropping valid course URLs

discovery:
  seed_urls:
    - https://www.law.ac.uk/study/

  # API covers all 172 courses — sitemap adds non-course noise
  always_sitemap_supplement: false

  generic_search_api:
    enabled: true
    method: GET
    url: 'https://law.ac.uk/api/coursesearch/find'
    root_path: 'Courses'
    url_fields: [Url]
    title_fields: [Name]
    normalize_relative_urls: true
    base_url: 'https://www.law.ac.uk'
    # Static params — size=200 means all 172 arrive in page 1 response
    params:
      size: '200'
    # Dynamic page-number pagination (law.ac.uk uses 1-indexed pages)
    page_size: 200
    page_number_param: 'page'
    max_pages: 5   # page 2 will return 0 items and stop immediately
    # Only keep URLs under /study/ — filters out any stray API results
    allow_url_patterns:
      - '/study/'

  # BFS URL filter — allow BFS to follow /study/undergraduate/ and /study/postgraduate/
  # paths only.  This keeps BFS within the course catalogue and out of employability,
  # resources, blog etc.  Depth-4 course pages (e.g. /study/postgraduate/law/llm-x/)
  # are intentionally included because the BFS-vs-API name-collision fix in the
  # orchestrator merge now prefers the clean API name over the messy BFS anchor text,
  # so gate drops from "postgraduate courses" prefix no longer occur.
  allow_url_patterns:
    - '/study/undergraduate/'
    - '/study/postgraduate/'

  block_url_patterns:
    - '/sqe-assessments'
    - '/pass-rates'
    - '/information-for'
    - '/apply'
    - '/help-and-support'
    - '/events'
    - '/news'
    - '/about'
    - '/contact'
    - '/careers'
    - '/blog'
    - '/legal'
    - '/privacy'
    - '/sitemap'

extraction:
  fees:
    default_currency: 'GBP'
    prefer_international: true
    prefer_annual_over_total: true
    reject_keywords:
      - 'Home student'
      - 'Home fee'
      - 'UK student'
      - 'UK fee'
      - 'Domestic'
      - 'home'

  english:
    trust_vision_ocr: false
    default_ielts: 6.0
    default_pte: 60
    default_toefl: 80

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | University of Law'
      - ' - University of Law'
      - ' | ULaw'
      - ' - ULaw'

  filters:
    domestic_only:
      enabled: false
    allow_url_patterns:
      - '/study/undergraduate/'
      - '/study/postgraduate/'
    block_url_patterns:
      - '/sqe-assessments'
      - '/pass-rates'
      - '/information-for'
