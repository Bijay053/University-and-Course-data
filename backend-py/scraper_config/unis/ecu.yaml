# Edith Cowan University
# Hostname: www.ecu.edu.au
#
# Bug history / rationale:
#   - ECU has a dedicated static-extract module (ecu_static_extract.py) that
#     handles ECU-specific page structures.  The module uses setdefault() so
#     standard extractors can override its values.
#   - ECU course pages have a distinct table layout for fees that the generic
#     fee extractor sometimes misreads.  The static extractor handles these.
#   - English requirements are published on individual course pages via an
#     embedded accordion — Playwright pass needed for some courses.
#
# ── Cloudflare / Funnelback block ────────────────────────────────────────────
# ECU's Cloudflare blocks: plain httpx (403), curl_cffi (403), Scrape.do
# static (502 ROTATION_FAILED).  Scrape.do render=true works for INDIVIDUAL
# course pages at /degrees/courses/<slug>.
#
# BOTH listing pages are React SPAs that load via Funnelback XHR:
#   /degrees/undergraduate  — SPA, 0 static links even with render=true+10s
#   /degrees/postgraduate   — SPA, 0 static links (Funnelback CF-blocked)
#
# ── Discovery approach ────────────────────────────────────────────────────────
# UG:  BFS from Funnelback pagination links (?start_rank=1/11/21/31…),
#      each returning ~10 unique UG course slugs.
#      The base URL /degrees/courses/all (no query params) always times out
#      under concurrent Scrape.do load — replaced with start_rank=1 form.
# PG:  Explicit individual course seeds + a few hub seeds that return
#      cross-links.  Hubs with 0 useful cross-links are NOT used as seeds;
#      their individual courses are seeded directly instead.
#
# ── Concurrent seed prefetch fix ─────────────────────────────────────────────
# Scrape.do render calls are now limited to 6 concurrent (discovery.py
# semaphore added 2026-07-16).  Before the fix, all N seed URLs were fired
# simultaneously — 27+ concurrent render calls saturated the Scrape.do
# account and caused random timeouts even for pages that succeed individually.
#
# Things that do NOT work:
#   - Scrape.do render=true on /degrees/postgraduate (0 links, SPA+Funnelback)
#   - Scrape.do render=true on /degrees/undergraduate (0 links, SPA+Funnelback)
#   - ECU sitemap.xml is Cloudflare-blocked (0 bytes returned)
#   - always_sitemap_supplement: true → 6 sitemap probes × ~25s = 150s wasted,
#     triggers 300s discovery timeout without adding any courses
#   - Wayback CDX for ecu.edu.au/degrees/courses/* (0 results)
#
# ── Pagination note ───────────────────────────────────────────────────────────
# /degrees/courses/all?start_rank=N loads 10 unique courses per page.
# start_rank= URLs are in block_url_patterns to prevent pagination page URLs
# appearing as course candidates (only their course links are kept).
# All pagination pages are pre-seeded explicitly — BFS must NOT follow
# ?start_rank= links because merging query strings produces doubled Funnelback
# params that cause Scrape.do render hangs.
#
# ── Individual PG courses (verified 2026-07-16) ───────────────────────────────
# Hub pages whose individual course children are seeded directly:
#   master-of-education      → master-of-education, master-of-education-advanced,
#                              master-of-education-accelerated-online,
#                              master-of-education-by-research,
#                              graduate-certificate-of-education,
#                              graduate-certificate-of-education-accelerated-online,
#                              graduate-diploma-in-teaching-primary,
#                              graduate-diploma-in-teaching-secondary,
#                              master-of-teaching-primary, master-of-teaching-secondary
#   doctor-of-philosophy     → master-of-computing-and-security-by-research,
#                              master-of-science-by-research,
#                              master-of-education-by-research,
#                              master-of-arts-performing-arts
#   master-of-nursing        → master-of-nursing-studies (already seeded)
#   master-of-engineering-science → 0 cross-links, seeded directly
#   master-of-information-technology → 0 cross-links, seeded directly
#   master-of-counselling    → 0 cross-links, seeded directly
# ─────────────────────────────────────────────────────────────────────────────

discovery:
  scrape_do_skip_fallbacks: true
  scrape_do_render: true
  use_wayback: false
  skip_sitemap_fallback: true

  seed_urls:
    # ── UG Funnelback pagination (12 pages × ~10 courses = ~120 UG courses) ──
    # The bare /degrees/courses/all URL always times out under concurrent
    # Scrape.do load.  start_rank=1 in parameterized form is stable.
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=1&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=11&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=21&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=31&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=41&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=51&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=61&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=71&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=81&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=91&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=101&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=111&waitFor=3000&profile=main

    # ── Business / Commerce (hub seeds — yield cross-links) ───────────────────
    - https://www.ecu.edu.au/degrees/courses/master-of-business-administration
    - https://www.ecu.edu.au/degrees/courses/master-of-professional-accounting
    - https://www.ecu.edu.au/degrees/courses/master-of-human-resource-management

    # ── Health Sciences ───────────────────────────────────────────────────────
    - https://www.ecu.edu.au/degrees/courses/master-of-nursing-studies
    - https://www.ecu.edu.au/degrees/courses/master-of-public-health

    # ── Engineering / Computing ───────────────────────────────────────────────
    # master-of-engineering-science and master-of-information-technology have
    # 0 course cross-links when fetched; seeded directly as individual courses.
    - https://www.ecu.edu.au/degrees/courses/master-of-engineering-science
    - https://www.ecu.edu.au/degrees/courses/master-of-information-technology
    - https://www.ecu.edu.au/degrees/courses/master-of-cyber-security
    - https://www.ecu.edu.au/degrees/courses/master-of-computing-and-security-by-research

    # ── Education ─────────────────────────────────────────────────────────────
    # These were previously seeded via hub pages (master-of-education,
    # master-of-teaching-primary/secondary) which timed out under concurrent
    # Scrape.do load.  Individual courses are now seeded directly.
    - https://www.ecu.edu.au/degrees/courses/master-of-education
    - https://www.ecu.edu.au/degrees/courses/master-of-education-advanced
    - https://www.ecu.edu.au/degrees/courses/master-of-education-accelerated-online
    - https://www.ecu.edu.au/degrees/courses/master-of-education-by-research
    - https://www.ecu.edu.au/degrees/courses/master-of-teaching-primary
    - https://www.ecu.edu.au/degrees/courses/master-of-teaching-secondary
    - https://www.ecu.edu.au/degrees/courses/graduate-certificate-of-education
    - https://www.ecu.edu.au/degrees/courses/graduate-certificate-of-education-accelerated-online
    - https://www.ecu.edu.au/degrees/courses/graduate-diploma-in-teaching-primary
    - https://www.ecu.edu.au/degrees/courses/graduate-diploma-in-teaching-secondary

    # ── Arts / Social Sciences ────────────────────────────────────────────────
    # master-of-counselling has 0 cross-links; seeded directly.
    - https://www.ecu.edu.au/degrees/courses/master-of-counselling
    - https://www.ecu.edu.au/degrees/courses/master-of-arts-performing-arts

    # ── Research / Doctoral ───────────────────────────────────────────────────
    # doctor-of-philosophy hub linked to these 4 research degrees.
    - https://www.ecu.edu.au/degrees/courses/doctor-of-philosophy
    - https://www.ecu.edu.au/degrees/courses/doctor-of-philosophy-integrated
    - https://www.ecu.edu.au/degrees/courses/master-of-science-by-research

  allow_url_patterns:
    # Course detail pages: slug always contains at least one hyphen
    # (bachelor-of-science, master-of-engineering, etc.).  Rejects broad hub
    # pages like /degrees/courses/all and /degrees/courses/search.
    - /degrees/courses/[a-z]+-
    # NOTE: start_rank= is intentionally NOT in allow_url_patterns.
    # All pagination pages are pre-seeded; BFS must NOT follow ?start_rank=
    # links (merged query strings cause doubled Funnelback params → hang).

  block_url_patterns:
    # Funnelback pagination/tab URL variants
    - start_rank=          # Funnelback pagination (same 10 courses every time)
    - collection=ecu%7E   # Funnelback search API calls
    - f\.Tabs%7C           # Funnelback tab filter params
    # Non-course site sections
    - /future-students/
    - /study/events
    - /degrees/study-areas/

  # 12 UG pagination seeds + ~25 PG seeds + cross-link BFS hops.
  # With the concurrent Scrape.do semaphore (max 6), all seeds succeed;
  # BFS then follows cross-links from hub pages for additional candidates.
  bfs_page_budget: 90

extraction:
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  max_parallel_fetch: 4
  skip_browser_rescue: true
  filters:
    domestic_only:
      enabled: true   # Preserve current prod behaviour.
