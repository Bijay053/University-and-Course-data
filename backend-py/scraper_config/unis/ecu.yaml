# Edith Cowan University
# Hostname: www.ecu.edu.au
#
# Bug history / rationale:
#   - ECU has a dedicated static-extract module (ecu_static_extract.py) that
#     handles ECU-specific page structures.  The module uses setdefault() so
#     standard extractors can override its values.
#   - ECU course pages have a distinct table layout for fees that the generic
#     fee extractor sometimes misreads.  The static extractor handles these.
#   - English requirements are published on individual course pages via an
#     embedded accordion — Playwright pass needed for some courses.
#
# ── Cloudflare block (2026-07-09) ────────────────────────────────────────────
# ECU's Cloudflare now blocks: plain httpx (403), curl_cffi (403), Scrape.do
# static (502 ROTATION_FAILED).  Scrape.do render=true works for INDIVIDUAL
# course pages at /degrees/courses/<slug>.
#
# DISCOVERY IS CURRENTLY BROKEN — root cause is different from JCU/Kingston:
#   ECU's course listing pages (/degrees/courses/all, /degrees/undergraduate,
#   /degrees/postgraduate) are full React SPAs.  They load course data via XHR
#   to ecu-search.funnelback.squiz.cloud (their Funnelback/Squiz search index),
#   which is SEPARATELY Cloudflare-protected.  Even Scrape.do render=true can
#   GET the ECU page HTML (70-90KB), but the XHR inside the browser to
#   Funnelback fails (CF-blocked separately), so the course list never loads
#   in the DOM.  Tested: 6s, 8s, 12s waitFor all return 0 course links.
#   Wayback CDX only has garbage URLs.  Direct Funnelback API → CF block.
#
# REQUIRED FIX: Implement a Funnelback provider (like the HUD SearchStax
#   provider in searchstax_hud.py) that queries ecu-search.funnelback.squiz.cloud
#   via Scrape.do render=true with super=true (residential proxy) to bypass the
#   CF block on the Funnelback subdomain.  The collection name and API endpoint
#   pattern need to be determined by inspecting the ECU JS bundle network calls.
#
# Until then: extraction config uses render=true so that courses coming in via
# repair pass or manual entry are extracted correctly.
# ─────────────────────────────────────────────────────────────────────────────

discovery:
  # Cloudflare blocks all static transports; render=true works for individual
  # pages but the course listing XHR (Funnelback) is separately CF-blocked.
  # Seeds below are best-effort — they will be fetched via render but course
  # links will NOT appear in the rendered HTML until Funnelback bypass is implemented.
  scrape_do_skip_fallbacks: true
  scrape_do_render: true
  use_wayback: false
  seed_urls:
    - https://www.ecu.edu.au/degrees/courses/all
    - https://www.ecu.edu.au/degrees/undergraduate
    - https://www.ecu.edu.au/degrees/postgraduate
  allow_url_patterns:
    - /degrees/courses/
  block_url_patterns:
    - /degrees/courses/all
    - /degrees/courses/search
    - /degrees/postgraduate
    - /degrees/undergraduate
    - /degrees/choose-mid-year
  bfs_page_budget: 10
  # Even with render=true the BFS will likely find 0 candidates because the
  # course list is XHR-loaded from Funnelback (separately CF-blocked).
  # The job will fall through to the discovery failure alert path.

extraction:
  # Course pages at /degrees/courses/<slug> return full HTML via render=true.
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  max_parallel_fetch: 4
  skip_browser_rescue: true
  filters:
    domestic_only:
      enabled: true   # Preserve current prod behaviour.
