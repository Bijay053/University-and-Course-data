# Edith Cowan University
# Hostname: www.ecu.edu.au
#
# Bug history / rationale:
#   - ECU has a dedicated static-extract module (ecu_static_extract.py) that
#     handles ECU-specific page structures.  The module uses setdefault() so
#     standard extractors can override its values.
#   - ECU course pages have a distinct table layout for fees that the generic
#     fee extractor sometimes misreads.  The static extractor handles these.
#   - English requirements are published on individual course pages via an
#     embedded accordion — Playwright pass needed for some courses.
#
# ── Cloudflare / Funnelback block (2026-07-09) ───────────────────────────────
# ECU's Cloudflare blocks: plain httpx (403), curl_cffi (403), Scrape.do
# static (502 ROTATION_FAILED).  Scrape.do render=true works for INDIVIDUAL
# course pages at /degrees/courses/<slug>.
#
# BOTH listing pages are React SPAs that load via Funnelback XHR:
#   /degrees/undergraduate  — SPA, 0 static links even with render=true+10s
#   /degrees/postgraduate   — SPA, 0 static links (Funnelback CF-blocked)
#
# DISCOVERY APPROACH (2026-07-09):
#   UG:  BFS from /degrees/courses/all follows Funnelback pagination links
#        (?start_rank=11/21/31...), each returning 10 unique UG course slugs.
#        The allow_url_patterns restricts BFS traversal so only course-detail
#        pages and start_rank= pagination are followed (tab variants are NOT
#        allowed through global blocks, saving ~5 BFS page slots per run).
#   PG:  4 explicit seeds (one per faculty) pre-seeded into BFS queue.
#        Individual PG pages are fully accessible via Scrape.do render=true.
#        Cross-links on each seed page yield additional PG candidates.
#
# Things that do NOT work for PG listing discovery:
#     - Scrape.do render=true on /degrees/postgraduate (0 links, SPA+Funnelback)
#     - Scrape.do render=true on /degrees/undergraduate (0 links, SPA+Funnelback)
#     - ECU sitemap.xml is Cloudflare-blocked (0 bytes returned)
#     - always_sitemap_supplement: true → 6 sitemap probes × ~25s = 150s wasted,
#       triggers 300s discovery timeout without adding any courses
#     - Wayback CDX for ecu.edu.au/degrees/courses/* (0 results)
#
# PAGINATION NOTE (2026-07-09):
#   /degrees/courses/all?start_rank=N loads 10 unique courses per page via BFS.
#   start_rank= URLs are ALSO in block_url_patterns to prevent the pagination
#   page URL from appearing as a candidate (only its course links are kept).
#
# "COURSE DETAILS" / "SUPPLEMENTAL" REJECTIONS (2026-07-09):
#   ~5 discovered course URLs at /degrees/courses/<slug> resolve to ECU 404
#   pages (stale slugs in the UG listing HTML).  The 404 template H1 is
#   "Supplemental"; the guard correctly rejects these with reason
#   category_landing_page_missing_degree_qualifier.  No code change needed.
#
# DOMESTIC ONLY SKIPS (2026-07-09):
#   ~20 Advanced Diploma programs (CUA-code courses) are legitimately
#   domestic-only.  Honours programs are staged correctly (not rejected).
# ─────────────────────────────────────────────────────────────────────────────

discovery:
  scrape_do_skip_fallbacks: true
  scrape_do_render: true
  use_wayback: false

  # NOTE: always_sitemap_supplement is NOT set.  ECU's sitemap.xml is
  # Cloudflare-blocked (returns 0 bytes) and discover_from_sitemap() probes 6
  # sitemap URL candidates × ~25s each = ~150s of the 300s discovery budget
  # wasted.  UG courses are discovered via Funnelback pagination in BFS:
  # /degrees/courses/all?start_rank=N returns 10 real course links per page.
  # With block patterns preventing nav-tab URL waste, budget=60 covers the
  # ~10 UG pagination pages (10 courses each) plus 26 explicit PG seeds.

  seed_urls:
    # ── BFS start (UG Funnelback pagination) ─────────────────────────────
    # /degrees/courses/all is the ECU all-courses Funnelback SPA page.  It
    # renders 10 courses per "page" via ?start_rank= pagination.
    #
    # IMPORTANT — pre-seed ALL pagination pages explicitly (2026-07-10 fix):
    # Previously only the root /all URL was seeded and BFS was expected to
    # follow ?start_rank= links between pages.  BFS resolved those relative
    # query-string links against the already-parameterized current page URL,
    # merging both query strings instead of replacing — producing doubled
    # Funnelback params (?collection=X&collection=X&waitFor=3000&waitFor=3000
    # …).  Scrape.do render=true on a malformed doubled-param URL hangs for
    # 80s+ and blows the 300s discovery budget.
    # By seeding every page directly, BFS never needs to follow ?start_rank=
    # links between pagination pages (they are already in the queue), so no
    # URL merging occurs.  start_rank= is also removed from allow_url_patterns
    # so BFS ignores any pagination links it encounters on each page.
    # Each page returns 10 UG course links; 12 pages covers ~120 UG courses.
    - https://www.ecu.edu.au/degrees/courses/all
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=11&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=21&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=31&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=41&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=51&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=61&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=71&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=81&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=91&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=101&waitFor=3000&profile=main
    - https://www.ecu.edu.au/degrees/courses/all?collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=111&waitFor=3000&profile=main
    # ── Postgraduate — explicit seeds by faculty ──────────────────────────
    # /degrees/postgraduate is a CF-blocked Funnelback SPA (0 links even with
    # render=true).  Strategy: seed one confirmed course page per discipline.
    # BFS cross-links (related-courses sections on each page) yield additional
    # PG candidates.
    #
    # Stale 404 seeds removed (2026-07-10) — ECU discontinued these pages:
    #   master-of-commerce, master-of-marketing-communications,
    #   master-of-international-tourism-and-hospitality-management,
    #   master-of-physiotherapy, master-of-occupational-therapy,
    #   master-of-sport-science, master-of-clinical-exercise-physiology,
    #   master-of-psychology, master-of-special-education, master-of-social-work,
    #   master-of-speech-pathology, master-of-science-biomedical-science.
    # Each stale seed wastes one Scrape.do render call + one BFS page slot.
    #
    # Business / Commerce
    - https://www.ecu.edu.au/degrees/courses/master-of-business-administration
    - https://www.ecu.edu.au/degrees/courses/master-of-professional-accounting
    - https://www.ecu.edu.au/degrees/courses/master-of-human-resource-management
    # Health Sciences
    - https://www.ecu.edu.au/degrees/courses/master-of-nursing
    - https://www.ecu.edu.au/degrees/courses/master-of-nursing-studies
    - https://www.ecu.edu.au/degrees/courses/master-of-public-health
    # Engineering / Computing
    - https://www.ecu.edu.au/degrees/courses/master-of-engineering-science
    - https://www.ecu.edu.au/degrees/courses/master-of-information-technology
    - https://www.ecu.edu.au/degrees/courses/master-of-cyber-security
    # Education
    - https://www.ecu.edu.au/degrees/courses/master-of-education
    - https://www.ecu.edu.au/degrees/courses/master-of-teaching-primary
    - https://www.ecu.edu.au/degrees/courses/master-of-teaching-secondary
    # Arts / Social Sciences / Science
    - https://www.ecu.edu.au/degrees/courses/master-of-counselling
    # Research / Doctoral
    - https://www.ecu.edu.au/degrees/courses/doctor-of-philosophy
    - https://www.ecu.edu.au/degrees/courses/doctor-of-philosophy-integrated

  allow_url_patterns:
    # Course detail pages: slug always contains at least one hyphen
    # (bachelor-of-science, master-of-engineering, etc.).  Rejects broad hub
    # pages like /degrees/courses/all and /degrees/courses/search.
    - /degrees/courses/[a-z]+-
    # NOTE: start_rank= is intentionally NOT in allow_url_patterns (2026-07-10).
    # All pagination pages are pre-seeded above; BFS must NOT follow ?start_rank=
    # links it encounters on each page, because resolving a relative
    # ?start_rank=21&... href against an already-parameterized page URL merges
    # both query strings, producing doubled Funnelback params that cause a
    # Scrape.do render=true hang and a 300s discovery timeout.

  block_url_patterns:
    # Funnelback pagination/tab URL variants — these appear when BFS follows
    # nav links from /degrees/courses/all.  All generate 0 course candidates.
    # ECU post-filter in discovery.py handles hub/listing URL rejection for
    # non-Funnelback URLs.
    - start_rank=          # Funnelback pagination (same 10 courses every time)
    - collection=ecu%7E   # Funnelback search API calls (tab/collection variants)
    - f\.Tabs%7C           # Funnelback tab filter params (URL-encoded f.Tabs|)
    # Non-course site sections — these pages have degree-related text so the
    # BFS classifier wrongly adds them as course candidates (2026-07-10 fix):
    #   /future-students/course-entry/international-student-enquiries  → enquiry form
    #   /future-students/course-entry/english-proficiency-bands        → IELTS band table
    #   /future-students/course-entry                                  → listing of above
    #   /study/events                                                  → events calendar
    #   /degrees/study-areas/*                                         → faculty hubs
    - /future-students/
    - /study/events
    - /degrees/study-areas/

  # 1 UG BFS seed + ~10 UG pagination pages (~100 UG courses) +
  # ~26 PG seeds + cross-links and related-course BFS hops.
  bfs_page_budget: 60

extraction:
  # Course pages at /degrees/courses/<slug> return full HTML via render=true.
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  max_parallel_fetch: 4
  skip_browser_rescue: true
  filters:
    domestic_only:
      enabled: true   # Preserve current prod behaviour.
