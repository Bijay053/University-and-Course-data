# Edith Cowan University
# Hostname: www.ecu.edu.au
#
# ── Discovery approach (2026-07-16 rewrite) ──────────────────────────────────
# Previously used 12 Funnelback UG pagination seeds + 22 individual PG course
# seeds = 34 seeds total, with persistent timeout problems on later seeds.
#
# Now uses the ECU international student search URL, which lists all 187
# international courses across 19 paginated pages (10 per page, start_rank
# increments by 10).
#
# Course links on each page are Funnelback redirect hrefs of the form:
#   https://ecu-search.funnelback.squiz.cloud/s/redirect?...&url=<encoded-url>
# discovery.py's _unwrap_funnelback_redirect() (line ~541) already handles
# this pattern — it extracts the real URL from the `url=` query parameter
# before any allow/block filter or origin check is applied.  After unwrapping,
# each link is a plain /degrees/courses/<slug> URL that:
#   - passes allow_url_patterns (/degrees/courses/[a-z]+-), and
#   - passes _looks_like_course() → added directly to `found` (no re-fetch).
#
# Net: 19 Scrape.do render calls (seeds) → 187 course URLs in `found`.
# No hub traversal or individual PG course seeds needed.
#
# ── Pagination structure ──────────────────────────────────────────────────────
# "1-10 of 187 results" confirmed by live fetch 2026-07-16.
# 19 pages: page 1 = base URL, pages 2-19 = base URL + &start_rank=11/21/…/181
#
# ── Concurrency ───────────────────────────────────────────────────────────────
# Scrape.do render calls limited to 4 concurrent (discovery.py semaphore).
# 19 seeds / 4 = 5 batches × ~25 s ≈ 125 s prefetch — well within 300 s budget.
#
# ── Things that do NOT work ───────────────────────────────────────────────────
#   - Scrape.do render=true on /degrees/postgraduate (0 links, SPA+Funnelback)
#   - Scrape.do render=true on /degrees/undergraduate (0 links, SPA+Funnelback)
#   - ECU sitemap.xml (Cloudflare-blocked, 0 bytes)
#   - always_sitemap_supplement (6 probes × ~25 s = 150 s, 0 results)
#   - Wayback CDX for ecu.edu.au/degrees/courses/* (0 results)
# ─────────────────────────────────────────────────────────────────────────────

discovery:
  scrape_do_skip_fallbacks: true
  scrape_do_render: true
  use_wayback: false
  skip_sitemap_fallback: true

  seed_urls:
    # ECU international student course search — 187 courses, 19 pages × 10.
    # _unwrap_funnelback_redirect() resolves each card's Funnelback redirect
    # href to a direct /degrees/courses/<slug> URL before any filter runs.
    # Page 1 (base URL — no start_rank):
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses
    # Pages 2-19 (start_rank=11 … 181):
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=11
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=21
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=31
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=41
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=51
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=61
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=71
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=81
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=91
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=101
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=111
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=121
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=131
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=141
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=151
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=161
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=171
    - https://www.ecu.edu.au/search/corporate?f.Student+type%7Cr=International&profile=main&query=&collection=ecu%7Esp-ecu-web&f.Tabs%7Cecu%7Eds-fs-courses=Courses&start_rank=181

  allow_url_patterns:
    # Course detail pages: slug contains at least one hyphen.
    # Unwrapped Funnelback URLs (/degrees/courses/<slug>) match this pattern.
    - /degrees/courses/[a-z]+-

  block_url_patterns:
    # Funnelback / search parameters — block cross-link re-queuing of search pages.
    # Seeds bypass this check (depth=0); only cross-links from fetched pages are
    # subject to block_url_patterns.
    - start_rank=          # Pagination in search results
    - collection=ecu%7E   # Funnelback collection param (search pages)
    - f\.Tabs%7C           # Funnelback tab filter
    - /search/corporate    # Search page itself (if found as cross-link)
    # Non-course site sections
    - /future-students/
    - /study/events
    - /degrees/study-areas/
    # Stale postgraduate hub URLs (return HTTP 404)
    - /postgraduate-
    # Article / blog URLs that falsely match _looks_like_course()
    - /study/extra
    # Non-course /degrees/* hub pages
    - /degrees/courses/all$
    - /degrees/ecu-city
    - /degrees/online$
    - /degrees/uniprep$

  # 19 seeds (5 batches of 4 via semaphore) + small buffer for any cross-links.
  # In practice BFS processes only the 19 search pages; all course URLs go
  # directly to `found` via _looks_like_course() after Funnelback unwrapping.
  bfs_page_budget: 30

extraction:
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  max_parallel_fetch: 4
  skip_browser_rescue: true
  filters:
    domestic_only:
      # All 187 courses come from ECU's international student search filter,
      # so every course on these pages is confirmed international.  The
      # domestic_only guard was silently dropping legitimate courses whose
      # pages don't surface an explicit international fee marker.
      enabled: false
