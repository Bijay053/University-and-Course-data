# ─────────────────────────────────────────────────────────────────────────────
# DEAKIN UNIVERSITY
# Hostname: www.deakin.edu.au  |  uni_id: 2252
# Country: Australia  |  Currency: AUD
# ─────────────────────────────────────────────────────────────────────────────
#
# SITE OVERVIEW
# ─────────────────────────────────────────────────────────────────────────────
# CMS: SquizMatrix with Angular SPA frontend (git_bridge bundle).
# Cloudflare protection: yes — plain HTTP returns 403 from all paths including
# sitemap.xml and robots.txt. All discovery must use the browser pool
# (always_browser_discover: true).
#
# DISCOVERY ARCHITECTURE (confirmed from scrape logs)
# ─────────────────────────────────────────────────────────────────────────────
# always_browser_discover: true → BFS is SKIPPED → browser_discover_generic runs.
#
# THREE DISCOVERY PATHS (all used):
#
#   A. SSR seed: /international-students/choosing-your-degree
#      PG course cards are SSR'd in the initial HTML. Playwright finds them
#      immediately at domcontentloaded. ~12s, yields ~43 PG links.
#
#   B. Explicit discipline seeds: /study/find-a-course/<subject-area>
#      Each discipline page yields 10–30 course links in ~10s (static HTML).
#      Seeding them explicitly gives +300 priority — all are processed before
#      any BFS heap items, so heap growth does not affect discovery completeness.
#
#   C. Organic BFS: nav links discovered during seed visits.
#      Budget remainder after seeds handles any remaining sub-pages.
#
# WHY EXPLICIT SEEDING IS REQUIRED (heap growth problem)
# ─────────────────────────────────────────────────────────────────────────────
# Run 2 log: "13 nav pages visited, 83 blocked, heap_remaining=51 at stop".
# After visiting nav #13 (arts-humanities), heap grew from 34 → 51.
# Each discipline page adds ~17 new nav links to the heap. The heap grows
# faster than it depletes, so time-budget increases alone never reach 200+.
# Explicit seeds bypass this entirely: they are processed at score+300 before
# any heap item is dequeued.
#
# DISCIPLINE SLUGS (verified via Wayback Machine CDX query, 2026-07-19)
# ─────────────────────────────────────────────────────────────────────────────
# arts-humanities-and-social-sciences — ALSO confirmed in live scrape logs
# business, data-science-and-analytics, design-and-creative-arts,
# double-degrees, education-and-teaching, engineering, environment,
# food-nutrition-and-dietetics, health-and-community-services,
# health-sciences-and-allied-health
# Additional slugs included that may exist on current site (fast-fail if 404).
#
# WHAT DID NOT WORK (XHR capture)
# ─────────────────────────────────────────────────────────────────────────────
# Angular SPA seeds (/study/find-a-course/undergraduate-courses etc.) load
# courses via XHR. The XHR interceptor captured 6 JSON endpoints but Deakin's
# API schema (proprietary SquizMatrix format) did not match any known shape in
# _extract_courses_from_xhr_json — 0 courses from that path.
# seed_page_settle_s: 10 on 3 SPA seeds consumed ~120s of budget while
# contributing 0 courses → removed.
#
# COURSE URL STRUCTURE
# ─────────────────────────────────────────────────────────────────────────────
# All individual course detail pages follow:
#   https://www.deakin.edu.au/course/<slug>
#   e.g. https://www.deakin.edu.au/course/bachelor-of-commerce
# ─────────────────────────────────────────────────────────────────────────────

discovery:
  seed_urls:
    # ── SSR seed: yields ~43 PG courses from initial HTML immediately ──────
    - "https://www.deakin.edu.au/international-students/choosing-your-degree"

    # ── Discipline pages (static HTML, ~10s each, 10-30 courses each) ─────
    # Verified slugs (Wayback Machine CDX + live scrape log confirmation):
    - "https://www.deakin.edu.au/study/find-a-course/arts-humanities-and-social-sciences"
    - "https://www.deakin.edu.au/study/find-a-course/business"
    - "https://www.deakin.edu.au/study/find-a-course/data-science-and-analytics"
    - "https://www.deakin.edu.au/study/find-a-course/design-and-creative-arts"
    - "https://www.deakin.edu.au/study/find-a-course/education-and-teaching"
    - "https://www.deakin.edu.au/study/find-a-course/engineering"
    - "https://www.deakin.edu.au/study/find-a-course/environment"
    - "https://www.deakin.edu.au/study/find-a-course/food-nutrition-and-dietetics"
    - "https://www.deakin.edu.au/study/find-a-course/health-and-community-services"
    - "https://www.deakin.edu.au/study/find-a-course/health-sciences-and-allied-health"
    # Additional slugs that may exist on the current site:
    - "https://www.deakin.edu.au/study/find-a-course/law"
    - "https://www.deakin.edu.au/study/find-a-course/nursing-and-midwifery"
    - "https://www.deakin.edu.au/study/find-a-course/psychology"
    - "https://www.deakin.edu.au/study/find-a-course/sport-and-exercise-science"
    - "https://www.deakin.edu.au/study/find-a-course/architecture"
    - "https://www.deakin.edu.au/study/find-a-course/double-degrees"

  # Time budget covers: 1 SSR seed (~12s) + 16 discipline seeds × ~10s each
  # = ~172s, plus BFS remainder for any organic sub-pages. 280s is well within
  # the orchestrator's 300s hard ceiling.
  browser_time_budget_s: 280

  # Explicitly declare /course/<slug> pages as extraction candidates.
  # force_candidate bypasses the global is_blocked_page classifier which
  # might reject a course found at depth 2+ as a non-course page.
  force_candidate_url_patterns:
    - "^https://www\\.deakin\\.edu\\.au/course/[a-z][a-z0-9-]+/?$"

  # Gate all discovery candidates to /course/<slug> only.
  allow_url_patterns:
    - "/course/"

  # Mark all listing/hub pages as traverse-only (links extracted but page
  # not staged for extraction).
  listing_only_patterns:
    # /study/find-a-course/ listing pages (UG, PG, double degrees, per-area)
    - "/study/find-a-course/?$"
    - "/study/find-a-course/[a-z][a-z0-9-]+/?$"
    # /international-students/choosing-your-degree/ pages
    - "/international-students/choosing-your-degree/?$"
    - "/international-students/choosing-your-degree/[a-z][a-z0-9-]+/?$"

  block_url_patterns:
    # Non-course /study/ sections
    - "/study/fees-and-scholarships"
    - "/study/how-to-apply"
    - "/study/key-dates"
    - "/study/study-online"
    - "/study/entry-pathways"
    - "/study/access-programs"
    - "/study/find-a-course-by-atar"
    - "/study/find-a-course/short-courses"
    - "/study/study-areas"
    # Non-course international-students sections
    - "/international-students/entry-requirements"
    - "/international-students/how-to-apply"
    - "/international-students/international-student-fees"
    - "/international-students/international-student-scholarships"
    - "/international-students/why-study-in-australia"
    - "/international-students/study-abroad-and-exchange"
    - "/international-students/help-or-contact"
    - "/international-students/partnership-institutions"
    # Wider site sections — never contain course pages
    - "/research/"
    - "/about-deakin/"
    - "/news/"
    - "/events/"
    - "/students/"
    - "/library/"
    - "/global-connect/"
    - "/faculty-of-"
    - "/accommodation"
    - "/indigenous-students/"
    - "/partnerships-and-engagement/"
    - "/student-life-and-services/"
    # Course sub-pages (unit lists, course structure, handbooks) — depth 3+
    - "/course/[a-z][a-z0-9-]+/[a-z]"

  # browser_discover_generic is the primary discovery engine (BFS is skipped).
  always_browser_discover: true

  # Sitemap is Cloudflare-blocked (403). Disabling avoids a slow timeout.
  always_sitemap_supplement: false

  # bfs_page_budget only applies when BFS runs (always_browser_discover=false).
  bfs_page_budget: 60

extraction:
  fees:
    default_currency: AUD
    central_page: ""
    fees_pdf_url: ""

  english:
    central_page: "https://www.deakin.edu.au/international-students/entry-requirements/english"

  course_name:
    strip_title_suffixes:
      - " | Deakin University"
      - " | Deakin"

  filters:
    # Do NOT filter on fee presence — Deakin's fee panel is JS-rendered.
    domestic_only:
      enabled: false

    # Deakin offers legitimate online international programmes.
    online_only:
      enabled: false

  # Deakin blocks plain HTTP (403/CF). Skip static fetch, go straight to Playwright.
  skip_initial_http_fetch: true
  force_browser: true

  # Deakin's Cloudflare tier is sensitive to high concurrency.
  # 2 parallel Playwright sessions avoids triggering bot-detect.
  max_parallel_fetch: 2
