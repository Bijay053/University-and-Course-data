# ─────────────────────────────────────────────────────────────────────────────
# DEAKIN UNIVERSITY
# Hostname: www.deakin.edu.au  |  uni_id: 2252
# Country: Australia  |  Currency: AUD
# ─────────────────────────────────────────────────────────────────────────────
#
# SITE OVERVIEW
# ─────────────────────────────────────────────────────────────────────────────
# CMS: SquizMatrix with Angular SPA frontend (git_bridge bundle).
# Cloudflare protection: yes — plain HTTP returns 403 from all paths including
# sitemap.xml and robots.txt. All discovery and extraction must use Playwright
# (always_browser_discover) or Scrape.do.
#
# DISCOVERY ARCHITECTURE (confirmed from scrape logs)
# ─────────────────────────────────────────────────────────────────────────────
# always_browser_discover: true → BFS is SKIPPED → browser_discover_generic runs.
#
# Two discovery paths (confirmed working):
#
#   A. SSR seed: /international-students/choosing-your-degree
#      PG course cards are SSR'd in the initial HTML. Playwright finds them
#      immediately at domcontentloaded. ~12s, yields 43 PG links.
#
#   B. Per-discipline nav pages: /study/find-a-course/<subject-area>
#      e.g. /study/find-a-course/arts-humanities-and-social-sciences
#      Each yields 10–30 course links in ~5s (static HTML, no Angular SPA wait).
#      browser_discover_generic finds these by following navigation links from
#      the pages it visits and adds them to its internal BFS heap at score=100.
#
# WHAT DID NOT WORK (XHR capture)
# ─────────────────────────────────────────────────────────────────────────────
# Angular SPA seeds (/study/find-a-course/undergraduate-courses etc.) load
# courses via XHR. The XHR interceptor captured 6 JSON endpoints but Deakin's
# API schema (proprietary SquizMatrix format) did not match any known shape in
# _extract_courses_from_xhr_json — 0 courses from that path.
# seed_page_settle_s: 10 added for DOM fallback consumed ~120s of budget on
# 3 SPA seeds that contributed nothing, leaving only 13 of 64 discipline
# nav-pages visited before the 200s budget was exhausted → 84 courses total.
#
# THE FIX
# ─────────────────────────────────────────────────────────────────────────────
# 1. Remove the 3 Angular SPA seeds (they contribute 0 courses, waste ~90s).
# 2. Remove seed_page_settle_s (SSR seed renders immediately, no SPA wait).
# 3. browser_time_budget_s: 280 — 280s allows the SSR seed (~12s) + all 51+
#    remaining discipline nav-pages (~5s each) = ~267s → every course found.
#    300s is the orchestrator's hard ceiling; 280s leaves a 20s safety margin.
#
# COURSE URL STRUCTURE
# ─────────────────────────────────────────────────────────────────────────────
# All individual course detail pages follow:
#   https://www.deakin.edu.au/course/<slug>
#   e.g. https://www.deakin.edu.au/course/bachelor-of-commerce
#
# The slug is lowercase hyphen-separated with no path segments beyond the slug.
# ─────────────────────────────────────────────────────────────────────────────

discovery:
  seed_urls:
    # SSR'd international landing — PROVEN to find PG courses immediately.
    # PG course cards appear in the initial HTML (SquizMatrix SSR, no Angular
    # wait needed). Placed as the only seed so nav-page budget is maximised.
    - "https://www.deakin.edu.au/international-students/choosing-your-degree"

  # Allow all 64 discipline nav-pages to be visited: SSR seed ~12s +
  # 51 discipline pages × ~5s = ~267s, comfortably within this budget.
  # Hard ceiling is the orchestrator's discovery_phase_timeout_s = 300s.
  browser_time_budget_s: 280

  # Explicitly declare /course/<slug> pages as extraction candidates.
  # force_candidate bypasses the global is_blocked_page classifier which
  # might reject a course found at depth 2+ as a non-course page.
  force_candidate_url_patterns:
    - "^https://www\\.deakin\\.edu\\.au/course/[a-z][a-z0-9-]+/?$"

  # Gate all discovery candidates to /course/<slug> only.
  allow_url_patterns:
    - "/course/"

  # Mark all listing/hub pages as traverse-only (links extracted but page
  # not staged for extraction).
  listing_only_patterns:
    # /study/find-a-course/ listing pages (UG, PG, double degrees, per-area)
    - "/study/find-a-course/?$"
    - "/study/find-a-course/[a-z][a-z0-9-]+/?$"
    # /international-students/choosing-your-degree/ pages
    - "/international-students/choosing-your-degree/?$"
    - "/international-students/choosing-your-degree/[a-z][a-z0-9-]+/?$"

  block_url_patterns:
    # Non-course /study/ sections
    - "/study/fees-and-scholarships"
    - "/study/how-to-apply"
    - "/study/key-dates"
    - "/study/study-online"
    - "/study/entry-pathways"
    - "/study/access-programs"
    - "/study/find-a-course-by-atar"
    - "/study/find-a-course/short-courses"
    - "/study/study-areas"
    # Non-course international-students sections
    - "/international-students/entry-requirements"
    - "/international-students/how-to-apply"
    - "/international-students/international-student-fees"
    - "/international-students/international-student-scholarships"
    - "/international-students/why-study-in-australia"
    - "/international-students/study-abroad-and-exchange"
    - "/international-students/help-or-contact"
    - "/international-students/partnership-institutions"
    # Wider site sections — never contain course pages
    - "/research/"
    - "/about-deakin/"
    - "/news/"
    - "/events/"
    - "/students/"
    - "/library/"
    - "/global-connect/"
    - "/faculty-of-"
    - "/accommodation"
    - "/indigenous-students/"
    - "/partnerships-and-engagement/"
    - "/student-life-and-services/"
    # Course sub-pages (unit lists, course structure, handbooks) — depth 3+
    - "/course/[a-z][a-z0-9-]+/[a-z]"

  # browser_discover_generic is the primary discovery engine (BFS is skipped).
  always_browser_discover: true

  # Sitemap is Cloudflare-blocked (403). Disabling avoids a slow timeout.
  always_sitemap_supplement: false

  # bfs_page_budget only applies when BFS runs (always_browser_discover=false).
  bfs_page_budget: 60

extraction:
  fees:
    default_currency: AUD
    central_page: ""
    fees_pdf_url: ""

  english:
    central_page: "https://www.deakin.edu.au/international-students/entry-requirements/english"

  course_name:
    strip_title_suffixes:
      - " | Deakin University"
      - " | Deakin"

  filters:
    # Do NOT filter on fee presence — Deakin's fee panel is JS-rendered.
    domestic_only:
      enabled: false

    # Deakin offers legitimate online international programmes.
    online_only:
      enabled: false

  # Deakin blocks plain HTTP (403/CF). Skip static fetch, go straight to Playwright.
  skip_initial_http_fetch: true
  force_browser: true

  # Deakin's Cloudflare tier is sensitive to high concurrency.
  # 2 parallel Playwright sessions avoids triggering bot-detect.
  max_parallel_fetch: 2
