# University of Wolverhampton
# Hostname: www.wlv.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Slug: wlv
# Updated: 2026-06-04
#
# Observed issues fixed here:
#  1. Only UG courses discovered — browser time budget (90s) ran out before
#     visiting PG categories.  Fix: add PG seed URL + raise time budget to 180s.
#  2. 17 fetch_failed at the end of the run — Cloudflare rate-limits the browser
#     pool after ~46 concurrent requests.  Fix: max_parallel_fetch=2 + wlv.ac.uk
#     added to _BROWSER_RETRY_HOSTS in per_course_browser.py.
#  7. 375/433 fetch_failed (prod run 2026-06-04) — Cloudflare blocks curl_cffi
#     AND browser for the majority of courses (only first ~40 succeed before
#     rate-limit kicks in).  WLV uses SearchStax Solr for discovery; individual
#     course pages are fetched via browser pipeline.
#  3. duplicate_fee_detected CRITICAL — WLV charges a near-flat £17,600 for most
#     UG courses (legitimate flat rate, not a selector bug).  Suppressed.
#  4. annual_fee_too_low / possible_domestic_fee — first-run DQ used AUD defaults
#     because this yaml didn't exist yet.  default_currency: GBP fixes it on
#     subsequent runs.
#  5. StudyMode 'Online' (rule conf=0.70) — WLV nav contains "online" text
#     (study-online links / online-learning section); the bare-keyword rule fires
#     incorrectly.  Suppressed via _STUDY_MODE_RULE_SUPPRESSED_HOSTS; Gemini /
#     location_derived correctly returns 'On Campus'.
#  6. IELTS missing on all courses — WLV does not publish per-course IELTS scores;
#     English requirements page lists 6.0 overall as the general UG minimum.

discovery:
  # ── SearchStax Solr provider (replaces browser BFS discovery) ─────────────
  # WLV's search page (https://www.wlv.ac.uk/search/) is powered by a
  # SearchStax-hosted Solr core that indexes all 433 courses.  The browser BFS
  # crawler only discovers ~93/433 courses because Cloudflare blocks the
  # listing pages and the sub-category nav trees exhaust the 180 s time budget.
  #
  # This block instructs the orchestrator to query Solr directly for ALL 433
  # course URLs and hand them to the normal per-course browser+Gemini pipeline.
  # "links_only: true" means we do NOT short-circuit extraction: each URL is
  # still fetched individually for fees, IELTS, intakes, etc.
  #
  # Endpoint intercepted 2026-06-04 via Playwright network intercept.
  # Token is the same read-only token the SPA ships to every browser user
  # (not a server secret) — set via WLV_SEARCHSTAX_TOKEN env var so we avoid
  # committing it to git.
  searchstax:
    endpoint: "https://searchcloud-1-eu-west-2.searchstax.com/29847/wolverhamptondevelopment-3254/emselect"
    token_env: WLV_SEARCHSTAX_TOKEN
    filter_query: "sectionType_s:courses"
    # field_map_as_payload: true — builds payloads directly from Solr fields
    # without fetching any individual course pages.  ~432 courses complete in
    # <5 minutes vs ~271 minutes with per-page browser extraction at concurrency 2.
    # Fees and IELTS come from degree_level_defaults in the extraction section
    # below (WLV Solr does not carry fee/IELTS data in the index).
    field_map_as_payload: true
    exclude_part_time: true
    # Reject courses whose parsed duration exceeds 4 years when exclude_part_time
    # is set.  WLV PhD/MPhil research programs are part-time-only (6–8 years)
    # but their Solr duration_t field contains bare "8 years" with no "part-time"
    # qualifier, so the text filter cannot detect them.  UG max is 4 yrs (with
    # sandwich), PG max is 2 yrs — threshold 4 safely covers both.
    max_fulltime_duration_years: 4

    # WLV Solr url_t field contains bare SITS course codes (e.g. "WR006J01UMU"),
    # not real HTTP URLs.  url_base is prepended so the link URL becomes
    # "https://www.wlv.ac.uk/courses/wr006j01umu".
    url_base: "https://www.wlv.ac.uk/courses"

    # WLV campus — used as course_location for all courses since Solr does
    # not carry a location field.
    location_override: "Wolverhampton"

    # Solr field name → system field mapping for _build_field_map_payload.
    # WLV Solr has two duration fields:
    #   multi_duration_ss — multi-valued ("Part-time (8 years)", "Full-time (4 years)")
    #   duration_t        — single-valued ("3 years full-time") for most courses
    # duration_fallback is tried when multi_duration_ss is absent from the doc.
    # Same pattern for intake dates.
    field_map:
      url: url_t
      name: title_t
      degree_type: award_s
      degree_level: study_level_s
      duration: multi_duration_ss
      duration_fallback: duration_t
      intake_dates: multi_course_start_date_ss
      intake_fallback: start_dates_s
      category: subject_s

  # ── Retained as fallback only (not used when searchstax block is active) ──
  seed_urls:
    - https://www.wlv.ac.uk/courses/undergraduate/
    - https://www.wlv.ac.uk/courses/postgraduate/
  browser_time_budget_s: 180
  browser_early_stop_courses: 300

extraction:
  # No per-page fetching needed: field_map_as_payload uses Solr data directly.
  # Cloudflare-bypass settings (force_browser, retry_on_cloudflare) are removed.

  filters:
    # WLV pages that list only "Part-time (N years)" with no Full-time option
    # are courses that international students cannot take on a student visa.
    # Reject them during extraction rather than staging them for manual review.
    reject_parttime_only: true

  text_cleaning:
    duration:
      # WLV course-length cells list Part-time before Full-time:
      #   "Course length: Part-time (8 years), Full-time (4 years)"
      # The label-matched Pattern-0 picks "8 years" (first number) at ×100
      # priority, beating Pattern-1's "4 years" at ×10.
      # prefer_fulltime: true demotes Pattern-0 when "part-time" precedes
      # the matched number so Pattern-1 (full-time anchor) wins instead.
      prefer_fulltime: true

  study_mode:
    # WLV: site-wide nav contains "online" text (study-online / online-learning
    # links) that the bare \bonline\b rule matches at conf=0.70, overriding the
    # correct On Campus value for all on-campus courses. Gemini and
    # location_derived correctly return 'On Campus'. Previously hardcoded in
    # _STUDY_MODE_RULE_SUPPRESSED_HOSTS in study_mode.py.
    suppress_nav_rule: true

  fees:
    default_currency: GBP
    prefer_international: true
    force_central_fee_stage: true
    # WLV publishes a near-flat £17,600/year for the majority of courses.
    # Solr docs do not contain fee amounts — these defaults are the fallback.
    # Source: https://www.wlv.ac.uk/apply/fees-and-finance/international-students/
    degree_level_defaults:
      undergraduate: 17600
      postgraduate: 17600

  english:
    # WLV does not publish per-course IELTS scores.
    # Source: https://www.wlv.ac.uk/international/english-language-requirements/
    #   UG:  IELTS 6.0 overall, no band below 5.5
    #   PG:  IELTS 6.5 overall, no band below 5.5
    # Tier-based defaults applied by academic_level from Solr level_s field.
    degree_level_defaults:
      undergraduate:
        ielts: 6.0
      postgraduate:
        ielts: 6.5
    # Fallback for courses whose academic level cannot be determined.
    default_ielts: 6.0

  staging:
    # WLV charges a near-flat £17,600/year for the majority of UG international
    # courses.  The 75%-threshold duplicate_fee_detected check fires on this as a
    # CRITICAL selector-scope error — suppress it as a known false positive.
    skip_duplicate_fee_check: true
