# Massey University
# The generic /study/courses/ page is a paper/course-code search, not the
# qualification catalogue. The complete qualification index is static HTML and
# currently exposes roughly 190 degree links in one response.

hostname_guard: www.massey.ac.nz

locked_config_paths:
  - discovery.seed_urls
  - discovery.bfs_page_budget
  - discovery.allow_url_patterns
  - discovery.listing_only_patterns
  - discovery.force_candidate_url_patterns
  - discovery.course_detail_url_patterns
  - discovery.skip_sitemap_fallback
  - discovery.skip_browser_discovery
  - extraction.max_parallel_fetch
  - extraction.scrape_do_static
  - extraction.skip_per_course_browser
  - extraction.fees.central_page
  - extraction.fees.currency_override
  - extraction.fees.central_fee_priority
  - extraction.fees.discard_domestic_fee
  - extraction.english.degree_level_defaults

discovery:
  seed_urls:
    - https://www.massey.ac.nz/study/all-qualifications-and-degrees/

  # Every qualification is linked directly from the single static index.
  bfs_page_budget: 1
  expected_min_courses: 170
  skip_sitemap_fallback: true
  always_sitemap_supplement: false
  skip_browser_discovery: true

  # Keep discovery and extraction restricted to individual qualification pages.
  # The final non-empty path segment includes Massey's qualification code.
  allow_url_patterns:
    - '^https://www\.massey\.ac\.nz/study/all-qualifications-and-degrees/[^/?#]+/?$'
  listing_only_patterns:
    - '^/study/all-qualifications-and-degrees/?$'
  force_candidate_url_patterns:
    - '^/study/all-qualifications-and-degrees/[^/?#]+/?$'
  course_detail_url_patterns:
    - '^https://www\.massey\.ac\.nz/study/all-qualifications-and-degrees/[^/?#]+/?$'

extraction:
  # Massey's origin blocks the production worker IP after roughly 60 direct
  # qualification requests, even sequentially. Its pages are server-rendered,
  # so use the static proxy transport and avoid a browser pass that adds no
  # fields before degree-level English defaults are applied.
  scrape_do_static: true
  skip_per_course_browser: true
  max_parallel_fetch: 2

  fees:
    central_page: https://www.massey.ac.nz/study/fees-and-funding/tuition-fees-for-international-students/
    default_currency: NZD
    currency_override: NZD
    prefer_international: true
    central_fee_exact_match_only: true
    central_fee_priority: true
    discard_domestic_fee: true
    reject_keywords:
      - Non-tuition fees
      - Student services fee
      - Student Services Levy

  english:
    # The combined requirements table contains component minima alongside
    # overall scores. Use Massey's published institution-wide overall scores by
    # degree level so a component minimum cannot be mistaken for an overall.
    degree_level_defaults:
      undergraduate:
        ielts: 6.0
        pte: 50
        toefl: 80
      postgraduate:
        ielts: 6.5
        pte: 58
        toefl: 90
      doctorate:
        ielts: 6.5
        pte: 58
        toefl: 90
      research:
        ielts: 6.5
        pte: 58
        toefl: 90