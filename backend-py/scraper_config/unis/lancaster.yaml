# Lancaster University
# Hostname: www.lancaster.ac.uk
# Country: United Kingdom  |  Currency: GBP
#
# Discovery strategy (2026-06-12):
#   Lancaster's listing pages use a Vue 3 <course-listing> component. While
#   the rendered course list requires JavaScript, the :courses-data Vue prop
#   is SERVER-RENDERED directly into the HTML as a JSON array — plain httpx
#   fetches it without any browser.  538 courses for 2026 entry (371 UG +
#   167 PG).  Individual course detail pages are also fully SSR.
#
# This config uses the generic ssr_prop_discovery feature (available to any
# university with server-rendered JSON data embedded in HTML attributes).
# The lancaster_listing: true key (legacy shorthand) is kept as a fallback.

discovery:
  # ── Generic SSR-prop discovery (primary path) ──────────────────────────
  # Fetches both listing pages, extracts the :courses-data JSON prop, and
  # builds course URLs.  No browser required.  Auto-falls back to Playwright
  # (browser_fallback_xpath) if the prop is ever missing.
  ssr_prop_discovery:
    listing_pages:
      - url: "https://www.lancaster.ac.uk/study/undergraduate/courses/"
        url_prefix: "https://www.lancaster.ac.uk/study/undergraduate/courses/"
        label: "Undergraduate"
      - url: "https://www.lancaster.ac.uk/study/postgraduate/postgraduate-courses/"
        url_prefix: "https://www.lancaster.ac.uk/study/postgraduate/postgraduate-courses/"
        label: "Postgraduate"

    # Vue prop attribute that holds the JSON courses array (SSR-embedded)
    prop_attr: ":courses-data"

    # Fields in each JSON course object
    slug_field: "slug"
    name_field: "title"

    # URL construction: {url_prefix}/{slug}{url_suffix}
    # {year} → 4-digit entry year (e.g. 2026)
    url_suffix: "/{year}/"

    # Entry-year filter: Lancaster's format is "26/27", so filter on prefix "26/"
    year_field: "entryYear"
    year_filter_prefix: "{short_year}/"

    # Browser fallback XPath — used automatically if the SSR prop is not found.
    # The Vue component renders an A-Z nav client-side; once mounted, this XPath
    # extracts all course links from the rendered DOM.
    # Confirmed 2026-06-12 via browser DevTools inspection.
    browser_fallback_xpath: "//nav[contains(@class, 'a-z')]//li/a/@href"
    browser_wait_selector: "nav.a-z"

    # Regex to validate hrefs extracted by the browser fallback
    course_url_pattern: '/study/(undergraduate/courses|postgraduate/postgraduate-courses)/[^/]+/20\d{2}/?$'

  # course_detail_url_patterns: validates URLs from both discovery paths
  # before extraction begins.
  course_detail_url_patterns:
    - '/study/undergraduate/courses/[^/]+/20\d{2}/?$'
    - '/study/postgraduate/postgraduate-courses/[^/]+/20\d{2}/?$'

  # ── BFS fallback (if ssr_prop_discovery returns 0 links) ───────────────
  seed_urls:
    - https://www.lancaster.ac.uk/study/undergraduate/courses/computer-science-bsc-hons-g400/2026/
    - https://www.lancaster.ac.uk/study/postgraduate/postgraduate-courses/artificial-intelligence-msc/2026/

  allow_url_patterns:
    - '/study/undergraduate/courses/[^/]+/20\d{2}/?$'
    - '/study/postgraduate/postgraduate-courses/[^/]+/20\d{2}/?$'

  block_url_patterns:
    - '/news'
    - '/events'
    - '/staff/'
    - '/about'
    - '/contact'
    - '/linkassets/'
    - '/study/student-experience'
    - '/study/fees-and-funding'
    - '/study/open-days'
    - '/study/international-students'
    - '/study/entry-requirements'
    - '/study/accommodation'
    - '/study/scholarships'
    - '/study/global-experiences'
    - '/study/expression-of-interest'
    - '/study/clearing'
    - '/study/results'
    - '/study/chat'
    - '/study/partners'
    - '/study/lancaster-online'
    - '/study/undergraduate/courses/$'
    - '/study/postgraduate/postgraduate-courses/$'
    - '/lums/postgraduate/programmes'
    - '/maths/study/'
    - '/lancaster-online/'
    - '/international/'
    - '/admissions'
    - '/media/'
    - '/our-'

  bfs_page_budget: 60
  always_browser_discover: false
  skip_browser_discovery: true
  use_wayback: false

extraction:
  # Verified against a live 278 KB course page: 31% smaller, 1.45x faster,
  # with exact critical-field parity against the unmodified document.
  html_compaction_enabled: true
  max_parallel_fetch: 8
  skip_browser_rescue: false
  skip_per_course_browser: false

  # Lancaster geo-block fix: the server detects US IPs and returns
  # "We welcome applications from the United States of America" with
  # "Our Use of Cookies" as the page title — wrong content entirely.
  # scrape_do_static routes each per-course fetch through Scrape.do's
  # residential proxy (render=False, ~$0.0005/call) which provides a
  # UK/EU IP so the actual course page is returned.  No JS rendering
  # needed — pages are fully SSR.  Cost: ~$0.27 per full 538-course run.
  scrape_do_static: true
  # Use a Nepal exit-node IP so Lancaster serves international (non-US) content.
  # NP is a neutral non-US/non-UK country that gets standard international fees.
  scrape_do_geo: NP

  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false

  fees:
    default_currency: GBP
    prefer_international: true
    prefer_annual_over_total: true
    fee_year: "2026"
    fee_term: "year"
    # reject_keywords intentionally omitted: the fee XPath already targets
    # td[2] (the International column) directly, so Home/UK keywords in the
    # evidence context come from the adjacent Home column — they are NOT an
    # indicator that we scraped the domestic fee.  Keeping these keywords
    # caused FEE_REJECT on every course even when £30,770 was correct.

  english:
    source: course_page
    source_xpath: "//section[contains(@id, 'entry-requirements')] | //div[contains(@id, 'requirements')] | //main"

    ielts:
      raw_xpath: ".//*[contains(text(), 'IELTS')] | .//li[contains(., 'IELTS')]"
      remove_tags: true
      patterns:
        overall:
          - 'overall\sscore\sof\s*(\d\.?\d*)'
          - 'IELTS.?(\d\.?\d)\s*overall'
          - 'score\sof\s(\d\.?\d*)'
        each:
          - 'minimum\sof\s(\d\.?\d*)'
          - '(\d\.?\d*)\sin\seach\s*element'
          - 'no\selement\sless\sthan\s(\d\.?\d*)'
      apply_each_to:
        - ielts_reading
        - ielts_writing
        - ielts_listening
        - ielts_speaking

  course_name:
    # Lancaster's cookie-consent modal injects <div id="biccy-prompt">
    # <h1>Our use of cookies</h1></div> BEFORE the main content area, so
    # a bare soup.find("h1") returns the wrong element. The real course
    # title is always inside <div class="course-title"><h1>...</h1></div>.
    # This CSS selector targets that div specifically and skips the modal.
    h1_css_selector: "div.course-title h1"
    # The H1 inside div.course-title contains only the bare subject name
    # (e.g. "Artificial Intelligence") with no degree qualifier.  The full
    # degree name including the level abbreviation is only in <title>:
    #   "Artificial Intelligence MSc - Lancaster University"
    # prefer_title_over_h1 promotes the cleaned <title> (conf 0.85) above
    # the H1 (conf 0.6) so the effective_name carries a degree qualifier
    # and passes _name_has_degree_qualifier in the staging gate.
    prefer_title_over_h1: true
    strip_title_suffixes:
      - " - Lancaster University"

  selectors:
    course_name:
      # Phase-2 AI-rule XPath (used by ai_extractor_run, not course_name.py).
      # The h1_css_selector above fixes the built-in extractor.
      # MUST NOT use bare //h1 — cookie modal h1 comes first in the DOM.
      xpath: "//div[contains(@class,'course-title')]/h1"

    city:
      value: "Lancaster"

    study_load:
      xpath: "//div[contains(@class,'course-meta')]//*[contains(text(),'Mode')]/following-sibling::text() | //li[contains(.,'Full-time') or contains(.,'Part-time')]/text()"

    duration:
      xpath: "//div[contains(@class,'course-meta')]//*[contains(text(),'Duration') or contains(text(),'Length')]/following-sibling::text() | //li[contains(.,'year') or contains(.,'Duration')]/text()"

    intake_month:
      xpath: "//div[contains(@class,'course-meta')]//*[contains(text(),'Start')]/following-sibling::text()"

    course_description:
      xpath: "//section[contains(@id,'overview')] | //div[contains(@class,'course-overview')] | //div[contains(@id,'course-description')]"

    course_structure:
      xpath: "//section[contains(@id,'course-structure')] | //div[contains(@id,'modules')] | //div[contains(@class,'modules-content')]"

    career:
      xpath: "//section[contains(@id,'careers')] | //div[contains(@class,'careers-content')] | //div[contains(@id,'opportunities')]"

    other_requirements:
      xpath: "//section[contains(@id,'entry-requirements')] | //div[contains(@id,'requirements-content')]"

    fee_international:
      primary:
        # Lancaster fee table: <table class='fees-table'>
        #   Row 1 headers: Home | International
        #   Row 2 values:  £9,790 | £X  ← td[2] = International fee
        xpath: "//table[contains(@class,'fees-table')]//tr[contains(.,'£')]/td[2]/text()"
      fallback_1:
        xpath: "//table[contains(@class,'fees-table')]//td[contains(@class,'international') or contains(@headers,'international')]/text()"
      fallback_2:
        xpath: "//*[contains(text(),'International') or contains(text(),'Overseas')]/following-sibling::*[contains(text(),'£')]/text()"

  text_cleaning:
    global_substring_blocklist:
      - Apply now
      - Find out more
      - Book an open day
      - Request a prospectus
      - Chat with a student
      - Our use of cookies

  staging:
    reject_if_missing:
      - course_name
    require_international_fee: false
