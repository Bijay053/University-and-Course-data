# Lancaster University
# Hostname: www.lancaster.ac.uk
# Country: United Kingdom  |  Currency: GBP
#
# Root-cause analysis (2026-06-12):
#   - OLD YAML had course_detail_url_patterns that didn't match Lancaster's
#     /study/{ug|pg}/.../[slug]/[year]/ URL shape → ALL candidates dropped
#     → "kept 0/7 (dropped 7 = 100%)" → 0 staged.
#   - NEW fix: correct allow_url_patterns + course_detail_url_patterns both
#     using '/study/undergraduate/courses/[^/]+/20\d{2}/?$' etc., verified
#     to match all 21 per-page cross-links AND all 12 seed URLs.
#   - BFS budget was 25 (= orchestrator default, YAML override requires >25).
#     Raised to 60. Each course page has 21 cross-links → budget of 60 visits
#     many pages and accumulates hundreds of candidates.
#   - Old YAML wasted budget on /study/student-experience/, /study/open-days/,
#     /study/fees-and-funding/ etc. Added to block_url_patterns.
#   - Cookie-consent modal: <div id='biccy-prompt'><h1>Our use of cookies</h1>
#     Fix: use //div[contains(@class,'course-title')] → "Computer Science BSc Hons"
#   - skip_degree_qualifier_check: true removed (was allowing cookie pages through)
#   - Fee table: <table class='fees-table'> col1=Home col2=International
#   - PDF fee (Fee_Summary_2324) yields stale £1,385/£1,850 values; per-course
#     XPath is more reliable so PDF fee is deprioritised via low-priority fallback.

discovery:
  seed_urls:
    # Undergraduate — one representative per department cluster
    - https://www.lancaster.ac.uk/study/undergraduate/courses/computer-science-bsc-hons-g400/2026/
    - https://www.lancaster.ac.uk/study/undergraduate/courses/engineering-with-a-foundation-year-beng-hons-h10f/2026/
    - https://www.lancaster.ac.uk/study/undergraduate/courses/mathematics-with-computer-science-bsc-hons-gg14/2026/
    - https://www.lancaster.ac.uk/study/undergraduate/courses/mathematics-artificial-intelligence-and-realworld-systems-mars-bsc-hons-g1i4/2026/
    - https://www.lancaster.ac.uk/study/undergraduate/courses/theoretical-physics-study-abroad-mphys-hons-f322/2026/
    - https://www.lancaster.ac.uk/study/undergraduate/courses/business-management-bsc-hons-n100/2026/
    - https://www.lancaster.ac.uk/study/undergraduate/courses/english-language-ba-hons-q100/2026/
    - https://www.lancaster.ac.uk/study/undergraduate/courses/psychology-bsc-hons-c800/2026/
    # Postgraduate — one representative per faculty cluster
    - https://www.lancaster.ac.uk/study/postgraduate/postgraduate-courses/artificial-intelligence-msc/2026/
    - https://www.lancaster.ac.uk/study/postgraduate/postgraduate-courses/management-msc/2026/
    - https://www.lancaster.ac.uk/study/postgraduate/postgraduate-courses/management-science-mres/2026/
    - https://www.lancaster.ac.uk/study/postgraduate/postgraduate-courses/mathematics-phd/2026/
    - https://www.lancaster.ac.uk/study/postgraduate/postgraduate-courses/international-relations-phd/2026/
    - https://www.lancaster.ac.uk/study/postgraduate/postgraduate-courses/health-data-science-phd/2026/
    - https://www.lancaster.ac.uk/study/postgraduate/postgraduate-courses/volcanology-msc/2026/
    - https://www.lancaster.ac.uk/study/postgraduate/postgraduate-courses/data-science-msc/2026/

  # Restrict BFS queue — only these URL shapes are allowed past the global block.
  # Verified 2026-06-12: all 21 cross-links per course page match pattern [0],
  # and all seed URLs match [0] or [1].
  allow_url_patterns:
    - '/study/undergraduate/courses/[^/]+/20\d{2}/?$'
    - '/study/postgraduate/postgraduate-courses/[^/]+/20\d{2}/?$'

  # Post-discovery gate: drop any candidate that is not a year-specific course URL.
  # Verified: matches all 12+ seeds and 21 cross-links per page.
  course_detail_url_patterns:
    - '/study/undergraduate/courses/[^/]+/20\d{2}/?$'
    - '/study/postgraduate/postgraduate-courses/[^/]+/20\d{2}/?$'

  # Explicit blocks prevent BFS from wasting page budget on non-course sections
  # (previously /study/student-experience/, /study/fees-and-funding/, /study/open-days/
  # were each being visited, burning 3–5 of the 25-page budget for zero yield).
  block_url_patterns:
    - '/news'
    - '/events'
    - '/staff/'
    - '/about'
    - '/contact'
    - '/linkassets/'
    - '/study/student-experience'
    - '/study/fees-and-funding'
    - '/study/open-days'
    - '/study/international-students'
    - '/study/entry-requirements'
    - '/study/accommodation'
    - '/study/scholarships'
    - '/study/global-experiences'
    - '/study/expression-of-interest'
    - '/study/clearing'
    - '/study/results'
    - '/study/chat'
    - '/study/partners'
    - '/study/lancaster-online'
    - '/study/undergraduate/courses/$'
    - '/study/postgraduate/postgraduate-courses/$'
    - '/lums/postgraduate/programmes'
    - '/maths/study/'
    - '/lancaster-online/'
    - '/international/'
    - '/admissions'
    - '/media/'
    - '/our-'

  # 60 > orchestrator default (25 non-fast / 12 fast) so this WILL apply.
  # With 16 seeds × 21 cross-links each = up to ~336 candidates after dedup.
  # Budget 60 lets the BFS visit ~60 discovered pages and expand further.
  bfs_page_budget: 60

  always_browser_discover: false
  skip_browser_discovery: true
  use_wayback: false

extraction:
  max_parallel_fetch: 8
  skip_browser_rescue: false
  skip_per_course_browser: false

  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false

  fees:
    default_currency: GBP
    prefer_international: true
    prefer_annual_over_total: true
    fee_year: "2026"
    fee_term: "year"
    reject_keywords:
      - "Home"
      - "UK"
      - "Channel Islands"
      - "Isle of Man"

  english:
    source: course_page
    source_xpath: "//section[contains(@id, 'entry-requirements')] | //div[contains(@id, 'requirements')] | //main"

    ielts:
      raw_xpath: ".//*[contains(text(), 'IELTS')] | .//li[contains(., 'IELTS')]"
      remove_tags: true
      patterns:
        overall:
          - 'overall\sscore\sof\s*(\d\.?\d*)'
          - 'IELTS.?(\d\.?\d)\s*overall'
          - 'score\sof\s(\d\.?\d*)'
        each:
          - 'minimum\sof\s(\d\.?\d*)'
          - '(\d\.?\d*)\sin\seach\s*element'
          - 'no\selement\sless\sthan\s(\d\.?\d*)'
      apply_each_to:
        - ielts_reading
        - ielts_writing
        - ielts_listening
        - ielts_speaking

  selectors:
    course_name:
      # Returns the course-title div which contains both:
      #   <h1>Computer Science</h1>  and  <p class='qualification'>BSc Hons</p>
      # Extractor joins all text → "Computer Science BSc Hons".
      # MUST NOT use //h1 — cookie-consent modal uses h1 first:
      #   <div id='biccy-prompt'><h1>Our use of cookies</h1></div>
      xpath: "//div[contains(@class,'course-title')] | //main//h1[not(ancestor::*[@id='biccy-prompt'])]"

    city:
      value: "Lancaster"

    study_load:
      xpath: "//div[contains(@class,'course-meta')]//*[contains(text(),'Mode')]/following-sibling::text() | //li[contains(.,'Full-time') or contains(.,'Part-time')]/text()"

    duration:
      xpath: "//div[contains(@class,'course-meta')]//*[contains(text(),'Duration') or contains(text(),'Length')]/following-sibling::text() | //li[contains(.,'year') or contains(.,'Duration')]/text()"

    intake_month:
      xpath: "//div[contains(@class,'course-meta')]//*[contains(text(),'Start')]/following-sibling::text()"

    course_description:
      xpath: "//section[contains(@id,'overview')] | //div[contains(@class,'course-overview')] | //div[contains(@id,'course-description')]"

    course_structure:
      xpath: "//section[contains(@id,'course-structure')] | //div[contains(@id,'modules')] | //div[contains(@class,'modules-content')]"

    career:
      xpath: "//section[contains(@id,'careers')] | //div[contains(@class,'careers-content')] | //div[contains(@id,'opportunities')]"

    other_requirements:
      xpath: "//section[contains(@id,'entry-requirements')] | //div[contains(@id,'requirements-content')]"

    fee_international:
      primary:
        # Lancaster fee table: <table class='fees-table'>
        #   Row 1 headers: Home | International  (no £ sign)
        #   Row 2 values:  £9,790 | £X  ← td[2] = International fee
        xpath: "//table[contains(@class,'fees-table')]//tr[contains(.,'£')]/td[2]/text()"
      fallback_1:
        xpath: "//table[contains(@class,'fees-table')]//td[contains(@class,'international') or contains(@headers,'international')]/text()"
      fallback_2:
        # Note: must be //* not //[ to be valid XPath
        xpath: "//*[contains(text(),'International') or contains(text(),'Overseas')]/following-sibling::*[contains(text(),'£')]/text()"

  text_cleaning:
    global_substring_blocklist:
      - Apply now
      - Find out more
      - Book an open day
      - Request a prospectus
      - Chat with a student
      - Our use of cookies

  staging:
    reject_if_missing:
      - course_name
    # skip_degree_qualifier_check intentionally NOT set (defaults to false).
    # With course_name = "Computer Science BSc Hons" (includes degree qualifier),
    # the guard correctly passes real courses and rejects "Our Use of Cookies".
    require_international_fee: false
