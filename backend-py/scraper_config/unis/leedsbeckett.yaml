# Leeds Beckett University
# Hostname: www.leedsbeckett.ac.uk
# Country: United Kingdom  |  Currency: GBP

discovery:
  always_sitemap_supplement: true

extraction:
  fees:
    default_currency: GBP
    prefer_international: true
    # Central fee page lists all programme fees in £
    central_pages:
      - url: "https://www.leedsbeckett.ac.uk/international-students/course-fees-and-living-costs/"
        type: fees

  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false

  study_mode:
    # Campus university — suppress \bonline\b nav-link false positives
    suppress_nav_rule: true

  course_name:
    strip_title_suffixes:
      - " | Leeds Beckett University"
      - " - Leeds Beckett University"
      - " | LBU"
      - " - LBU"
