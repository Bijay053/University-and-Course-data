# University of Leeds
# Hostname: www.leeds.ac.uk  (course catalogue: courses.leeds.ac.uk)
# Country: United Kingdom  |  Currency: GBP
# Discovery: Funnelback / course-search pagination (15 courses per page)
#
# Bug history / rationale:
#   - Default BFS budget (25) exhausts before all listing pages are visited.
#     Leeds has ~21 UG pages (~316 courses) + ~19 PGT pages (~280 courses).
#   - Default candidate cap (500) cut discovery at 499 courses.
#   - After run 2 (80 pages fetched), Cloudflare/rate-limit blocked our server
#     IP permanently.  BFS returns 0, Wayback fallback activates.
#   - Wayback CDX for www.leeds.ac.uk/* returns 10,000 URLs — includes 1990s
#     archived pages (/acom/leedsetc/course/, /aed/courses/credit/) that look
#     like course paths but are ancient HTML files with no usable data.  All
#     173 of them staged 0 courses.  Blocked by allow_url_patterns now.
#   - render_listing_pages_static: true (tried) — Funnelback search uses JS to
#     render the correct page for each ?page=N&start_rank=N URL.  Static mode
#     ignores the params and returns the default page-1 results for every URL,
#     so 42 pages × Scrape.do static = 16 unique links (all dupes of page 1).
#   - Fix: remove render_listing_pages_static so headless Chrome (JS enabled)
#     executes the Funnelback JS and renders each paginated page correctly.
#     Each Scrape.do render call costs ~$0.006; 42 pages ≈ $0.25 per run.
#   - allow_url_patterns restricts candidates to courses.leeds.ac.uk/NNNNN/
#     paths — the format all real current Leeds courses use — which blocks both
#     the Wayback garbage and any www.leeds.ac.uk/* non-course noise.

discovery:
  bfs_page_budget: 80
  max_candidates: 700
  always_sitemap_supplement: false   # sitemap returns 0 for courses.leeds.ac.uk

  seed_urls:
    - 'https://courses.leeds.ac.uk/course-search/undergraduate-courses?type=UG&term=202627'
    - 'https://courses.leeds.ac.uk/course-search/masters-courses?type=PGT&term=202627'

  # Only accept real Leeds course URLs — format is courses.leeds.ac.uk/<term>/<code>/<slug>
  # or courses.leeds.ac.uk/<legacy-id>/<Name>.  This blocks:
  #   - www.leeds.ac.uk/acom/leedsetc/course/*.htm  (1990s Wayback archive)
  #   - www.leeds.ac.uk/aed/courses/*               (archived adult-education pages)
  #   - any other www.leeds.ac.uk/* noise the Wayback CDX surfaces
  allow_url_patterns:
    - 'courses\.leeds\.ac\.uk/\d+'

  block_url_patterns:
    - '/news'
    - '/events'
    - '/about'
    - '/research'
    - '/staff'
    - 'term=202728'
    - 'term=202829'

  # Fetch all paginated listing pages via Scrape.do headless Chrome.
  # render_listing_pages_static is NOT set (defaults to false) — Funnelback
  # renders the correct page only after JS executes; static mode ignores URL
  # params and returns page-1 results for every URL.
  # Cost: 42 pages × ~$0.006 = ~$0.25 per run.
  render_listing_pages:
    # ── Undergraduate (UG) — 2026/27 cohort (~316 courses, 22 pages) ─────────
