# University of Leeds
# Hostname: www.leeds.ac.uk  (course catalogue: courses.leeds.ac.uk)
# Country: United Kingdom  |  Currency: GBP
# Discovery: Funnelback / course-search pagination (15 courses per page)
#
# Bug history / rationale:
#   - Default BFS budget (25) exhausts before all listing pages are visited.
#     Leeds has ~21 UG pages (~316 courses) + ~19 PGT pages (~280 courses).
#   - Default candidate cap (500) cut discovery at 499 courses.
#   - Tried pre-seeding all 42 paginated URLs — caused rate-limit/IP-block when
#     all 42 fired simultaneously; also wasteful because the two base seed URLs
#     already embed all pagination links in their static HTML, so the BFS discovers
#     them naturally without pre-seeding.
#   - Fix: two simple seed URLs + raised budget/candidate cap.  On a clean IP the
#     BFS follows all pagination links and reaches 545+ candidates within budget.

discovery:
  bfs_page_budget: 80
  max_candidates: 700
  always_sitemap_supplement: false   # sitemap returns 0 for courses.leeds.ac.uk

  seed_urls:
    - 'https://courses.leeds.ac.uk/course-search/undergraduate-courses?type=UG&term=202627'
    - 'https://courses.leeds.ac.uk/course-search/masters-courses?type=PGT&term=202627'

  block_url_patterns:
    - '/news'
    - '/events'
    - '/about'
    - '/research'
    - '/staff'
    # Block next-year duplicates so the BFS doesn't waste budget on them
    - 'term=202728'
    - 'term=202829'

extraction:
  fees:
    default_currency: 'GBP'
    prefer_international: true
    prefer_annual_over_total: true
    reject_keywords:
      - 'Home student'
      - 'Home fee'
      - 'UK student'
      - 'UK fee'
      - 'Domestic'

  english:
    trust_vision_ocr: false
    course_english_priority: true

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | University of Leeds'
      - ' - University of Leeds'

  filters:
    online_only:
      enabled: false
