# University of Leeds
# Hostname: www.leeds.ac.uk  (course catalogue: courses.leeds.ac.uk)
# Country: United Kingdom  |  Currency: GBP
# Discovery: Funnelback / course-search pagination (15 courses per page)
#
# Bug history / rationale:
#   - Default BFS budget (25) exhausts before all listing pages are visited.
#     Leeds has ~21 UG pages (~316 courses) + ~19 PGT pages (~280 courses).
#   - Default candidate cap (500) cut discovery at 499 courses.
#   - Pre-seeding 42 paginated URLs caused simultaneous burst → IP rate-limit.
#   - After run 2 (80 pages fetched), Cloudflare/rate-limit blocks all direct
#     HTTP fetches from our server IP. BFS returns 0, falls back to Wayback (159).
#   - Fix: use render_listing_pages (Scrape.do residential proxy) so each
#     listing page is fetched from a clean residential IP that bypasses the block.
#     render_listing_pages_static: true uses static mode (~$0.0005/page, not $0.006)
#     since the course results ARE present in the raw SSR HTML without JS execution
#     (confirmed by runs 1 & 2 where static fetch returned 16 course links per page).
#   - Total cost: 42 pages × $0.0005 = ~$0.02 per scrape run.

discovery:
  bfs_page_budget: 80
  max_candidates: 700
  always_sitemap_supplement: false   # sitemap returns 0 for courses.leeds.ac.uk

  seed_urls:
    - 'https://courses.leeds.ac.uk/course-search/undergraduate-courses?type=UG&term=202627'
    - 'https://courses.leeds.ac.uk/course-search/masters-courses?type=PGT&term=202627'

  block_url_patterns:
    - '/news'
    - '/events'
    - '/about'
    - '/research'
    - '/staff'
    - 'term=202728'
    - 'term=202829'

  # Fetch all paginated listing pages via Scrape.do residential proxy.
  # These bypass the IP block that direct HTTP from our server hits after
  # a heavy crawl.  Static mode (no headless Chrome) is sufficient because
  # Funnelback renders course cards server-side in the initial HTML response.
  render_listing_pages_static: true
  render_listing_pages:
    # ── Undergraduate (UG) — 2026/27 cohort (~316 courses, 22 pages) ─────────
    - 'https://courses.leeds.ac.uk/course-search/undergraduate-courses?page=1&start_rank=1&type=UG&term=202627'
    - 'https://courses.leeds.ac.uk/course-search/undergraduate-courses?page=2&start_rank=16&type=UG&term=202627'
