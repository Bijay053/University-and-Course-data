  block_url_patterns:
    - '/news'
    - '/events'
    - '/about'
    - '/research'
    - '/staff'
    # Block next-year term so the BFS doesn't waste budget visiting 202728 duplicates
    - 'term=202728'
    - 'term=202829'

extraction:
  # courses.leeds.ac.uk now returns a hard 403 to both direct HTTP and the
  # datacenter Playwright pool. The page itself is fully server-rendered, so
  # Scrape.do's static residential proxy returns complete HTML without paying
  # for headless rendering.
  scrape_do_static: true
  skip_browser_rescue: true
  skip_per_course_browser: true

  fees:
    default_currency: 'GBP'
    prefer_international: true
    prefer_annual_over_total: true
    reject_keywords:
      - 'Home student'
      - 'Home fee'
      - 'UK student'
      - 'UK fee'
      - 'Domestic'

  english:
    trust_vision_ocr: false
    course_english_priority: true

  intake:
    start_dates_only: true

  course_name:
    strip_title_suffixes:
      - ' | University of Leeds'
      - ' - University of Leeds'

  filters:
    online_only:
      enabled: false
  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false