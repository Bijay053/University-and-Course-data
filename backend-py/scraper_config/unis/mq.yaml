# Macquarie University (uni 277, slug "mq")
# Hostname: www.mq.edu.au
#
# Discovery: Scrapy spider (mq_spider.py) — two-step JSON approach
#
#   Step 1 — Funnelback search API (start_url)
#     GET https://mqu-search.funnelback.squiz.cloud/s/search.json
#         ?collection=mqu~sp-courses&profile=international
#         &query=!padrenull&start_rank=1&num_ranks=338
#     Returns all 338+ international courses with liveUrl, title, metaData.
#
#   Step 2 — Gatsby page-data.json per course
#     URL: liveUrl.replace(".au/study/", ".au/study/page-data/") + "/page-data.json"
#     Inner JSON contains fees, IELTS scores, description, admission requirements.
#
#   The spider yields rich items (payload + evidence) so the orchestrator
#   short-circuits per-course HTML fetch + extraction entirely.

discovery:
  scrapy:
    spider: mq_spider
    timeout_seconds: 900
    settings:
      DOWNLOAD_DELAY: 0.5
      CONCURRENT_REQUESTS: 8

extraction:
  fees:
    default_currency: AUD
    fee_term: Annual

  staging:
    require_international_fee: false

  filters:
    domestic_only:
      enabled: false
