discovery:
  generic_search_api:
    enabled: true
    url: https://mqu-search.funnelback.squiz.cloud/s/search.json?collection=mqu~sp-courses&profile=international&query=!padrenull&start_rank=1&num_ranks=338
    params:
      collection: mqu~sp-courses
      profile: international
      query: '!padrenull'
      start_rank: '1'
      num_ranks: '350'
    root_path: response.resultPacket.results
    url_fields:
    - liveUrl
    - url
    - link
    title_fields:
    - title
    - name
    allow_url_patterns:
    - /study/
    normalize_relative_urls: true
    base_url: https://www.mq.edu.au
  always_sitemap_supplement: true
  expected_min_courses: 350
extraction:
  fees:
    default_currency: AUD
    prefer_international: true
    prefer_annual_over_total: true
  course_name:
    strip_title_suffixes:
    - ' | Macquarie University'
    - ' - Macquarie University'
    - ' — Macquarie University'
  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: true
