# University of East London (UEL)
# Hostname: www.uel.ac.uk
#
# Bug history / rationale:
#   - Cloudflare protection: HTTP BFS/httpx returns 403.
#   - Playwright began receiving a navigation-only response with 0 course
#     anchors in September 2026, while Scrape.do render=false still returns the
#     complete server-rendered catalogue (114 UG links on the first page).
#
# Current discovery:
#   - always_browser_discover skips the blocked BFS tier.
#   - skip_browser_discovery suppresses the now-unproductive Playwright walk.
#   - render_listing_pages_static fetches the two SSR catalogue pages through
#     Scrape.do without JavaScript and keeps only exact course-detail URLs.
#   - use_wayback=false avoids a 10,000-URL CDX scan that yields 0 UEL courses.
#
# NOTE: UEL may be delivered in Australia by a separate partner institution.
# Verify whether the scrape_url points to the Australian delivery site or the
# UK mother institution, as content structure differs significantly.

discovery:
  always_browser_discover: true
  skip_browser_discovery: true
  use_wayback: false

  # Direct course catalogue listing pages (2026-05-31 fix).
  # Individual course pages are at /(under|post)graduate/courses/{slug},
  # so the listing pages are at the parent paths below.
  # The /study/* hub pages are kept in _HOST_EXTRA_SEEDS as fallbacks;
  # these YAML seeds are prepended by the scraper and navigated first.
  seed_urls:
    - https://www.uel.ac.uk/study/undergraduate/courses
    - https://www.uel.ac.uk/study/postgraduate/courses

  render_listing_pages_static: true
  render_listing_pages:
    - https://www.uel.ac.uk/study/undergraduate/courses
    - https://www.uel.ac.uk/study/postgraduate/courses

  allow_url_patterns:
    - '^https://www\.uel\.ac\.uk/(undergraduate|postgraduate)/courses/[^/?#]+/?$'

  # Hard wall-clock limit for the browser nav BFS (seconds).
  # Previous value (120 s) was exhausted entirely by 18 useless paginated
  # ?page=N seeds that all returned 0 links. New seeds are 4 targeted URLs
  # so the budget is spent on BFS exploration instead.
  # 300 s gives the BFS time to explore all 32+ queued nav candidates.
  browser_time_budget_s: 300

  # Stop nav BFS once this many course links are collected.
  # Actual UEL catalogue: 276 total (114 UG + 162 PG, confirmed 2026-09-17).
  # Set above 276 so discovery doesn't stop before both pages are harvested.
  # The global default pipeline cap is 500 and comfortably covers UEL.
  browser_early_stop_courses: 300

  # Warn if discovery returns fewer than this many courses.
  # Orchestrator emits: "Discovery incomplete: expected 100+, found X."
  expected_min_courses: 100

  # Per-UEL nav blocklist (extends the global blocklist in browser_discover_generic.py).
  # These path segments appear in UEL site navigation but lead to info/support
  # pages rather than course pages.
  block_nav_patterns:
    - "/apprenticeship"
    - "/pre-entry"
    - "/foundation"
    - "/higher-national"
    - "/short-course"
    - "/cpd"
    - "/professional-development"
    - "/open-evenings"
    - "/clearing"
    - "/how-to-apply"
    - "/student-support"
    - "/placements"
    - "/campus"
    - "/partners"
    - "/research"
    - "/business"
    - "/employer"

  # Post-filter: keep any course URL that looks like a UEL course page.
  # ANY match in the list passes (OR semantics).
  #
  # Why two patterns:
  #   "/postgraduate/courses/" — confirmed PG URL structure (e.g. /postgraduate/courses/msc-xxx)
  #   "/undergraduate/"       — UG course pages may live at /undergraduate/<slug> WITHOUT
  #                             a nested /courses/ segment; using just "/courses/" silently
  #                             drops the entire undergraduate catalogue.
  #
  # Previous value was "/courses/" only, which filtered out all UG course links
  # whose URLs were at /undergraduate/<slug> rather than /undergraduate/courses/<slug>.
  # (Bug identified 2026-05-31: 51 staged courses, all Master's, 0 UG.)
  must_contain:
    - "/undergraduate/"
    - "/postgraduate/courses/"

  # Block specific UEL URL segments that pass the must_contain filter but are
  # NOT individual course detail pages:
  #   - /funding, /scholarships, /bursaries  → money-info hub pages
  #     (e.g. "Funding for Undergraduate Students", "Funding for Postgraduate Students")
  #   - /fees                                → tuition-fee overview page
  #   - /entry-requirements                  → generic requirements hub
  #   - /study-online                        → online study landing page
  # These are blocked HERE (rather than in block_nav_patterns) because they
  # pass the /undergraduate/ or /postgraduate/courses/ must_contain filter
  # and only get caught later at staging_gate. Blocking them at URL level is
  # cheaper and keeps staging_gate logs clean.
  block_url_patterns:
    - "/funding"
    - "/scholarships"
    - "/bursaries"
    - "/fees"
    - "/entry-requirements$"
    - "/study-online"

extraction:
  # UEL is Cloudflare-protected — every course page needs a real browser.
  # Without scrape.do, 4 parallel browser tabs is the practical ceiling before
  # CF starts rate-limiting; retry_on_cloudflare: true handles the occasional
  # challenge that fires after the burst, so net throughput is still ~2× faster
  # than max_parallel_fetch: 2 (was ~72 min → now ~36-40 min for 270 courses).
  max_parallel_fetch: 4

  # First request per new browser context often fails CF challenge; second
  # attempt passes once cf_clearance cookie is established.
  retry_on_cloudflare: true

  # UEL's Cloudflare blocks plain HTTP → fetch_html returns None → browser
  # fallback fires for the initial HTML fetch.  However, if that first browser
  # pass returns a partial challenge page, Gemini fills ielts_overall with the
  # flat default_ielts (6.0), which BLOCKS the normal maybe_browser_refetch
  # gate (gate skips when any English slot is already populated).  This leaves
  # duration, intake, and mode blank on ~30% of courses.
  # force_browser: true overrides the gate so the full browser re-extraction
  # pass always runs, regardless of whether Gemini already filled a slot.
  force_browser: true

  # The database auto-config may retain browser suppression from an earlier
  # proxy strategy. UEL's explicit browser-only extraction path must clear both
  # independent suppression controls or skip_initial_http_fetch below leaves
  # every course with no transport at all.
  skip_browser_rescue: false
  skip_per_course_browser: false

  # UEL is 100% Cloudflare-protected: every plain HTTP attempt returns a 403
  # or bot-challenge page before the browser fallback fires.  Skipping the
  # initial HTTP try eliminates the wasted round-trip for every course page
  # (saves ~2–5 s × 273 courses = ~10–23 min per run).
  skip_initial_http_fetch: true

  course_name:
    university_aliases:
      - "University of East London"
      - "UEL"

  fees:
    default_currency: GBP
    force_central_fee_stage: true
    # UEL publishes flat international fees (2025/26):
    #   UG: £16,020/year  PG: £16,680/year
    # Source: https://www.uel.ac.uk/study/undergraduate/fees-and-funding
    # Applied as fallback when page extraction yields no fee.
    degree_level_defaults:
      undergraduate: 16020
      postgraduate: 16680

  english:
    # UEL general entry: IELTS 6.0 overall, no band below 5.5 (UG/PG standard).
    # Source: https://www.uel.ac.uk/international/english-language-requirements
    default_ielts: 6.0

    # When both ielts_overall (from default_ielts above) and international_fee
    # (from degree_level_defaults above) are already set before the vision pass,
    # skip the full Gemini image scan (6 candidate images per course).
    # For UEL these two fields always come from YAML defaults — vision OCR adds
    # nothing but cost.  Saves ~273 × Gemini-image-scan overhead per run.
    skip_vision_when_core_found: true

  staging:
    # UEL is a flat-fee university: every undergraduate international course
    # costs £16,020/year.  The duplicate_fee_detected DQ check fires at ≥75%
    # and would flag this as a CRITICAL selector-scope bug — suppress it.
    skip_duplicate_fee_check: true

    # UEL course pages surface the course name from JSON metadata (SPA-style
    # rendering) WITHOUT a leading degree qualifier. Examples:
    #   "Accounting and Finance"           (BSc implied by URL /undergraduate/...)
    #   "Bcs Foundation Certificate in Agile"  (BCS = British Computer Society qual)
    #   "Primary with Early Years (3-7) Pgce"  (trailing abbreviation)
    # The standard _name_has_degree_qualifier check rejects these as
    # category_landing_page. The block_url_patterns above gate non-course pages
    # instead; this check is redundant and causes false positives for UEL.
    skip_degree_qualifier_check: true

  study_mode:
    # UEL: every course page contains "apply online" / "online student services"
    # text that triggers the bare \bonline\b rule at conf=0.70, overriding
    # Gemini's correct 'On Campus' result. Suppressing the rule extractor
    # entirely lets Gemini and location_derived classify study mode correctly.
    # Previously hardcoded in _STUDY_MODE_RULE_SUPPRESSED_HOSTS in study_mode.py.
    suppress_nav_rule: true

  filters:
    domestic_only:
      enabled: true
    # online_only filter disabled: suppress_nav_rule above prevents false 'Online'
    # detections at source. Gemini correctly returns 'On Campus' for UEL pages.
    online_only:
      enabled: false
