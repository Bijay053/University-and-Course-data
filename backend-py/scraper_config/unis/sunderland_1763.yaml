# University of Sunderland
# Hostname: www.sunderland.ac.uk
# Country: United Kingdom  |  Currency: GBP
# uni_id: 1763

discovery:
  sitemap_url: "https://www.sunderland.ac.uk/sitemap.xml"
  always_sitemap_supplement: true
  scrape_do_fallback: true

  # Allow both sitemap-style slug URLs (/postgraduate/<slug>, /undergraduate/<slug>)
  # AND the numeric-ID format Wayback Machine returns (/course/\d+/<slug>).
  # REPLACES the DB auto_config allow_url_patterns which only had slug-style paths
  # and was dropping 100% of the 47 Wayback-sourced /course/ URLs.
  allow_url_patterns:
    - "sunderland\\.ac\\.uk/(postgraduate|undergraduate)/(?!(conversion-courses|difference-between-ma-msc-degree|llm-criminal-law-procedure))"
    - "sunderland\\.ac\\.uk/course/\\d+"

  seed_urls:
    - "https://www.sunderland.ac.uk/postgraduate"
    - "https://www.sunderland.ac.uk/undergraduate"

extraction:
  fees:
    default_currency: GBP
    # NOTE: https://www.sunderland.ac.uk/international/fees returns 404 (React SPA
    # routing — static HTML gives no fee data).  Remove central_page until a
    # scrapeable fee URL is found; use degree_level_defaults below instead.
    # Source: University of Sunderland official fees page / CollegeDunia 2025/26.
    # UG: £14,500, PGT: £16,500 (range £14,500–21,000; using floor as conservative default).
    degree_level_defaults:
      undergraduate: 14500
      postgraduate: 16500
      doctorate: 16500

  english:
    central_page: "https://www.sunderland.ac.uk/english-language-requirements"
    # IELTS: 6.0 overall, min 5.5 each component (UG and PGT standard).
    # Source: sunderland.ac.uk/study/international/entry-language-requirements 2025.
    degree_level_defaults:
      undergraduate:
        ielts: 6.0
      postgraduate:
        ielts: 6.0
      doctorate:
        ielts: 6.0

  study_mode:
    # Sunderland pages contain "apply online" / "register online" nav copy that
    # fires the bare \bonline\b fallback → 'Online' at conf=0.70 on every
    # on-campus course.  Suppress the rule pass so Gemini reads the actual
    # course content ("On campus", "Full-time") and classifies correctly.
    suppress_nav_rule: true
