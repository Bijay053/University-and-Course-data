# University of Sunderland
# Hostname: www.sunderland.ac.uk
# Country: United Kingdom  |  Currency: GBP
# uni_id: 1763
#
# Discovery strategy:
#   The site is a Contensis CMS React SPA — static HTML has no course links.
#   The sitemap (141 URLs) is outdated; 32 newer courses only appear in the
#   /find-a-course page's window.REDUX_DATA navigation tree (187 total).
#   Strategy: seed ALL 187 nav-tree course URLs directly so every URL that
#   matches allow_url_patterns is immediately added as a course candidate
#   without relying on BFS traversal of the SPA shell.
#   The sitemap supplement runs in parallel and deduplicates.

discovery:
  sitemap_url: "https://www.sunderland.ac.uk/sitemap.xml"
  always_sitemap_supplement: true

  # Only depth-2 /postgraduate/<slug> and /undergraduate/<slug> paths are
  # real course pages.  Known nav/info pages are excluded via the negative
  # lookahead. The trailing [a-z0-9][a-z0-9-]*$ anchors against depth-3+
  # sub-paths (e.g. schools-colleges-outreach/post-16).
  allow_url_patterns:
    - "sunderland\\.ac\\.uk/(postgraduate|undergraduate)/(?!(conversion-courses|difference-between-ma-msc-degree|llm-criminal-law-procedure|postgraduate-application-form|why-study-postgraduate-degree|how-to-write-personal-statement|freshers-week-guide|schools-colleges-outreach|scitt))[a-z0-9][a-z0-9-]*$"
    - "sunderland\\.ac\\.uk/course/\\d+"

  # All 187 course URLs extracted from window.REDUX_DATA on /find-a-course
  # (Contensis CMS navigation tree, captured 2026-06-07).
  # Seeding these directly bypasses BFS traversal of the JS SPA shell.
  # The scraper adds each URL to the candidate set as soon as it matches
  # allow_url_patterns above, without fetching the listing page.
