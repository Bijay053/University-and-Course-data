# Queen Mary University of London (QMUL)
# Hostname: www.qmul.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Slug: qmul  |  uni_id: 2203
# Updated: 2026-07-02
#
# ── URL STRUCTURE ─────────────────────────────────────────────────────────────
# Real UG course pages:  /undergraduate/coursefinder/courses/{year}/{slug}/
# Real PG taught pages:  /postgraduate/taught/coursefinder/courses/{year}/{slug}/
# Real PG research:      /postgraduate/research/projects/{slug}/
#
# ── DISCOVERY APPROACH ────────────────────────────────────────────────────────
# QMUL's search page (https://www.qmul.ac.uk/search/) is powered by a
# SearchStax-hosted Solr core (qmu-1736).  The BFS crawler finds only ~160–200
# of the 409 courses because:
#   1. Individual course pages are at /coursefinder/courses/{year}/{slug}/ which
#      the BFS does not reach without visiting every subject-area listing page.
#   2. Cloudflare blocks the search/listing pages from plain httpx; Scrape.do
#      with geo=gb works but the BFS page budget runs out before full coverage.
#
# Fix: query the Solr core directly (links_only=true) to obtain all 409 course
# URLs in one pass, then run normal per-course extraction for fee/IELTS/intakes.
#
# Token is the read-only SPA token embedded in every browser request to
# www.qmul.ac.uk/search/ — it is PUBLIC (visible in the page JS to any visitor)
# and intentionally committed here.  Rotate if SearchStax revoke it.
# Literal: bc0d2578c3f22cca23fdb327f7490ddb56098759
#
# ── KNOWN ISSUES (fixed in this YAML) ────────────────────────────────────────
#
#  FEES SHOWN AS "AUD" WITH LOW-FEE WARNINGS:
#    QMUL is a UK university — all fees are GBP.  Without default_currency: GBP
#    the system defaults to AUD and fires annual_fee_too_low_warning for all
#    valid £15k–£35k fees.  Fixed below.
#
#  COURSE COUNT REGRESSION (root cause fixed 2026-06-26):
#    QMUL course pages contain "online" in navigation and utility text:
#      - "Apply Online" buttons
#      - "Online Learning" sidebar links
#      - "Online Prospectus" references
#    The bare \bonline\b keyword fallback in the study_mode extractor fired on
#    this navigation copy and set study_mode="Online" at confidence 0.5.
#    With online_only.enabled=true, those courses were then silently rejected
#    even though every one of them is an on-campus programme.
#    Fix: online_only_requires_strong_evidence=true suppresses the bare
#    \bonline\b fallback (confidence < 0.7); only unambiguous phrases like
#    "fully online", "100% online", or "distance learning" now mark a course
#    as Online-only.  The filter remains enabled to correctly reject QMUL's
#    small number of genuinely distance-learning programmes.
#
# ── DEPLOYMENT ────────────────────────────────────────────────────────────────
# After editing this file, trigger a new scrape from the Scraping Jobs page.
# No code restart needed — the YAML is re-read on every scrape job start.
# ─────────────────────────────────────────────────────────────────────────────

discovery:
  # ── SearchStax Solr provider (replaces BFS discovery) ─────────────────────
  # QMUL's search page is powered by SearchStax (same EU-West-2 cluster as
  # HUD and WLV).  Querying Solr directly returns all 409 courses in one pass,
  # bypassing Cloudflare and the BFS page budget limit.
  #
  # links_only: true — Solr provides the 409 course URLs only; each URL is then
  # fetched individually by the per-course pipeline (Scrape.do static → browser
  # fallback → Gemini) for fee, IELTS, duration, and intake extraction.  The
  # Solr docs do NOT contain IELTS or structured fee data, so full per-course
  # extraction is necessary.
  searchstax:
    endpoint: "https://searchcloud-1-eu-west-2.searchstax.com/29847/qmu-1736/emselect"

    # Public read-only token — embedded in the page JS shipped to every browser
    # visitor of www.qmul.ac.uk/search/.  Not a secret.
    authorization_token: "bc0d2578c3f22cca23fdb327f7490ddb56098759"

    # Filter to course documents only (excludes news, events, staff pages, etc.)
    filter_query: 'sectionType_s:"courses"'

    # links_only mode: Solr supplies URLs + basic metadata; per-course pages
    # supply fee, IELTS, duration, and intakes.
    links_only: true

    # QMUL Solr field → system field mapping for links_only mode.
    # coursepageurl_t holds the full course page URL (not a bare code like WLV).
    # coursetitle_t  holds the plain course name (e.g. "Accounting and Finance").
    # awardname_t    holds the degree abbreviation (e.g. "MSc", "BSc (Hons)").
    # level          holds "ug" or "pg" (academic level).
    # campusname_t   holds campus name (e.g. "Mile End Campus").
    # modeofattendancecode_s holds "Full-time", "F-FT", "Part-time", "P-PT".
    url_fields:
      - coursepageurl_t
    title_fields:
      - coursetitle_t
      - awardname_t

    field_map:
      url:           coursepageurl_t
      name:          coursetitle_t
      degree_type:   awardname_t
      degree_level:  level
      location:      campusname_t
      study_mode:    modeofattendancecode_s

  # Alert threshold: fire a discovery-failure alert when fewer than 390 courses
  # are staged (5% below the 409-course Solr baseline).
  expected_min_courses: 390


extraction:
  # QMUL is an on-campus university with its main campus at Mile End, London.
  # Most Solr course docs have no campusname_t value, so course_location is
  # often blank after per-course extraction.  Without a preset location the
  # study_mode guard at single_course.py:2665–2685 downgrades "On Campus"
  # (set via a study_mode:rule from the mode-of-attendance field) to "Online"
  # when no page-extracted location is found — causing all courses to be
  # rejected by the online_only filter.  This default provides the physical
  # location evidence the guard requires without overriding a Solr-provided
  # campus name (the guard checks course_location first and skips the preset
  # when it is already populated).
  default_course_location: "London"

  fees:
    # QMUL is in the UK — all fees are quoted in GBP.
    # Without this, the system defaults to AUD and fires low-fee warnings
    # for valid £15,000–£35,000 annual fees.
    default_currency: "GBP"
    prefer_international: true

  filters:
    domestic_only:
      enabled: false
    online_only:
      # Keep the filter enabled — QMUL does offer a small number of
      # genuinely distance-learning programmes that should be rejected.
      # The regression fix is in study_mode (below), not here.
      enabled: true

  study_mode:
    # QMUL course pages embed "online" in navigation and utility copy:
    #   - "Apply Online" call-to-action buttons (present on every page)
    #   - "Online Learning" section links in the sidebar
    #   - "Online Prospectus" and "Online Open Day" links
    # The bare \bonline\b fallback (confidence 0.5) fires on those phrases
    # and incorrectly sets study_mode="Online" for on-campus courses, which
    # are then silently rejected by the online_only filter.
    #
    # online_only_requires_strong_evidence suppresses any Online result
    # with confidence < 0.7 (i.e. the bare keyword fallback).  Only
    # structured labels ("Mode of study: Online") or high-specificity
    # phrases ("fully online", "100% online", "distance learning") remain.
    online_only_requires_strong_evidence: true
    #
    # Belt-and-suspenders: if a physical campus location has already been
    # extracted for the course, a bare-keyword Online result is suppressed
    # in favour of "On Campus".  QMUL lists campus names (Mile End,
    # Whitechapel) in every course's key facts — this preference prevents
    # a stray "apply online" phrase from overriding the campus evidence.
    prefer_location_over_online_keyword: true

  english:
    # QMUL course pages do NOT publish IELTS requirements on individual
    # course pages.  The entry requirements section links to a central
    # English language requirements page instead.
    #
    # Central page (verified 2026-07-02):
    #   https://www.qmul.ac.uk/international-students/englishlanguagerequirements/
    #                                  undergraduate-and-postgraduate-programmes/
    #
    # Published IELTS bands from that page:
    #   Undergraduate programmes: Band 5 — IELTS 7.0 overall, 6.0 in each component
    #   Most Postgraduate programmes: Band 4 — IELTS 6.5 overall, 6.0 in each component
    #   PG arts/creative programmes: Band 5 — IELTS 7.0 overall, 6.0 in each component
    #     (MA Creative Arts; MA Digital Media; MA Linguistics; MA TESOL)
    #
    # The central_page is prefetched once per job and IELTS values are applied
    # to all courses.  degree_level_defaults below act as a fallback when the
    # central page cannot be matched to a specific course.
    central_page: "https://www.qmul.ac.uk/international-students/englishlanguagerequirements/undergraduate-and-postgraduate-programmes/"

    degree_level_defaults:
      undergraduate:
        # Band 5 — all UG programmes except listed exceptions
        ielts: 7.0
      postgraduate:
        # Band 4 — most taught PG programmes
        # Note: some arts PG require Band 5 (7.0); 6.5 is the majority default.
        ielts: 6.5
      doctorate:
        # PhD/MRes — same as PG taught (Band 4)
        ielts: 6.5

    # Flat fallback for courses whose degree level cannot be determined.
    default_ielts: 7.0

  staging:
    # QMUL's 2027 entry course pages display "Fees for 2027 entry will appear
    # here shortly" — international fees have not yet been published for the
    # upcoming intake year.  2026 entry pages confirm international fees exist
    # (e.g. Biology 2026: £32,950 overseas).
    #
    # Setting require_international_fee: false allows courses to pass the
    # staging gate without a fee and land in the review queue.  When QMUL
    # publishes 2027 fees (typically 4–6 months before entry), a re-scrape
    # will automatically populate them via the regex extractor.
    require_international_fee: false
    # QMUL course pages name courses by subject only — "Economics", "Law",
    # "Biology" — without a degree qualifier in the H1.  The degree is shown
    # in the sidebar/key-facts box, not the main heading.  The qualifier check
    # would reject all of these as "category landing pages"; disable it here
    # because the URL pattern /undergraduate/coursefinder/courses/2027/{slug}/
    # already guarantees individual course pages (not listing pages).
    skip_degree_qualifier_check: true

  # QMUL's site is WAF-protected (Akamai-style 403 "The request could not be
  # satisfied") and blocks our datacenter IP for BOTH plain HTTP (httpx) and
  # our own Playwright browser fetch — job_291e348d325c (2026-07-03) showed
  # 403 on ~87% of course pages via both paths, confirming this is an IP-level
  # block, not a session/cookie issue that retries or longer settle times can
  # fix. Same failure signature as Cardiff (see cardiff.yaml) — the working
  # fix there is Scrape.do's residential-IP headless Chrome, which bypasses
  # the datacenter-IP block entirely instead of retrying against it.
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  skip_browser_rescue: true
