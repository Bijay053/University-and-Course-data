# Auckland University of Technology (New Zealand)
# Hostname: www.aut.ac.nz
#
# Bug history / rationale:
#   - AUT has ~14 study-area faculties and no usable sitemap.
#     Pre-seed the faculty pages plus parent courses that expose specialisations.
#   - Cloudflare change (2026-08-28): direct HTTP/curl now returns a challenge
#     and Scrape.do static returns ROTATION_FAILED. Rendered Scrape.do succeeds.
#     Route discovery straight to render, skip dead sitemap/browser fallbacks,
#     and keep the crawl bounded to the verified seed set.
#   - AUT is a NZ university.  Fees are in NZD, not AUD.
#   - Graduate Diploma / Graduate Certificate duration split reported:
#     raw strings like '1 year (full-time) / 0.5 year (full-time)' need slash splitting.
#   - Discovery pollution fix (2026-06-28): narrowed allow_url_patterns from
#     "/study/study-options/" (too broad) to "/study/study-options/[^/]+/courses/".
#     Added block_url_patterns for sub-page pollution within /courses/ paths.
#   - 5 AUT online courses live on online.aut.ac.nz (separate subdomain, BFS cannot
#     reach them from www.aut.ac.nz).  Added as extra_course_urls.
#   - Grandchild discovery fix (2026-06-28): 41 courses still missing after the above
#     fix because they are specialisation sub-pages (depth 3+ URLs like
#     /courses/{parent}/{major} or /study/study-options/{fac}/courses/{parent}/{spec}).
#     BFS discovers these only by VISITING the parent course page.  With 80-page budget,
#     BFS was wasting ~22 slots on info/research/about pollution pages (entry-requirements,
#     semester-dates, career-advisors, research/*, international/* etc.) before it could
#     visit parent course pages.  Fixes:
#       1. Block patterns added for all observed pollution pages → frees ~22 BFS slots.
#       2. All 22 parent-course pages that have grandchild specialisations pre-seeded,
#          so BFS visits them with highest priority and enqueues grandchildren.
#       3. bfs_page_budget raised to 120 (14 faculty + 22 parent + 84 headroom).

discovery:
  # 37 verified seeds plus three slots for genuinely useful cross-links.
  # Do not restore the old 120-page budget: each page now requires rendering.
  bfs_page_budget: 40
  discovery_phase_timeout_s: 600
  scrape_do_skip_fallbacks: true
  scrape_do_render: true
  skip_sitemap_fallback: true
  skip_browser_discovery: true
  use_wayback: false

  # seed_urls[0]    = BFS start URL (the catalogue hub, not the marketing
  #                   homepage; this bypasses an unreliable auto-redirect)
  # seed_urls[1:13] = 14 faculty listing pages (all return HTTP 200; verified 2026-06-28)
  # seed_urls[14:]  = 22 parent course pages that have specialisation grandchildren.
  #                   Pre-seeding these guarantees BFS visits them to discover the
  #                   grandchild URLs before budget is exhausted.
  seed_urls:
    # ── BFS start + faculty listing pages ────────────────────────────────────
    - "https://www.aut.ac.nz/study/study-options"
    - "https://www.aut.ac.nz/study/study-options/health-sciences"
    - "https://www.aut.ac.nz/study/study-options/business"
    - "https://www.aut.ac.nz/study/study-options/engineering-computer-and-mathematical-sciences"
    - "https://www.aut.ac.nz/study/study-options/art-and-design"
    - "https://www.aut.ac.nz/study/study-options/architecture-and-built-environment"
    - "https://www.aut.ac.nz/study/study-options/communication-studies"
    - "https://www.aut.ac.nz/study/study-options/creative-technologies"
    - "https://www.aut.ac.nz/study/study-options/education"
    - "https://www.aut.ac.nz/study/study-options/hospitality-tourism-and-events"
    - "https://www.aut.ac.nz/study/study-options/law"
    - "https://www.aut.ac.nz/study/study-options/maori-and-indigenous-development"
    - "https://www.aut.ac.nz/study/study-options/science"
    - "https://www.aut.ac.nz/study/study-options/social-sciences-and-public-policy"
    - "https://www.aut.ac.nz/study/study-options/sport-and-recreation"
    # ── Parent course pages with specialisation grandchildren ─────────────────
    # /courses/* parents
    - "https://www.aut.ac.nz/courses/bachelor-of-arts"
    - "https://www.aut.ac.nz/courses/bachelor-of-arts-honours"
    - "https://www.aut.ac.nz/courses/bachelor-of-design-te-tohu-paetahi-mo-te-hoahoa"
    - "https://www.aut.ac.nz/courses/bachelor-of-engineering-honours"
    - "https://www.aut.ac.nz/courses/bachelor-of-science"
    - "https://www.aut.ac.nz/courses/master-of-arts"
    # /study/study-options/*/courses/* parents
    - "https://www.aut.ac.nz/study/study-options/architecture-and-built-environment/courses/bachelor-of-construction"
    - "https://www.aut.ac.nz/study/study-options/art-and-design/courses/bachelor-of-visual-arts"
    - "https://www.aut.ac.nz/study/study-options/business/courses/bachelor-of-business"
    - "https://www.aut.ac.nz/study/study-options/business/courses/bachelor-of-business-honours"
    - "https://www.aut.ac.nz/study/study-options/business/courses/master-of-business"
    - "https://www.aut.ac.nz/study/study-options/communication-studies/courses/bachelor-of-communication-studies"
    - "https://www.aut.ac.nz/study/study-options/education/courses/bachelor-of-education"
    - "https://www.aut.ac.nz/study/study-options/engineering-computer-and-mathematical-sciences/courses/bachelor-of-computer-and-information-sciences"
    - "https://www.aut.ac.nz/study/study-options/engineering-computer-and-mathematical-sciences/courses/bachelor-of-engineering-technology"
    - "https://www.aut.ac.nz/study/study-options/health-sciences/courses/bachelor-of-health-science"
    - "https://www.aut.ac.nz/study/study-options/health-sciences/courses/master-of-health-practice"
    - "https://www.aut.ac.nz/study/study-options/health-sciences/courses/master-of-health-science"
    - "https://www.aut.ac.nz/study/study-options/health-sciences/courses/postgraduate-certificate-in-health-science"
    - "https://www.aut.ac.nz/study/study-options/health-sciences/courses/postgraduate-diploma-in-health-science"
    - "https://www.aut.ac.nz/study/study-options/hospitality-tourism-and-events/courses/bachelor-of-international-hospitality-management"
    - "https://www.aut.ac.nz/study/study-options/sport-and-recreation/courses/bachelor-of-sport-exercise-and-health"

  # 5 AUT Online courses live on a separate subdomain (online.aut.ac.nz).
  # They cannot be reached by BFS from www.aut.ac.nz, so inject them directly.
  extra_course_urls:
    - "https://online.aut.ac.nz/courses/master-of-business-administration-aut-online"
    - "https://online.aut.ac.nz/courses/master-of-educational-leadership-aut-online"
    - "https://online.aut.ac.nz/courses/postgraduate-certificate-in-business-administration"
    - "https://online.aut.ac.nz/courses/postgraduate-certificate-in-educational-leadership"
    - "https://online.aut.ac.nz/courses/postgraduate-diploma-in-business-administration"

  allow_url_patterns:
    # Require the /courses/ segment — eliminates faculty landing/info pages entirely
    - "/study/study-options/[^/]+/courses/"
    - "/courses/"

  listing_only_patterns:
    # Catalogue hub and faculty pages are traversal-only. This prevents broad
    # degree wording from promoting them to course candidates.
    - '/study/study-options/?$'
    - '/study/study-options/[^/]+/?$'

  block_url_patterns:
    # ── Info / apply / fees pages (non-course, waste BFS budget) ─────────────
    - '/study/entry-requirements'
    - '/study/changing-my-enrolment'
    - '/study/information-for-high-school'
    - '/study/careers-advisors'
    - '/study/parents'
    - '/study/returning-to-study'
    - '/study/semester-dates'
    - '/study/why-study'
    - '/study/applying'
    - '/study/course-search'
    - '/study/fees-and-scholarships'
    - '/study/study-options/compare'       # compare-aut-degrees info page
    - '/study/study-options/workplace-experience'
    - '/study/study-options/degree-builder'
    - '/study/study-options/programme-guides'
    - '/study/study-options/future-career-sheets'
    - '/study/study-options/pathway'
    - '/study/study-options/short-courses'
    - '/study/study-options/language-and-culture'  # domestic-only; 0 intl courses
    - '/international/'
    - '/research/faculty-postgraduate'
    - '/research/academic-departments'
    - '/research/postgraduate-student-support'
    - '/research/postgraduate-study-and-research'
    - '/student-life/'
    - '/about/'
    # ── Previously-blocking patterns (keep) ───────────────────────────────────
    - '/study/qualifications/?$'
    - '/study/qualifications/undergraduate/?$'
    - '/study/qualifications/postgraduate/?$'
    - '/study/qualifications/research/?$'
    - '/int/about/'
    - '/int/research/'
    - '/int/study/apply/'
    - '/int/study/fees'
    - '/int/study/scholarships'
    - '/int/study/key-university'
    - '/int/study/prospectus'
    - '/int/study/why-choose'
    - '/int/study/work-integrated'
    - '/int/study/student-success'
    - '/int/study/options/'
    - '/int/study/papers/'
    - '/int/study/upskilling/'
    - '/int/study/get-started/'
    - '/int/study/subjects/'
    - '/search'
    - '/news'
    - '/events'
    - '\?'
    - '\.pdf$'
    # ── Sub-page pollution within /courses/ paths ─────────────────────────────
    - 'what-you-study'           # /what-you-study and /what-you-study-accordion
    - 'accredited-by'            # accreditation info sub-pages
    - 'info-for-students-who-started-before'  # old-cohort info pages
    - 'welcome-information'      # orientation sub-pages
    - 'frequently-asked-questions'
    - '/videos$'
    # Short courses, continuing-education, non-degree programmes
    - 'short-course'             # *-short-course, short-course-in-*
    - 'refresher-short'          # extra safety for refresher-short-course patterns
    - 'certificate-of-proficiency'
    - 'body-composition-anthropometry'
    - 'fitness-foundations'
    - 'fitness-instructing'
    - 'personal-training$'
    - 'sports-massage'
    - 'barista-beginner'
    - 'te-reo-maori-courses'
    - 'paramedic-assessment-for-registration'
    - '3-lead-ecg'
    - 'pre-hospital-paediatrics'
    - 'prehospital-cardiology'
    - 'Pre-Hospital-Antenatal-Care'
    - 'drug-assisted-airway-management'
    # Specialisation sub-pages (depth-6 forks off a qualification page)
    - 'podiatry-master'
    - 'podiatry-postgraduate'
    - 'podiatry-certificate'
    - 'critical-care-paramedicine'
    - 'extended-care-paramedicine'
    # Personal / gallery pages discovered under /fitness-foundations/
    - 'lisa-hartnett'
    - 'stephanie-mansfield'
    - 'maisci-'

extraction:
  # Direct requests now receive Cloudflare challenge HTML. Static Scrape.do
  # also fails with ROTATION_FAILED, so per-course fetches must render first.
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  skip_browser_rescue: true

  fees:
    default_currency: "NZD"

  text_cleaning:
    duration:
      split_on_slash: true    # Handles 'X year / Y year' composite patterns

  filters:
    domestic_only:
      enabled: true   # Preserve current prod behaviour: filter runs for all unis.
  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
    dedup_use_full_url: true
