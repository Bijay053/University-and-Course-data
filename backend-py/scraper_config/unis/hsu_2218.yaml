discovery:
  # Full course catalogue is published as a WordPress SEO sitemap. Use it
  # directly instead of BFS crawling — avoids missing pages behind
  # pagination/nav and avoids classifier misses on course-detail slugs.
  sitemap_url: https://www.hsu.ac.uk/course-sitemap.xml
  # BFS only reaches courses linked from nav/subject-area pages (~59);
  # the sitemap has the full catalogue (~87). Force the unconditional
  # merge instead of relying on the <15-candidate alt-probe threshold.
  always_sitemap_supplement: true
  allow_url_patterns:
    - ^https://www\.hsu\.ac\.uk/course/[a-z0-9-]+/?$
  force_candidate_url_patterns:
    - ^https://www\.hsu\.ac\.uk/course/[a-z0-9-]+/?$
  course_detail_url_patterns:
    - ^https://www\.hsu\.ac\.uk/course/[a-z0-9-]+/?$
  block_url_patterns:
    - ^https://www\.hsu\.ac\.uk/course/?$

extraction:
  fees:
    default_currency: GBP
  staging:
    # 4 courses were skipped in job_e5c90d6d674f (2026-07-10) as
    # no_international_fee: Pgcert Enhanced Clinical Practice
    # (Apprenticeship), Fdsc Assistant Practitioner – Podiatry [+
    # Apprenticeship], Pgcert First Contact Practice. These are UK
    # apprenticeship/CPD courses aimed at practising healthcare staff —
    # apprenticeships are legally UK-employer-funded and CPD short courses
    # are for existing domestic clinicians, so HSU's site never publishes
    # an international fee for them (Pgcert First Contact Practice only
    # has a domestic fee of £2,775 — DATA QUALITY correctly flagged this as
    # domestic_fee_only_no_international, not a low/incorrect international
    # fee). Rather than silently dropping these real courses, stage them
    # for human review without a fee so an operator can confirm/price them
    # manually instead of the pipeline guessing a number.
    require_international_fee: false
