# Queensland University of Technology — uni_id 1011.
#
# Hostname: www.qut.edu.au  (course catalogue under /courses/<slug>)
#
# Discovery problem (2026-05-15): the live site is fully Cloudflare-walled
# (HTTP 403 for plain BFS), sitemap.xml does not exist, and the /study +
# /courses listing pages are JS-rendered SPA shells whose DOM contains
# zero anchor-based course links.  Playwright-based discovery via the
# homepage nav only finds ~56 courses out of the full ~150-200 catalogue.
#
# Fix: enable the Wayback Machine CDX fallback and let it always run
# (use_wayback=true) — the orchestrator merges its results with whatever
# BFS+browser produced.  must_contain restricts kept URLs to /courses/<slug>
# so non-course archive cruft (/courses/admission/, /courses/adult.jsp, …)
# is filtered out before extraction.
discovery:
  # 2026-07-08 run 2 — postgrad seeds added; budget raised to 420 s
  # ----------------------------------------------------------------
  # Previous problem: all 15 hardcoded seeds were undergrad-only
  # (/study/<faculty>). The browser hit the 180 s budget with 61 nav
  # candidates still in the heap; the crawler was only just reaching
  # /study/postgraduate/business (nav #16) when it stopped. Postgrad
  # sections (Masters, Grad Certs, PG Diplomas) were entirely missed.
  #
  # Fix:
  #   seed_urls — 11 /study/postgraduate/<faculty> pages added as YAML
  #               seeds (run FIRST, +300 priority vs +200 for hardcoded).
  #               URL structure confirmed from nav #16 in the 180 s run:
  #               /study/postgraduate/business/short-courses-and-... →
  #               base is /study/postgraduate/business.  Cloudflare
  #               returns 403 to plain curl on all QUT pages; seeds are
  #               visited by Playwright which handles CF fine (same as
  #               the undergrad seeds that already work).
  #   browser_time_budget_s: 420 — 26 total seeds × ~6 s each ≈ 156 s
  #               seed phase; 264 s BFS headroom for sub-listing pages.
  #               180 s was insufficient even for the undergrad heap.
  #
  # After this run: compare staged count against QUT's published
  # international catalogue (~200+ courses). If still truncating on
  # specific faculties, add sub-faculty seeds or raise budget to 600 s.
  #
  # Separate known issue (NOT fixed here): TOEFL 120 hallucination on
  # QUT diploma rows (Diploma in Health Science etc). TOEFL 120 is the
  # perfect score; a regex is matching something else on the page.
  # Investigate after confirming catalogue coverage is correct.
  use_wayback: false
  browser_time_budget_s: 420
  browser_early_stop_courses: 400
  must_contain:
    - "/courses/"
  always_browser_discover: true
  seed_urls:
    # Postgraduate listing pages — same faculty slugs as undergrad seeds
    # hardcoded in _HOST_EXTRA_SEEDS (browser_discover_generic.py).
    # These run FIRST (higher priority score) so postgrad courses are
    # discovered before the BFS budget is consumed by undergrad nav.
    - https://www.qut.edu.au/study/postgraduate
    - https://www.qut.edu.au/study/postgraduate/business
    - https://www.qut.edu.au/study/postgraduate/creative-industries
    - https://www.qut.edu.au/study/postgraduate/design-and-architecture
    - https://www.qut.edu.au/study/postgraduate/education
    - https://www.qut.edu.au/study/postgraduate/engineering
    - https://www.qut.edu.au/study/postgraduate/health
    - https://www.qut.edu.au/study/postgraduate/information-technology
    - https://www.qut.edu.au/study/postgraduate/justice-and-law
    - https://www.qut.edu.au/study/postgraduate/science-and-mathematics
    - https://www.qut.edu.au/study/postgraduate/social-work-and-human-services
    - https://www.qut.edu.au/study/postgraduate/communication

extraction:
  filters:
    # 2026-05-18 — enabled. QUT course pages render a hard banner on
    # domestic-only courses: "This course is only available for
    # Australian and New Zealand students." (verified live against
    # /courses/graduate-certificate-in-business-public-sector-management).
    # International-eligible pages instead carry a two-icon audience
    # toggle whose default-tab banner reads "You are viewing Australian
    # and New Zealand students' course information." — that phrasing
    # deliberately does NOT match _DOMESTIC_ONLY_RE (the pattern requires
    # "this course is only available for australian|domestic" with the
    # course as the explicit subject, not "you are viewing …").
    #
    # The filter was originally disabled when the YAML was first added
    # (commit 309c2a4) because the bare "available to Australian and New
    # Zealand" phrasing was not yet covered by _DOMESTIC_ONLY_RE; the
    # QUT-specific "only available for australian|domestic" alternative
    # was added in commit 1892941 (replit.md line ~121-131) but the YAML
    # gate was never flipped. Flipping now wires the existing pattern to
    # the QUT pipeline so domestic-only courses (Graduate Certificate in
    # Business (Public Sector Management), Diploma in Architectural
    # Studies/Bachelor of Architectural Design, etc.) skip cleanly
    # instead of staging with the regex Fee pattern's chrome hit (e.g.
    # fee "2027" — a year, not a dollar amount).
    domestic_only:
      enabled: true
