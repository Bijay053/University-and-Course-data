# Anglia Ruskin University
# Discovery: BFS from server-rendered course filter pages + sitemap supplement
#
# Key finding (2026-06-02):
#   https://www.aru.ac.uk/study/course-search?levelofstudy=Undergraduate
#   returns 33+ real course links in static HTML
#   (e.g. /study/undergraduate/accounting-and-finance)
#   No API or browser rendering required.
#
# Speed optimisation (2026-06-02):
#   Previous run: 27m 41s for 140/327 courses (projected ~50 min total)
#   Target: ≤30 min for ~327 courses
#
#   Bottleneck 1 — Discovery: BFS was crawling all multi-filter query-param
#     combinations (?levelofstudy=UG&modeofstudy=Full-time, &location=Cambridge,
#     &startdate=September+2026, etc). These added 1-3 new candidates each but
#     burned most of the 60-page budget. Fix: block any course-search URL that
#     combines levelofstudy= with a second filter param. Sitemap supplement
#     (always_sitemap_supplement: true) covers the courses they found.
#     Budget reduced 60→20 — enough for the two seed pages + BFS from them.
#
#   Bottleneck 2 — Browser settle: domcontentloaded fires almost immediately
#     on ARU's server-rendered pages. The 3000ms settle adds 3s to every
#     browser rescue (≈170 sessions per 327-course run). Reduced to 800ms.
#     Saves: 2.2s × 1.2 sessions/course × 327 = ~860s (~14 min).
#
#   Bottleneck 3 — Parallelism: max_parallel_fetch raised 6→12.
#     ~2× extraction throughput for the HTTP + extraction phase.
#
#   Projected new total: (11.9 - 2.6) / 2 × 327 = ~24 min extraction
#     + ~3 min discovery = ~27 min. Within target.

discovery:
  auto_api_discovery: false

  # ARU's course pages are a React SPA. The regular headless Playwright pool
  # gets 0B rendered because Cloudflare's bot-detection blocks it (same
  # behaviour as Macquarie). Stealth routes each fetch through patchright +
  # Xvfb which bypasses the CF challenge and gets the fully-hydrated HTML.
  # Without this: text_len=0 → no H1 → no degree qualifier → 237 false
  # category_landing_page rejections at the staging gate.
  use_stealth_browser: true

  seed_urls:
    - https://www.aru.ac.uk/study/course-search?levelofstudy=Undergraduate
    - https://www.aru.ac.uk/study/course-search?levelofstudy=Postgraduate

  always_sitemap_supplement: true
  sitemap_url: https://www.aru.ac.uk/sitemap.xml

  bfs_page_budget: 20
  max_candidates: 800
  expected_min_courses: 200

  always_browser_discover: false
  skip_browser_discovery: true
  use_wayback: false

  allow_url_patterns:
    - '/study/undergraduate/'
    - '/study/postgraduate/'

  block_url_patterns:
    # Block the bare search widget (no results without JS)
    - '/study/course-search/?$'
    # ── KEY SPEED FIX: block multi-filter course-search combinations ──────
    # The BFS follows ?levelofstudy=UG&modeofstudy=Full-time, &location=Cambridge,
    # &startdate=September+2026, etc. — each adds only 1-3 new courses while
    # burning BFS budget. Block any course-search URL with a second filter param.
    # The sitemap supplement covers all courses these pages would have found.
    - 'course-search\?.*levelofstudy=.*&'
    # Block non-degree filter combinations
    - 'levelofstudy=(?:CPD|college-course|College\+course|Short\+course|Research|English\+language|Degree\+apprenticeship|Work-based)'
    - 'levelofstudy=college'
    # Block non-degree study mode filters
    - 'modeofstudy=(?:Short\+course|English\+course|Workshop|Degree\+apprenticeship)'
    # ── Research / MPhil / PhD pages: domestic fees only, no intl fee ────
    # These live under /study/postgraduate/*-research and cause 39 false
    # "no_international_fee" staging rejections.  Block them before extraction
    # so they never burn a browser slot.  Pattern matches:
    #   /study/postgraduate/biology-research
    #   /study/postgraduate/art-and-design-research
    #   /study/postgraduate/computer-science-research  etc.
    - '/study/postgraduate/[^/]+-research$'
    # MPhil/PhD pages grouped under /study/postgraduate/*-mphil-phd
    - 'mphil'
    # Professional doctorate pages (DProf, EdD, DBA, MD) — domestic fees only
    - '/study/postgraduate/professional-doctorate'
    - '/study/postgraduate/doctor-of'
    - '/study/postgraduate/doctorate'
    # Block non-course sections
    - '/study/continuing-professional-development'
    - '/study/professional-and-short-courses'
    - '/study/college-courses'
    - '/study/degree-apprenticeships'
    - '/research/postgraduate-research'
    - '/schools-and-colleges'
    - '/study/admissions'
    - '/study/open-day'
    - '/study/starting-at'
    - '/about'
    - '/contact'
    - '/news'
    - '/events'
    - '/staff/'
    - '/student-life/'
    - '/business-employers/'
    - '/linkassets/'
    - '/open-days'
    - '/clearing'
    - '/how-to-apply'
    - '/fees-and-funding'
    - '/accommodation'
    - '/international/'
    - '/subjects/'
    - '/search'
    - '\.pdf$'

extraction:
  # ── KEY SPEED FIX: doubled from 6 → ~2× extraction throughput ────────
  max_parallel_fetch: 12

  skip_browser_rescue: false
  skip_per_course_browser: false

  # ARU has SPLIT rendering: MBA/BEng pages are server-rendered (fees in
  # static HTML, text_len=9000+), but MSc/research pages are React SPAs
  # (static HTML is a shell, text_len=0, fees loaded via API call after DCL).
  # domcontentloaded + 800ms fired before the JS API calls completed →
  # "Fee section detected but fee is blank" on all SPA-course pages.
  # networkidle waits until no pending requests for 500ms, capturing the
  # API-loaded fee values.  Safety settle of 1500ms after networkidle.
  browser_wait_strategy: networkidle
  browser_dcl_settle_ms: 1500

  fees:
    default_currency: GBP
    prefer_international: true
    prefer_annual_over_total: true
    prefer_year_one_over_total: true

    reject_keywords:
      - Home student
      - Home fee
      - Home fees
      - UK student
      - UK fee
      - Domestic
      - England
      - Student Finance England

  english:
    trust_vision_ocr: false
    trust_tier1_vision_ocr_english: false

    default_ielts: 6.0
    default_pte: 60
    default_toefl: 80

  intake:
    start_dates_only: true
    start_dates_window_chars: 700

  filters:
    domestic_only:
      enabled: false

    online_only:
      enabled: false

  text_cleaning:
    global_substring_blocklist:
      - Apply now
      - Book an open day
      - Request information
      - Contact us
      - Download prospectus
      - Chat to us

  course_name:
    strip_title_suffixes:
      - " | ARU"
      - " | Anglia Ruskin University"
      - " - ARU"
      - " - Anglia Ruskin University"

  staging:
    reject_if_missing:
      - course_name
    # ARU/Writtle SPA pages surface course_name from JSON metadata without
    # the degree prefix (e.g. "Nursing (Children)" instead of "BSc (Hons)
    # Nursing (Children)").  URL block_url_patterns already gates non-course
    # pages, so the name-based qualifier check is redundant here.
    skip_degree_qualifier_check: true
    # ARU fees live on JS tabs that the static extractor cannot always reach.
    # Stage fee-missing courses for human review rather than auto-rejecting.
    require_international_fee: false
