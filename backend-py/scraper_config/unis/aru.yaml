# Anglia Ruskin University
# Temporary Discovery YAML
# Purpose:
# Stop browser wandering into CPD, short courses, cookie APIs and category pages
# until the real ARU course API is identified.

discovery:
  auto_api_discovery: false

  seed_urls:
    - https://www.aru.ac.uk/study/course-search

  always_sitemap_supplement: true
  sitemap_url: https://www.aru.ac.uk/sitemap.xml

  bfs_page_budget: 250
  max_candidates: 1500
  expected_min_courses: 300

  always_browser_discover: false
  skip_browser_discovery: true
  use_wayback: false

  allow_url_patterns:
    - '/study/undergraduate/'
    - '/study/postgraduate/'
    - '/courses/'
    - '/course/'
    - '/study/course-search'

  block_url_patterns:
    - '/study/course-search/?$'
    - '/study/continuing-professional-development'
    - '/study/professional-and-short-courses'
    - '/study/college-courses'
    - '/study/degree-apprenticeships'
    - '/research/postgraduate-research'
    - '/schools-and-colleges'
    - '/about'
    - '/contact'
    - '/news'
    - '/events'
    - '/staff/'
    - '/student-life/'
    - '/business-employers/'
    - '/linkassets/'
    - '/open-days'
    - '/clearing'
    - '/how-to-apply'
    - '/fees-and-funding'
    - '/accommodation'
    - '/international/'
    - '/subjects/'
    - '/search'
    - '\?'
    - '\.pdf$'

extraction:
  max_parallel_fetch: 6

  skip_browser_rescue: false
  skip_per_course_browser: false

  browser_wait_strategy: domcontentloaded
  browser_dcl_settle_ms: 3000

  fees:
    default_currency: GBP
    prefer_international: true
    prefer_annual_over_total: true
    prefer_year_one_over_total: true

    reject_keywords:
      - Home student
      - UK student
      - Domestic
      - England
      - Student Finance England

  english:
    trust_vision_ocr: false
    trust_tier1_vision_ocr_english: false

    default_ielts: 6.0
    default_pte: 60
    default_toefl: 80

  intake:
    start_dates_only: true
    start_dates_window_chars: 700

  filters:
    domestic_only:
      enabled: false

    online_only:
      enabled: false

  text_cleaning:
    global_substring_blocklist:
      - Apply now
      - Book an open day
      - Request information
      - Contact us
      - Download prospectus
      - Chat to us

  course_name:
    strip_title_suffixes:
      - " | ARU"
      - " | Anglia Ruskin University"
      - " - ARU"
      - " - Anglia Ruskin University"

  staging:
    reject_if_missing:
      - course_name