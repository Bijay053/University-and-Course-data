# Sydney Metropolitan Institute of Technology
# Hostname: sydneymet.edu.au
# Country: Australia  |  Currency: AUD
# Slug: sydneymet
#
# ── Site architecture ─────────────────────────────────────────────────────────
#
# Headless WordPress backend + Vite/React SPA frontend (dev mode).
# Nginx routes all paths to Vite except:
#   /           → WordPress SSR (homepage has ALL course links in nav)
#   /wp-json/   → WordPress REST API root
#
# The WP REST API for page content is locked to authenticated users.
# Scrape.do / Playwright returns navigation-only shells for course pages.
#
# ── Discovery strategy ────────────────────────────────────────────────────────
#
# The WordPress-rendered homepage (https://sydneymet.edu.au/) contains all 15
# course links in the navigation.  bfs_page_budget: 1 fetches the homepage,
# and force_candidate_url_patterns marks root-level course URLs as candidates.
#
# seed_urls pins all 15 course URLs as a backup so none are missed if the
# nav link structure changes.
#
# ── Course inventory (15 courses) ─────────────────────────────────────────────
#
#   Social Work & Development (SWD):
#     /master-of-social-work-q/         → Master of Social Work (Qualifying)
#     /master-of-social-work/           → Master of Social Work
#     /graduate-diploma-in-human-and-community-services/
#     /graduate-certificate-in-human-and-community-services/
#     /bachelor-of-social-work/
#
#   Information Technology & Engineering (ITE):
#     /master-of-information-technology/
#     /graduate-diploma-in-information-technology/
#     /graduate-certificate-in-information-technology/
#     /bachelor-of-information-technology/
#     /undergraduate-certificate-in-information-technology-ucit/
#
#   Business Management & Entrepreneurship (BME):
#     /master-of-business-administration/
#     /graduate-diploma-in-business-administration/
#     /graduate-certificate-in-business-administration/
#     /bachelor-of-business/
#     /undergraduate-certificate-in-business-ucb/

discovery:
  bfs_page_budget: 1
  use_wayback: false
  allow_url_patterns:
    - /(master|bachelor|graduate|undergraduate)-[^/]+/?$
  seed_urls:
    - https://sydneymet.edu.au/master-of-social-work-q/
    - https://sydneymet.edu.au/master-of-social-work/
    - https://sydneymet.edu.au/graduate-diploma-in-human-and-community-services/
    - https://sydneymet.edu.au/graduate-certificate-in-human-and-community-services/
    - https://sydneymet.edu.au/bachelor-of-social-work/
    - https://sydneymet.edu.au/master-of-information-technology/
    - https://sydneymet.edu.au/graduate-diploma-in-information-technology/
    - https://sydneymet.edu.au/graduate-certificate-in-information-technology/
    - https://sydneymet.edu.au/bachelor-of-information-technology/
    - https://sydneymet.edu.au/undergraduate-certificate-in-information-technology-ucit/
    - https://sydneymet.edu.au/master-of-business-administration/
    - https://sydneymet.edu.au/graduate-diploma-in-business-administration/
    - https://sydneymet.edu.au/graduate-certificate-in-business-administration/
    - https://sydneymet.edu.au/bachelor-of-business/
    - https://sydneymet.edu.au/undergraduate-certificate-in-business-ucb/
  force_candidate_url_patterns:
    - /(master|bachelor|graduate|undergraduate)-[^/]+/?$
  block_url_patterns:
    - /graduate-attributes
    - /sydney-met-graduate-research-school
    - /courses-all
    - /student-course-guide

extraction:
  fees:
    default_currency: AUD
  course_name:
    prefer_title_over_h1: true
    strip_title_suffixes:
      - " – Sydney Metropolitan Institute of Technology"
      - " | Sydney Metropolitan Institute of Technology"
      - " – Sydney Met"
      - " | Sydney Met"
  staging:
    skip_degree_qualifier_check: true
    require_international_fee: false
    reject_if_missing:
      - course_name
