# Holmesglen Institute
# Hostname: www.holmesglen.edu.au
# Country: Australia  |  Currency: AUD
# uni_id: 2305
#
# ── Site architecture ─────────────────────────────────────────────────────────
#
# AEM (Adobe Experience Manager) site. Listing pages are fully JS-rendered
# (no static course links). Course links are discovered via a private API:
#
#   POST https://www.holmesglen.edu.au/bin/searchResults
#   Body: {"q":"","isGlobalSearch":true,"isInternational":true,"searchFilter":"Courses",
#          "theme":"holmesglen","pageNo":1,"limit":100,"sortBy":"ascending"}
#   Response: {"Courses": "<json-encoded array>", "totalCount": 39, ...}
#   Each item has "pagePath" and "pageTitle".
#
# International course pages all have an "-int" URL suffix and live at depth 4-5
# under /explore-courses/.
#
# ── Discovery strategy ───────────────────────────────────────────────────────
#
# All 39 known international course URLs are pinned as seed_urls.
# force_candidate_url_patterns marks /explore-courses/**-int paths as candidates
# so BFS doesn't discard them as non-course pages.
# allow_url_patterns limits traversal to the same shape.
#
# ── Full course inventory (39 international courses, from API 2026-07-31) ───

discovery:
  # 39 course seeds + 2 listing pages = 41 queue entries; budget must exceed that
  bfs_page_budget: 50
  use_wayback: false

  seed_urls:
