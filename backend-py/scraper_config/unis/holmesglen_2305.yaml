    - https://www.holmesglen.edu.au/explore-courses/english-education-and-teacher-training/english-courses/others/pathway-english-int

  # Only the -int suffixed course detail pages are course candidates.
  # All /explore-courses/ intermediate pages (category/subcategory hubs) are listing-only.
  force_candidate_url_patterns:
    - "/explore-courses/[^/]+/[^/]+/[^/]+/[^/]+-int$"

  allow_url_patterns:
    - "/explore-courses/[^/]+/[^/]+/[^/]+/[^/]+-int$"

  block_url_patterns:
    - "/search"
    - "/about-us"
    - "/get-career-help"
    - "/get-business-support"
    - "/current-students"
    - "/study-with-us"
    - "/forms"
    - "/news"
    - "/events"
    - "/authorisation"
    - "/wp-content"
    - "/wp-json"
    - "my\\.holmesglen"
    - "\\.css"
    - "\\.js"
    - "\\.pdf"
    - "sitemap"

  listing_only_patterns:
    - "^/explore-courses/?$"
    - "/explore-courses/[^/]+/?$"
    - "/explore-courses/[^/]+/[^/]+/?$"
    - "/explore-courses/[^/]+/[^/]+/[^/]+/?$"

extraction:
  fees:
    default_currency: AUD

  # AEM page H1 contains sibling <span> elements for CRICOS code and course code:
  #   <h1>
  #     <span class="cmp-teaser__courseTitle">Bachelor of Nursing</span>
  #     <span class="cmp-teaser__courseDesc-item">CRICOS 103159J</span>
  #     <span class="cmp-teaser__courseDesc-item">Course Code BNURS20</span>
  #   </h1>
  # Without a selector, get_text() returns the full junk string. This pinpoints
  # only the course title span.
  course_name:
    h1_css_selector: ".cmp-teaser__courseTitle"
  filters:
    domestic_only:
      enabled: false
  staging:
    skip_degree_qualifier_check: true
    require_international_fee: false
