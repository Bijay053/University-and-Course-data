# INTI International University
# Host-scoped so the same validated recipe loads across database environments.
hostname_guard: "newinti.edu.my"

discovery:
  # The static finder contains every programme link on one page. Do not spend
  # the BFS budget crawling individual programme pages and their shared nav.
  seed_urls:
    - "https://newinti.edu.my/find-a-programme/"
  bfs_page_budget: 1

  allow_url_patterns:
    - "/programme/"

  force_candidate_url_patterns:
    - "^/programme/(?!micro-credential/?$)[^/?#]+/?$"

  course_detail_url_patterns:
    - "^https?://newinti\\.edu\\.my/programme/(?!micro-credential/?$)[^/?#]+/?$"

  listing_only_patterns:
    - "^https?://newinti\\.edu\\.my/find-a-programme/?$"

  block_url_patterns:
    # Category listing pages — crawl for links but never extract as courses.
    - "/academic-programmes/$"
    - "/academic-programmes/postgraduate-studies"
    - "/academic-programmes/undergraduate"
    - "/academic-programmes/postgraduate"
    - "/academic-programmes/.*/(masters|doctorate|foundation|certificate|diploma|degrees|postgraduate-studies|postgraduate|bachelor)/?$"
    - "/undergraduate/bachelor-degrees"
    - "/undergraduate/diploma"
    - "/undergraduate/foundation"
    - "/undergraduate/certificate"
    - "/programme/micro-credential/?$"
    - "/english-language"
    - "/inti-english"
    - "/american-university"
    - "/student-life"
    - "/about"
    - "/news"
    - "/events"
    - "/contact"
    - "/admission"
    - "/scholarship"
    - "/campus"

  use_wayback: false

extraction:
  study_mode:
    # The site's shared fee tables and navigation contain "Campus" and
    # "Online Learning"; neither is authoritative for an individual course.
    suppress_nav_rule: true

  fees:
    default_currency: MYR
    currency_override: MYR
    # INTI publishes total-programme fees. Preserve the source amount and label
    # it as a full-course total; never divide it by duration.
    fee_term: Full Course
    fee_calculation_mode: use_source_value_only
    fee_prevent_full_course_rollup: false

  campus_allowlist:
    - Nilai
    - Subang
    - Penang
    - Sabah
    - INTI International University
    - INTI International College
    - Online
    - Distance Learning