# James Cook University
# Hostname: www.jcu.edu.au

discovery:
  always_browser_discover: true
  use_stealth_browser: true
  use_wayback: true

  seed_urls:
    - https://www.jcu.edu.au/courses

  allow_url_patterns:
    - '/courses/(?:bachelor|master|graduate|doctor|diploma|certificate|associate|honours|juris)[^/]*$'

  block_url_patterns:
    - '/linkassets/'
    - '/courses/study/'
    - '/courses/undergraduate$'
    - '/courses/postgraduate$'
    - '/courses/research$'
    - '/news'
    - '/events'
    - '/staff/'
    - '/about'
    - '/contact'

  browser_early_stop_courses: 160
  bfs_page_budget: 0
  max_candidates: 180

extraction:
  # JCU's "International" tab is JS-driven — appending ?international=true
  # to a static HTTP request triggers Cloudflare bot detection and returns a
  # challenge page (no course content), so static URL rewrites cannot be used.
  # skip_browser_rescue is true to avoid cascading 101 browser sessions; the
  # browser actions below are available for future targeted use (e.g. repair
  # passes or manual single-course re-scrapes that allow browser mode).
  skip_browser_rescue: true
  max_parallel_fetch: 8

  # Browser actions: click the "International" tab on the Fast Facts panel.
  # Runs only during the browser rescue pass (when static HTML fetch missed fee).
  actions:
    - click_text: "International"
    - wait_for:
        text: "International"

  filters:
    domestic_only:
      enabled: false

    online_only:
      enabled: false

  fees:
    default_currency: "AUD"
    prefer_international: true
    prefer_annual_over_total: true

    reject_keywords:
      - "Commonwealth Supported"
      - "CSP"
      - "HECS"
      - "HECS-HELP"
      - "Domestic students"
      - "Domestic fee"
      - "estimated annual Commonwealth Supported Fee"

    follow_links:
      - "fees and scholarships"
      - "international student fees"
      - "international postgraduate research fees"
      - "fees for your course"
      - "view fees"
      - "view international fees"
      - "fee schedule"

    force_central_fee_stage: true

  english:
    central_page: https://www.jcu.edu.au/policy/academic-governance/student-experience/admissions-policy-schedule-ii

    default_ielts: 6.5
    default_pte: 58
    default_toefl: 79

  intake:
    rolling_enrollment_label: "Rolling"

  text_cleaning:
    global_substring_blocklist:
      - "Saved"
      - "Apply"
      - "Chat"

  staging:
    reject_if_missing:
      - course_name