# James Cook University
# Hostname: www.jcu.edu.au
#
# JCU is Cloudflare-protected. BFS discovery is slow but works — the site
# returns HTML for browser-mode requests and has a stable /courses listing.
# 104 extractable courses found via BFS in the 2026-05-30 scrape.
#
# DISABLED API BLOCK — DO NOT RE-ENABLE without finding JCU's actual endpoint
# ──────────────────────────────────────────────────────────────────────────────
# The URL that was here (searchcloud-1-eu-west-2.searchstax.com/29847/qmu-1736)
# is Queen Margaret University's SearchStax core, NOT JCU's.  It was copy-pasted
# in error and always returns 0 results.  The correct JCU SearchStax endpoint is
# not yet known.  To find it: open browser DevTools → Network tab → visit
# https://www.jcu.edu.au/courses → filter XHR by "searchstax" or "searchcloud" →
# copy the full request URL and token, then update this block and set enabled: true.

discovery:
  # ── YAML-driven API-first discovery ──────────────────────────────────────
  # DISABLED: URL is wrong (see comments above). BFS fallback handles discovery.
  # Re-enable once the correct JCU SearchStax endpoint is identified.
  generic_search_api:
    enabled: false
    method: GET
    url: "REPLACE_WITH_JCU_SEARCHSTAX_URL"
    # How to find the correct URL:
    #   1. Open https://www.jcu.edu.au/courses in a browser
    #   2. Open DevTools → Network → filter by "searchstax" or "searchcloud"
    #   3. Copy the full request URL (e.g. https://searchcloud-X.searchstax.com/NNNNN/jcu-NNNN/emselect)
    #   4. Copy the Authorization header token
    #   5. Replace url and authorization below, set enabled: true
    headers:
      authorization: "Token REPLACE_WITH_JCU_TOKEN"
    params:
      q: "*"
      rows: "250"
    root_path: "response.docs"
    url_fields:
      - url
      - course_url
      - page_url
      - link
      - path
    title_fields:
      - title
      - name
      - course_name
    allow_url_patterns:
      - '^https://www\.jcu\.edu\.au/courses/[a-z0-9-]+/?$'
      - '^/courses/[a-z0-9-]+/?$'
    block_url_patterns:
      - '/linkassets/'
      - '/courses/study/'
      - '/news'
      - '/events'
      - '/staff/'
      - '/about'
      - '/contact'
    normalize_relative_urls: true
    base_url: "https://www.jcu.edu.au"

  # ── BFS / browser fallback (when API returns 0 links) ────────────────────
  # scrape_do_skip_fallbacks: true — JCU's Cloudflare now blocks plain
  # httpx and curl_cffi on all fetches (BFS listing page + sitemap probes).
  # Without this, every sitemap probe hangs for the full _PROBE_TIMEOUT_S
  # (100s) before giving up, and 3 probes × 100s = 300s → discovery deadline.
  # Confirmed broken: job_c8f93129006c (2026-07-08) "ERROR: fetch failed for
  # https://www.jcu.edu.au/courses" + "Discovery phase exceeded 300s deadline".
  # Previously (2026-05-30 job, 104 courses) cffi worked; no longer.
  scrape_do_skip_fallbacks: true
  # scrape_do_render: true — Scrape.do STATIC now ALWAYS fails on JCU with
  # 502 ROTATION_FAILED ("cannot connect target url" — proxy-level connect
  # refusal, retrying static never helps).  Verified live 2026-07-09
  # (job_a127d35039d1): static → 502 after ~58s; render=true → 200, 354KB,
  # title "Courses - JCU Australia".  Going straight to headless render
  # keeps the seed prefetch inside its 95s timeout.
  scrape_do_render: true
  always_browser_discover: false
  use_stealth_browser: true
  use_wayback: false
  # 125 courses found on page 1 alone (job_50d1b89fa01b, job_16c76d0e5565).
  # With scrape_do_skip_fallbacks each Scrape.do page takes ~20-25s.
  # Pages 2+ add 0 new candidates and may trigger the Scrape.do→httpx fallback
  # hang. Budget=1: fetch seed URL only, stop. ~20s discovery vs 100s+ with 5.
  bfs_page_budget: 1
  browser_early_stop_courses: 180
  max_candidates: 220

  seed_urls:
    - https://www.jcu.edu.au/courses

  allow_url_patterns:
    - '^https://www\.jcu\.edu\.au/courses/[a-z0-9-]+/?$'
    - '^/courses/[a-z0-9-]+/?$'

  block_url_patterns:
    - '/linkassets/'
    # Category/filter pages — match the allow_url_patterns regex but add 0 new candidates.
    # Without blocking, BFS visits them via Scrape.do (~25s each) wasting time.
    # Fixed missing trailing slash: '/courses/study/' didn't match '/courses/study'.
    - '/courses/study'
    - '/courses/online'
    - '/courses/research'
    - '/courses/undergraduate'
    - '/courses/postgraduate'
    - '/courses/search'
    - '/courses/pathways'
    - '/news'
    - '/events'
    - '/staff/'
    - '/about'
    - '/contact'


extraction:
  skip_browser_rescue: true   # Cloudflare Enterprise blocks Playwright too; rescue wastes 30 s/course
  # Course pages: direct httpx/cffi now 403 (CF challenge, verified 2026-07-09)
  # and Scrape.do static 502s with ROTATION_FAILED — headless render through
  # the residential browser pool is the only working transport (same fix as
  # kingston_2193.yaml / cardiff_2194.yaml).
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  # Render calls are slower than static; 4 concurrent keeps throughput
  # reasonable without overwhelming the residential proxy pool.
  max_parallel_fetch: 4

  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false

  fees:
    default_currency: "AUD"
    prefer_international: true
    prefer_annual_over_total: true
    # Appends ?international to each course URL so the international fee tab is active
    fee_url_suffix: "?international"
    force_central_fee_stage: true
    reject_keywords:
      - "Commonwealth Supported"
      - "CSP"
      - "HECS"
      - "HECS-HELP"
      - "Domestic students"
      - "Domestic fee"
      - "estimated annual Commonwealth Supported Fee"
    follow_links:
      - "fees and scholarships"
      - "international student fees"
      - "international postgraduate research fees"
      - "fees for your course"
      - "view fees"
      - "view international fees"
      - "fee schedule"

  english:
    central_page: "https://www.jcu.edu.au/policy/academic-governance/student-experience/admissions-policy-schedule-ii"
    band_reference_url: "https://www.jcu.edu.au/policy/academic-governance/student-experience/admissions-policy-schedule-ii"
    # Prefer the English band stated on the individual course page over the
    # central-page default (courses vary from Band P to Band 3c). (2026-05-01)
    course_english_priority: true
    default_ielts: 6.5
    default_pte: 58
    default_toefl: 86
    # band_mapping: detect band name on course page → look up IELTS/PTE/TOEFL/CAE scores.
    # Key = band label as it appears verbatim on course pages.
    # Valid BandSpec fields: ielts_overall, ielts_each, pte_overall, toefl_overall,
    #   cambridge_overall, duolingo_overall.
    band_mapping:
      "Band P":
        ielts_overall: 5.5
        ielts_each: 5.0
        pte_overall: 46
        toefl_overall: 56
        cambridge_overall: 162
      "Band 1":
        ielts_overall: 6.0
        ielts_each: 6.0
        pte_overall: 52
        toefl_overall: 74
        cambridge_overall: 169
      "Band 2":
        ielts_overall: 6.5
        ielts_each: 6.5
        pte_overall: 58
        toefl_overall: 86
        cambridge_overall: 176
      "Band 3a":
        ielts_overall: 7.0
        ielts_each: 6.5
        pte_overall: 65
        toefl_overall: 94
        cambridge_overall: 185
      "Band 3b":
        ielts_overall: 7.0
        ielts_each: 6.5
        pte_overall: 65
        toefl_overall: 94
        cambridge_overall: 185
      "Band 3c":
        ielts_overall: 7.0
        ielts_each: 7.0
        pte_overall: 65
        toefl_overall: 94
        cambridge_overall: 185

  intake:
    rolling_enrollment_label: "Rolling"

  text_cleaning:
    global_substring_blocklist:
      - "Saved"
      - "Apply"
      - "Chat"

  staging:
    reject_if_missing:
      - course_name
