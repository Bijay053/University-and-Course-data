# James Cook University
# Hostname: www.jcu.edu.au
#
# JCU is a JS-heavy SPA. BFS/browser discovery is unreliable — the site
# is Cloudflare-protected and returns empty HTML for datacenter IPs.
# We query the SearchStax Solr core used by the site's own search widget.
# API discovery runs before BFS (orchestrator YAML-API tier).
#
# WARNING: The endpoint URL below contains a SearchStax core identifier
# captured from JCU's network requests. Verify it is still correct and
# that the token in headers is the current active token. Do NOT commit
# the literal token to VCS — replace with an env-var reference when
# rotating. (2026-05-01)

discovery:
  # ── YAML-driven API-first discovery ──────────────────────────────────────
  # Queries JCU's SearchStax Solr core before any BFS/browser attempt.
  # Set enabled: false to fall back to browser discovery for debugging.
  generic_search_api:
    enabled: true
    method: GET
    url: "https://searchcloud-1-eu-west-2.searchstax.com/29847/qmu-1736/emselect"
    headers:
      authorization: "Token bc0d2578c3f22cca23fdb327f7490ddb56098759"
    params:
      q: "*"
      spellcheck.correct: "true"
      hl.fragsize: "200"
      model: "coursefinder-ug"
      language: "en"
      rows: "250"
    root_path: "response.docs"
    url_fields:
      - url
      - course_url
      - page_url
      - link
      - path
    title_fields:
      - title
      - name
      - course_name
    allow_url_patterns:
      - '^https://www\.jcu\.edu\.au/courses/[a-z0-9-]+/?$'
      - '^/courses/[a-z0-9-]+/?$'
    block_url_patterns:
      - '/linkassets/'
      - '/courses/study/'
      - '/news'
      - '/events'
      - '/staff/'
      - '/about'
      - '/contact'
    normalize_relative_urls: true
    base_url: "https://www.jcu.edu.au"

  # ── BFS / browser fallback (when API returns 0 links) ────────────────────
  always_browser_discover: false
  use_stealth_browser: true
  use_wayback: false
  bfs_page_budget: null
  browser_early_stop_courses: 180
  max_candidates: 220

  seed_urls:
    - https://www.jcu.edu.au/courses

  allow_url_patterns:
    - '^https://www\.jcu\.edu\.au/courses/[a-z0-9-]+/?$'
    - '^/courses/[a-z0-9-]+/?$'

  block_url_patterns:
    - '/linkassets/'
    - '/courses/study/'
    - '/news'
    - '/events'
    - '/staff/'
    - '/about'
    - '/contact'


extraction:
  skip_browser_rescue: true   # Cloudflare Enterprise blocks Playwright too; rescue wastes 30 s/course
  max_parallel_fetch: 8

  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false

  fees:
    default_currency: "AUD"
    prefer_international: true
    prefer_annual_over_total: true
    # Appends ?international to each course URL so the international fee tab is active
    fee_url_suffix: "?international"
    force_central_fee_stage: true
    reject_keywords:
      - "Commonwealth Supported"
      - "CSP"
      - "HECS"
      - "HECS-HELP"
      - "Domestic students"
      - "Domestic fee"
      - "estimated annual Commonwealth Supported Fee"
    follow_links:
      - "fees and scholarships"
      - "international student fees"
      - "international postgraduate research fees"
      - "fees for your course"
      - "view fees"
      - "view international fees"
      - "fee schedule"

  english:
    central_page: "https://www.jcu.edu.au/policy/academic-governance/student-experience/admissions-policy-schedule-ii"
    band_reference_url: "https://www.jcu.edu.au/policy/academic-governance/student-experience/admissions-policy-schedule-ii"
    # Prefer the English band stated on the individual course page over the
    # central-page default (courses vary from Band P to Band 3c). (2026-05-01)
    course_english_priority: true
    default_ielts: 6.5
    default_pte: 58
    default_toefl: 86
    # band_mapping: detect band name on course page → look up IELTS/PTE/TOEFL/CAE scores.
    # Key = band label as it appears verbatim on course pages.
    # Valid BandSpec fields: ielts_overall, ielts_each, pte_overall, toefl_overall,
    #   cambridge_overall, duolingo_overall.
    band_mapping:
      "Band P":
        ielts_overall: 5.5
        ielts_each: 5.0
        pte_overall: 46
        toefl_overall: 56
        cambridge_overall: 162
      "Band 1":
        ielts_overall: 6.0
        ielts_each: 6.0
        pte_overall: 52
        toefl_overall: 74
        cambridge_overall: 169
      "Band 2":
        ielts_overall: 6.5
        ielts_each: 6.0
        pte_overall: 58
        toefl_overall: 86
        cambridge_overall: 176
      "Band 3a":
        ielts_overall: 7.0
        ielts_each: 6.5
        pte_overall: 65
        toefl_overall: 94
        cambridge_overall: 185
      "Band 3b":
        ielts_overall: 7.0
        ielts_each: 6.5
        pte_overall: 65
        toefl_overall: 94
        cambridge_overall: 185
      "Band 3c":
        ielts_overall: 7.0
        ielts_each: 7.0
        pte_overall: 65
        toefl_overall: 94
        cambridge_overall: 185

  intake:
    rolling_enrollment_label: "Rolling"

  text_cleaning:
    global_substring_blocklist:
      - "Saved"
      - "Apply"
      - "Chat"

  staging:
    reject_if_missing:
      - course_name
