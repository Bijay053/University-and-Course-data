# James Cook University
# Hostname: www.jcu.edu.au

discovery:
  always_browser_discover: true
  use_stealth_browser: true
  # Wayback CDX for jcu.edu.au hits the 10,000-URL cap and returns 0 useful course
  # URLs every time — pure overhead of 5+ minutes per run. Browser discovers ~109
  # links directly from the seed URL, so Wayback adds nothing here.
  use_wayback: false

  seed_urls:
    - https://www.jcu.edu.au/courses

  allow_url_patterns:
    - '/courses/(?:bachelor|master|graduate|doctor|diploma|certificate|associate|honours|juris)[^/]*$'

  block_url_patterns:
    - '/linkassets/'
    - '/courses/study/'
    - '/courses/undergraduate$'
    - '/courses/postgraduate$'
    - '/courses/research$'
    - '/news'
    - '/events'
    - '/staff/'
    - '/about'
    - '/contact'

  browser_early_stop_courses: 160
  bfs_page_budget: 0
  max_candidates: 180

extraction:
  # JCU's "International" tab is JS-driven — appending ?international=true
  # to a static HTTP request triggers Cloudflare bot detection and returns a
  # challenge page (no course content), so static URL rewrites cannot be used.
  # skip_browser_rescue is true to avoid cascading 101 browser sessions; the
  # browser actions below are available for future targeted use (e.g. repair
  # passes or manual single-course re-scrapes that allow browser mode).
  skip_browser_rescue: true
  max_parallel_fetch: 8

  # Browser actions: click the "International" tab on the Fast Facts panel.
  # Runs only during the browser rescue pass (when static HTML fetch missed fee).
  actions:
    - click_text: "International"
    - wait_for:
        text: "International"

  filters:
    domestic_only:
      enabled: false

    online_only:
      enabled: false

  fees:
    default_currency: "AUD"
    prefer_international: true
    prefer_annual_over_total: true
    # JCU international fees are only on the ?international variant of each
    # course page (e.g. /courses/bachelor-of-science?international). The
    # valueless query flag cannot be expressed in url_rewrites.append_query
    # so we use fee_url_suffix instead.  Cloudflare blocks ?international=true
    # (static HTTP) but ?international (no value) renders the JS-free tab.
    fee_url_suffix: "?international"

    reject_keywords:
      - "Commonwealth Supported"
      - "CSP"
      - "HECS"
      - "HECS-HELP"
      - "Domestic students"
      - "Domestic fee"
      - "estimated annual Commonwealth Supported Fee"

    follow_links:
      - "fees and scholarships"
      - "international student fees"
      - "international postgraduate research fees"
      - "fees for your course"
      - "view fees"
      - "view international fees"
      - "fee schedule"

    force_central_fee_stage: true

  english:
    central_page: https://www.jcu.edu.au/policy/academic-governance/student-experience/admissions-policy-schedule-ii
    # Individual JCU course pages carry per-course IELTS bands (e.g. 6.0, 6.5,
    # 7.0) that differ from the institution-wide default (5.5 on the central
    # policy page). Setting course_english_priority prevents the cached central
    # value from silently overwriting per-course values already extracted from
    # the ?international page.
    course_english_priority: true
    default_ielts: 6.5
    default_pte: 58
    default_toefl: 79

    # Band → score lookup from JCU Admissions Policy Schedule II.
    # Each course page says "Band 2" or "Band 3a" in Entry Requirements.
    # The band_mapping code overrides any central_page-derived value with the
    # correct per-course band score (more specific than the institution default).
    # Source: https://www.jcu.edu.au/policy/academic-governance/student-experience/admissions-policy-schedule-ii
    band_reference_url: https://www.jcu.edu.au/policy/academic-governance/student-experience/admissions-policy-schedule-ii
    band_mapping:
      # Band P: Foundation-level English (e.g. some pathway, foundation courses)
      Band P:
        ielts_overall: 5.5
        ielts_each: 5.0
        pte_overall: 46
        toefl_overall: 56
      # Band 1: General undergraduate entry
      Band 1:
        ielts_overall: 6.0
        ielts_each: 6.0
        pte_overall: 50
        toefl_overall: 74
      # Band 2: Standard undergraduate / most postgraduate programs
      Band 2:
        ielts_overall: 6.5
        ielts_each: 6.0
        pte_overall: 58
        toefl_overall: 86
      # Band 3a: Higher-requirement programs (e.g. Medicine, Psychology, Law)
      Band 3a:
        ielts_overall: 7.0
        ielts_each: 6.5
        pte_overall: 65
        toefl_overall: 94
      # Band 3b: Same overall as 3a but 7.0 required in 3 components (6.5 in 1)
      Band 3b:
        ielts_overall: 7.0
        ielts_each: 6.5
        pte_overall: 65
        toefl_overall: 94
      # Band 3c: Strictest — no IELTS component below 7.0
      Band 3c:
        ielts_overall: 7.0
        ielts_each: 7.0
        pte_overall: 65
        toefl_overall: 94

  intake:
    rolling_enrollment_label: "Rolling"

  text_cleaning:
    global_substring_blocklist:
      - "Saved"
      - "Apply"
      - "Chat"

  staging:
    reject_if_missing:
      - course_name