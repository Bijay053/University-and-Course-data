# James Cook University
# Hostname: www.jcu.edu.au

discovery:
  always_browser_discover: false
  use_stealth_browser: true
  use_wayback: false

  seed_urls:
    - https://www.jcu.edu.au/courses

  # BFS is skipped for this JS-heavy site. Setting to null to use default if ever reconsidered.
  bfs_page_budget: null
  browser_early_stop_courses: 180
  max_candidates: 220

  generic_search_api:
    enabled: true
    priority: first
    method: GET
    url: "https://searchcloud-1-eu-west-2.searchstax.com/29847/qmu-1736/emselect"
    headers:
      authorization: "Token bc0d2578c3f22cca23fdb327f7490ddb56098759"
    params:
      q: "*"
      spellcheck.correct: "true"
      hl.fragsize: "200"
      model: "coursefinder-ug"
      language: "en"
      rows: "250"

    root_path: "response.docs"

    url_fields:
      - url
      - course_url
      - page_url
      - link
      - path

    title_fields:
      - title
      - name
      - course_name

    allow_url_patterns:
      - '^https://www\.jcu\.edu\.au/courses/[a-z0-9-]+/?$'
      - '^/courses/[a-z0-9-]+/?$'

    block_url_patterns:
      - '/linkassets/'
      # Removed specific listing pages from block_url_patterns to allow browser discovery to traverse them.
      # They are navigation pages leading to course pages, not actual course pages themselves.
      # - '/courses/undergraduate$'
      # - '/courses/postgraduate$'
      # - '/courses/research$'
      - '/courses/study/'
      - '/news'
      - '/events'
      - '/staff/'
      - '/about'
      - '/contact'

    normalize_relative_urls: true
    base_url: "https://www.jcu.edu.au"

  allow_url_patterns:
    - '^https://www\.jcu\.edu\.au/courses/[a-z0-9-]+/?$'
    - '^/courses/[a-z0-9-]+/?$'

  block_url_patterns:
    - '/linkassets/'
    # Removed specific listing pages from block_url_patterns to allow browser discovery to traverse them.
    # They are navigation pages leading to course pages, not actual course pages themselves.
    # - '/courses/undergraduate$'
    # - '/courses/postgraduate$'
    # - '/courses/research$'
    - '/courses/study/'
    - '/news'
    - '/events'
    - '/staff/'
    - '/about'
    - '/contact'

extraction:
  skip_browser_rescue: true
  max_parallel_fetch: 8

  url_rewrites:
    append_query:
      - "international"

  filters:
    domestic_only:
      enabled: false

    online_only:
      enabled: false

  fees:
    default_currency: "AUD"
    prefer_international: true
    prefer_annual_over_total: true
    fee_url_suffix: "?international"
    force_central_fee_stage: true

    reject_keywords:
      - "Commonwealth Supported"
      - "CSP"
      - "HECS"
      - "HECS-HELP"
      - "Domestic students"
      - "Domestic fee"
      - "estimated annual Commonwealth Supported Fee"

    follow_links:
      - "fees and scholarships"
      - "international student fees"
      - "international postgraduate research fees"
      - "fees for your course"
      - "view fees"
      - "view international fees"
      - "fee schedule"

  english:
    enabled: true
    central_page: https://www.jcu.edu.au/policy/academic-governance/student-experience/admissions-policy-schedule-ii
    band_reference_url: https://www.jcu.edu.au/policy/academic-governance/student-experience/admissions-policy-schedule-ii

    course_english_priority: true
    prefer_course_band: true
    band_overrides_default: true
    band_overrides_generic_ielts: true
    do_not_use_central_default_when_band_found: true
    extract_band_from_course_page: true

    default_band: "Band 2"
    default_ielts: 6.5
    default_pte: 58
    default_toefl: 86
    default_cae: 176

    band_detection:
      enabled: true
      patterns:
        - '(?i)\bBand\s*P\b'
        - '(?i)\bBand\s*1\b'
        - '(?i)\bBand\s*2\b'
        - '(?i)\bBand\s*3a\b'
        - '(?i)\bBand\s*3b\b'
        - '(?i)\bBand\s*3c\b'
        - '(?i)English\s+Language\s+Band\s*(P|1|2|3a|3b|3c)'
        - '(?i)English\s+Band\s*(P|1|2|3a|3b|3c)'

    band_mapping:
      "Band P":
        ielts_overall: 5.5
        ielts_each: 5.0
        pte_overall: 46
        toefl_overall: 56
        cae_overall: 162

      "Band 1":
        ielts_overall: 6.0
        ielts_each: 6.0
        pte_overall: 52
        toefl_overall: 74
        cae_overall: 169

      "Band 2":
        ielts_overall: 6.5
        ielts_each: 6.0
        pte_overall: 58
        toefl_overall: 86
        cae_overall: 176

      "Band 3a":
        ielts_overall: 7.0
        ielts_each: 6.5
        pte_overall: 65
        toefl_overall: 94
        cae_overall: 185

      "Band 3b":
        ielts_overall: 7.0
        ielts_each: 6.5
        ielts_note: "7.0 in three components and 6.5 in one component"
        pte_overall: 65
        toefl_overall: 94
        cae_overall: 185

      "Band 3c":
        ielts_overall: 7.0
        ielts_each: 7.0
        pte_overall: 65
        toefl_overall: 94
        cae_overall: 185

  intake:
    rolling_enrollment_label: "Rolling"

  text_cleaning:
    global_substring_blocklist:
      - "Saved"
      - "Apply"
      - "Chat"

  staging:
    reject_if_missing:
      - course_name