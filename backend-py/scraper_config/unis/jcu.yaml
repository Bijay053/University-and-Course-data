# James Cook University
# Hostname: www.jcu.edu.au

discovery:
  always_browser_discover: true
  use_stealth_browser: true
  use_wayback: false

  seed_urls:
    - https://www.jcu.edu.au/courses

  allow_url_patterns:
    - '/courses/(?:bachelor|master|graduate|doctor|diploma|certificate|associate|honours|juris)[^/]*$'

  block_url_patterns:
    - '/linkassets/'
    - '/courses/study/'
    - '/courses/undergraduate$'
    - '/courses/postgraduate$'
    - '/courses/research$'
    - '/news'
    - '/events'
    - '/staff/'
    - '/about'
    - '/contact'

  browser_early_stop_courses: 160
  bfs_page_budget: 0
  max_candidates: 180

extraction:
  skip_browser_rescue: true
  max_parallel_fetch: 8

  actions:
    - click_text: "International"
    - wait_for:
        text: "International"

  filters:
    domestic_only:
      enabled: false

    online_only:
      enabled: false

  fees:
    default_currency: "AUD"
    prefer_international: true
    prefer_annual_over_total: true
    fee_url_suffix: "?international"
    force_central_fee_stage: true

    reject_keywords:
      - "Commonwealth Supported"
      - "CSP"
      - "HECS"
      - "HECS-HELP"
      - "Domestic students"
      - "Domestic fee"
      - "estimated annual Commonwealth Supported Fee"

    follow_links:
      - "fees and scholarships"
      - "international student fees"
      - "international postgraduate research fees"
      - "fees for your course"
      - "view fees"
      - "view international fees"
      - "fee schedule"

  english:
    central_page: https://www.jcu.edu.au/policy/academic-governance/student-experience/admissions-policy-schedule-ii
    band_reference_url: https://www.jcu.edu.au/policy/academic-governance/student-experience/admissions-policy-schedule-ii

    course_english_priority: true
    prefer_course_band: true
    band_overrides_default: true
    band_overrides_generic_ielts: true
    do_not_use_central_default_when_band_found: true
    extract_band_from_course_page: true

    default_band: "Band 2"
    default_ielts: 6.5
    default_pte: 58
    default_toefl: 86
    default_cae: 176

    band_detection:
      enabled: true
      source_priority:
        - course_page
        - international_page
        - entry_requirements
        - english_language_requirements
        - central_page

      patterns:
        - '(?i)\bBand\s*P\b'
        - '(?i)\bBand\s*1\b'
        - '(?i)\bBand\s*2\b'
        - '(?i)\bBand\s*3a\b'
        - '(?i)\bBand\s*3b\b'
        - '(?i)\bBand\s*3c\b'
        - '(?i)English\s+Language\s+Band\s*P'
        - '(?i)English\s+Language\s+Band\s*1'
        - '(?i)English\s+Language\s+Band\s*2'
        - '(?i)English\s+Language\s+Band\s*3a'
        - '(?i)English\s+Language\s+Band\s*3b'
        - '(?i)English\s+Language\s+Band\s*3c'
        - '(?i)English\s+Band\s*P'
        - '(?i)English\s+Band\s*1'
        - '(?i)English\s+Band\s*2'
        - '(?i)English\s+Band\s*3a'
        - '(?i)English\s+Band\s*3b'
        - '(?i)English\s+Band\s*3c'

      normalize:
        'band p': "Band P"
        'bandp': "Band P"
        'english language band p': "Band P"
        'english band p': "Band P"

        'band 1': "Band 1"
        'band1': "Band 1"
        'english language band 1': "Band 1"
        'english band 1': "Band 1"

        'band 2': "Band 2"
        'band2': "Band 2"
        'english language band 2': "Band 2"
        'english band 2': "Band 2"

        'band 3a': "Band 3a"
        'band3a': "Band 3a"
        'english language band 3a': "Band 3a"
        'english band 3a': "Band 3a"

        'band 3b': "Band 3b"
        'band3b': "Band 3b"
        'english language band 3b': "Band 3b"
        'english band 3b': "Band 3b"

        'band 3c': "Band 3c"
        'band3c': "Band 3c"
        'english language band 3c': "Band 3c"
        'english band 3c': "Band 3c"

    band_mapping:
      "Band P":
        ielts_overall: 5.5
        ielts_each: 5.0
        pte_overall: 46
        pte_each: 42
        toefl_overall: 56
        toefl_each: 16
        cae_overall: 162
        cae_each: 154

      "Band 1":
        ielts_overall: 6.0
        ielts_each: 6.0
        pte_overall: 52
        pte_each: 52
        toefl_overall: 74
        toefl_each: 18
        cae_overall: 169
        cae_each: 169

      "Band 2":
        ielts_overall: 6.5
        ielts_each: 6.0
        pte_overall: 58
        pte_each: 54
        toefl_overall: 86
        toefl_each: 21
        cae_overall: 176
        cae_each: 169

      "Band 3a":
        ielts_overall: 7.0
        ielts_each: 6.5
        pte_overall: 65
        pte_each: 58
        toefl_overall: 94
        toefl_each: 23
        cae_overall: 185
        cae_each: 176

      "Band 3b":
        ielts_overall: 7.0
        ielts_each: 6.5
        ielts_note: "7.0 in three components and 6.5 in one component"
        pte_overall: 65
        pte_each: 58
        pte_note: "65 in three components and 58 in one component"
        toefl_overall: 94
        toefl_note: "23 Speaking, 24 Listening, 24 Reading, 27 Writing"
        cae_overall: 185
        cae_each: 176

      "Band 3c":
        ielts_overall: 7.0
        ielts_each: 7.0
        pte_overall: 65
        pte_each: 65
        toefl_overall: 94
        toefl_note: "23 Speaking, 24 Listening, 24 Reading, 27 Writing"
        cae_overall: 185
        cae_each: 185

  intake:
    rolling_enrollment_label: "Rolling"

  text_cleaning:
    global_substring_blocklist:
      - "Saved"
      - "Apply"
      - "Chat"

  staging:
    reject_if_missing:
      - course_name