# University of Western Australia
# Hostname: www.uwa.edu.au
#
# Bug history / rationale:
#   - First scrape (uni 1091): 19 found, 0 staged. Two failures:
#     1. Discovery harvested /study/ nav pages instead of /study/courses/<name>.
#     2. Real courses extracted fine but rejected no_international_fee —
#        UWA publishes fees via a per-credit-point CALCULATOR, not a flat number.
discovery:
  always_sitemap_supplement: true
  fallback_subdomains:
    - handbook.{domain}
  # Keep ONLY real course-detail pages. Drops CELT pages, discover-uwa,
  # HDR pages, etc. — anything not under /study/courses/.
  must_contain:
    - "/study/courses/"
  block_url_patterns:
    - /study/discover-uwa
    - /study/explore-courses/higher-degree-by-research
    - /study/explore-courses/postgraduate/employer-assistance
    - /study/login
    - /facilities/
extraction:
  fees:
    default_currency: "AUD"
    # UWA fees are per-credit-point via calculator — no flat per-course figure
    # exists on the page. Force every UWA course to be treated as having a
    # central fee page, so the no_international_fee gate passes them into the
    # review queue (international_fee=None) instead of rejecting them.
    force_central_fee_stage: true
  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: true