# Manchester Metropolitan University
# Hostname: www.mmu.ac.uk  |  Country: UK  |  Currency: GBP
# uni_id: 40 (dev)  /  2167 (prod)
#
# Discovery strategy (2026-06-16):
#   MMU uses Swiftype for course search. The public engine key is embedded in
#   the course-search page JS. We query Swiftype directly — no Cloudflare
#   exposure, no browser, no BFS. 393 courses with structured metadata +
#   full body text (fees, IELTS, entry requirements).

discovery:
  swiftype:
    engine_key: "yxx_JtAeyygPkQNS-jYj"
    type_filter: course
    per_page: 100
    city: Manchester
    currency: GBP
    fee_year: "2025"
extraction:
  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false