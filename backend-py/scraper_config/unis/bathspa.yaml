# Bath Spa University
# Hostname: www.bathspa.ac.uk
# Country: United Kingdom | Currency: GBP
#
# Discovery design:
#   Real course discovery pages sit under /student-life/ (a globally-blocked
#   campus_page path).  allow_blocked_listing_patterns overrides the global
#   guard and crawls those pages for course links WITHOUT adding them to the
#   candidate set for extraction.  course_detail_url_patterns then acts as
#   the final extraction gate so only genuine /courses/(ug|pg|...)- URLs are
#   extracted.  This separates "pages we need to crawl" from "pages we want
#   to extract" — which allow_url_patterns conflates.
discovery:
  auto_api_discovery: false
  seed_urls:
  - https://www.bathspa.ac.uk/courses/course-index-a-z/
  - https://www.bathspa.ac.uk/student-life/undergraduate-study/
  - https://www.bathspa.ac.uk/student-life/postgraduate-study/
  always_sitemap_supplement: true
  sitemap_url: https://www.bathspa.ac.uk/sitemap.xml
  bfs_page_budget: 160
  max_candidates: 1200
  expected_min_courses: 180
  allow_blocked_listing_patterns:
  - /student-life/undergraduate-study
  - /student-life/postgraduate-study
  listing_only_patterns:
  - /courses/course-index-a-z
  - /courses/interest-areas/
  - /courses/types-of-courses/
  - /courses/new-courses/
  - /courses/short-courses/
  - /courses/community-learning/
  - /courses/course-documents/
  - \?
  course_detail_url_patterns:
  - ^https://www\.bathspa\.ac\.uk/courses/(ug|pg|ify|phd|edd|pgce)-[a-z0-9-]+/?$
  allow_url_patterns:
  - ^https://www\.bathspa\.ac\.uk/courses/(ug|pg|ify|phd|edd|pgce)-[a-z0-9-]+/?$
  block_url_patterns:
  - ^https://www\.bathspa\.ac\.uk/courses/?$
  - ^https://www\.bathspa\.ac\.uk/courses/course-index-a-z/?$
  - /courses/types-of-courses/
  - /courses/new-courses/
  - /courses/interest-areas/
  - /courses/course-documents/
  - /courses/short-courses/
  - /courses/community-learning/
  - /schools/
  - /news/
  - /events/
  - /open-days/
  - /how-to-apply/
  - /research/
  - /staff/
  - /contact/
  - /accommodation/
  - /fees-and-funding/
  - /scholarships/
  - \.pdf$
  always_browser_discover: true
  skip_browser_discovery: true
  use_wayback: false
extraction:
  max_parallel_fetch: 8
  skip_browser_rescue: false
  skip_per_course_browser: false
  fees:
    central_page: https://www.bathspa.ac.uk/students/student-finance/tuition-fees/international-fees/
    default_currency: GBP
    prefer_international: true
    prefer_annual_over_total: true
    prefer_year_one_over_total: true
    reject_keywords:
    - Home student
    - Home fee
    - UK student
    - UK fee
    - Domestic
    - Student Finance England
    - UK fees
    international_fee_keywords:
    - International
    - International student
    - International fee
    - Overseas student
    - Overseas fee
  study_mode:
    online_only_requires_strong_evidence: true
    prefer_location_over_online_keyword: true
    ignore_online_keywords_in:
    - navigation
    - footer
    - apply online
    - online application
  english:
    trust_vision_ocr: false
    trust_tier1_vision_ocr_english: false
  intake:
    start_dates_only: true
    use_default_when_missing: true
    default_source_note: Bath Spa default intake (September)
    default_by_level:
      undergraduate:
      - September
      postgraduate:
      - September
  filters:
    domestic_only:
      enabled: false
      international_markers:
      - International students
      - International fee
      - international applicants
      - overseas students
      domestic_markers:
      - UK students only
      - Home students only
      - Domestic only
    online_only:
      enabled: true
      keep_if_location_present: true
      reject_if_mode_is_exactly:
      - Online
      - Distance learning
  course_name:
    prefer_title_over_h1: true
    strip_title_suffixes:
    - ' | Bath Spa University'
    - ' - Bath Spa University'
  staging:
    reject_if_missing:
    - course_name
    require_international_fee: false
    skip_degree_qualifier_check: true
    reject_slug_name_with_no_data: true
  default_course_location: Bath
  prefer_blended_over_on_campus: true
_min_expected_courses: 180
