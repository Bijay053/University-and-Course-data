# Birmingham City University (BCU)
# Hostname: www.bcu.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Slug: bcu
#
# ── ARCHITECTURE (verified live) ──────────────────────────────────────────────
# Server-rendered HTML CMS (.NET / Optimizely). Course links are in static HTML.
# Catalogue: 386 courses behind a faceted server-paginated search at /courses/search.
#   perpage capped at 20 server-side  → 20 result pages (?page=1..20).
#   type = level (1 Foundation, 2 UG, 3 PG-Taught, 5 PG-Research, 8 Short/CPD, 9 Appr.)
# Course detail URL (canonical): /courses/<slug>-YYYY-YY  e.g. /courses/computer-science-bsc-hons-2026-27
#   Duplicate alternate paths also exist (/conservatoire/courses/..., /business-school/courses/...)
#   that resolve to the SAME courses and produce garbled slug-titled duplicates.
# NOTE: the ?International=true view is NOT seedable — the server rewrites it to
#   ?International=true&JanStart=true&mode=1&intake=2025-26 (a January-only subset).
#   So discovery uses the plain all-courses pages; international fees are resolved
#   at extraction via fee keywords (below), not by changing the listing view.
#
# ── EVOLUTION OF THE FIX (run-by-run evidence) ────────────────────────────────
# Run 1: BFS seeded at ?type=2 burned its budget on facet permutations → ~10 real
#        courses found; broken filters then dropped everything → Staged 0.
# Run 2 (this config's target): discovery+extraction WORK (136 fetched, fees/IELTS/
#        duration mostly PASS 100/100) but staging rejected 119/127 as
#        category_landing_page, leaving 8. Verified: the rejected pages (e.g.
#        computer-science-bsc-hons-2026-27) are clean SINGLE-course pages, so the
#        rejection is a false positive that tracks discovery SOURCE — only
#        BFS-crawled detail pages survived; the 238 sitemap-supplemented candidates
#        were the ones rejected.
#
# ── FIXES ─────────────────────────────────────────────────────────────────────
#  (A) DISCOVERY — make every course a BFS-crawled detail page and remove the
#      sitemap supplement that injected the mis-classified candidates:
#        • seed all 20 pages of the unfiltered all-courses search
#        • always_sitemap_supplement: false   (sitemap is news/about only; it was
#          the source of the 119 category_landing_page staging rejections)
#        • course_detail_url_patterns pins the canonical /courses/<slug>-YYYY-YY
#          shape — excludes /conservatoire/courses/ & /business-school/courses/
#          duplicates and asserts these URLs as genuine course-detail pages.
#  (B) EXTRACTION — fix the now-observed fee defect: the regex was grabbing BCU's
#      UK/home fee (~£9,790 / £10,050) instead of the international fee (~£17–19k),
#      tripping 89 "annual_fee_too_low" + several "possible_domestic_fee" flags.
#      Pattern-6 reject_keywords + international_fee_keywords steer to the intl fee.
#  (C) Drop apprenticeship pages — by nature employer-funded & UK-only, they carry
#      no international fee or IELTS (every apprenticeship in run 2 failed both).

discovery:

  # All 386 courses, 20 per page (perpage is ignored by the server).
  seed_urls:
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=1
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=2
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=3
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=4
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=5
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=6
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=7
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=8
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=9
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=10
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=11
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=12
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=13
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=14
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=15
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=16
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=17
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=18
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=19
    - https://www.bcu.ac.uk/courses/search?perpage=20&page=20

  bfs_page_budget: 30        # 20 seed listing pages + headroom
  max_candidates: 600        # > 386 course-detail links

  # ROOT CAUSE of the 119 category_landing_page staging rejections: the flat
  # site-wide sitemap (news/about pages) was supplemented in and its candidates
  # were staged as category_landing_page. The seeds above are authoritative.
  always_sitemap_supplement: false

  # Canonical single-course shape only. Excludes /courses/search, /choices,
  # /prospectus, /short-courses, nav/news, AND the faculty-prefixed duplicate
  # paths (/conservatoire/courses/..., /business-school/courses/...).
  allow_url_patterns:
    - '^https://www\.bcu\.ac\.uk/courses/[a-z0-9-]+-20\d{2}-\d{2}$'

  # Final extraction gate — asserts these URLs ARE course-detail pages.
  course_detail_url_patterns:
    - '^https://www\.bcu\.ac\.uk/courses/[a-z0-9-]+-20\d{2}-\d{2}$'

  # Apprenticeships are employer-funded / UK-only — no international fee or IELTS.
  block_url_patterns:
    - 'apprenticeship'

# ── EXTRACTION ────────────────────────────────────────────────────────────────
extraction:
  fees:
    default_currency: GBP
    # Correct central fee page (scraper auto-mis-detected the accommodation page).
    central_page: "https://www.bcu.ac.uk/international/fees-costs-and-scholarships/international-fees"

    # BCU course pages list BOTH a UK/home fee (~£9,790/£10,050) and an
    # international fee (~£17–19k). Run 2 captured the home figure on ~89 courses.
    # Discard the home rows; keep the international one.
    reject_keywords:
      - "Home student"
      - "Home fee"
      - "UK student"
      - "UK fee"
      - "Home/EU"
      - "Domestic"
    international_fee_keywords:
      - "International student"
      - "International fee"
      - "International"
      - "Overseas"