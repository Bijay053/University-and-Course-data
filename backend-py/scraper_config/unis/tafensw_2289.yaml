# TAFE NSW
# Hostname: www.tafensw.edu.au
# Country: Australia  |  Currency: AUD
# uni_id: 2289 (dev)
#
# ── Discovery strategy ───────────────────────────────────────────────────────
#
# Seed page: https://www.tafensw.edu.au/international/course-search?keyword=
#
# The course search page is a Nuxt SPA.  Even with full JS rendering (Scrape.do
# render=true / Playwright), the page only shows 6 navigation-tab links in HTML
# — individual course cards are loaded 100% client-side after tab clicks.
# BFS and render_listing_pages therefore find 0 course URLs from this page.
#
# The tafensw_api provider calls the internal Elasticsearch endpoint directly:
#   GET /api/international/course/search?from=0&size=500&query_string=
# This is the same endpoint the Nuxt SPA queries after each tab click.
# It returns all 153 international courses in a single response, and expands
# coursePackage arrays (mirroring the Nuxt bundle's URL builder functions):
#
#   h(title, courseCode) → /international/courses/<slug>--<CODE>  (97 entries)
#   p(title, pkgId)      → /international/package/<slug>--<ID>    (63 entries)
#
# Total: 160 URL candidates → ~158 valid after 2 non-existent t2t bundles.
# Deduplication at staging produces the ~153 unique international courses.
#
# IMPORTANT: The CASCADE auto-probe writes auto_config.discovery.allow_url_patterns
# = ["/courses/.+"] which drops all 63 /package/ URLs and reduces the count to 97.
# The patterns below (YAML priority > auto_config) override that probe output.
# admin_config.discovery.allow_url_patterns is also set identically in the DB
# as the highest-priority override layer.
discovery:
  tafensw_api:
    base_url: https://www.tafensw.edu.au
  use_wayback: false
  allow_url_patterns:
  - /international/courses/[^/]+/?$
  - /international/package/[^/]+/?$

extraction:
  fees:
    default_currency: AUD
  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
