# TAFE NSW
# Hostname: www.tafensw.edu.au
# Country: Australia  |  Currency: AUD
# uni_id: 2289 (dev)
#
# ── Discovery strategy ───────────────────────────────────────────────────────
#
# The international course search page (https://www.tafensw.edu.au/international/
# course-search?keyword=) is a Nuxt SPA.  Scrape.do render of the initial DOM
# only captures category navigation tabs ("Certificate to Advanced Diploma",
# "English courses" etc.) — never individual course cards.  Course cards are
# loaded asynchronously via an internal Elasticsearch API after tab interaction.
#
# The tafensw_api provider calls that internal API directly:
#   GET /api/international/course/search?from=0&size=500&query_string=
# It expands coursePackage arrays (mirroring the Nuxt composable in BhP9Tq1G.js)
# and builds /international/courses/<slug>--<id> URLs for all ~153 international
# courses.  Normal per-course HTML extraction then runs on each detail page.
#
# This honours the user requirement: seed = international/course-search,
# result = exactly the ~153 international courses, no domestic leakage.
discovery:
  tafensw_api:
    base_url: https://www.tafensw.edu.au
  use_wayback: false
  allow_url_patterns:
  - /international/courses/[^/]+/?$
  - /international/package/[^/]+/?$
  block_url_patterns:
  - /apply
  - /contact
  - /news
  - /events
  - /blog
  - /about
  - /research
  - /alumni
  - /outreach
  - /parents
  - /jobs
  - /careers
  - /accommodation
  - /life-on-campus
  - /fees-and-funding$
  - /international/living
extraction:
  fees:
    default_currency: AUD
