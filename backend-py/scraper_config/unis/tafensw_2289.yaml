# TAFE NSW
# Hostname: www.tafensw.edu.au
# Country: Australia  |  Currency: AUD
# uni_id: 2289 (dev)
#
# ── Discovery strategy ───────────────────────────────────────────────────────
#
# Problem: https://www.tafensw.edu.au/international/course-search?keyword=
# lists all 153 international courses in a browser, but the SPA lazy-loads
# course cards as the user scrolls — Scrape.do only snapshots the initial
# DOM and captures the first ~22 cards. A second "Load More" click / scroll
# is required for the rest, which Scrape.do render cannot perform.
#
# Fix: use TAFE NSW's XML sitemap as the primary course source.
# The sitemap lists every course-areas detail page (typically 500+).
# The 153 international courses are a subset of those pages; extraction
# filters them later (the user confirmed "filter can happen later").
#
# allow_url_patterns restricts the sitemap URLs to course detail pages only
# (/course-areas/<area>/courses/<slug>) so nav/admin/blog pages are skipped.
#
# The international seed URL is kept as the BFS seed so any courses NOT in
# the sitemap (new additions) can still be found via the rendered search page.
#
# Precedent: same pattern as UTAS Funnelback, UNE Wayback — when the primary
# listing page can't surface all courses, use a secondary bulk source (sitemap
# or API) and rely on allow_url_patterns to scope down to course pages only.

discovery:
  # Sitemap is plain XML — httpx fetches it fine without Scrape.do.
  # The course detail pages are SSR (Next.js) so Scrape.do render=True is
  # needed for the BFS seed page and any BFS-traversed listing pages.
  scrape_do_skip_fallbacks: true
  scrape_do_render: true

  # 10 s waitFor for the React international search SPA on the seed URL.
  scrape_do_wait_for_ms: 10000

  use_wayback: false

  # Sitemap primary source — lists all TAFE NSW course pages.
  # Combined with allow_url_patterns this yields all /course-areas/ pages.
  sitemap_url: "https://www.tafensw.edu.au/sitemap.xml"

  # Force sitemap to run even when BFS already found candidates from the seed.
  always_sitemap_supplement: true

  # 1 seed + 10 buffer for any BFS traversal from the rendered search page.
  bfs_page_budget: 12

  seed_urls:
    - "https://www.tafensw.edu.au/international/course-search?keyword="

  # Mark the international search page as listing-only: BFS extracts links
  # from it but does not add it to the course candidate set.
  listing_only_patterns:
    - "/international/course-search"

  # Only accept TAFE NSW course detail pages — /course-areas/<area>/courses/<slug>.
  # This filters out the 5000+ non-course sitemap entries (news, staff, pages).
  allow_url_patterns:
    - "/course-areas/[^/]+/courses/[^/]+"

  # Drop clearly non-course URLs from BFS traversal.
  block_url_patterns:
    - "/about(?:/|$)"
    - "/news(?:/|$)"
    - "/contact(?:/|$)"
    - "/policies(?:/|$)"
    - "/staff(?:/|$)"
    - "/sitemap"
    - "/events(?:/|$)"
    - "/alumni(?:/|$)"
    - "/jobs(?:/|$)"

extraction:
  fees:
    default_currency: AUD
