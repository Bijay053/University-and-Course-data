# Canterbury Christ Church University
# Hostname: www.canterbury.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Slug "canterbury" is shared with University of Canterbury NZ (uni_id=1750).
# This file (canterbury_1759.yaml) shadows the shared slug file and is loaded
# ONLY for uni_id=1759 so the two universities never mix configuration.
#
# NOTE: Do NOT add seed_urls, sitemap_url, or central_page URLs from
# www.canterbury.ac.nz here.  That domain belongs to a different university.

discovery:
  allowed_extra_hostnames: []
  always_sitemap_supplement: true
extraction:
  fees:
    default_currency: GBP
    prefer_international: true
    # Canterbury CC is a React SPA — fee pages yield no static text.
    # These defaults are used when per-course extraction fails to find a fee.
    # Source: official CCCU website / Shiksha 2025/26 data.
    degree_level_defaults:
      undergraduate: 15500
      postgraduate: 15500
      doctorate: 15500

  english:
    # IELTS: 6.0 overall (UG); 6.5 overall (PG).
    # Source: CCCU international admissions page 2025/26.
    degree_level_defaults:
      undergraduate:
        ielts: 6.0
      postgraduate:
        ielts: 6.5
      doctorate:
        ielts: 6.5
    # With degree-level IELTS defaults + fee defaults both pre-filled, there
    # is nothing useful for vision OCR to find — skip the image scan entirely.
    skip_vision_when_core_found: true

  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false

  study_mode:
    # Canterbury CC is a physical campus university.  The bare \bonline\b
    # rule-pass fires on "Apply online" / "Chat online" nav links and tags
    # every course as Online.  Suppress it — Gemini reads the actual content.
    suppress_nav_rule: true

  # Canterbury CC is Cloudflare Enterprise — httpx receives a 200 SPA shell
  # with near-zero visible text (React / Contensis CMS, JS-rendered).
  # scrape_do_render: true lets Scrape.do's headless Chrome return the
  # fully-rendered HTML for pages where it works.
  #
  # skip_ai_when_text_empty: true — when a page still returns text_len=0
  # after the scrape.do fetch (JS hydration failed or rate-limited), we skip
  # Gemini + AI fallback entirely.  This avoids sending empty prompts and
  # wasting API tokens/credits.  The per-course browser (skip_per_course_browser
  # now false) can still attempt a Playwright render as a fallback.
  #
  # skip_per_course_browser was previously true (local Playwright is also
  # IP-blocked by Cloudflare).  Reverting to false so that on pages where
  # scrape.do returns 0-text the browser path can be tried before giving up.
  # Playwright will still fail on CF-Enterprise pages — the cost is just
  # a Playwright timeout (~15 s) rather than a silent zero-result.
  scrape_do_render: true

  # ── Empty-text guard (skip_ai_when_text_empty) ──────────────────────────────
  # Canterbury CC is Cloudflare Enterprise + Contensis React SPA.  The
  # scrape.do static fetch returns a large HTML shell (2–3 MB) but
  # html_to_text() = "" (zero visible text) on many course pages.
  #
  # With skip_ai_when_text_empty: true the pipeline:
  #   1. Detects text_len=0 → skips Gemini+AI fallback immediately.
  #   2. Retries with a real Playwright browser (one attempt).
  #   3a. Browser recovered text → proceeds with browser HTML normally.
  #   3b. Browser also empty → returns fetch_failed_empty_text; the course
  #       is counted as an error, NOT staged with hollow default data.
  #
  # skip_per_course_browser must be false (browser allowed) so step 2 fires.
  # skip_browser_rescue intentionally absent (false default) — the sparse-
  # static rescue can still run if browser gives partial content.
  skip_ai_when_text_empty: true
  skip_per_course_browser: false
  # skip_browser_rescue: true — the sparse-static rescue triggers when
  # international_fee + duration are both blank after Gemini-primary.  On
  # Canterbury CC pages the per-course browser returns filled=[] (Cloudflare
  # also blocks Playwright), so each rescue wastes one Scrape.do JS-render
  # credit (~10 s) for zero benefit.  Fees and IELTS are already covered by
  # degree_level_defaults above, so skipping the rescue loses nothing.
  skip_browser_rescue: true

  course_name:
    strip_title_suffixes:
      - " | Canterbury Christ Church University"
      - " - Canterbury Christ Church University"
      - " | CCCU"
      - " - CCCU"
