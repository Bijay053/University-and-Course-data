# Canterbury Christ Church University
# Hostname: www.canterbury.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Slug "canterbury" is shared with University of Canterbury NZ (uni_id=1750).
# This file (canterbury_1759.yaml) shadows the shared slug file and is loaded
# ONLY for uni_id=1759 so the two universities never mix configuration.
#
# NOTE: Do NOT add seed_urls, sitemap_url, or central_page URLs from
# www.canterbury.ac.nz here.  That domain belongs to a different university.

discovery:
  allowed_extra_hostnames: []
  always_sitemap_supplement: true
extraction:
  fees:
    default_currency: GBP
    prefer_international: true
    # Canterbury CC is a React SPA — fee pages yield no static text.
    # These defaults are used when per-course extraction fails to find a fee.
    # Source: official CCCU website / Shiksha 2025/26 data.
    degree_level_defaults:
      undergraduate: 15500
      postgraduate: 15500
      doctorate: 15500

  english:
    # IELTS: 6.0 overall (UG); 6.5 overall (PG).
    # Source: CCCU international admissions page 2025/26.
    degree_level_defaults:
      undergraduate:
        ielts: 6.0
      postgraduate:
        ielts: 6.5
      doctorate:
        ielts: 6.5

  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false

  study_mode:
    # Canterbury CC is a physical campus university.  The bare \bonline\b
    # rule-pass fires on "Apply online" / "Chat online" nav links and tags
    # every course as Online.  Suppress it — Gemini reads the actual content.
    suppress_nav_rule: true

  # Canterbury CC is Cloudflare Enterprise — httpx receives a 200 SPA shell
  # with near-zero visible text (React / Contensis CMS, JS-rendered).
  # With the Scrape.do token now available, we use scrape_do_render: true
  # to detect the empty shell and retry via Scrape.do's headless Chrome,
  # which returns the fully-rendered HTML including the per-course fee table
  # (e.g. "UK £9,790 | Overseas £17,000").  Local Playwright is still
  # skipped (skip_per_course_browser: true) because it is also IP-blocked.
  scrape_do_render: true
  skip_browser_rescue: true
  skip_per_course_browser: true

  course_name:
    strip_title_suffixes:
      - " | Canterbury Christ Church University"
      - " - Canterbury Christ Church University"
      - " | CCCU"
      - " - CCCU"
