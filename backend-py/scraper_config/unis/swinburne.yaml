# ─────────────────────────────────────────────────────────────────────────────
# SWINBURNE UNIVERSITY OF TECHNOLOGY
# Hostname: www.swinburne.edu.au  |  uni_id: 1747
# Country: Australia  |  Currency: AUD
# ─────────────────────────────────────────────────────────────────────────────
#
# SITE OVERVIEW — URL STRUCTURE CHANGE (detected 2026-07)
# ─────────────────────────────────────────────────────────────────────────────
# Swinburne has completely migrated their course pages to a new URL scheme.
# ALL old /courses/find-a-course/<faculty>/<sub-cat>/<course> URLs return 404.
# The Funnelback search seed (/search?query=...collection=sut|sp-course-search)
# no longer returns course cards even when browser-rendered (just nav links).
#
# NEW URL STRUCTURE:
#   /course/<level>/<course-slug>/
#   /course/<level>/<course-slug>/<specialisation>/   (major/stream variants)
#
#   Examples:
#     https://www.swinburne.edu.au/course/postgraduate/master-of-professional-accounting/
#     https://www.swinburne.edu.au/course/postgraduate/master-of-professional-accounting/finance/
#     https://www.swinburne.edu.au/course/undergraduate/bachelor-of-business/
#
# DISCOVERY APPROACH — sitemap
# ─────────────────────────────────────────────────────────────────────────────
# Swinburne publishes a full course sitemap at /course/sitemap.xml with 746
# URLs across levels:
#   undergraduate:  288
#   postgraduate:   217
#   tafe:           109  (domestic only — excluded via block_url_patterns)
#   short-courses:   65  (excluded)
#   research:        45
#   degree-pathway:  18
#   inbound:          4  (excluded)
#   ─────────────────
#   total:          746  →  ~568 international-relevant after exclusions
#
# Course pages are fully SSR (static HTML, no browser needed):
#   - Fee visible in static HTML: AUD $36,540 confirmed
#   - IELTS visible in static HTML: 6.5 confirmed
#   - No Cloudflare protection
# ─────────────────────────────────────────────────────────────────────────────
discovery:
  sitemap_url: https://www.swinburne.edu.au/course/sitemap.xml
  always_sitemap_supplement: true
  always_browser_discover: false
  allow_url_patterns:
    - '^https://www\.swinburne\.edu\.au/course/(undergraduate|postgraduate|honours|research|degree-pathway)/'
  block_url_patterns:
    - '/course/tafe/'
    - '/course/short-courses/'
    - '/course/inbound/'
    - '/course/online/'
  seed_urls: []
  bfs_page_budget: 1
extraction:
  # Verified against a live 391 KB course page: 29% smaller with exact
  # critical-field parity against the unmodified document.
  html_compaction_enabled: true
  # Collapse Swinburne's large mega-menu, majors navigation and footer link
  # trees to inert text. The compactor preserves text order and refuses the
  # change if any critical value fingerprint differs.
  html_compaction_remove_selectors:
    - '.brand-header__nav > ul'
    - '.course-majors'
    - '.brand-footer .pagelist'
  # Course pages are fully SSR. The old pipeline still launched Playwright
  # and OCR over decorative accreditation/campus images, causing batches to
  # hit the shared 90-second deadline with no additional field coverage.
  skip_browser_rescue: true
  skip_per_course_browser: true
  skip_remote_ai_enrichment: true
  # Twelve simultaneous 300–400 KB AEM pages contend on repeated DOM parsing;
  # tail tasks then cross the 90s wall-clock deadline. Eight keeps the CPU queue
  # bounded while maintaining the same useful throughput without timeout waste.
  max_parallel_fetch: 8
  recovery_sweep_max_items: 0
  recovery_sweep_time_budget_seconds: 0
  # Emergency kill switch: set false if the run alert reports lost speedup or
  # critical-field coverage regression after a Swinburne CMS template change.
  fees:
    default_currency: AUD
  english:
    central_page: https://www.swinburne.edu.au/study/international/apply/entry-requirements/
    trust_vision_ocr: false
    skip_vision_when_core_found: true
  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false
  course_name:
    strip_title_suffixes:
    - ' | Swinburne University of Technology'
    - ' | Swinburne'
