# Swinburne University of Technology — www.swinburne.edu.au
# Custom CMS (JS-rendered course listings under /courses/find-a-course/).
#
# URL structure (3 levels):
#   Level 1 — Faculty hub:    /courses/find-a-course/business
#   Level 2 — Sub-category:   /courses/find-a-course/business/accounting
#   Level 3 — Course detail:  /courses/find-a-course/business/accounting/bachelor-of-accounting-honours
#
# The BFS seeds at level-1 pages, crawls level-2 sub-category pages (which
# are link lists, NOT extractable), and lands on level-3 individual course
# pages for extraction.
#
# allow_url_patterns requires 3 segments after find-a-course so that level-2
# sub-category hub pages (/business/accounting) are NOT extracted as courses.
# Previously the 2-segment pattern matched sub-category hubs and every course
# had 0% field fill because the hub pages contain no individual course data.

discovery:
  always_browser_discover: true
  always_sitemap_supplement: true
  bfs_page_budget: 100

  seed_urls:
    - https://www.swinburne.edu.au/courses/find-a-course/business
    - https://www.swinburne.edu.au/courses/find-a-course/engineering
    - https://www.swinburne.edu.au/courses/find-a-course/health
    - https://www.swinburne.edu.au/courses/find-a-course/information-technology
    - https://www.swinburne.edu.au/courses/find-a-course/law
    - https://www.swinburne.edu.au/courses/find-a-course/arts-humanities-social-sciences
    - https://www.swinburne.edu.au/courses/find-a-course/design
    - https://www.swinburne.edu.au/courses/find-a-course/science-mathematics
    - https://www.swinburne.edu.au/courses/find-a-course/built-environment-architecture
    - https://www.swinburne.edu.au/courses/find-a-course/aviation

  # Require 3 path segments after /find-a-course/ so that level-2 sub-category
  # listing pages are crawled for link discovery but NOT extracted as courses.
  allow_url_patterns:
    - '/courses/find-a-course/[^/]+/[^/]+/[^/]'

  block_url_patterns:
    - /courses/online/
    - /courses/search
    - /courses/planning-your-future/
    - /courses/study-levels-explained/
    - /courses/how-to-apply/
    - /courses/scholarships/

  _min_expected_courses: 50

extraction:
  filters:
    domestic_only:
      enabled: false
