# ─────────────────────────────────────────────────────────────────────────────
# SWINBURNE UNIVERSITY OF TECHNOLOGY
# Hostname: www.swinburne.edu.au  |  uni_id: 1747
# Country: Australia  |  Currency: AUD
# ─────────────────────────────────────────────────────────────────────────────
#
# SITE OVERVIEW — URL STRUCTURE CHANGE (detected 2026-07)
# ─────────────────────────────────────────────────────────────────────────────
# Swinburne has completely migrated their course pages to a new URL scheme.
# ALL old /courses/find-a-course/<faculty>/<sub-cat>/<course> URLs return 404.
# The Funnelback search seed (/search?query=...collection=sut|sp-course-search)
# no longer returns course cards even when browser-rendered (just nav links).
#
# NEW URL STRUCTURE:
#   /course/<level>/<course-slug>/
#   /course/<level>/<course-slug>/<specialisation>/   (major/stream variants)
#
#   Examples:
#     https://www.swinburne.edu.au/course/postgraduate/master-of-professional-accounting/
#     https://www.swinburne.edu.au/course/postgraduate/master-of-professional-accounting/finance/
#     https://www.swinburne.edu.au/course/undergraduate/bachelor-of-business/
#
# DISCOVERY APPROACH — sitemap
# ─────────────────────────────────────────────────────────────────────────────
# Swinburne publishes a full course sitemap at /course/sitemap.xml with 746
# URLs across levels:
#   undergraduate:  288
#   postgraduate:   217
#   tafe:           109  (domestic only — excluded via block_url_patterns)
#   short-courses:   65  (excluded)
#   research:        45
#   degree-pathway:  18
#   inbound:          4  (excluded)
#   ─────────────────
#   total:          746  →  ~568 international-relevant after exclusions
#
# Course pages are fully SSR (static HTML, no browser needed):
#   - Fee visible in static HTML: AUD $36,540 confirmed
#   - IELTS visible in static HTML: 6.5 confirmed
#   - No Cloudflare protection
# ─────────────────────────────────────────────────────────────────────────────

discovery:
  # Use the /course/ sub-sitemap as the primary discovery source.
  # The root sitemap.xml (1291 bytes) has zero /course/ URLs but links to
  # this sub-sitemap which has all 746 course-level URLs.
  sitemap_url: "https://www.swinburne.edu.au/course/sitemap.xml"
  always_sitemap_supplement: true

  # No browser BFS needed — the sitemap gives us all URLs directly.
  # The old browser-based Funnelback discovery is completely broken.
  always_browser_discover: false

  # Include only international-relevant levels.
  # Excludes: tafe (domestic-only), short-courses, inbound.
  allow_url_patterns:
    - '^https://www\.swinburne\.edu\.au/course/(undergraduate|postgraduate|honours|research|degree-pathway)/'

  block_url_patterns:
    - '/course/tafe/'
    - '/course/short-courses/'
    - '/course/inbound/'
    - '/course/online/'

  # No seed_urls needed — sitemap covers everything.
  seed_urls: []

  # Sitemap is not empty any more — it has 746 course URLs.
  # (The root sitemap.xml is still 1291 bytes; the /course/sitemap.xml is 87KB.)
  bfs_page_budget: 1

extraction:
  fees:
    default_currency: AUD

  english:
    central_page: "https://www.swinburne.edu.au/study/international/apply/entry-requirements/"

  filters:
    # Sitemap includes legitimate international courses at all levels.
    domestic_only:
      enabled: false

    # Swinburne offers legitimate online international programmes.
    online_only:
      enabled: false

  course_name:
    strip_title_suffixes:
      - " | Swinburne University of Technology"
      - " | Swinburne"
