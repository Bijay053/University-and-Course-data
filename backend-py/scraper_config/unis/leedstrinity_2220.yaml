# Leeds Trinity University
# Hostname: www.leedstrinity.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Slug: leedstrinity
# Verified recovery from SearchStax access denial: the official sitemap
# supplied 107 detail-shaped candidates with the verified absolute-URL filters
# and the production homepage seed (the earlier unscoped replay returned 111).
# Four course-owned pages passed fresh acceptance checks (10 pages fetched
# across probe and validation). This is not a complete scrape or eligibility
# certification: normal per-course extraction and global staging guards apply.
# Keep the verified transport/source above stale generated/admin SearchStax
# settings; unrelated discovery and extraction settings remain configurable.

hostname_guard: www.leedstrinity.ac.uk
locked_config_paths:
  - discovery.official_catalogue_fallback
  - discovery.sitemap_url
  - discovery.allow_url_patterns
  - discovery.block_url_patterns

discovery:
  official_catalogue_fallback: true
  sitemap_url: https://www.leedstrinity.ac.uk/sitemap.xml
  # Match absolute sitemap URLs, not path-only strings. These are the two
  # course-detail branches confirmed by the bounded official-source replay.
  allow_url_patterns:
    - '^https://www\.leedstrinity\.ac\.uk/courses/(undergraduate|postgraduate)/[^/?#]+/$'
  block_url_patterns:
    - '(?i)/(apprenticeships?|cpd(?:-and-short-courses)?|short-courses?|online)(/|$)'

extraction:
  fees:
    default_currency: GBP
  staging:
    # 2026-07-10: Leeds Trinity course pages use plain subject titles as the
    # H1/course_name (e.g. "Criminology", "Film", "Games Design", "Digital
    # Marketing") with no "BA (Hons)"-style degree-level prefix. The generic
    # should_stage_course() guard's _name_has_degree_qualifier check treats
    # any title lacking a degree word as a category/landing page and rejects
    # it — this was silently dropping 90%+ of real Leeds Trinity courses
    # (127/132 rejected as category_landing_page_missing_degree_qualifier).
    # Official catalogue discovery + block_url_patterns scope links to real
    # course detail pages, so the degree-qualifier name check is redundant
    # and actively harmful here. Same opt-out pattern used for ARU/Writtle.
    skip_degree_qualifier_check: true
