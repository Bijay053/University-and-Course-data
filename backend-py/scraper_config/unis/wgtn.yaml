# Victoria University of Wellington (Te Herenga Waka)
# Hostname: www.wgtn.ac.nz  → slug: wgtn
# Country: New Zealand  |  Currency: NZD  |  uni_id: 61 (prod), 2188 (dev)
#
# ══ DISCOVERY + EXTRACTION: VUW JSON API provider ═══════════════════════════
#
# VUW course pages are a React SPA that returns only:
#   "Victoria University of Wellington Loading ... The application is loading,
#    please wait." (86 bytes of visible text).
# Neither static fetch nor Playwright browser rescue can extract course data.
#
# VUW publishes 4 JSON API endpoints with FULL structured course data:
#
#   Endpoint               Count   Covers
#   pg-programmes          179     Postgraduate taught + research degrees
#   ug-programmes           26     Undergraduate bachelor degrees
#   grad-quals              21     Graduate certificates / diplomas
#   other-quals              5     Non-degree qualifications
#   TOTAL                 ~231
#
# Each item carries: name, url, internationalFeeTotal, internationalFeeTerm,
# durationDescription/duration, keyDateSet (intakes), location,
# internationalLocation, partTimeQual/fullTimeQual, intDistance, description.
#
# vuw_api.py fetches all 4 endpoints in parallel, maps fields directly to
# pre-built staged-course payloads stored under "searchstax_result" in each
# link dict. _extract_only returns them verbatim — zero HTML fetches needed.
#
# ══ IELTS ════════════════════════════════════════════════════════════════════
# VUW's English requirements are not published per-course. Standard minimums:
#   UG: IELTS 6.0 overall (no band below 5.5)
#   PG: IELTS 6.5 overall (no band below 6.0)
# These are applied as YAML defaults — the operator can update per-course.

discovery:
  vuw_api:
    enabled: true
    base_url: "https://www.wgtn.ac.nz"
    currency: NZD

extraction:
  # VUW course pages are a React SPA — the HTML shell contains only a loading
  # spinner. All course data comes from the vuw_api provider (4 JSON endpoints)
  # which pre-builds the complete payload in each link's searchstax_result so
  # _extract_only returns it verbatim without any HTML fetch.
  #
  # browser_wait_strategy is set here as a safety net for:
  #   - repair-mode passes that target individual page URLs
  #   - future changes where per-course HTML may be needed
  #   - any code path that bypasses the searchstax_result short-circuit
  #
  # VUW URLs stored in course_website always carry ?international=true so that
  # operators who click through from the staging-review panel land on the
  # international-student view of the course (fees, IELTS, intakes).
  browser_wait_strategy: networkidle
  browser_dcl_settle_ms: 2500

  fees:
    default_currency: NZD
    prefer_international: true

  english:
    default_ielts: 6.0
    default_pte: 58
    default_toefl: 80

  course_name:
    strip_title_suffixes:
      - " | Victoria University of Wellington - Te Herenga Waka"
      - " | Victoria University of Wellington"
      - " - Victoria University of Wellington"
      - " | Te Herenga Waka"

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
    # dedup_use_full_url: true is intentionally kept — all VUW URLs now carry
    # the ?international=true param uniformly, so full-URL dedup works correctly.
    dedup_use_full_url: true
