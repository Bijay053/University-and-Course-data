# Victoria University of Wellington (Te Herenga Waka)
# Hostname: www.wgtn.ac.nz  → slug: wgtn
# Country: New Zealand  |  Currency: NZD  |  uni_id: 61 (prod), 2188 (dev)
#
# ══ ROOT CAUSE HISTORY ══════════════════════════════════════════════════════
#
# Attempt 1-2 (all attempts): File was named wgtn_2188.yaml.
#   Loader derives slug 'wgtn' from hostname www.wgtn.ac.nz and looks for
#   wgtn.yaml — ENTIRE config silently ignored every scrape. Ran with defaults.
#
# Attempt 3 (wgtn.yaml, always_browser_discover: true):
#   Rename fixed the loading bug. BUT Playwright visits of seed pages found only
#   4 wrong candidates (2× /explore/other-quals/... Study Abroad pages, 2× dropped
#   by category gate). Real programme pages at /study/programmes-courses/... were
#   not found. Cause: VUW serves different content to headless browsers vs plain
#   HTTP (Cloudflare-style bot detection on listing pages). Static HTTP BFS with
#   default config had previously found 80+ programme links just fine.
#
# THIS VERSION: Lancaster pattern — static HTTP for discovery, browser reserved
# for per-course extraction only (like Lancaster which also serves JS-rendered
# course pages but uses SSR listing pages for discovery).
#
# ══ ACTUAL COURSE URL STRUCTURE ═════════════════════════════════════════════
#   /study/programmes-courses/postgraduate/<subject>/<course-slug>
#   /study/programmes-courses/undergraduate/<subject>/<course-slug>
#   e.g. /study/programmes-courses/postgraduate/architecture/master-of-architecture-professional
#   e.g. /study/programmes-courses/undergraduate/commerce/bachelor-of-commerce
#
#   Confirmed NOT course pages (must block):
#     /explore/other-quals/... — Study Abroad, exchange, non-degree programmes
#     /study/programmes-courses/postgraduate/phds-doctorates — nav hub SPA (rendered=0B)
#     /international/study-options/* — React SPA (rendered=0B)
#
#   Good BFS entry: /study/programmes-courses/limited-entry — static HTML listing
#   page that links to ~80 real programme pages. Previously found 80 links via
#   plain HTTP BFS (confirmed working with default config before YAML fix).

discovery:
  # Static HTTP BFS — VUW listing pages are accessible via plain HTTP.
  # Browser discovery was tried and found only 4 wrong /explore/... links.
  # Skip browser entirely for discovery; use it only for per-course extraction.
  always_browser_discover: false
  skip_browser_discovery: true

  seed_urls:
    # PRIMARY: Lists ~80 limited-entry programmes with direct links to individual
    # /postgraduate/<subject>/<course> and /undergraduate/<subject>/<course> pages.
    # Previously confirmed to find 80 programme links via static HTTP BFS.
    # FALLBACK: Level hubs so BFS also discovers programmes NOT in limited-entry list.
    - https://www.wgtn.ac.nz/study/programmes-courses/postgraduate/
    - https://www.wgtn.ac.nz/study/programmes-courses/undergraduate/

  allow_url_patterns:
    # Individual programme pages: 2 non-empty segments after the level.
    # Matches /postgraduate/<subject>/<course-slug> but NOT depth-1 hub pages or
    # known nav sections (get-started, explore-research, flexible-study, short-courses).
    - "wgtn\\.ac\\.nz/study/programmes-courses/(postgraduate|undergraduate)/(?!flexible-study/?|short-courses/?|get-started/?|explore-research/?)[^/?#]+/[^/?#]+"

  # course_detail_url_patterns: final gate before extraction (like Lancaster).
  # Drops any URL that slipped through allow_url_patterns.
  course_detail_url_patterns:
    - '/study/programmes-courses/(postgraduate|undergraduate)/[^/]+/[^/]+/?$'

  block_url_patterns:
    # /explore/ section: Study Abroad, exchange, English programmes — NOT degrees
    - "/explore/"
    # Known nav noise under programmes-courses
    - "/study/programmes-courses/undergraduate/taster-lectures"
    - "/study/programmes-courses/undergraduate/how-degrees-work"
    - "/study/programmes-courses/undergraduate/minors"
    - "/study/programmes-courses/short-courses"
    - "/study/programmes-courses/subjects"
    - "/study/programmes-courses/study-in-trimester"
    - "/study/programmes-courses/VicStart"
    - "/study/programmes-courses/courses"
    - "/study/programmes-courses/_edit"
    - "/study/programmes-courses/postgraduate/phds-doctorates"
    - "/study/programmes-courses/postgraduate/explore-research"
    - "/study/programmes-courses/postgraduate/get-started"
    - "/study/programmes-courses/postgraduate-subjects"
    - "/flexible-study"
    # Confirmed React-SPA sections (rendered=0B even from browser)
    - "/international/study-options"
    # General noise
    - "/students/"
    - "/study/course-planning"
    - "/study/apply-enrol"
    - "/_edit"
    - "/about"
    - "/news"
    - "/research"
    - "/staff"
    - "/contact"
    - "/library"
    - "/alumni"
    - "/governance"
    - "/news-events"
    - "/key-dates"
    - "/maori"
    - "/pasifika"
    - "/disability"
    - "/wellington"
    - "/giving"
    - "/victoria-university-of-wellington-foundation"

extraction:
  fees:
    default_currency: NZD

  # VUW course pages are JS-rendered — use networkidle to wait for XHR/fetch
  # to settle before capturing HTML. browser_dcl_settle_ms as fallback.
  # This mirrors Lancaster's approach: browser reserved for extraction only.
  browser_wait_strategy: networkidle
  browser_dcl_settle_ms: 5000

  # Allow browser rescue for any page where HTTP returns empty/challenge shell.
  skip_per_course_browser: false
  skip_browser_rescue: false

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
    dedup_use_full_url: true
