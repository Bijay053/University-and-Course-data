extraction:
  filters:
    domestic_only:
      # 2026-05-12 fix: Curtin DOES publish domestic-only courses on the
      # International toggle (e.g. Bachelor of Science (Computer Systems
      # and Networking) [B-SCCSNT], Bachelor of Applied Science
      # (Indigenous Australian Research) (Honours) [BH-INDAUS]). Their
      # Key Information panel reads exactly "This course is not available
      # to international students studying on an Australian student visa."
      # — which the global hard-pattern detector matches at confidence 1.0
      # ("not available to international students" anchor at line ~94 of
      # single_course.py). Without this filter enabled, the page is still
      # extracted and Curtin's CSP placeholder ($12,500/Annual) gets
      # written as the "international fee" — staging garbage courses that
      # cannot accept international student visas. Enabling the filter
      # short-circuits these pages at single_course.py line ~956 before
      # any Gemini call fires.
      enabled: true

  fees:
    # Per-course pages publish their own international fee under
    # "International student indicative fees", visible at
    #   /study/offering/course-ug-...--<code>/?regionToggle=1
    # The query param is the entire reason the previous run captured
    # domestic-CSP fees ($4,800 for Education Primary, $7,200 for Nursing
    # etc) instead of the real international rates ($21k-47k+).
    central_page: ""
    fees_pdf_url: ""

    # 2026-05-12 fix: Curtin per-course pages publish BOTH labels:
    #   "Indicative year 1 fee     $47,116*"
    #   "Total indicative course fee  $141,348*"
    # for multi-year degrees (e.g. 3-year Bachelor of Biomedical Sciences,
    # 2-year Master of Commerce).  The default page-regex extractor
    # prefers the larger total and labels it "Annual" — so the catalogue
    # showed $141,348/Annual instead of the operator-expected
    # $47,116/Annual.  This knob inverts the preference: the year-1
    # label wins via proximity scoring AND fee_term is forced to
    # "Annual".  1-year programs (Master of Cyber Security, MBA) are
    # unaffected because they only publish a single amount.
    prefer_year_one_over_total: true

  intake:
    # 2026-05-12 fix: Curtin PhD and Master of Philosophy pages (URL
    # prefix /course-rd-) are research degrees with continuous enrolment.
    # The page literally states "Enrolment shall be continuous" — there
    # are no fixed intake months. Without this fallback the intake
    # column is blank for every research degree (Doctor of Philosophy -
    # Accounting, Doctor of Philosophy - Applied Geology, Master of
    # Philosophy (Geographic Information Science), Master of Philosophy
    # (Information Systems), and ~80 others). Operators read the blank
    # as a scrape bug rather than as accurate "no fixed intake".
    # Surfacing "Rolling" makes the rolling-intake intent explicit.
    rolling_enrollment_label: "Rolling"
    rolling_enrollment_markers:
      - "enrolment shall be continuous"
      - "enrollment shall be continuous"
      - "enrolment is continuous"
      - "enrollment is continuous"
      - "may enrol at any time"
      - "may enroll at any time"

  english:
    # Per-course pages don't publish per-course IELTS for most courses;
    # central page lists "IELTS Academic 6.5 / no bands below 6.0" for most
    # postgrad and "6.0 / no bands below 5.5" for most undergrad.
    central_page: "https://www.curtin.edu.au/study/applying/english-language-requirements/"
    requirements_pdf_url: ""

  text_cleaning:
    location:
      # When a Curtin page has no campus listed under "Location", the
      # parser sometimes grabs the academic-calendar sentinel sentence
      # instead. Strip it so the field stays blank rather than holding
      # a sentence.
      strip_patterns:
        - "^For start dates, please view the academic calendar.*$"

  # ── url_rewrites: speculative — verify before relying on ──────────────────
  # Not documented in defaults.yaml. Including in case the backend reads
  # this key; harmless if it doesn't (just ignored). The intent is to
  # append ?regionToggle=1 to every fetched Curtin URL so each course
  # renders the international view server-side.
  #
  # If on next run fees are STILL domestic-CSP values (e.g. Nursing $7,200),
  # then this key is being ignored and the fix has to move into backend
  # Python code (intercept the URL request and append the query before fetch).
  url_rewrites:
    - host: "www.curtin.edu.au"
      append_query: "regionToggle=1"

# ── Expected next-run outcome ────────────────────────────────────────────────
#
# DISCOVERY
#   ~130 candidates, ~80-90 surviving the new allow_url_patterns whitelist.
#   /study/courses/<slug>/ pages now blocked (saves budget, removes empty rows).
#
# EXTRACTION — VALIDATION CHECKPOINTS
#
#   Validation #1 — international fee toggle (the critical test):
#   Look up "Bachelor of Science (Biomedical Science) (Honours)" in the
#   staged courses. Expected international fee: ~$42,834/year (per the
#   official page at ?regionToggle=1). If the staged row STILL shows the
#   $9,600 domestic-CSP fee, then url_rewrites is not being honored by the
#   backend. In that case the fix has to be code-level: somewhere in the
#   per-course fetcher, before the HTTP GET, append regionToggle=1 to the
#   query string for any www.curtin.edu.au URL.
#
#   Validation #2 — Bachelor of Education (Primary). Last run staged $4,800,
#   which is the CSP rate. Expected international rate: roughly $30k-35k/yr.
#
#   Validation #3 — Bachelor of Medicine, Bachelor of Surgery. Last run
#   staged $13,600. Expected international rate is well above $70k/yr.
#
# IELTS COVERAGE
#   Per-course IELTS will stay blank for most non-health courses (Curtin
#   site genuinely doesn't publish per-course IELTS for those). Backend
#   needs to fall back to the central English page when per-course is
#   null. This is parser behavior, not YAML.
#
# LOCATIONS
#   Should improve. The strip_patterns rule prevents the
#   "academic calendar" sentinel from being captured as a location.
#   Courses with a real campus listed should keep showing Perth /
#   Kalgoorlie / Albany correctly.