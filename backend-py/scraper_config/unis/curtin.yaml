# ─────────────────────────────────────────────────────────────────────────────
# CURTIN UNIVERSITY
# File: backend-py/scraper_config/unis/curtin.yaml
# ─────────────────────────────────────────────────────────────────────────────
#
# Discoveries from this debugging session (2026-05-12):
#
# 1. Course pages live at /study/offering/course-ug-<slug>--<code>/
#    NOT at /study/courses/<slug>/ as I previously assumed. The earlier
#    allow_url_patterns whitelist used the wrong path and dropped 121 of 137
#    candidates. Removing whitelist altogether let the discoverer find 130
#    courses on the next run; 83 staged successfully.
#
# 2. The international-fee toggle on Curtin pages is the query string
#    ?regionToggle=1. With that param, the page renders International fees
#    (e.g. Bachelor of Biomedical Sciences Honours: $42,834/yr 2026 intake).
#    Without it, the page renders domestic CSP fees, which is why almost
#    every staged course shows a fee that is far below the true international
#    rate.
#
# 3. The "JS shell" diagnosis from the earlier session was partly wrong.
#    Most /study/offering/ pages DO server-render content in static HTML
#    (text_len 12-22KB), and 83 of 130 courses staged with valid fee/IELTS/
#    duration data. The previous-run failures concentrated on
#    /study/courses/<slug>/ URLs — which are course landing/marketing pages
#    that legitimately render almost no content server-side. Those should be
#    blocked at discovery, not retried with a browser.
#
# 4. Curtin does NOT publish intake months on most course pages — many show
#    "For start dates, please view the academic calendar." The current
#    parser sometimes treats that whole sentence as the location string
#    (see "Bachelor of Science (Nutrition), Bachelor of Innovation" in the
#    last run: location = 'For start dates, please view the academic
#    calendar .'). This is a backend parser bug, but we can also mask the
#    sentence here via text_cleaning.location.strip_patterns.
#
# Outstanding limitations after this YAML:
# - Fees will only become international-correct IF the backend honors the
#   regionToggle=1 query in fetched URLs. This file relies on
#   extraction.url_rewrites, which IS NOT documented in defaults.yaml. If
#   the backend doesn't read that key, this section is a no-op and fees
#   will remain domestic-CSP values. Verification step is in the
#   "Expected next-run outcome" section below.
# - IELTS appears blank on many course pages because Curtin publishes a
#   per-course IELTS only for clinical/health programs; for others, the
#   institutional minimum lives on the central English page. Backend has
#   to fall back to central_page when per-course is blank.
#
# ─────────────────────────────────────────────────────────────────────────────

discovery:
  # Default budget is enough — previous run hit 137 candidates within budget.
  # Not raising.

  # WHITELIST course-offering URLs. This is the path Curtin actually uses
  # for course detail pages. The previous /study/courses/ pattern was wrong.
  #
  # Pattern matches:
  #   /study/offering/course-ug-bachelor-of-science-...--bh-biomed/
  #   /study/offering/course-pg-master-of-architecture--mc-arch/
  # Does NOT match the /study/courses/<slug>/ landing pages, which last run
  # showed extract as empty shells and waste budget.
  allow_url_patterns:
    - "/study/offering/course-"

  # Block budget-burners that BFS otherwise picks up.
  block_url_patterns:
    - "/news/"
    - "/research/"
    - "/about/"
    - "/events/"
    - "/study/scholarships/"
    - "/study/applying/"
    # /study/courses/<slug>/ pages are marketing landing pages that render
    # near-empty static HTML. Last run extracted them with text_len 23-66
    # chars. Blocking saves both budget AND the bad rows they generated.
    - "/study/courses/"

  # Curtin's full course catalogue — sourced from the SPA's own tRPC API at
  # https://search.curtin.edu.au/api/trpc/search?batch=1&input=<json>
  # where <json> is URL-encoded {"0":{"region":"international","searchTerms":"",
  # "facet":"courses","page":N,"availability":{"year":<YYYY>}}}.  pageSize=10,
  # walk page=1..ceil(resultCount/10) to enumerate all offerings.  As of
  # 2026-05-12 this returned 268 international courses for year=2026
  # (87 UG + 93 PG + 88 research doctorates).  We seed all of them here
  # because BFS from /study/courses/ only finds ~75 UG offerings (Curtin's
  # /study/courses/ archive page is JS-rendered with 0 course-pg-/course-
  # research- strings in static HTML, and the on-page faceted search lazy-
  # loads via the tRPC API which our http_fetcher tier doesn't trigger).
  # First scrape with 16 PG seeds (2026-05-12) staged 75 Bach + 11 Master +
  # 4 Grad Cert + 2 Grad Diploma = 92.  This expanded list lifts coverage to
  # the full 268-course catalogue including PhDs/professional doctorates.
  # International-fee unlock is handled by the user_region=int cookie set
  # in extractors/curtin_session.py (see archive#curtin-htmx) for both
  # http_fetcher and browser_pool, so URLs intentionally have no query
  # string.  REGENERATION: re-run the tRPC API call above when Curtin's
  # catalogue rotates (~yearly).  Dead URLs surface as 404s in scrape logs
  # and can be pruned in-place; allow_url_patterns + block_url_patterns
  # already cover the URL shapes correctly.
