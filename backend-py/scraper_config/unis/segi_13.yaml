# SEGi University & Colleges (production university id 13)
#
# The current official catalogue moved from www.segi.edu.my to
# university.segi.edu.my. The new host has an incomplete TLS chain for direct
# datacenter clients, while Scrape.do render=true returns the complete page.
hostname_guard: "www.segi.edu.my"

discovery:
  # Skip the obsolete www host and start from the new official site map. It
  # contains the complete current SEGi University catalogue in one page.
  bfs_page_budget: 1
  skip_home_page_redirect: true
  skip_sitemap_fallback: true
  skip_browser_discovery: true
  use_wayback: false
  archive_only: false
  seed_urls:
    - "https://university.segi.edu.my/site-map/"
  allowed_extra_hostnames:
    - "university.segi.edu.my"
    - "www.segi.edu.my"
  segi_wordpress_supplement: true

  # The official host presents an incomplete TLS chain. Production probes
  # confirm direct verify=False fetches are fast and stable; scope the exception
  # to this exact hostname and never fall through to proxies or stale archives.
  insecure_tls_direct_hostnames:
    - "university.segi.edu.my"

  expected_min_courses: 80
  max_candidates: 450
  allow_url_patterns:
    - "^https?://university\\.segi\\.edu\\.my/course/[^/?#]+/?$"
    - "^https://www\\.segi\\.edu\\.my/[^/?#]+/$"
  course_detail_url_patterns:
    - "^https?://university\\.segi\\.edu\\.my/course/[^/?#]+/?$"
    - "^https://www\\.segi\\.edu\\.my/[^/?#]+/$"
  block_url_patterns:
    - "^https?://university\\.segi\\.edu\\.my/course-search(?:/|$)"

extraction:
  skip_browser_rescue: true
  skip_per_course_browser: true
  # Rendered Colleges pages are ~600 KB and the generic extractor is
  # synchronous. More than one page per worker blocks the event loop long
  # enough to stale the heartbeat at the University→Colleges boundary.
  # Serial extraction remains within the two-hour job budget.
  max_parallel_fetch: 1
  per_course_timeout_seconds: 60
  html_compaction_enabled: true
  # Healthy renders return in ~19s, while bad provider rotations can wait
  # indefinitely. Bound each attempt and retry once on a fresh route.
  scrape_do_wait_for_ms: 500
  scrape_do_request_timeout_seconds: 20
  scrape_do_render_max_retries: 1
  scrape_do_render_hostnames:
    - "www.segi.edu.my"

  fees:
    default_currency: MYR
    currency_override: MYR

  # SEGi publishes course, campus, intake, duration, and international English
  # requirements on the official course pages, but not programme tuition.
  # Keep those rows visible for review instead of rejecting the whole catalogue.
  staging:
    require_international_fee: false
    stage_on_parser_error: true