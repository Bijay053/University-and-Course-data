# London Metropolitan University (UK)
# Hostname: www.londonmet.ac.uk
# University ID: dev=6 (prod: lookup by name).
#
# Bug history / rationale (2026-05-13):
#   - Live data showed only 2 staged courses.  BFS found only 19 candidates,
#     all category landing pages.  The sitemap (482 URLs) was suppressed because
#     19 > _SITEMAP_FALLBACK_THRESHOLD(5) so the conditional sitemap fallback
#     never fired.  Fix: always_sitemap_supplement: true.
#
# Bug history (2026-06-19 — sitemap dead, render_listing_pages broken):
#   - All LondonMet sitemap URLs now return HTML 404:
#       /new-sitemap-en.xml, /sitemap.xml, /sitemap_index.xml, /sitemap-en.xml
#     Our server IP appears blocked from robots.txt too (curl times out).
#     always_sitemap_supplement: true → 0 unique candidates wasted.
#   - render_listing_pages was added (3 JS-rendered listing URLs) but returned
#     0 new course links.  Root cause: allow_url_patterns was also applied inside
#     render_listing_pages (orchestrator line 1768).  The rendered page links
#     either use a slightly different URL format or the rendered page's course
#     hrefs don't match the strict "---[a-z0-9-]+" infix pattern, so every link
#     is rejected before entering the candidate pool.
#   - Wayback never triggered because BFS found 18 candidates (> 0 threshold).
#     use_wayback: true forces Wayback to always supplement regardless.
#   - Fix: remove allow_url_patterns (was blocking render_listing_pages);
#     disable always_sitemap_supplement (sitemap is dead); add use_wayback: true.
#   - LondonMet is a UK university — fees are quoted in GBP (£).

discovery:
  # Sitemap is completely dead — all sitemap URLs (including the formerly-working
  # /new-sitemap-en.xml) now return HTML 404.  Disable to avoid wasted probing.
  always_sitemap_supplement: false

  # Seed the three JS-rendered listing pages.  BFS will block them via
  # category_landing_page_url_block (expected), but render_listing_pages below
  # fetches them via Scrape.do headless Chrome independently.
  seed_urls:
    - 'https://www.londonmet.ac.uk/courses/undergraduate/'
    - 'https://www.londonmet.ac.uk/courses/postgraduate/'
    - 'https://www.londonmet.ac.uk/research/courses/'

  # allow_url_patterns intentionally removed.  When set, this filter is also
  # applied inside render_listing_pages (orchestrator.py:1768) and rejects every
  # course link the rendered pages produce.  Without it, render_listing_pages
  # adds all same-host links; the extraction gate then drops non-course pages.

  # Block obvious non-course paths early to save BFS budget.
  # Also blocks Wayback CDX junk: the CDX for londonmet.ac.uk returns thousands
  # of /applying/academic-term-dates/ and /applying/postgraduate/ URLs that the
  # extraction gate drops anyway — blocking them here avoids wasted gate cycles.
  block_url_patterns:
    - "/applying/"
    - "/courses/short/"
    - "/courses/short-courses/"
    - "/courses/english-language-courses/"
    - "/courses/open-language-programme/"
    - "/courses/professional-courses/"
    - "/courses/apprenticeships/"
    - "/courses/international-pathway-programmes/"
    - "/courses/global-partnerships/"
    - "/courses/our-collaborative-partnerships/"
    - "/courses/routes-into-law/"
    - "/international/study-abroad/"
    - "/news"
    - "/events"
    - "/about"
    - "/staff"
    - "/library"
    - "/students"

  # Raise the candidate cap — with no allow filter, more pages will be found.
  max_candidates: 600

  # Force Wayback Machine to always supplement BFS results (not just as a
  # fallback when BFS returns 0).  LondonMet has solid Wayback CDX coverage
  # of course URLs with the ---<degree> infix pattern.
  use_wayback: true

  # Fetch the three JS-rendered listing pages via Scrape.do headless Chrome.
  # allow_url_patterns is NOT set so extracted links are NOT pre-filtered here.
  render_listing_pages:
    - 'https://www.londonmet.ac.uk/courses/undergraduate/'
    - 'https://www.londonmet.ac.uk/courses/postgraduate/'
    - 'https://www.londonmet.ac.uk/research/courses/'

extraction:
  # Skip the sparse-static rescue browser refetch.
  # londonmet_chrome_scrub.py recovers fees directly from data-* attributes
  # embedded in each course page's <select id="course-entry-point-selector">.
  skip_browser_rescue: true

  english:
    # London Met does NOT publish per-course IELTS/PTE/TOEFL scores.
    # Every course links to a shared entry-requirements page.
    # Standard minimums (verified 2026-06-04):
    #   IELTS 6.0 overall, PTE Academic 59, TOEFL iBT 72
    default_ielts: 6.0
    default_pte: 59
    default_toefl: 72

  filters:
    domestic_only:
      # londonmet_chrome_scrub.apply_overrides() detects has_international_options()
      # via <select> dropdown and returns is_domestic_only=True for UK-only courses.
      enabled: true

  fees:
    default_currency: "GBP"
    central_page: "https://www.londonmet.ac.uk/international/costs-and-fees/"
    # London Met does not publish per-course fees on individual course pages.
    # londonmet_chrome_scrub.py nulls the bogus £10,000 postgraduate-loan banner
    # that appears on every PG page, leaving fee=null.  The central fee page
    # parses to 0 program records.  Without this flag, ALL courses fail the
    # no_international_fee staging gate and are dropped (3/34 staged in testing).
    # With force_central_fee_stage: true, courses without an extracted fee still
    # stage in "review" status — the operator can inspect and correct fees there.
    # Remove this flag once a proper per-course fee fetcher is implemented.
    force_central_fee_stage: true
