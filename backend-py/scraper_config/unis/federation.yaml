# Hostname: www.federation.edu.au
discovery:
  generic_search_api:
    url: https://www.federation.edu.au/api/CourseApi/course-search
    params:
      PageId: '12'
      PageSize: '20'
    page_size: 20
    page_size_param: PageSize
    page_number_param: currentPage
    has_next_field: result.hasNextPage
    root_path: result.items
    url_fields:
    - link.href
    title_fields:
    - header
    normalize_relative_urls: true
    base_url: https://www.federation.edu.au
    allow_url_patterns:
    - /courses/
    max_pages: 20
    fetch_via_browser: true
    browser_seed_url: https://www.federation.edu.au/study/course-search
    offset_param: currentPage
  seed_urls:
  - https://www.federation.edu.au/study/course-search
  allow_url_patterns:
  - /courses/
  block_url_patterns:
  - /study/intakes/
  - /study/information/
  - /study/skills
  - /study/early-offer
  - /study/atars
  - /study/guaranteed-atars
  - /study/free-tafe
  - /study/college
  - /study/mid-year
  - /study/pathways
  - /study/high-school
  - /study/advance-to-university
  - /study/federation-college
  - /study/fees/
  - /study/scholarships
  - /study/how-to-apply
  - /study/apply
  - /study/search
  - /study/entry-pathways
  - \?
  - \.pdf$
  bfs_page_budget: 80
  max_candidates: 500
  expected_min_courses: 200
  always_sitemap_supplement: true
  sitemap_url: https://www.federation.edu.au/sitemap.xml
  always_browser_discover: false
  skip_browser_discovery: true
  use_wayback: false
extraction:
  fees:
    default_currency: AUD
    fees_pdf_url: https://www.federation.edu.au/siteassets/files/students/fees/2026_higher_ed_indicative_commencing_international_student_tuition_fee_schedule.pdf
    pdf_fee_term: Annual
  english:
    source_priority:
    - section: English language requirements
    - section: Academic entry requirements
    overall_pattern: (?i)overall\s+(?:academic\s+)?(?:ielts\s+)?(?:band\s+)?(?:score\s+)?(?:of\s+)?(?P<overall>\d(?:\.\d)?)
    min_band_pattern: (?i)no\s+(?:individual\s+)?band\s+(?:score\s+)?(?:of\s+)?less\s+(?:than\s+)?(?P<min_band>\d(?:\.\d)?)
  filters:
    domestic_only:
      enabled: true
    online_only:
      enabled: true
  text_cleaning:
    location:
      strip_patterns:
      - (?:^|,)\s*online\s*(?=,|$)
      - (?:^|,)\s*open\s+universities\s+australia\s*(?=,|$)
      - \s*\(\s*(?:online|virtual|distance|external|flexible|blended|on[\s-]?campus|in[\s-]?person)\s*\)
      deduplicate: true
  course_name:
    # Used by the final provider-name cleaner after Federation's late JSON
    # canonical-name override. Keep both current and legacy brand forms.
    university_aliases:
    - Federation University Australia
    - Federation University
    strip_title_suffixes:
    - ' | Federation University Australia'
    - ' - Federation University Australia'
    - ' | Federation University'
    - ' - Federation University'
  max_parallel_fetch: 4
  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true   
    require_international_fee: false    
    dedup_use_full_url: true   
