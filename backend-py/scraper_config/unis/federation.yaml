# Federation University Australia (federation.edu.au)
# Per-uni overrides — none of these affect any other university.
#
# Issues fixed by this file (verified 2026-05-09):
#   1. "Online" leaking into multi-campus location lists.
#      Federation lists e.g. "Ballarat, Mount Helen, Online" on a course
#      page; the global location extractor's _REMOVE_VIRTUAL is
#      case-sensitive and only matches lowercase "online", so capitalised
#      "Online" survived. Fixed here via text_cleaning strip patterns
#      (case-insensitive) — no global change.
#   2. Discovery harvesting non-course /study/* info pages
#      ("Mid-year Entry", "Free Tafe", "Regional Students",
#      "International Students", "Pathways Through Tafe", "Tafe to
#      Undergraduate", "Early School Leavers" …). Page-type classifier
#      treats them as course-like; sitemap returns 235 candidates and
#      the first ~30 are info pages. Fixed via discovery.block_url_patterns.
#   3. Per-course pages don't expose international fees in scrape-friendly
#      form. Federation publishes the international fee schedule centrally;
#      pointed there via extraction.fees.central_page so the existing
#      central-pages prefetcher can join fees by course name.
#   4. URL filter dropped 100% of discovered course pages.
#      Federation's real course-detail pages live under /courses/, NOT
#      /study/. With no per-uni allow_url_patterns, the inherited default
#      (which assumes /study/-style course paths, as on most other unis)
#      matched 0 of the 219 /courses/* URLs, so every course was dropped
#      at the allow stage before block_url_patterns was even consulted.
#      Fixed via discovery.allow_url_patterns below. (verified 2026-06-01)
#   5. Per-band IELTS minimum ("no band less than X") missing from scrape,
#      and overall risked being read from the wrong statement. Federation
#      course pages carry TWO conflicting IELTS lines: a generic one in
#      "Academic entry requirements" (e.g. 6.0) and the authoritative one
#      under the "English language requirements" heading (e.g. 6.5). Scoped
#      extraction to the dedicated heading + capture overall AND min band
#      via extraction.english below. (verified 2026-06-01)
#   6. domestic_only filter was dropping legitimate INTERNATIONAL courses as
#      domestic-only (~40 Bachelor/Master/PhD, e.g. Criminology, Arts, Visual
#      Arts, Social Work). Root cause: /courses/* pages are JS-rendered, so the
#      detector ran against the static nav/footer shell and never saw the
#      international student-type data. Disabled the filter — see
#      extraction.filters.domestic_only below. (2026-06-01)
#   7. REVERTS Fix 6 — domestic-only courses were leaking into staged output.
#      The disable was an overcorrection: the filter actually fires per-course
#      (single vs double Nursing, Bachelor vs Master Social Work), proving it
#      reads a real per-course marker and is reliable. Re-enabled. (2026-06-01)

discovery:
  # allow-list OVERRIDE (Fix 4): Federation's real course-detail pages live
  # under /courses/, NOT /study/ (the inherited default allow pattern).
  # Without this, every /courses/* URL fails the allow filter and all 219
  # courses get dropped before block_url_patterns is consulted. Match-anywhere
  # substring on "/courses/" — slugs vary: some end in "/", some don't
  # (e.g. /courses/dhm4.cfh-graduate-diploma-of-health-child-and-family-health-nursing).
  allow_url_patterns:
    - "/courses/"

  # Drop info / pathway / general-information pages that BFS + sitemap
  # surface but are not actual course-detail pages.
  #
  # NOTE (post-Fix 4): with the /courses/ allow-list in place, /study/* info
  # pages now fail the allow stage anyway, so these block patterns are
  # belt-and-suspenders / documentation rather than load-bearing. Kept in
  # case the global allow default ever changes. If non-course pages turn up
  # UNDER /courses/ (e.g. /courses/search, /courses/how-to-apply), add them
  # here — block_url_patterns overrides the /courses/ allow.
  block_url_patterns:
    - "/study/intakes/"
    - "/study/information/"
    - "/study/skills"
    - "/study/early-offer"
    - "/study/atars"
    - "/study/guaranteed-atars"
    - "/study/free-tafe"
    - "/study/college"
    - "/study/mid-year"
    - "/study/pathways"
    - "/study/high-school"
    - "/study/advance-to-university"
    - "/study/federation-college"
    - "/study/fees/"
    - "/study/scholarships"
    - "/study/how-to-apply"
    - "/study/apply"
    - "/study/search"
    # Added 2026-05-28: reviewer predicted /study/entry-pathways/* would
    # slip through after Fix 4 deploy because no existing pattern matches
    # that path.  The "Regional Students" / "International Students" /
    # "Early School Leavers" pages flagged in the YAML header comment are
    # already covered by the existing `/study/information/` pattern (their
    # real paths are /study/information/regional-students/ etc.), so they
    # don't need their own entries.
    - "/study/entry-pathways"

extraction:
  fees:
    # The /international/fees-scholarships-and-living-costs hub is JS-
    # rendered (curl returns ~empty HTML), so the central-pages
    # prefetcher recovers 0 records from it. Federation publishes the
    # actual per-course tuition figures in a downloadable Higher Ed
    # fee schedule PDF; point the per-course PDF pipeline at it.
    #
    # Known coverage gap: this PDF only covers Higher Ed courses
    # (Bachelor / Master / Postgrad / Honours). VET / TAFE courses
    # (Cert III, Diploma of …, Cert IV) sit in a separate VET fee
    # schedule that lives behind https://www.federation.edu.au/students/
    # student-essentials/fees/fees-vet/vet-fees/ and isn't a stable
    # direct PDF URL. VET courses will keep falling back to the uni-wide
    # value (or stay blank) until either the schema grows multi-PDF
    # support or the VET PDF gets a stable URL.
    fees_pdf_url: "https://www.federation.edu.au/siteassets/files/students/fees/2026_higher_ed_indicative_commencing_international_student_tuition_fee_schedule.pdf"

    # Federation's HE fee schedule has a different column layout from
    # the Torrens / ASA layout the shared _PDF_DATA_ROW_RE expects:
    #   <name> <course-code> <CRICOS> [bullet markers ⬤⬤⬤] $<annual>
    #     $<semester> <weeks> <credits> <years>
    # i.e. CRICOS comes AFTER the name (not before), there are 2 dollar
    # amounts not 3, and duration is at the END not the start. This
    # per-uni regex captures CRICOS + the first dollar amount (the
    # annual fee — the second amount is exactly half and is the
    # semester rate). The override is opt-in via YAML and has zero
    # effect on any other university.
    #
    # \uf06c is a private-use unicode character — pypdf substitutes it
    # for the campus-availability bullet glyph used in the schedule.
    # Extended 2026-05-10 to ALSO capture the trailing duration column
    # (e.g. "$42,000 $21,000 120 52 1 year") via optional named groups
    # `duration` + `duration_unit`. The trailing block is wrapped in a
    # `(?:...)?` so rows without credit/unit/duration columns still match.
    # Downstream, `university_pdfs.py` lifts the values into
    # `duration_pdf` / `duration_term_pdf`, and `single_course.py` uses
    # them as a last-resort fallback when payload `duration` is NULL.
    pdf_row_pattern: '\b(?P<cricos>\d{6}[A-Z])\b[\s\uf06c]*\$(?P<annual>\d[\d,]*)\s+\$\d[\d,]*(?:(?:\s+\d+){0,3}\s+(?P<duration>\d+(?:\.\d+)?)\s*(?P<duration_unit>years?|months?|semesters?|trimesters?))?'
    pdf_fee_term: "Annual"

    # Per-course PDF row aliases — opt-in dict mapping the lower-cased DB
    # course name (after _TITLE_SUFFIX strips "| Federation University") to
    # the exact title used in the HE fee schedule PDF. Federation publishes
    # course pages with "Bachelor of IT (Foo)" but the PDF uses the long
    # form "Bachelor of Information Technology (Foo)", so the per-course
    # PDF matcher misses these courses without explicit aliases.
    # Verified against the live 2026 schedule PDF on 2026-05-10.
    course_pdf_aliases:
      "bachelor of it (business analysis)": "Bachelor of Information Technology (Business Analysis)"
      "bachelor of it (cybersecurity)": "Bachelor of Information Technology (Cybersecurity)"
      "bachelor of it (software application development)": "Bachelor of Information Technology (Software Application Development)"

  english:
    # Fix 5 (2026-06-01): per-band minimum ("no band less than X") was
    # missing from scraped English requirements, and the overall risked
    # being grabbed from the WRONG statement.
    #
    # Federation publishes English requirements IN the HTML course page
    # (not a central page or PDF like CQU/Curtin). Each course page has a
    # dedicated "English language requirements" heading, e.g. on
    # /courses/dre4-graduate-certificate-in-research/:
    #     "Overall IELTS band score of 6.5, with no band less 6.00"
    #
    # PROBLEM: the page ALSO carries a generic IELTS line earlier, in the
    # "Academic entry requirements" bullets, with DIFFERENT numbers:
    #     "...overall band score of 6.0, with no band less than 6.0..."
    # An unscoped match takes that first (6.0) and never reaches the
    # authoritative 6.5 — and dropped the min-band either way.
    #
    # FIX: scope extraction to the dedicated section heading, then pull
    # BOTH the overall and the per-band minimum. Patterns are
    # case-insensitive; min_band makes "than" optional because Federation's
    # copy is ungrammatical ("no band less 6.00", no "than").
    #
    # source_priority: prefer the dedicated section; only fall back to the
    # academic-entry bullet if the section heading is absent on a page.
    source_priority:
      - section: "English language requirements"
      - section: "Academic entry requirements"   # fallback only
    overall_pattern: '(?i)overall\s+ielts\s+band\s+score\s+of\s+(?P<overall>\d+(?:\.\d+)?)'
    min_band_pattern: '(?i)no\s+(?:individual\s+)?band\s+(?:score\s+)?(?:of\s+)?less\s+(?:than\s+)?(?P<min_band>\d+(?:\.\d+)?)'

  text_cleaning:
    location:
      # Strip "Online", "Open Universities Australia" and similar virtual
      # / partner tokens from comma-joined location lists. Applied BEFORE
      # the rest of the location-sanitise pipeline so they never reach the
      # final string. Case-insensitive.
      strip_patterns:
        # Standalone "Online" surrounded by commas / start / end of string.
        - '(?:^|,)\s*online\s*(?=,|$)'
        # "Open Universities Australia" (a virtual partner, not a campus)
        - '(?:^|,)\s*open\s+universities\s+australia\s*(?=,|$)'
        # Trailing parentheticals like "Melbourne (Southbank)" → keep the
        # city; only strip explicit (Online) / (Virtual) markers.
        - '\s*\(\s*(?:online|virtual|distance|external)\s*\)'

  filters:
    domestic_only:
      # RE-ENABLED 2026-06-01 (Fix 7) — reverts the Fix 6 disable, which was an
      # overcorrection that let genuinely domestic-only courses leak through.
      #
      # The run log shows this filter fires PER-COURSE and SELECTIVELY, which is
      # only possible if it reads a real per-course marker on each page (the
      # StudentTypeBlock `"hasInternational": false`), NOT a blind global shell:
      #   - Bachelor of Nursing (Dnn5) staged as international, but the
      #     Nursing/Midwifery double (Dhl5) was dropped domestic-only.
      #   - Master of Social Work staged; Bachelor of Social Work was dropped.
      #   - Bachelor of Business specialisations staged; the base Bachelor of
      #     Business was dropped.
      # So the marker IS present per page and the detector is reliable. The Fix 6
      # claim that it false-positives on a blind JS shell was wrong: a blind
      # shell would drop all-or-none, not pick single vs double degrees apart.
      #
      # The courses it drops (VET Cert I–IV, Skill Sets, short courses, and
      # placement-heavy degrees like Nursing/Midwifery doubles, Social Work,
      # Visual Arts, Music Theatre) are genuinely not offered to international
      # students at Federation — correctly rejected at the staging gate.
      #
      # If a SPECIFIC international course is ever wrongly dropped, prune/allow it
      # by name rather than disabling the whole filter; a blanket disable trades
      # one wrong course for ~100 domestic-only courses leaking in.
      enabled: true