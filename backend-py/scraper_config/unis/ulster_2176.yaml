# Ulster University
# Hostname: www.ulster.ac.uk
# Country: United Kingdom  |  Currency: GBP
#
# Discovery notes (2026-06-19):
#   - Course listing at /courses uses Funnelback JS search.  Scrape.do headless
#     Chrome renders the UI but individual course hrefs are never emitted into
#     the DOM (virtual list rendering).  render_listing_pages returned 0 new links.
#   - Site is fully Cloudflare-protected; direct HTTP returns 403 on every path.
#   - SOLUTION: dedicated courses sitemap at /site-maps/sitemap-courses.xml
#     has 987 course URLs at /courses/202627/<slug>-<id>.  Accessible via the
#     Scrape.do fallback in http_fetcher.fetch_html.
#   - The sitemap fallback fires automatically: BFS finds 0 course candidates
#     (all BFS links are navigation/info pages filtered by allow_url_patterns),
#     which is below _SITEMAP_FALLBACK_THRESHOLD so discover_from_sitemap is
#     called with the explicit sitemap_url below.
#   - year_dedup_mode: keep_latest dedups if future sitemaps include both
#     202627 and 202728 variants of the same course.
#   - Full-time catalogue has exactly 558 courses (verified via Funnelback filter).
#     Sitemap has 987 raw URLs (FT + PT combined); year_dedup reduces to unique
#     courses per slug (one intake year kept per course slug).
#
# Candidate cap history:
#   - Original cap 500: captured only courses from sitemap positions 0-499.
#     ~487 courses at positions 500-986 were never staged.
#   - Raised to 700: improved coverage but still left courses at positions 700-986
#     untouched, missing PT and some FT courses.
#   - Raised to 1000 (current): covers all 987 raw sitemap URLs in one job.
#     Memory is no longer a concern: the orchestrator now splits the course list
#     into batches of _EXTRACTION_BATCH_SIZE (default 50) and stages each batch
#     before starting the next, so peak in-memory result set is bounded regardless
#     of total candidate count.  The previous "OOM at 961" report predates this
#     batched extraction loop and the semaphore-controlled concurrency cap.

discovery:
  # Explicit sitemap URL — fetched via Scrape.do since direct HTTP returns 403.
  # 987 course URLs at pattern /courses/202627/<slug>-<id>.
  sitemap_url: 'https://www.ulster.ac.uk/site-maps/sitemap-courses.xml'

  # Seed URL for the Funnelback full-time filtered listing (558 courses).
  # NOTE: The Funnelback page uses virtual-list JS rendering so the browser
  # currently finds 0 hrefs from this page directly.  It is kept here as a
  # documented entry point and for when Scrape.do pagination support improves.
  seed_urls:
    - 'https://www.ulster.ac.uk/courses?query=&f.Attendance_u|modeft=Full-time'

  # NOTE: always_sitemap_supplement removed — bfs_page_budget:0 means BFS
  # always finds 0 candidates (< the 5-candidate threshold), which triggers
  # the automatic sitemap fallback unconditionally.  Keeping
  # always_sitemap_supplement:true would cause a redundant second sitemap
  # fetch (~25s per run via Scrape.do) with no additional courses discovered.
  # always_sitemap_supplement: true  # ← intentionally removed

  # Accept /courses/<6-digit-year>/<slug> URLs only.
  # re.search finds 'ulster.ac.uk/courses/202627/' anywhere in the full URL.
  # Blocks /study/*, /doctoralcollege/*, /departments, all info pages, and
  # bare /courses/ index (no 6-digit year segment → no match).
  allow_url_patterns:
    - 'ulster\.ac\.uk/courses/\d{6}/'

  # Skip BFS entirely — the sitemap has all 987 courses and
  # always_sitemap_supplement:true runs it unconditionally.  BFS is pure waste
  # for Ulster: every page costs ~25 s through the HTTP→cffi→Wayback→Scrape.do
  # fallback chain (Cloudflare Enterprise blocks HTTP and cffi; Wayback returns
  # 429).  Setting bfs_page_budget:0 sets max_pages=0 so the BFS while-loop
  # never executes and discovery jumps straight to the sitemap.
  bfs_page_budget: 0

  # 1000 covers all 987 raw sitemap URLs with a margin for sitemap growth.
  # year_dedup (below) collapses multiple intake-year variants into one URL
  # per course slug, so total extractions ≈ unique course count, not raw count.
  max_candidates: 1000

  # sitemap_offset: 0 = start from position 0 (full catalogue in one job).
  # Increase this only if a future sitemap exceeds 1000 and a second batch
  # is needed: set offset=1000, max_candidates=500 for the second job.
  sitemap_offset: 0

  # Year dedup: block 202728 (incomplete future year), keep only 202627.
  #
  # Sitemap breakdown (verified 2026-07-02):
  #   Total: 1050 URLs — 592 in /courses/202627/ + 458 in /courses/202728/
  #
  # The 2026/27 catalog (592 URLs) is the CURRENT, COMPLETE academic year.
  # The 2027/28 catalog (458 URLs) is the INCOMPLETE future year — only 77%
  # of courses have been announced, meaning it is a partial subset that also
  # duplicates the 2026/27 entries (same course, new numeric ID in the slug).
  #
  # Blocking 202728 eliminates the duplication:
  #   592 (202627) − ~35 blocked (pgce + degree-apprenticeship) ≈ 557 courses
  # This matches the user-verified count of 557 international-eligible courses.
  #
  # Previous attempts:
  #   year_dedup_mode: keep_latest + strip_trailing_id:true  →  362 courses
  #     (over-deduped because Ulster changes the numeric ID between years, so
  #      genuinely different courses sharing a base slug were collapsed).
  #   year_dedup_mode: none  →  998 courses extracted (all variants, double cost).
  #
  # When 2027/28 approaches completion (≥90% of 2026/27 count), switch to:
  #   block_url_patterns: - '202627'  (and remove the 202728 block below)
  year_dedup_mode: none

  # Block course types that are domestic-only in the UK and never available
  # to international students:
  #   pgce                 — Postgraduate Certificate in Education (teacher
  #                          training); funded by DfE bursary, requires UK QTS
  #   degree-apprenticeship — employer-funded; only open to UK residents with
  #                           an employer sponsor
  #   202728               — incomplete future-year duplicate (see note above)
  block_url_patterns:
    - 'pgce'
    - 'degree-apprenticeship'
    - '/courses/202728/'
    # CPD / short-course URL blocking by numeric ID range.
    # Ulster uses the following ID ranges for non-degree content:
    #   50000-59999  — "Short course and CPD" professional development courses
    #                  (confirmed by page title: "Short course and CPD")
    #   46000-47999  — Short professional modules / CPD units
    #                  (confirmed: "Short course and CPD" in page title too)
    # These are blocked at discovery time to avoid wasting fetch budget on
    # pages with no international fee, IELTS, or intake data.
    # Pattern: matches /courses/202627/<slug>-<5-digit-id-starting-with-5>.
    # The regex is anchored to the end of the URL path segment.
    - '-5\d{4}$'
    - '-4[67]\d{3}$'

extraction:
  # Ulster course pages have dedicated /fees/ and /entry-requirements/ sub-pages
  # that carry data not always in the main Scrape.do static HTML.
  follow_admission_links: true
  max_admission_linked_pages: 3

  fees:
    default_currency: GBP
  filters:
    online_only:
      enabled: false

  # Cloudflare bypass — Ulster is fully Cloudflare Bot Management protected.
  # httpx returns 403, curl_cffi also blocked (Enterprise Bot Management).
  #
  # Per-job trace (2026-06-23): static=249KB rendered=0B using=static.
  # Scrape.do render=true is also being blocked by Cloudflare Enterprise
  # (rendered=0B every course), so scrape_do_render adds zero value and is
  # disabled.  Scrape.do STATIC returns the full SSR HTML (249KB) which is
  # sufficient: fee regex finds £17,490, intake regex finds September/May,
  # study_mode rule fires correctly.  IELTS is not present in static HTML —
  # accept this as a data gap rather than spending 30-60s per course on
  # Playwright (also blocked: rendered=0B / 403) or repeated render retries.
  #
  # scrape_do_skip_fallbacks=true: skips wasted httpx+curl_cffi attempts and
  # goes directly to Scrape.do static. ~3-4s saved per course × 987 courses.
  scrape_do_skip_fallbacks: true

  # Skip ALL Playwright per-course browser fetches.  Ulster's Cloudflare
  # Enterprise blocks Playwright headless Chrome the same way it blocks plain
  # httpx and curl_cffi — the browser always gets 403 / rendered=0B and wastes
  # 30-60s per course with zero benefit.
  skip_per_course_browser: true
  skip_browser_rescue: true

  # Vision OCR suppression — Ulster's static HTML does NOT contain IELTS
  # scores; the scores are in a Cloudflare-gated JS-only overlay that is
  # never returned by Scrape.do static.  Running vision OCR on 3-6 images
  # per course (~33 min across 987 courses) finds nothing useful.
  # trust_vision_ocr: false skips the entire per-course vision pass.
  english:
    trust_vision_ocr: false

  # CPD / short-course suppression.
  # Ulster CPD pages contain "Short course and CPD" in their <title> and
  # visible text.  Two suppression layers work together:
  #   1. block_url_patterns above blocks the known CPD ID ranges at discovery.
  #   2. skip_staging_keywords below catches any CPD page that slips through
  #      (e.g. a CPD course with an ID outside the blocked ranges) and aborts
  #      staging entirely — the course is never written to scraped_courses.
  #   3. skip_ai_fallback_keywords suppresses the Gemini fallback call on any
  #      CPD page that somehow reaches that stage.
  skip_staging_keywords:
    - "Short course and CPD"
  skip_ai_fallback_keywords:
    - "Short course and CPD"

  # Rate-limiting fix (2026-07-02):
  # Analysis of job_036b8fe884a9 (998 URLs, 429 staged) showed only ~42%
  # success rate spread equally across both year variants (202627: 41%,
  # 202728: 45%), meaning ~181 unique courses had ALL their URL variants
  # fail.  This random pattern is consistent with Scrape.do rate-limiting
  # (HTTP 429 → _retry_after exhausted → fetch_failed) when 16 parallel
  # connections all hit Scrape.do simultaneously.
  #
  # Fix: lower concurrency from 16 → 4 to reduce Scrape.do rate pressure.
  # Expected: scrape time grows from ~22 min → ~88 min, but staged count
  # should grow from ~429 → ~500+ (ideally covering all ~557 courses).
  # If 4 slots still yields high fail rates, try 2.
  max_parallel_fetch: 4

  # Pin Scrape.do exit-node IPs to the UK.  Ulster's Cloudflare Enterprise
  # WAF may apply less-restrictive rules to same-country (GB) visitors than
  # to overseas IPs.  This matches what a prospective student browsing from
  # the UK would see, and may improve the per-URL success rate.
  scrape_do_geo: GB

  staging:
    skip_degree_qualifier_check: true
    require_international_fee: false
