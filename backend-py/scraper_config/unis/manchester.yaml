# The University of Manchester
# Hostname: www.manchester.ac.uk
# Country: United Kingdom  |  Currency: GBP
#
# Discovery strategy (2026-06-17):
#   Manchester publishes three public XML course feeds that enumerate every
#   taught programme and research degree (~934 courses total):
#
#     UG  (~366): https://www.manchester.ac.uk/study/undergraduate/courses/{year}/xml/
#     PGT (~321): https://www.manchester.ac.uk/study/masters/courses/list/xml/
#     PGR (~247): https://www.manchester.ac.uk/study/postgraduate-research/programmes/list/xml/
#
#   Each <li id="idNNNNN"> entry carries: course name, degree type, duration
#   (and UCAS code for UG). Full course URL = xml_base + href.
#
#   The XML feeds are public and NOT Cloudflare-protected (fetched directly
#   via manchester_xml.py provider). Per-course detail pages ARE protected;
#   scrape.do is used for per-course extraction.

discovery:
  manchester_xml:
    ug_year: "2026"        # UG feed rotates annually — update each admissions cycle
    include_ug:  true      # ~366 undergraduate courses
    include_pgt: true      # ~321 postgraduate taught (Masters) courses
    include_pgr: true      # ~247 postgraduate research (PhD/MPhil) courses

extraction:
  # Hard ceiling is 16; at ~7s per Scrape.do slot and 934 courses this gives
  # ≈ 934 × 7 / 16 ≈ 408 s ≈ 7 min (well under the 30-min target).
  max_parallel_fetch: 16

  # Manchester course pages link to /fees/ and /entry-requirements/ sub-pages
  # that contain fee tables and English-requirement details not always present
  # on the main course page.  Enable link-following to fetch those before Gemini.
  #
  # Budget is capped at 2 (not 3):
  #   At ~7s per Scrape.do slot with 16 parallel workers and ~934 courses:
  #     max_admission_linked_pages: 3 → 934 × 4 pages / 16 × 7s ≈ 1634s ≈ 27 min
  #     max_admission_linked_pages: 2 → 934 × 3 pages / 16 × 7s ≈ 1225s ≈ 20 min
  #   Manchester's /fees/ page is almost always the first linked page found
  #   and /entry-requirements/ the second — both are captured at budget=2.
  #   The third linked page (if any) typically adds no fee/IELTS data that
  #   the first two haven't already covered.
  follow_admission_links: true
  max_admission_linked_pages: 2
  # Playwright is also blocked by Manchester's Cloudflare Enterprise WAF —
  # browser rescue and per-course browser both return rendered=0B and waste
  # 30-60s per course with zero benefit.  Gemini extracts all required fields
  # from the Scrape.do static HTML (32-44KB text per page) successfully.
  skip_browser_rescue: true
  skip_per_course_browser: true
  browser_wait_strategy: domcontentloaded

  allow_url_patterns:
    - '(?i)/study/undergraduate/courses/\d{4}/\d+/[^/]+/?$'
    - '(?i)/study/masters/courses/list/\d+/[^/]+/?$'
    - '(?i)/study/postgraduate-research/programmes/list/\d+/[^/]+/?$'

  course_detail_url_patterns:
    - '(?i)/study/undergraduate/courses/\d{4}/\d+/[^/]+/?$'
    - '(?i)/study/masters/courses/list/\d+/[^/]+/?$'
    - '(?i)/study/postgraduate-research/programmes/list/\d+/[^/]+/?$'

  force_detail_pages:
    - '(?i)/study/undergraduate/courses/\d{4}/\d+/[^/]+/?$'
    - '(?i)/study/masters/courses/list/\d+/[^/]+/?$'
    - '(?i)/study/postgraduate-research/programmes/list/\d+/[^/]+/?$'

  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false

  fees:
    default_currency: GBP
    prefer_international: true
    prefer_annual_over_total: true
    fee_year: "2026"
    fee_term: "year"
    reject_keywords:
      - "Home"
      - "UK student"
      - "Domestic"

  english:
    source: course_page
    source_xpath: "//div[contains(@id, 'entry-requirements')] | //section[contains(@id, 'entry-requirements')] | //div[contains(@class, 'course-profile-content')] | //main"
    # Issue 5: Manchester pages are text-rich — IELTS/PTE/TOEFL scores are
    # parseable from structured HTML so OCR adds noise, not value.
    # Disabling vision prevents tier-0 image OCR from overriding regex /
    # Gemini values that were extracted correctly from page text.
    trust_vision_ocr: false

    ielts:
      raw_xpath: ".//*[contains(text(), 'IELTS')] | .//li[contains(., 'IELTS')]"
      remove_tags: true
      patterns:
        overall:
          - 'ielts:?\s*(\d\.?\d*)'
          - 'overall\s*score\s*of\s*(\d\.?\d*)'
          - '(\d\.?\d*)\s*overall'
        each:
          - 'minimum\s*of\s*(\d\.?\d*)'
          - 'than\s*(\d\.?\d*)'
          - 'below\s*(\d\.?\d*)'
      apply_each_to:
        - ielts_reading
        - ielts_writing
        - ielts_listening
        - ielts_speaking

    pte:
      raw_xpath: ".//li[contains(., 'Pearson')]"
      remove_tags: true
      patterns:
        overall:
          - ':?\s*(\d\.?\d*)'
        each:
          - 'than\s*(\d\.?\d*)'
          - 'below\s*(\d\.?\d*)'
      apply_each_to:
        - pte_reading
        - pte_writing
        - pte_listening
        - pte_speaking

    toefl:
      raw_xpath: ".//li[contains(., 'TOEFL iBT')]"
      remove_tags: true
      patterns:
        overall:
          - 'toefl ibt:?\s*(\d\.?\d*)'
        each:
          - 'than\s*(\d\.?\d*)'
          - 'below\s*(\d\.?\d*)'
      apply_each_to:
        - toefl_reading
        - toefl_writing
        - toefl_listening
        - toefl_speaking

  # ── Intake defaults ───────────────────────────────────────────────────────
  # Manchester course pages often omit explicit start dates (especially for UG
  # courses where September is universal).  Pre-filling intake_months before
  # the Gemini gate check means the gate fires "classification_only" instead of
  # "full_extraction_needed" for these courses, dropping per-course Gemini cost
  # from ~$0.000875 to ~$0.000044 — a 95% reduction.
  # use_default_when_missing only fires when ALL regex/CSS/vision extractors
  # return no intake; a regex hit (e.g. "May" for Nursing) still wins.
  intake:
    use_default_when_missing: true
    default_source_note: Manchester default intake (not extracted from page)
    # Raise intake-default confidence to 0.75 (above the Gemini gate threshold
    # of 0.70) so YAML-default intake months count toward the gate's coverage
    # calculation.  Manchester's intake schedule is highly predictable:
    #   UG     → September (universal across all 366 courses)
    #   PGT/PGR → September + January (correct for >95% of programmes)
    # With this setting a course that already has fee + IELTS + duration +
    # course_name + study_mode all at ≥ 0.70 will trigger "classification_only"
    # instead of "full_extraction_needed" — saving ~75% of per-course Gemini
    # cost (cheap 80-token prompt vs full extraction ~500 tokens).
    # Do NOT copy this to universities with variable/unpublished intake schedules.
    default_confidence: 0.75
    default_by_level:
      undergraduate:
        - September
      postgraduate:
        - September
        - January
      doctorate:
        - September
        - January

  text_cleaning:
    global_substring_blocklist:
      - Apply now
      - Find out more
      - Book an open day
      - Request a prospectus
      - Chat with a student
      - Our use of cookies

  # Manchester courses are always on-campus in Manchester city.  Pre-filling
  # the location eliminates the AI-fallback call that would otherwise fire
  # just to write "Manchester" for every single course.
  default_course_location: Manchester

  staging:
    reject_if_missing:
      - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
