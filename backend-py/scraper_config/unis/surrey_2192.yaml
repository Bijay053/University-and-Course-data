# University of Surrey
# Hostname: www.surrey.ac.uk
# Country: United Kingdom | Currency: GBP
# Discovery: BFS from main study levels (undergraduate, postgraduate, research) following course links. Pages are primarily server-rendered HTML.
# Notes: Extracts fees and English requirements directly from individual course pages. Allows online-only international courses.
discovery:
  always_sitemap_supplement: true
  seed_urls:
  - https://www.surrey.ac.uk/undergraduate
  - https://www.surrey.ac.uk/postgraduate
  - https://www.surrey.ac.uk/postgraduate/research
  allow_url_patterns:
  - /postgraduate/[^/]+/?$
  - /undergraduate/[^/]+/\d{4}/?$
  block_url_patterns:
  - /apply
  - /contact
  - /news
  - /events
  - /blog
  - /about
  - /research
  - /alumni
  - /outreach
  - /parents
  - /jobs
  - /careers
  - /accommodation
  - /life-on-campus
  - /fees-and-funding$
  - /international/living
  expected_min_courses: 400
extraction:
  fees:
    default_currency: GBP
    prefer_international: true
    prefer_annual_over_total: true
    prefer_year_one_over_total: true
    reject_keywords:
    - Home student
    - Home fee
    - UK student
    - UK fee
    - Domestic
  english:
    central_page: https://www.surrey.ac.uk/apply/international/english-language-requirements
    course_english_priority: true
    trust_vision_ocr: false
    default_ielts: 6.0
    default_pte: 60
    default_toefl: 80
  intake:
    start_dates_only: true
  course_name:
    strip_title_suffixes:
    - ' | University of Surrey'
    - ' - University of Surrey'
    - ' — University of Surrey'
    - '| University of Surrey'
  filters:
    online_only:
      enabled: false
  text_cleaning:
    duration:
      reject_sentence_patterns:
      - up to \d+(?:\.\d+)? (?:years?|months?)
      - maximum of \d+ (?:years?|months?)
      - candidature.*\d+ years
  staging:
    reject_if_missing:
    - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
