# University of Surrey
# Hostname: www.surrey.ac.uk
# Country: United Kingdom | Currency: GBP
# Discovery: BFS from main study levels (undergraduate, postgraduate, research) following course links. Pages are primarily server-rendered HTML.
# Notes: Course pages own English requirements; the central page is only a conversion reference.
locked_config_paths:
  - discovery.seed_urls
  - discovery.allow_url_patterns
  - discovery.expected_min_courses
  - extraction.english.central_page
  - extraction.english.default_ielts
  - extraction.english.default_pte
  - extraction.english.default_toefl
discovery:
  always_sitemap_supplement: true
  seed_urls:
  - https://www.surrey.ac.uk/undergraduate
  - https://www.surrey.ac.uk/postgraduate
  - https://www.surrey.ac.uk/postgraduate/research
  allow_url_patterns:
  - /postgraduate/[^/]+/?$
  - /undergraduate/[^/]+(?:/\d{4})?/?$
  block_url_patterns:
  - /apply
  - /contact
  - /news
  - /events
  - /blog
  - /about
  - /research
  - /alumni
  - /outreach
  - /parents
  - /jobs
  - /careers
  - /accommodation
  - /life-on-campus
  - /fees-and-funding$
  - /international/living
  # Current UG, taught PG and research A–Z lists contain roughly 245 distinct
  # course URLs, not 400 (variants share course pages). Keep a collapse alarm.
  expected_min_courses: 200
extraction:
  fees:
    default_currency: GBP
    prefer_international: true
    prefer_annual_over_total: true
    prefer_year_one_over_total: true
    reject_keywords:
    - Home student
    - Home fee
    - UK student
    - UK fee
    - Domestic
  english:
    central_page: null
    course_english_priority: true
    trust_vision_ocr: false
    default_ielts: null
    default_pte: null
    default_toefl: null
  intake:
    start_dates_only: true
  course_name:
    strip_title_suffixes:
    - ' | University of Surrey'
    - ' - University of Surrey'
    - ' — University of Surrey'
    - '| University of Surrey'
  filters:
    online_only:
      enabled: false
  text_cleaning:
    duration:
      reject_sentence_patterns:
      - up to \d+(?:\.\d+)? (?:years?|months?)
      - maximum of \d+ (?:years?|months?)
      - candidature.*\d+ years
  staging:
    reject_if_missing:
    - course_name
    skip_degree_qualifier_check: true
    require_international_fee: false
