# Cardiff University
# Hostname: www.cardiff.ac.uk
#
# CLOUDFLARE ENTERPRISE IP-BLOCK: All datacenter IPs return 403 — listing pages,
# course pages, sitemap, robots.txt.  cffi (TLS impersonation) does NOT bypass it.
#
# Engineering recommendation (Task-253, 2026-06-26):
#   Cardiff's Sitecore-rendered pages require a residential exit-node IP to bypass
#   the Cloudflare Enterprise bot-management layer at the extraction stage.
#   Scrape.do (SCRAPE_DO_TOKEN) provides headless-Chrome rendering through a
#   residential proxy pool — this is the preferred path over purchasing a dedicated
#   residential proxy service.
#
#   scrape_do_render: true    — routes each course-page fetch through Scrape.do's
#                               headless Chrome (residential IP).  Replaces the
#                               doomed httpx/cffi datacenter attempts.
#   scrape_do_skip_fallbacks: true — skips the two datacenter HTTP attempts
#                               (httpx + curl_cffi) for each page, saving ~1-2 s
#                               per course before the Scrape.do fetch.  With 300+
#                               courses this saves ~10 min per job.
#   skip_browser_rescue: true — disables the Playwright browser-rescue path; that
#                               browser also runs from a datacenter IP and would
#                               return the same 403 as plain HTTP.  Scrape.do
#                               already provides rendering; no rescue needed.
#
# If Scrape.do is not available (SCRAPE_DO_TOKEN unset), Cardiff cannot be scraped
# from this environment — a PM decision to purchase residential proxy credits or
# obtain Cardiff's internal search API token is required before proceeding.
#
# NOTE: discovery.parsers is NOT a valid schema key — it is silently ignored.
# Per-listing-page XPath rules belong in extraction.selectors.course_list (see below).

discovery:
  # Skip httpx + curl_cffi for listing pages — Cardiff's CF Enterprise blocks
  # all datacenter IPs at the IP/ASN level, so both tiers always fail.
  # Going straight to Scrape.do static (residential proxy, render=False,
  # ~$0.0005/call) saves 2-4 wasted attempts per listing URL and prevents
  # the host-cache from being populated only after those failures.
  scrape_do_skip_fallbacks: true

  seed_urls:
    - https://www.cardiff.ac.uk/study/undergraduate/courses/a-to-z
    - https://www.cardiff.ac.uk/study/postgraduate/research/programmes/a-to-z
    - https://www.cardiff.ac.uk/study/postgraduate/taught/courses

  auto_api_discovery: true

  allow_url_patterns:
    - '/study/undergraduate/courses/'
    - '/study/postgraduate/research/programmes/'
    - '/study/postgraduate/taught/courses/'
    - '/courses/.+'

  block_url_patterns:
    - '/news'
    - '/events'
    - '/staff/'
    - '/about'
    - '/contact'
    - '/linkassets/'

  use_wayback: false

extraction:
  # Scrape.do residential proxy bypasses the Cloudflare Enterprise block that
  # returns 403 for all datacenter IPs (httpx, cffi, Playwright datacenter).
  # scrape_do_render:true uses headless Chrome through Scrape.do's residential
  # IP pool.  scrape_do_skip_fallbacks:true skips the two doomed datacenter
  # HTTP attempts, saving ~1-2 s per course (~10 min across 300+ courses).
  # skip_browser_rescue:true prevents the datacenter Playwright from firing
  # (it also gets 403) — Scrape.do is already the rendering path.
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  skip_browser_rescue: true

  max_parallel_fetch: 3

  filters:
    domestic_only:
      enabled: false

    online_only:
      enabled: false

  fees:
    default_currency: "GBP"
    prefer_international: true
    prefer_annual_over_total: true
    fee_year: "2025"
    fee_term: "year"

    reject_keywords:
      - "Domestic"
      - "Home student"
      - "UK student"

  english:
    source: course_page
    source_xpath: "//div[contains(@class, 'row') and contains(.//h2/@id, 'requirements')]/*[not(self::div[contains(@id, 'outside-uk-requirements')])] | //div[contains(@class, 'row') and contains(.//h2/@id, 'admission')] | //div[contains(@id, 'entry-requirement')]"

    ielts:
      raw_xpath: ".//p[contains(., 'IELTS')] | .//li[contains(., 'IELTS')] | .//h3[contains(., 'IELTS')]/following-sibling::p"
      patterns:
        overall:
          - 'score\sof\s.?(\d\.?\d)'
          - 'of\s*(\d\.?\d*)'
        each:
          - 'no\selement\sbelow\s*(\d\.?\d*)'
          - '(\d\.?\d*)\sin\seach'
          - '(\d\.?\d*)\sin\sall'
      apply_each_to:
        - ielts_reading
        - ielts_writing
        - ielts_listening
        - ielts_speaking

    toefl_ibt:
      raw_xpath: ".//p[contains(., 'TOEFL')] | .//li[contains(., 'TOEFL')] | .//h3[contains(., 'TOEFL')]/following-sibling::p"
      patterns:
        overall:
          - '(\d\.?\d*)\s*overall'
          - 'of\s*(\d\.?\d*)'
        each:
          - 'no\selement\sbelow\s*(\d\.?\d*)'
          - '(\d\.?\d*)\sin\sall'
        individual:
          writing: '(\d\.?\d*)\sfor\swriting'
          reading: '(\d\.?\d*)\sfor\sreading'
          listening: '(\d\.?\d*)\sfor\slistening'
          speaking: '(\d\.?\d*)\sfor\sspeaking'
      apply_each_to:
        - toefl_ibt_reading
        - toefl_ibt_writing
        - toefl_ibt_listening
        - toefl_ibt_speaking

    pte:
      raw_xpath: ".//p[contains(., 'PTE')] | .//li[contains(., 'PTE')] | .//h3[contains(., 'PTE')]/following-sibling::p"
      patterns:
        overall:
          - '(\d\.?\d*)\s*overall'
          - 'of\s*(\d\.?\d*)'
        each:
          - 'no\selement\sbelow\s*(\d\.?\d*)'
          - '(\d\.?\d*)\sin\seach'
          - '(\d\.?\d*)\sin\sall'
      apply_each_to:
        - pte_reading
        - pte_writing
        - pte_listening
        - pte_speaking

  selectors:
    # Combined XPath for both listing page types:
    #   - UG / Research: table rows  → //table//tbody/tr//a/@href
    #   - PG Taught: card/teaser divs → //div[contains(@class,'teaser')]//a/@href
    course_list:
      xpath: "//table//tbody/tr//a/@href | //div[contains(@class, 'teaser')]//a/@href"

    course_name:
      xpath: "//h1/text()"

    city:
      value: "Cardiff"

    course_description:
      xpath: "//div[contains(@class, 'row') and contains(.//h2/@id, 'overview')] | //div[contains(@id, 'overview')]"

    other_requirements:
      xpath: "//div[contains(@class, 'row') and contains(.//h2/@id, 'requirements')]/*[not(self::div[contains(@id, 'outside-uk-requirements')])] | //div[contains(@class, 'row') and contains(.//h2/@id, 'admission')] | //div[contains(@id, 'entry-requirement')]"

    career:
      xpath: "//div[contains(@id, 'employability')] | //div[contains(@class, 'row') and contains(.//h2/@id, 'career')]"

    course_structure:
      xpath: "//div[contains(@class, 'row') and contains(.//h2/@id, 'structure')] | //div[contains(@id, 'details')]"

    intake_month:
      xpath: "//li[strong[contains(., 'intake')]]/text() | //legend[contains(., 'Start')]/following-sibling::div//label/text()"

    duration:
      xpath: "//li[strong[contains(., 'Duration')]]"
      remove_tags: true
      strip: true

    fee_international:
      xpath: "//div[contains(@class, 'row') and contains(.//h2/@id, 'fee')]//h3[contains(., 'overseas')]/following-sibling::div[contains(@class, 'table')]//table//tbody//tr[1]/td[2]"

  staging:
    reject_if_missing:
      - course_name
