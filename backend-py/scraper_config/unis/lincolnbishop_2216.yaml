# Lincoln Bishop University
# Hostname: www.lincolnbishop.ac.uk
# Country: United Kingdom  |  Currency: GBP
# Slug: lincolnbishop
# Auto-generated: 2026-07-10
#
# This stub was created automatically on the first scrape of this university.
# Review and expand it to improve discovery and extraction quality.
# See scraper_config/defaults.yaml for all available options.

discovery:
  # The /courses listing page is fully static (no JS/render needed) and
  # lists all ~121 course detail links directly in the initial HTML — no
  # pagination exists. Default BFS heuristics were only finding 33 because
  # many of these slugs (e.g. /courses/heas, /courses/primed, /courses/ba-teachlearn)
  # don't look like course-detail pages to the generic classifier and were
  # being treated as category-landing/nav noise. force_candidate_url_patterns
  # promotes every /courses/<slug> URL straight to the candidate set,
  # bypassing that heuristic entirely.
  seed_urls:
    - https://www.lincolnbishop.ac.uk/courses
  allow_url_patterns:
    - ^https://www\.lincolnbishop\.ac\.uk/courses/(?!search$)[a-z0-9-]+$
  force_candidate_url_patterns:
    - ^https://www\.lincolnbishop\.ac\.uk/courses/(?!search$)[a-z0-9-]+$
  course_detail_url_patterns:
    - ^https://www\.lincolnbishop\.ac\.uk/courses/(?!search$)[a-z0-9-]+$
  bfs_page_budget: 10

extraction:
  fees:
    default_currency: GBP
  staging:
    # Lincoln Bishop course pages use bare subject titles as their H1
    # ("Business Management", "Criminology", "History with Foundation
    # Year", etc.) with NO leading/trailing degree-qualifier word (no
    # "BA (Hons)" prefix/suffix anywhere in the title). The generic
    # category-landing-page guard (_name_has_degree_qualifier) requires
    # such a qualifier and was rejecting 97/121 + 5 sweep-stage duplicates
    # = 102 of 107 skipped courses in job_e56a966a0fec (2026-07-10),
    # including obviously real single-course pages like "Business
    # Management", "Psychology", "Health & Social Care with Foundation
    # Year". Verified these are genuine course-detail pages (not category
    # listings) via live fetch + log trace of babusiness/business-marketing
    # etc. Non-course URLs are already excluded upstream by this uni's
    # narrow allow_url_patterns/course_detail_url_patterns (only
    # /courses/<slug> is ever a candidate), so disabling the name-based
    # qualifier check here carries no risk of admitting real listing pages.
    skip_degree_qualifier_check: true
  filters:
    online_only:
      # 4 courses (Primary Education with Qts [+Foundation Year], Pgce
      # Primary Full/Part-time) were wrongly rejected as online_only in
      # job_e56a966a0fec even though [FIELD SUMMARY] showed
      # StudyMode='On Campus' pre-Gemini and course_location='Lincoln' in
      # the final [FIELD TRACE]. Root cause: single_course.py's
      # no_location_online_override fires when course_location is blank
      # at browser-retry time and downgrades study_mode to "Online"; the
      # browser_location_restore that should undo this only re-checks
      # course_location at one point in the pipeline, but here
      # course_location was filled later by the AI/Gemini fallback pass,
      # after that restore check already ran — so the downgrade never got
      # reversed even though a real campus (Lincoln) was ultimately found.
      # Lincoln Bishop is a physical UK college with no genuinely
      # online-only undergraduate/PGCE/QTS programmes, so disabling this
      # filter for this university is safe until the pipeline ordering
      # bug is fixed upstream.
      enabled: false
