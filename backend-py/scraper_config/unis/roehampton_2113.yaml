# University of Roehampton
# Hostname: www.roehampton.ac.uk
# Country: United Kingdom  |  Currency: GBP
#
# Discovery: listing pages are JS-rendered (static HTML only shows nav links).
# Sitemap at /sitemap.xml has 200+ course URLs — always_sitemap_supplement is
# the primary discovery mechanism; BFS is a supplemental fallback.

discovery:
  always_sitemap_supplement: true
  sitemap_url: https://www.roehampton.ac.uk/sitemap.xml

  seed_urls:
    - https://www.roehampton.ac.uk/study/undergraduate-courses/
    - https://www.roehampton.ac.uk/study/postgraduate-taught-courses/
    - https://www.roehampton.ac.uk/study/postgraduate-research-courses/
    - https://www.roehampton.ac.uk/study/academic-areas/continuing-education/international-pathways/
    - https://www.roehampton.ac.uk/study/higher-technicals/
    - https://www.roehampton.ac.uk/study/apprenticeships/

  bfs_page_budget: 50
  max_candidates: 1500
  expected_min_courses: 150

  listing_only_patterns:
    - '/study/[^/]+/$'
    - '/study/[^/]+/[^/]+/$'
    - '/study/clearing'
    - '/study/open-days'
    - '/study/short-courses'
    - '/study/study-abroad'
    - '/study/foundation-studies'
    - '/study/unibuddy'
    - '/study/our-rankings'
    - '/study/our-subject-areas'
    - '/study/academic-areas/$'
    - '/study/academic-areas/[^/]+/$'

  # Course pages: /study/{level}-courses/{slug}/, /study/apprenticeships/{slug}/,
  # /study/higher-technicals/{slug}/,
  # /study/academic-areas/{area}/{sub}/{slug}/ (deep pathway courses)
  allow_url_patterns:
    - '/study/undergraduate-courses/[^/?#]+/?$'
    - '/study/postgraduate-taught-courses/[^/?#]+/?$'
    - '/study/postgraduate-research-courses/[^/?#]+/?$'
    - '/study/apprenticeships/[^/?#]+/?$'
    - '/study/higher-technicals/[^/?#]+/?$'
    - '/study/academic-areas/[^/]+/[^/]+/[^/?#]+/?$'
    - '/study/academic-areas/continuing-education/[^/]+/[^/]+/[^/?#]+/?$'

  course_detail_url_patterns:
    - '/study/undergraduate-courses/[^/?#]+/?$'
    - '/study/postgraduate-taught-courses/[^/?#]+/?$'
    - '/study/postgraduate-research-courses/[^/?#]+/?$'
    - '/study/apprenticeships/[^/?#]+/?$'
    - '/study/higher-technicals/[^/?#]+/?$'
    - '/study/academic-areas/[^/]+/[^/]+/[^/]+/[^/?#]+/?$'

  block_url_patterns:
    - '/apply'
    - '/contact'
    - '/news'
    - '/events'
    - '/blog'
    - '/about'
    - '/research'
    - '/alumni'
    - '/outreach'
    - '/parents'
    - '/jobs'
    - '/careers'
    - '/accommodation'
    - '/life-on-campus'
    - '/fees-and-funding'
    - '/international/living'
    - '/globalassets/'
    - '/study/clearing'
    - '/study/open-days'
    - '/study/short-courses'
    - '/study/study-abroad'
    - '/study/foundation-studies'
    - '/study/unibuddy'
    - '/study/our-rankings'
    - '/study/our-subject-areas'
    - '/staff'
    - '/facilities'
    - '/earth-day'
    - '/pgce-offer-holder-page'
    - '/law-clinic'
    - '/volunteering'
    - '\.(?:jpg|jpeg|png|gif|webp|svg|pdf)(?:\?|$)'

  use_browser: true

extraction:
  fees:
    default_currency: GBP
    prefer_international: true
    prefer_annual_over_total: true
    fee_year: "2025"
    fee_term: "year"
    reject_keywords:
      - "Home"
      - "UK student"
      - "Domestic"

  english:
    central_page: https://www.roehampton.ac.uk/international/entry-requirements/english-language-requirements/
    source: course_page

  filters:
    domestic_only:
      enabled: false
    online_only:
      enabled: false

  staging:
    skip_degree_qualifier_check: true
    reject_if_missing:
      - course_name
    require_international_fee: false
