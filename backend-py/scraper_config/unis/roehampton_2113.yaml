extraction:
  fees:
    default_currency: GBP
discovery:
  block_url_patterns:
  - /apply
  - /contact
  - /news
  - /events
  - /blog
  - /about
  - /research
  - /alumni
  - /outreach
  - /parents
  - /jobs
  - /careers
  - /accommodation
  - /life-on-campus
  - /fees-and-funding$
  - /international/living
  - /globalassets/
  - \.(?:jpg|jpeg|png|gif|webp|svg|pdf)(?:\?|$)
  allow_url_patterns:
  - /study/(?:$|\?(?:.*)?$)
  - /study/(?:undergraduate|postgraduate-taught-courses|postgraduate-research-courses)(?:/|$)
  - /study/(?:undergraduate|postgraduate-taught-courses|postgraduate-research-courses)/[^?#]+(?:/[^?#]+){0,3}(?:/|$)
