# University of Tasmania (UTAS)
# Hostname: www.utas.edu.au
# uni_id: 5 (prod)
#
# ── Browser behaviour (NOT in YAML schema — see per_course_browser.py) ──────
#
# UTAS is Cloudflare-protected. Static HTML is a JS challenge page so every
# useful field comes from the Playwright browser pass.
#
# per_course_browser.py hardcoded lists (host-scoped to utas.edu.au):
#   _INTERNATIONAL_TOGGLE_HOSTS — click the INTERNATIONAL tab before snapping
#       HTML. The Domestic tab is active by default; without the click, the
#       browser sees only CSP/HECS domestic fees.
#   _FORCE_BROWSER_HOSTS        — always run the browser even when IELTS is
#       already populated from static HTML.
#   _EXTENDED_EXTRACT_HOSTS     — run the full extractor suite (fee, location,
#       study_mode, intake, duration, english_test) on the rendered DOM, not
#       just english_test.
#   _NETWORKIDLE_HOSTS          — wait for networkidle + 3 s settle before the
#       toggle JS fires; domcontentloaded + 1.5 s was too short for UTAS's
#       JS tab panels to mount.
#
# These will be migrated to YAML once the schema adds browser_behavior fields.
# NOTE: these per_course_browser.py checks are keyed on the hostname, NOT on
# discovery mode — removing always_browser_discover: true does NOT disable them.
# Per-course extraction still runs the full Playwright browser pass.
#
# ── Text-level international section reorder (gemini_primary.py) ─────────────
#
# The Gemini step also has a text-level reorder (_promote_international_text)
# that moves the "International students" section before the "Domestic students"
# / CSP/HECS anchors in the flat plain-text passed to Gemini.  This is a
# belt-and-suspenders fix for the cases where the browser tab-click misses
# (e.g. Cloudflare CAPTCHA, tab not mounted yet).
#
# ── Discovery strategy (UPDATED — Funnelback search via Scrape.do) ───────────
#
# PREVIOUS approach (always_browser_discover — REMOVED):
#   Playwright browser visited /courses/undergraduate + /courses/postgraduate.
#   These pages use INFINITE SCROLL — the browser only captures the initial DOM
#   (~84 UG + 103 PG = 184 courses). Further courses require scrolling, which
#   the BFS browser cannot do.
#
#   Funnelback search seeds were also tried but returned +0 course links: the
#   browser ran from a DATACENTER IP, so Cloudflare JS-challenged the initial
#   page load AND blocked any XHR/fetch requests made by the Funnelback JS,
#   preventing the async course-card JSON from loading.
#
#   Result: 187/605 courses discovered.
#
# NEW approach (Scrape.do + paginated Funnelback search):
#   UTAS's Funnelback search (https://www.utas.edu.au/search) returns all
#   UG + PG courses in paginated HTML. Each page is fetched via Scrape.do
#   (residential IP + headless Chrome), which:
#     1. Bypasses Cloudflare (residential IP ≠ datacenter block)
#     2. Executes JavaScript, allowing Funnelback's async AJAX to complete
#     3. Returns fully-rendered HTML with all course result cards + links
#
#   13 paginated seeds (num_ranks=50) cover all 605 courses:
#     page 1  → results 1–50    (start_rank=1)
#     page 2  → results 51–100  (start_rank=51)
#     ...
#     page 13 → results 601–605 (start_rank=601)
#
#   WHY num_ranks=50 (changed from 100):
#     With num_ranks=100, Scrape.do's DOM-stable snapshot fires before all
#     100 result cards are in the viewport / lazy-loaded.  Observed: only
#     ~97/100 cards captured per page, plus ~15 sidebar-course links shared
#     across all pages introduce cross-page dedup.  Net: 549/605 courses
#     discovered.  Halving to 50 keeps all cards above-the-fold and
#     eliminates the rendering gap → target ≥605 raw candidates.
#
#   Discovery config:
#     scrape_do_skip_fallbacks: true — skip httpx/cffi datacenter tiers
#     scrape_do_render: true         — headless Chrome in Scrape.do (residential)
#     bfs_page_budget: 16            — 13 Funnelback seeds + 3 buffer (no deep BFS)
#     use_wayback: false             — no Wayback benefit; saves latency
#     listing_only_patterns: /search\\? — search pages visited for links only
#
#   Per-course extraction is UNCHANGED:
#     max_parallel_fetch: 1 (Cloudflare 429 at 2+)
#     per_course_browser.py hardcoded checks still apply (hostname-keyed)
#
# If SCRAPE_DO_TOKEN is unset, fall back to always_browser_discover: true with
# the original listing seeds (adds ~420 browser budget), recovering ~187 courses.

discovery:
  # Scrape.do residential proxy for Funnelback search discovery.
  # Skip httpx + curl_cffi datacenter fetches — both get Cloudflare-challenged.
  # render: true is required because Funnelback loads course cards via async AJAX
  # (the datacenter-IP browser couldn't reach the AJAX endpoint; Scrape.do can).
  scrape_do_skip_fallbacks: true
  scrape_do_render: true

  # Each Scrape.do render call takes ~20-30s. Seeds are prefetched CONCURRENTLY
  # so wall-clock discovery time ≈ slowest single render (not sum).
  # bfs_page_budget: 16 — 13 seeds + 3 buffer; BFS does not follow links from
  # course detail pages (course URLs are added as candidates, not BFS targets).
  bfs_page_budget: 16

  use_wayback: false

  # Paginated Funnelback search — 50 results per page, 13 pages for ~605 courses.
  #
  # WHY num_ranks=50 (not 100):
  #   With num_ranks=100, Scrape.do captures only ~97/100 result cards per page
  #   (the remainder are below the initial render viewport or lazy-load after
  #   Scrape.do's DOM-stable snapshot fires).  Each page also shares ~15 sidebar/
  #   featured course links with other pages; those duplicates reduce net-new
  #   candidates.  Combined effect: 7 × 100 seeds → 549 raw candidates instead
  #   of 605.  Halving to 50 results/page ensures every card is above-the-fold
  #   in the initial render, eliminating both the rendering gap and most of the
  #   cross-page sidebar overlap.
  #
  # URL decoded:
  #   query= (empty → all courses)
  #   f.Tabs|utas|ds-handbook-courses,utas|ds-short-courses = Courses
  #   f.Course+Level|courseLevel = Postgraduate + Undergraduate
  #   collection = utas|sp-search
  #   num_ranks=50, start_rank=1…601 (13 pages × 50 = 650 slots → covers 605)
  seed_urls:
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Postgraduate&f.Course+Level%7CcourseLevel=Undergraduate&collection=utas%7Esp-search&num_ranks=50&start_rank=1"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Postgraduate&f.Course+Level%7CcourseLevel=Undergraduate&collection=utas%7Esp-search&num_ranks=50&start_rank=51"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Postgraduate&f.Course+Level%7CcourseLevel=Undergraduate&collection=utas%7Esp-search&num_ranks=50&start_rank=101"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Postgraduate&f.Course+Level%7CcourseLevel=Undergraduate&collection=utas%7Esp-search&num_ranks=50&start_rank=151"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Postgraduate&f.Course+Level%7CcourseLevel=Undergraduate&collection=utas%7Esp-search&num_ranks=50&start_rank=201"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Postgraduate&f.Course+Level%7CcourseLevel=Undergraduate&collection=utas%7Esp-search&num_ranks=50&start_rank=251"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Postgraduate&f.Course+Level%7CcourseLevel=Undergraduate&collection=utas%7Esp-search&num_ranks=50&start_rank=301"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Postgraduate&f.Course+Level%7CcourseLevel=Undergraduate&collection=utas%7Esp-search&num_ranks=50&start_rank=351"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Postgraduate&f.Course+Level%7CcourseLevel=Undergraduate&collection=utas%7Esp-search&num_ranks=50&start_rank=401"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Postgraduate&f.Course+Level%7CcourseLevel=Undergraduate&collection=utas%7Esp-search&num_ranks=50&start_rank=451"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Postgraduate&f.Course+Level%7CcourseLevel=Undergraduate&collection=utas%7Esp-search&num_ranks=50&start_rank=501"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Postgraduate&f.Course+Level%7CcourseLevel=Undergraduate&collection=utas%7Esp-search&num_ranks=50&start_rank=551"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Postgraduate&f.Course+Level%7CcourseLevel=Undergraduate&collection=utas%7Esp-search&num_ranks=50&start_rank=601"

  # Mark Funnelback search pages as listing-only: BFS visits them to extract
  # course links but does NOT add them to the course candidate set.
  listing_only_patterns:
    - "/search\\?"

  # Only keep URLs matching UTAS's canonical course-page pattern:
  #   /courses/<faculty>/courses/<code>-<name>
  # Prevents BFS from adding nav/footer/staff links as course candidates.
  allow_url_patterns:
    - "/courses/[^/]+/courses/"       # current format: /courses/<faculty>/courses/<code>
    - "/courses/\\d{4}/[^/]+/courses/" # Wayback-archived legacy format (pre-2016)

  # Drop domestic-only and non-course URLs discovered from Funnelback pages.
  block_url_patterns:
    - "-domestic(?:/|$)"
    - "/study/undergraduate"

  extra_course_urls:
    # Master of Teaching — under arts-soc which returns 403 for plain HTTP.
    # Belt-and-suspenders: injected unconditionally after all discovery tiers.
    - https://www.utas.edu.au/courses/arts-soc/courses/e7g-master-of-teaching

extraction:
  # When every extractor returns blank course_location (common on browser-fetched
  # partial HTML from arts-soc / health faculties), fall back to "Hobart" so the
  # UTAS-specific blank-location online guard does not reject valid on-campus courses.
  default_course_location: "Hobart"
  # Cap concurrent browser sessions to 1 to avoid Cloudflare 429 rate-limiting.
  # UTAS's Cloudflare blocks even 2 simultaneous browser sessions with 600s cooldowns;
  # 1 sequential session eliminates 429s entirely at a modest speed cost.
  max_parallel_fetch: 1
  fees:
    # UTAS publishes international fees on a central schedule, not on each course
    # page.  Without this flag, courses whose browser-rendered HTML does not
    # surface the fee table are rejected by the no_international_fee staging gate
    # (~43/84 courses per run).  With this flag they pass to the review queue so
    # a reviewer can fill the fee from the central schedule.
    force_central_fee_stage: true
  filters:
    domestic_only:
      enabled: true   # UTAS lists some domestic-only short courses; drop them.
