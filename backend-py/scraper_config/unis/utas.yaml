# University of Tasmania (UTAS)
# Hostname: www.utas.edu.au
# uni_id: 5 (prod)
#
# ── Browser behaviour (NOT in YAML schema — see per_course_browser.py) ──────
#
# UTAS is Cloudflare-protected. Static HTML is a JS challenge page so every
# useful field comes from the Playwright browser pass.
#
# per_course_browser.py hardcoded lists (host-scoped to utas.edu.au):
#   _INTERNATIONAL_TOGGLE_HOSTS — click the INTERNATIONAL tab before snapping
#       HTML. The Domestic tab is active by default; without the click, the
#       browser sees only CSP/HECS domestic fees.
#   _FORCE_BROWSER_HOSTS        — always run the browser even when IELTS is
#       already populated from static HTML.
#   _EXTENDED_EXTRACT_HOSTS     — run the full extractor suite (fee, location,
#       study_mode, intake, duration, english_test) on the rendered DOM, not
#       just english_test.
#   _NETWORKIDLE_HOSTS          — wait for networkidle + 3 s settle before the
#       toggle JS fires; domcontentloaded + 1.5 s was too short for UTAS's
#       JS tab panels to mount.
#
# These will be migrated to YAML once the schema adds browser_behavior fields.
# NOTE: these per_course_browser.py checks are keyed on the hostname, NOT on
# discovery mode — removing always_browser_discover: true does NOT disable them.
# Per-course extraction still runs the full Playwright browser pass.
#
# ── Text-level international section reorder (gemini_primary.py) ─────────────
#
# The Gemini step also has a text-level reorder (_promote_international_text)
# that moves the "International students" section before the "Domestic students"
# / CSP/HECS anchors in the flat plain-text passed to Gemini.  This is a
# belt-and-suspenders fix for the cases where the browser tab-click misses
# (e.g. Cloudflare CAPTCHA, tab not mounted yet).
#
# ── Discovery strategy (UPDATED — Funnelback search via Scrape.do) ───────────
#
# PREVIOUS approach (always_browser_discover — REMOVED):
#   Playwright browser visited /courses/undergraduate + /courses/postgraduate.
#   These pages use INFINITE SCROLL — the browser only captures the initial DOM
#   (~84 UG + 103 PG = 184 courses). Further courses require scrolling, which
#   the BFS browser cannot do.
#
#   Funnelback search seeds were also tried but returned +0 course links: the
#   browser ran from a DATACENTER IP, so Cloudflare JS-challenged the initial
#   page load AND blocked any XHR/fetch requests made by the Funnelback JS,
#   preventing the async course-card JSON from loading.
#
#   Result: 187/605 courses discovered.
#
# NEW approach (Scrape.do + paginated Funnelback search):
#   UTAS's Funnelback search (https://www.utas.edu.au/search) returns all
#   UG + PG courses in paginated HTML. Each page is fetched via Scrape.do
#   (residential IP + headless Chrome), which:
#     1. Bypasses Cloudflare (residential IP ≠ datacenter block)
#     2. Executes JavaScript, allowing Funnelback's async AJAX to complete
#     3. Returns fully-rendered HTML with all course result cards + links
#
#   13 paginated seeds (num_ranks=50) cover all 605 courses:
#     page 1  → results 1–50    (start_rank=1)
#     page 2  → results 51–100  (start_rank=51)
#     ...
#     page 13 → results 601–605 (start_rank=601)
#
#   WHY num_ranks=50 + scrape_do_wait_for_ms=8000 (not 61 seeds at num_ranks=10):
#     Attempt 1 — num_ranks=50, waitFor=3000ms, 13 seeds:
#       Only ~38/50 cards rendered per page → 499 courses found.
#       Root cause: 3000ms not enough for Funnelback to lazy-load all 50 cards.
#     Attempt 2 — num_ranks=10, waitFor=3000ms, 61 seeds:
#       FAILED: 61 seeds / 4 concurrent = 16 batches × ~25s = 400s → exceeds
#       300s discovery deadline (same "Discovery phase exceeded 300s" error).
#     Fix — num_ranks=50, waitFor=8000ms, 13 seeds:
#       13 seeds / 4 concurrent = 4 batches × ~33s = ~132s → safely within 300s.
#       8 s waitFor gives Funnelback enough time to load all 50 cards.
#       scrape_do_wait_for_ms is a new per-uni YAML field wired through
#       schema.py + http_fetcher.py (was previously hardcoded to 3000ms).
#
#   Discovery config:
#     scrape_do_skip_fallbacks: true   — skip httpx/cffi datacenter tiers
#     scrape_do_render: true           — headless Chrome in Scrape.do (residential)
#     scrape_do_wait_for_ms: 8000      — 8 s waitFor to capture all 50 lazy-loaded cards
#     bfs_page_budget: 17              — 13 Funnelback seeds + 4 buffer (no deep BFS)
#     use_wayback: false               — no Wayback benefit; saves latency
#     listing_only_patterns: /search\\? — search pages visited for links only
#
#   Per-course extraction is UNCHANGED:
#     max_parallel_fetch: 1 (Cloudflare 429 at 2+)
#     per_course_browser.py hardcoded checks still apply (hostname-keyed)
#
# If SCRAPE_DO_TOKEN is unset, fall back to always_browser_discover: true with
# the original listing seeds (adds ~420 browser budget), recovering ~187 courses.

discovery:
  # Scrape.do residential proxy for Funnelback search discovery.
  # Skip httpx + curl_cffi datacenter fetches — both get Cloudflare-challenged.
  # render: true is required because Funnelback loads course cards via async AJAX
  # (the datacenter-IP browser couldn't reach the AJAX endpoint; Scrape.do can).
  scrape_do_skip_fallbacks: true
  scrape_do_render: true

  # 7 seeds / 4 concurrent = 2 batches × ~35s normal / 90s worst-case = ~70–180s.
  # Well under the 600s deadline even if Cloudflare blocks every IP on the first
  # attempt (Scrape.do retries exhaust at 90s/call → 2 × 90s = 180s ≪ 600s).
  #
  # WHY 7 seeds (num_ranks=100, NO On Campus filter) — previous attempts:
  #   Attempt 1 — On Campus filter, 4 seeds (start_rank=1/101/201/301):
  #     Only 99 courses found total. The filter URL was wrong — "On Campus"
  #     matched far fewer courses than expected (99, not ~391).
  #     Reverted to no filter covering all 605 UG+PG courses.
  #   Attempt 2 (current) — No filter, num_ranks=100, 7 seeds:
  #     7 seeds / 4 concurrent = 2 batches. Worst-case 2 × 90s = 180s.
  #     discovery_phase_timeout_s: 600 gives 3× headroom.
  #
  # Note: the original 13-seed config (num_ranks=50) timed out because
  # 13/4 = 4 batches × 90s = 360s > 300s deadline. Switching to num_ranks=100
  # halves the seed count to 7 (2 batches) and keeps within the 600s budget.
  bfs_page_budget: 12

  # Per-page: wait 12 s after initial load so all 100 Funnelback cards lazy-load.
  scrape_do_wait_for_ms: 12000

  # 2 batches × 90s worst-case = 180s. 600s gives 3× headroom for retries.
  discovery_phase_timeout_s: 600

  use_wayback: false

  # Paginated Funnelback search — 100 results per page, 7 pages for 605 courses.
  #
  # URL decoded:
  #   query= (empty → all courses)
  #   f.Tabs|utas|ds-handbook-courses,utas|ds-short-courses = Courses
  #   f.Course Level|courseLevel = Undergraduate + Postgraduate
  #   collection = utas|sp-search
  #   num_ranks=100, start_rank=1…601 (7 pages × 100 = 700 slots → covers 605)
  seed_urls:
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Undergraduate&f.Course+Level%7CcourseLevel=Postgraduate&collection=utas%7Esp-search&num_ranks=100&start_rank=1"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Undergraduate&f.Course+Level%7CcourseLevel=Postgraduate&collection=utas%7Esp-search&num_ranks=100&start_rank=101"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Undergraduate&f.Course+Level%7CcourseLevel=Postgraduate&collection=utas%7Esp-search&num_ranks=100&start_rank=201"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Undergraduate&f.Course+Level%7CcourseLevel=Postgraduate&collection=utas%7Esp-search&num_ranks=100&start_rank=301"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Undergraduate&f.Course+Level%7CcourseLevel=Postgraduate&collection=utas%7Esp-search&num_ranks=100&start_rank=401"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Undergraduate&f.Course+Level%7CcourseLevel=Postgraduate&collection=utas%7Esp-search&num_ranks=100&start_rank=501"
    - "https://www.utas.edu.au/search?query=&f.Tabs%7Cutas%7Eds-handbook-courses%2Cutas%7Eds-short-courses=Courses&f.Course+Level%7CcourseLevel=Undergraduate&f.Course+Level%7CcourseLevel=Postgraduate&collection=utas%7Esp-search&num_ranks=100&start_rank=601"

  # Mark Funnelback search pages as listing-only: BFS visits them to extract
  # course links but does NOT add them to the course candidate set.
  listing_only_patterns:
    - "/search\\?"

  # Only keep URLs matching UTAS's canonical course-page pattern:
  #   /courses/<faculty>/courses/<code>-<name>
  # Prevents BFS from adding nav/footer/staff links as course candidates.
  allow_url_patterns:
    - "/courses/[^/]+/courses/"       # current format: /courses/<faculty>/courses/<code>
    - "/courses/\\d{4}/[^/]+/courses/" # Wayback-archived legacy format (pre-2016)

  # Drop domestic-only and non-course URLs discovered from Funnelback pages.
  block_url_patterns:
    - "-domestic(?:/|$)"
    - "/study/undergraduate"

  # Funnelback still returns stale ?year=2025/2026 variants for some courses.
  # UTAS's yearless canonical URL resolves to the latest published entry year
  # (currently 2027), so strip the selector before deduplication and extraction.
  strip_query_parameters:
    - "year"

  extra_course_urls:
    # Master of Teaching — under arts-soc which returns 403 for plain HTTP.
    # Belt-and-suspenders: injected unconditionally after all discovery tiers.
    - https://www.utas.edu.au/courses/arts-soc/courses/e7g-master-of-teaching

extraction:
  # Use Scrape.do residential render for per-course pages instead of local Playwright.
  # Evidence: M7D returned 139KB static HTML with full international fee + IELTS in
  # the DOM (hidden CSS panel, not behind a JS tab-click). Gemini extracts all fields
  # from the raw HTML text without needing the International tab to be clicked visually.
  # Scrape.do render (~3s/call, residential IP) replaces Playwright (~18s/call,
  # datacenter IP that Cloudflare rate-limits to 1 concurrent session).
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  # A failed provider call must release one of the eight extraction slots quickly
  # enough for the 463-course catalogue to remain below the 30-minute job target.
  per_course_timeout_seconds: 20
  # Local Playwright uses the same blocked datacenter route and cannot safely
  # improve rendered Scrape.do HTML, so do not spend another 10-60s rescuing it.
  skip_browser_rescue: true
  skip_per_course_browser: true
  # 5s gives enough time for Funnelback panels / lazy CSS to fully load.
  # Tab panels with domestic/international sections are SSR'd in the initial HTML
  # but some CSS class toggling happens post-load; wait_for_ms ensures the final
  # DOM state is captured.
  scrape_do_wait_for_ms: 5000
  # Scrape.do residential IPs are per-request (different IP each call), so
  # multiple concurrent extractions don't share a rate-limit window. 8 concurrent
  # gives ~3-4 min total for 358 courses (vs ~140 min sequential Playwright).
  max_parallel_fetch: 8
  # Preserve transient provider failures for a small sequential second chance
  # without allowing the end-of-job sweep to erase the primary-pass time saving.
  recovery_sweep_max_items: 24
  recovery_sweep_time_budget_seconds: 120
  recovery_sweep_delay_seconds: 1
  default_course_location: "Hobart"
  fees:
    # UTAS publishes international fees on a central schedule, not on each course
    # page.  Without this flag, courses whose browser-rendered HTML does not
    # surface the fee table are rejected by the no_international_fee staging gate
    # (~43/84 courses per run).  With this flag they pass to the review queue so
    # a reviewer can fill the fee from the central schedule.
    force_central_fee_stage: true
  filters:
    domestic_only:
      enabled: true   # UTAS lists some domestic-only short courses; drop them.
