# University of Tasmania (UTAS)
# Hostname: www.utas.edu.au
# uni_id: 5 (prod)
#
# ── Browser behaviour (NOT in YAML schema — see per_course_browser.py) ──────
#
# UTAS is Cloudflare-protected. Static HTML is a JS challenge page so every
# useful field comes from the Playwright browser pass.
#
# per_course_browser.py hardcoded lists (host-scoped to utas.edu.au):
#   _INTERNATIONAL_TOGGLE_HOSTS — click the INTERNATIONAL tab before snapping
#       HTML. The Domestic tab is active by default; without the click, the
#       browser sees only CSP/HECS domestic fees.
#   _FORCE_BROWSER_HOSTS        — always run the browser even when IELTS is
#       already populated from static HTML.
#   _EXTENDED_EXTRACT_HOSTS     — run the full extractor suite (fee, location,
#       study_mode, intake, duration, english_test) on the rendered DOM, not
#       just english_test.
#   _NETWORKIDLE_HOSTS          — wait for networkidle + 3 s settle before the
#       toggle JS fires; domcontentloaded + 1.5 s was too short for UTAS's
#       JS tab panels to mount.
#
# These will be migrated to YAML once the schema adds browser_behavior fields.
#
# ── Text-level international section reorder (gemini_primary.py) ─────────────
#
# The Gemini step also has a text-level reorder (_promote_international_text)
# that moves the "International students" section before the "Domestic students"
# / CSP/HECS anchors in the flat plain-text passed to Gemini.  This is a
# belt-and-suspenders fix for the cases where the browser tab-click misses
# (e.g. Cloudflare CAPTCHA, tab not mounted yet).
#
# ── Discovery strategy ────────────────────────────────────────────────────────
#
# UTAS has 609 UG+PG courses in total.  The main listing pages
# (/courses/undergraduate, /courses/postgraduate) load only a JS-rendered
# initial subset (106 UG + 78 PG = 184 total) — further courses require
# scroll/pagination interaction.  Faculty listing pages
# (/courses/arts-soc, /courses/health, etc.) surface the same subset and
# add 0 net-new courses beyond the two main listings.
#
# Previous approach (Funnelback seeds) — REMOVED:
#   7 Funnelback search pages (/search?collection=utas~sp-search&...) were
#   seeded as YAML seed_urls to discover all 609 courses.  In live runs each
#   page takes ~110 s and returns +0 course links: the Funnelback results are
#   rendered asynchronously via JavaScript AFTER the initial page load; the
#   browser snaps the DOM before the course cards appear, so no links matching
#   the /courses/<faculty>/courses/ pattern are found.  7 pages × ~110 s =
#   ~770 s wasted, blowing the 420 s budget before BFS nav even starts.
#
# Current approach:
#   Rely on the two working listing seeds plus the 8 hardcoded faculty seeds.
#   With Funnelback removed the seed phase finishes in ~120 s, leaving ~300 s
#   of BFS nav budget to explore pagination links discovered from the main
#   listing pages.  This recovers as many courses as BFS nav can find.
#
# Time budget: 2 listing seeds (~20 s each) + 8 faculty seeds (~10 s each)
#   = ~120 s for seeds.  Set budget to 480 s to give BFS nav ~360 s of
#   exploration time after seeds complete.
#
# browser_early_stop_courses: keep at 700 so discovery does not abort before
#   all BFS nav pages are visited.

discovery:
  always_browser_discover: true   # Playwright is primary; plain HTTP blocked by CF

  # 480 s total: ~120 s for working seeds + ~360 s for BFS nav exploration.
  browser_time_budget_s: 480

  # Do not abort BFS nav early — expect up to 600+ courses if pagination found.
  browser_early_stop_courses: 700

  seed_urls:
    # ── Primary listing pages (known-good — 184 courses) ─────────────────────
    - "https://www.utas.edu.au/courses/undergraduate"
    - "https://www.utas.edu.au/courses/postgraduate"

  # Only keep URLs that match the canonical UTAS course-page pattern
  # (/courses/<faculty>/courses/<code>-<name>).  Browser discovery sweeps
  # nav links and can pick up /study/pathways-to-university,
  # /study/work-integrated-learning, etc. — these consume semaphore slots
  # and trigger 429s without ever yielding a stageable course.
  allow_url_patterns:
    - "/courses/[^/]+/courses/"       # current format: /courses/<faculty>/courses/<code>
    - "/courses/\\d{4}/[^/]+/courses/" # Wayback-archived legacy format (pre-2016): /courses/2015/<faculty>/courses/<code>

  # Drop URLs whose path ends with "-domestic" — UTAS appends this suffix to
  # domestic-only course pages (e.g. 35a2-graduate-certificate-in-business-studies-domestic).
  # These are never international-student courses so they waste a browser slot
  # and can trigger a 429 cooldown.  Applied at Phase A.5b (after browser-discovery
  # merge) in addition to the BFS-phase discovery.py block.
  block_url_patterns:
    - "-domestic(?:/|$)"
    # UTAS undergraduate discipline hub — category listing page, not a
    # course detail page.  Previously a global block in discovery.py and
    # guards.py; moved here so it only affects UTAS.
    # (belt-and-suspenders: allow_url_patterns above already restricts
    # UTAS to /courses/<faculty>/courses/<slug> paths, so this would only
    # fire if allow_url_patterns were ever removed.)
    - "/study/undergraduate"

  extra_course_urls:
    # Master of Teaching — under arts-soc which returns 403 for plain HTTP.
    # Belt-and-suspenders: injected unconditionally after all discovery tiers.
    - https://www.utas.edu.au/courses/arts-soc/courses/e7g-master-of-teaching

extraction:
  # When every extractor returns blank course_location (common on browser-fetched
  # partial HTML from arts-soc / health faculties), fall back to "Hobart" so the
  # UTAS-specific blank-location online guard does not reject valid on-campus courses.
  default_course_location: "Hobart"
  # Cap concurrent browser sessions to 1 to avoid Cloudflare 429 rate-limiting.
  # UTAS's Cloudflare blocks even 2 simultaneous browser sessions with 600s cooldowns;
  # 1 sequential session eliminates 429s entirely at a modest speed cost.
  max_parallel_fetch: 1
  fees:
    # UTAS publishes international fees on a central schedule, not on each course
    # page.  Without this flag, courses whose browser-rendered HTML does not
    # surface the fee table are rejected by the no_international_fee staging gate
    # (~43/84 courses per run).  With this flag they pass to the review queue so
    # a reviewer can fill the fee from the central schedule.
    force_central_fee_stage: true
  filters:
    domestic_only:
      enabled: true   # UTAS lists some domestic-only short courses; drop them.
