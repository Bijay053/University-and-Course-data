# The University of Portsmouth
# Hostname: www.port.ac.uk
# Country: United Kingdom  |  Currency: GBP
#
# Discovery notes (2026-06-19):
#   - Course listing at /study/courses is a JS-rendered Algolia search interface.
#     Headless Chrome (render_listing_pages) returns 0 course hrefs — Algolia
#     renders course cards in the DOM but <a href> links use JS navigation,
#     not plain anchors. render_listing_pages produced 0 new candidates.
#   - BFS via subject area pages (/study/subject-area/*) found 113 courses but
#     there are more subject areas than fit in the BFS page budget.
#   - Fix: sitemap page 2 (https://www.port.ac.uk/sitemap.xml?page=2) contains
#     419 top-level course pages (233 UG + 186 PG taught). Use
#     always_sitemap_supplement to run sitemap unconditionally (BFS finds ~113
#     course-like links via /study/subject-area/*, which is >= the 5-link
#     threshold, so the automatic sitemap fallback never fires alone).
#   - allow_url_patterns tightened to depth-4 URLs only (exactly 2 segments
#     after /study/courses/), blocking sub-pages like
#     /study/courses/postgraduate-taught/<slug>/applying-for-...

discovery:
  # Explicit sitemap URL — page 2 has 419 top-level course pages.
  sitemap_url: 'https://www.port.ac.uk/sitemap.xml?page=2'

  # REQUIRED: BFS finds ~113 /study/subject-area/* course links which are
  # >= the 5-link sitemap-fallback threshold, so automatic sitemap fallback
  # never fires.  always_sitemap_supplement forces the sitemap to run
  # unconditionally and its 419 URLs merge with BFS results.
  always_sitemap_supplement: true

  # Raise candidate cap to hold sitemap URLs + BFS candidates combined.
  max_candidates: 500

  # Accept only depth-4 course pages: /study/courses/<type>/<slug>
  # Pattern: exactly 2 path segments after /study/courses/ with optional
  # trailing slash → blocks sub-pages (depth 5+) and category pages (depth 3).
  allow_url_patterns:
    - 'port\.ac\.uk/study/courses/[^/]+/[^/]+/?$'

extraction:
  # Portsmouth course pages often have /fees/ and /entry-requirements/ sub-tabs
  # as separate URLs — follow them to fill missing fee and IELTS fields.
  follow_admission_links: true
  max_admission_linked_pages: 3

  fees:
    default_currency: GBP
  filters:
    online_only:
      enabled: false
  staging:
    skip_degree_qualifier_check: true
    require_international_fee: false
