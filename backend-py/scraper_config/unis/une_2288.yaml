# University of New England (UNE) — www.une.edu.au  (uni_id=2288)
#
# ── CLOUDFLARE ENTERPRISE BLOCK ──────────────────────────────────────────────
# All three transports (plain httpx, curl_cffi, direct) return 403 with
# cf-ray headers — same pattern as Cardiff and Kingston.
# All fetches must go through Scrape.do residential proxy pool.
#
# ── DISCOVERY STRATEGY ───────────────────────────────────────────────────────
# Listing page (/study/study-options/courses) is a React SPA — courses are
# XHR-loaded as JSON, so BFS finds 0 course links even with render=true.
#
# UNE has a dedicated course sub-sitemap:
#   https://www.une.edu.au/cauc-static/study/sitemap.xml  → 198 course URLs
# Course URL pattern: /study/courses/{year}/{slug}
#   e.g. /study/courses/2025/bachelor-of-science
#
# Discovery flow:
#   BFS (budget=0, skipped) → sitemap fallback (budget=0 means 0<5 threshold
#   always fires) → fetches sitemap_url directly → 198 candidates ✅
#
# The large main sitemap (sitemap.xml, 6532 entries, 0 course URLs) and the
# sitemap_index traversal are avoided entirely by pointing sitemap_url to the
# course-specific sub-sitemap.  This keeps the single sitemap probe fast
# (~3-5s via Scrape.do static) and well within the 300s discovery budget.
#
# ── EXTRACTION STRATEGY ──────────────────────────────────────────────────────
# single_course.py appends ?international=true to all /study/courses/ URLs
# automatically.  Scrape.do render=true fetches each course page via headless
# Chrome through Scrape.do's residential IP pool, bypassing CF Enterprise 403.

discovery:
  # Route ALL discovery fetches through Scrape.do.
  # Plain httpx / curl_cffi both return 403.
  scrape_do_skip_fallbacks: true
  # render=true for per-course page fetching during extraction.
  # Sitemap XML itself is fetched statically (cheaper + faster).
  scrape_do_render: true

  seed_urls:
    - https://www.une.edu.au/study/study-options/courses

  # Point directly at the course-specific sub-sitemap.
  # Avoids probing the 6532-entry main sitemap.xml and sitemap_index.xml.
  sitemap_url: https://www.une.edu.au/cauc-static/study/sitemap.xml

  # Course pages are under /study/courses/{year}/{slug}.
  allow_url_patterns:
    - /study/courses/

  block_url_patterns:
    - /study/courses?
    - /news
    - /events
    - /staff/
    - /about
    - /contact

  # Skip BFS entirely: the listing page is a React SPA with XHR-loaded courses.
  bfs_page_budget: 0

  # Disable the always-on supplement to prevent double-probing the sitemap.
  # With budget=0, BFS always yields 0 < 5 threshold, which already triggers
  # the sitemap fallback.  Running the supplement on top causes a second full
  # sitemap probe that times out on sitemap-study-pages.xml.
  always_sitemap_supplement: false

  # CDX not needed — the cauc-static/study/sitemap.xml already covers all 198+
  # courses.  Keeping CDX disabled avoids the extra network round-trip.
  use_wayback: false

extraction:
  # Scrape.do headless Chrome (residential IP) bypasses CF Enterprise 403.
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  skip_browser_rescue: true

  # Lower parallelism — render calls are ~4-6s each via Scrape.do.
  max_parallel_fetch: 3

  fees:
    default_currency: AUD

  filters:
    domestic_only:
      enabled: false
