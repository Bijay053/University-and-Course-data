# University of New England (UNE) — www.une.edu.au  (uni_id=2288)
#
# ── CLOUDFLARE ENTERPRISE BLOCK ──────────────────────────────────────────────
# All three transports (plain httpx, curl_cffi, direct) return 403 with
# cf-ray headers on EVERY path — homepage, listing, course pages, sitemap.
# Identical pattern to Cardiff (2194) and Kingston (2193).
#
# Fix: route ALL fetches through Scrape.do residential proxy pool, which
# bypasses Cloudflare Enterprise bot-management.
#
# ── DISCOVERY STRATEGY ───────────────────────────────────────────────────────
# Course URL pattern (confirmed via Wayback CDX):
#   /study/courses/{year}/{course-slug}
#   e.g. /study/courses/2025/bachelor-of-science
#
# Listing page: https://www.une.edu.au/study/study-options/courses
# This is a React SPA — even Scrape.do render=true finds ZERO course links
# because courses are XHR-loaded as JSON, not injected as <a> tags.
# BFS is skipped (bfs_page_budget: 0) to avoid burning the 300s budget.
#
# Primary discovery: Wayback Machine CDX API (use_wayback: true).
# wayback_discover.py _HOST_CDX_URL_PREFIX maps www.une.edu.au →
#   www.une.edu.au/study/courses/* so CDX returns only course pages.
# CDX runs with the 45s timeout + 3-attempt retry logic in wayback_discover.py.
# Year blocks are removed so CDX results for ANY year (2021–2026) pass through;
# the year-dedup pipeline normalises duplicates downstream.
#
# ── EXTRACTION STRATEGY ──────────────────────────────────────────────────────
# single_course.py (line 1337) already appends ?international=true to all
# /study/courses/ URLs automatically — no YAML change needed.
# Scrape.do render=true fetches each course page through headless Chrome via
# Scrape.do's residential IP pool, bypassing the CF Enterprise 403.
# skip_browser_rescue: true prevents datacenter Playwright (also 403).

discovery:
  # Route ALL discovery fetches through Scrape.do.
  # Plain httpx / curl_cffi both return 403 — skip them entirely.
  scrape_do_skip_fallbacks: true
  # Use headless Chrome render for per-course page fetching.
  # BFS skips the listing page anyway (budget=0), but render=true is needed
  # for any BFS fallback pages the sitemap might produce.
  scrape_do_render: true

  seed_urls:
    - https://www.une.edu.au/study/study-options/courses

  # Course pages are under /study/courses/{year}/{slug}.
  allow_url_patterns:
    - /study/courses/

  block_url_patterns:
    # Filter and search utility pages (not year-cohort blocks — CDX results
    # for any year are allowed; year-dedup handles duplicates downstream).
    - /study/courses?
    - /news
    - /events
    - /staff/
    - /about
    - /contact

  # Skip BFS entirely: the listing page is a React SPA that renders 0 course
  # links even with Scrape.do headless Chrome. Saving all 300s for Wayback CDX.
  bfs_page_budget: 0

  # Supplement with sitemap (tries quickly, fails gracefully — UNE has none).
  always_sitemap_supplement: true

  # Use Wayback CDX as the primary discovery mechanism (supplemental=True means
  # CDX always runs regardless of BFS results). See _HOST_CDX_URL_PREFIX in
  # wayback_discover.py for the www.une.edu.au → /study/courses/* prefix.
  use_wayback: true

extraction:
  # Scrape.do headless Chrome (residential IP) bypasses CF Enterprise 403.
  # skip_fallbacks: true skips the doomed httpx/cffi datacenter attempts.
  # skip_browser_rescue: true prevents datacenter Playwright (also 403).
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  skip_browser_rescue: true

  # Lower parallelism — render calls are ~4-6s each via Scrape.do.
  max_parallel_fetch: 3

  fees:
    default_currency: AUD

  filters:
    domestic_only:
      enabled: false
