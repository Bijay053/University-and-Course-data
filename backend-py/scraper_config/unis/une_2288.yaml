# University of New England (UNE) — www.une.edu.au  (uni_id=2288)
#
# ── CLOUDFLARE ENTERPRISE BLOCK ──────────────────────────────────────────────
# www.une.edu.au blocks ALL transports (httpx, curl_cffi, Scrape.do static).
# Scrape.do render=True (headless Chrome + residential IP) is the only path
# that returns real content. This applies to both the sitemap and per-course
# pages.
#
# ── DISCOVERY STRATEGY ───────────────────────────────────────────────────────
# Listing page (/study/study-options/courses) is a React SPA — courses are
# XHR-loaded as JSON, so BFS finds 0 course links even with render=true.
#
# UNE publishes a dedicated course sitemap (~2MB, ~1920 URLs):
#   https://www.une.edu.au/cauc-static/study/sitemap.xml
#
# Sitemap fetch: Scrape.do static returns 502 ROTATION_FAILED.
# Scrape.do render=True (headless Chrome) returns 200 OK with 2MB — Chrome's
# XML viewer embeds the raw XML in a <div id="webkit-xml-viewer-source-xml">
# with actual <loc> tags intact. _LOC_RE finds all 1920 entries correctly.
#
# Course URL pattern: /study/courses/{slug}  (no year)
#   e.g. /study/courses/bachelor-of-science
#
# IMPORTANT — allow_url_patterns MUST be set explicitly here.
# The DB auto_config.discovery.allow_url_patterns stores the OLD pattern
# '/courses/[0-9]{4}/[a-zA-Z0-9_-]+$' (year-based URLs, now obsolete).
# Without overriding it, all 1920 <loc> entries are filtered → 0 candidates.
#
# The sitemap also contains ~1717 /study/units/ URLs (individual subjects/units,
# not courses). The /study/courses/ pattern excludes these correctly.
#
# ── EXTRACTION STRATEGY ──────────────────────────────────────────────────────
# single_course.py appends ?international=true to all une.edu.au URLs
# automatically (keyed on hostname).
# Per-course pages (www.une.edu.au/study/courses/...) are CF Enterprise
# blocked; Scrape.do render=True is required.

hostname_guard: www.une.edu.au

discovery:
  seed_urls:
    - https://www.une.edu.au/study/study-options/courses

  # Point directly at the course-specific sitemap.
  # Avoids traversing the main sitemap_index (6500+ entries, 20+ sub-sitemaps).
  sitemap_url: https://www.une.edu.au/cauc-static/study/sitemap.xml

  # Override the stale DB auto_config pattern (was /courses/{year}/{slug}).
  # UNE's current URL structure uses /study/courses/{slug} (no year segment).
  # 203 of 1920 sitemap entries match this pattern (rest are /study/units/).
  allow_url_patterns:
    - '/study/courses/[a-zA-Z0-9_-]+$'

  # REQUIRED — skip_fallbacks=true makes the fetch chain go:
  #   Scrape.do static (502 ROTATION_FAILED) → render=True → 200 OK, 2MB XML ✓
  # Without this, httpx/cffi/Wayback are tried first (all 403/empty), then
  # Scrape.do static (502), and render=True is never attempted → 0 bytes.
  scrape_do_skip_fallbacks: true
  scrape_do_render: true
  skip_home_page_redirect: true

  block_url_patterns:
    - /news
    - /events
    - /staff/
    - /about
    - /contact

  # Skip BFS entirely: listing page is a React SPA with XHR-loaded courses.
  bfs_page_budget: 0

  # Disable the always-on sitemap supplement — bfs_page_budget=0 yields 0<5
  # which already triggers the sitemap fallback. The supplement would probe
  # 20+ sub-sitemaps from the main sitemap_index, consuming the 300s budget.
  always_sitemap_supplement: false

  # CDX not needed — cauc-static sitemap covers all courses.
  use_wayback: false

extraction:
  # Scrape.do headless Chrome (residential IP) bypasses CF Enterprise 403
  # for per-course pages.
  scrape_do_render: true
  scrape_do_skip_fallbacks: true
  skip_browser_rescue: true
  skip_per_course_browser: true

  # Lower parallelism — render calls are ~4-6s each via Scrape.do.
  max_parallel_fetch: 3
  per_course_timeout_seconds: 90
  recovery_sweep_max_items: 3
  recovery_sweep_time_budget_seconds: 120

  fees:
    default_currency: AUD
    force_central_fee_stage: true
    require_explicit_international_context: true

  english:
    default_ielts: 6.0
    default_pte: 57
    default_toefl: 79
    degree_level_defaults:
      research:
        ielts: 6.5
        pte: 64
        toefl: 91
    course_english_priority: true
    apply_defaults_before_remote_enrichment: true

  filters:
    domestic_only:
      enabled: false
