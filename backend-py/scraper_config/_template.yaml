# ─────────────────────────────────────────────────────────────────────────────
# PER-UNIVERSITY SCRAPER CONFIG — COMPLETE SETTINGS REFERENCE
# ─────────────────────────────────────────────────────────────────────────────
# Save as: backend-py/scraper_config/unis/<slug>.yaml
# Slug = lower-cased short name derived from the university hostname
#   www.aut.ac.nz  → aut.yaml
#   www.uow.edu.au → uow.yaml
#   bond.edu.au    → bond.yaml
#
# This file is deep-merged ON TOP OF defaults.yaml at scrape time.
# Only override what is genuinely different — keep the file minimal.
# Every key shown below is optional unless it solves a known problem.
#
# IMPORTANT: Every key in this file maps directly to a Pydantic schema field.
# Do NOT invent keys — they will be silently ignored by Pydantic and have no
# effect. The authoritative field list is schema.py in the config package.
# ─────────────────────────────────────────────────────────────────────────────


# ── DISCOVERY ─────────────────────────────────────────────────────────────────
# Controls how the scraper finds course-detail page URLs.

discovery:

  # ── API-first discovery: generic JSON/REST endpoint ───────────────────────
  # When set, this runs BEFORE BFS/browser/Wayback. If ≥1 link is returned,
  # BFS and browser tiers are skipped entirely. Falls through on 0 links.
  # Use for universities whose course catalogue is served by a JSON/REST API
  # (SearchStax Solr, Algolia, custom REST). Do NOT use this for the HUD
  # SearchStax provider — use discovery.searchstax instead.
  #
  # generic_search_api:
  #   enabled: true               # set false to disable without removing block
  #   method: GET                 # GET (default) or POST
  #   url: "https://api.myuni.edu.au/courses/search"
  #   headers:
  #     authorization: "Token <your-token>"   # use env-var; do not commit literal tokens
  #   params:
  #     q: "*"
  #     rows: "250"
  #   root_path: "response.docs"  # dot-path to results array; null = response is array
  #   url_fields: [url, page_url, link]        # first non-empty wins
  #   title_fields: [title, name, course_name] # first non-empty wins
  #   allow_url_patterns:
  #     - '^https://www\.myuni\.edu\.au/courses/[a-z0-9-]+/?$'
  #   block_url_patterns:
  #     - '/news'
  #     - '/events'
  #   normalize_relative_urls: true
  #   base_url: "https://www.myuni.edu.au"
  #   page_size: 100              # paginate via page_size_param + offset_param
  #   page_size_param: "rows"     # default
  #   offset_param: "start"       # default
  #   max_pages: 20               # pagination ceiling
  #   max_courses: null           # optional cap (for debug runs)

  # ── Huddersfield-style SearchStax provider ────────────────────────────────
  # Use for universities whose site queries a SearchStax Solr core client-side.
  # Bypasses HTML/browser discovery entirely. The orchestrator fetches the Solr
  # core directly and maps each doc to a staged course.
  # searchstax:
  #   endpoint: "https://searchcloud-1-eu-west-2.searchstax.com/29847/myuni-1234/emselect"
  #   token_env: "HUD_SEARCHSTAX_TOKEN"  # env var name for Bearer token
  #   use_generic_mapper: true   # true for any non-HUD university (HUD uses custom mapper)
  #   filter_query: "sectionType_s:course"
  #   page_size: 100
  #   max_pages: 20
  #   currency: "AUD"

  # ── SSR-prop discovery ────────────────────────────────────────────────────
  # Use when the university's listing pages embed the course catalogue as a
  # JSON array inside a server-rendered HTML attribute.  Fetches with plain
  # httpx — no browser needed.  Playwright browser fallback fires automatically
  # when the prop is missing.
  #
  # How to detect (DevTools):
  #   View Page Source → search for a known course slug. If the slug appears
  #   inside a JSON array embedded in an HTML attribute, this tier applies.
  #   Common attribute names: :courses-data (Vue), data-courses (React),
  #   data-initial-props (Next.js custom), __NEXT_DATA__ (Next.js JSON script).
  #
  # Lancaster reference implementation (lancaster.yaml):
  #   Vue 3 <course-listing :courses-data='[{"slug":"...", "title":"...", ...}]'>
  #   → 538 courses with zero browser, 0 Gemini cost (2026-06-12 verified).
  #
  # ssr_prop_discovery:
  #   listing_pages:
  #     - url: "https://www.myuni.edu.au/courses/undergraduate/"
  #       url_prefix: "https://www.myuni.edu.au/courses/undergraduate/"
  #       label: "Undergraduate"
  #     - url: "https://www.myuni.edu.au/courses/postgraduate/"
  #       url_prefix: "https://www.myuni.edu.au/courses/postgraduate/"
  #       label: "Postgraduate"
  #   prop_attr: ":courses-data"       # HTML attribute with the JSON array
  #   slug_field: "slug"               # JSON field → URL slug
  #   name_field: "title"              # JSON field → course name
  #   url_suffix: "/{year}/"           # {year}=2026, {short_year}=26
  #   year_field: "entryYear"          # omit to include all JSON objects
  #   year_filter_prefix: "{short_year}/"  # Lancaster="26/" | plain-year="{year}"
  #   browser_fallback_xpath: "//nav[contains(@class, 'a-z')]//li/a/@href"
  #   browser_wait_selector: "nav.a-z"
  #   course_url_pattern: '/courses/[a-z0-9-]+/20\d{2}/?$'

  # ── Scrapy spider (alternative discovery engine) ──────────────────────────
  # Use instead of BFS when the site needs a custom crawl strategy.
  # Copy backend-py/spiders/template_spider.py as a starting point.
  # scrapy:
  #   spider: example_uni_spider     # filename without .py (in backend-py/spiders/)
  #   timeout_seconds: 600           # kill subprocess after N seconds (default 600)
  #   max_courses: 50                # cap for debug/test runs only
  #   settings:
  #     DOWNLOAD_DELAY: 1
  #     CONCURRENT_REQUESTS: 4

  # ── BFS page budget ──────────────────────────────────────────────────────
  # Default: 25 (fast-mode 12). Raise for universities with many listing pages.
  # UOW example: catalogue has 62 pagination pages → raised to 70.
  bfs_page_budget: 25

  # ── Max candidate URLs collected before staging ───────────────────────────
  # Default: 500. Raise when a site has >500 course-detail pages (very rare).
  max_candidates: 500

  # ── Sitemap supplement ────────────────────────────────────────────────────
  # Always merge sitemap results with BFS candidates, even when BFS met
  # its threshold. Set true for JS-heavy SPAs (Torrens, CDU, CSU) and
  # sites where BFS burns budget on marketing pages (AUT, ACU, Flinders).
  always_sitemap_supplement: false

  # ── Explicit sitemap URL ──────────────────────────────────────────────────
  # Leave null to auto-detect /sitemap.xml or /sitemap_index.xml.
  sitemap_url: null

  # ── Fallback subdomains ───────────────────────────────────────────────────
  # Probe these subdomains when BFS + sitemap + alt-paths all yield < 5 links.
  # {domain} is replaced with the apex hostname (www-stripped).
  fallback_subdomains: []
  #   - "handbook.{domain}"
  #   - "study.{domain}"

  # ── Minimum expected course count ─────────────────────────────────────────
  # Raise a scrape-run alert if fewer than N courses are staged. Use when
  # you know the catalogue size (e.g. 200 courses) so low-discovery bugs
  # surface immediately rather than silently under-staging.
  expected_min_courses: null
  #   expected_min_courses: 200

  # ── Seed URLs ─────────────────────────────────────────────────────────────
  # Listing pages fed directly to the BFS queue with +300 priority. Use when
  # BFS starts from the homepage and wastes budget on marketing pages before
  # reaching the course catalogue.
  seed_urls: []
  #   - "https://www.myuni.edu.au/courses"
  #   - "https://www.myuni.edu.au/study/find-a-course"

  # ── Extra course URLs ─────────────────────────────────────────────────────
  # Individual course-detail URLs injected directly after discovery — bypasses
  # BFS entirely for those pages. Use to manually add missed courses.
  extra_course_urls: []
  #   - "https://www.myuni.edu.au/courses/some-course-not-in-sitemap"

  # ── URL allow-list (whitelist) ────────────────────────────────────────────
  # If non-empty, ONLY URLs matching at least one pattern are kept.
  allow_url_patterns: []
  #   - "/courses/"
  #   - "/study/courses/"

  # ── Listing-page override (blocked-path bypass) ───────────────────────────
  # URLs matching any of these patterns bypass the global is_blocked_page
  # classifier (campus_page, category_landing_page, etc.) AND are treated as
  # discovery/listing pages: they are crawled for outbound course links but
  # are NEVER added to the course-extraction candidate set.
  #
  # Use when the university's real listing pages sit under globally-blocked
  # paths (e.g. /student-life/, /faculties/, /schools/, /subject-areas/).
  #
  # Bath Spa example:
  #   /student-life/undergraduate-study/ and /student-life/postgraduate-study/
  #   are blocked as campus_page but contain all course links.
  #
  # Emits: [DISCOVER] YAML listing override: <path> treated as listing-only page
  allow_blocked_listing_patterns: []
  #   - '/student-life/undergraduate-study'
  #   - '/student-life/postgraduate-study'
  #   - '/faculties/arts/courses'

  # ── Listing-only patterns (force-listing without is_blocked_page bypass) ──
  # URLs matching any of these patterns are crawled for links but NEVER added
  # to the course-extraction candidate set, even if the classifier identifies
  # them as detail pages. Use for pagination, search-result, or category-index
  # URLs that contain course links but are not courses themselves.
  # Complements allow_blocked_listing_patterns — only needed when the URL is
  # not globally blocked by is_blocked_page.
  listing_only_patterns: []
  #   - '/courses/course-index-a-z'
  #   - '/courses/interest-areas/'
  #   - '\?'                          # any URL with a query string

  # ── Post-discovery extraction gate (allow-list + global-block bypass) ─────
  # Two effects in one field:
  #   1. ALLOW — only URLs matching at least one pattern reach the extractor.
  #      Lets the BFS crawl listing/category pages freely while restricting
  #      extraction to genuine course-detail pages.
  #   2. BYPASS — matching URLs skip the global is_blocked_page() classifier.
  #      Essential when course URLs contain a globally-blocked prefix such as
  #      /study/undergraduate, /study/postgraduate, or /study/international.
  #      Without this, those courses are silently dropped at the extraction
  #      gate before any fetching occurs.
  #      (Lancaster lesson: 538 SSR-prop-discovered courses were dropped at the
  #      gate because /study/undergraduate matched the global block-list; adding
  #      course_detail_url_patterns fixed it.)
  #
  # Log emits:
  #   [EXTRACT] course_detail_url_patterns bypass: N URLs exempted from gate
  #   [DISCOVER] YAML course detail filter: kept <url>
  #   [DISCOVER] YAML course detail filter: dropped listing URL <url>
  #
  # Examples:
  #   Lancaster:
  #     - '/study/undergraduate/courses/[^/]+/20\d{2}/?$'
  #     - '/study/postgraduate/postgraduate-courses/[^/]+/20\d{2}/?$'
  #   Bath Spa:
  #     - '^https://www\.bathspa\.ac\.uk/courses/(ug|pg|ify|phd|edd|pgce)-[a-z0-9-]+/?$'
  course_detail_url_patterns: []
  #   - '^https://www\.myuni\.ac\.uk/courses/(ug|pg|phd)-[a-z0-9-]+/?$'

  # ── URL block-list (blacklist) ────────────────────────────────────────────
  # URLs matching any of these patterns are dropped (regex, applied after allow).
  block_url_patterns: []
  #   - "/courses/search"
  #   - "/study/scholarships"

  # ── Navigation link block patterns ────────────────────────────────────────
  # Regex patterns applied to anchor hrefs during BFS link extraction (before
  # the URL enters the queue). Blocks nav bar / sidebar links from polluting
  # the crawl frontier. Lighter than block_url_patterns (applied earlier).
  block_nav_patterns: []
  #   - '/about'
  #   - '/news'
  #   - '/events'

  # ── Substring must-contain ────────────────────────────────────────────────
  # Candidate URLs missing ALL of these substrings are dropped.
  must_contain: []
  #   - "/courses/"

  # ── Skip browser discovery ────────────────────────────────────────────────
  # Set true to prevent the browser BFS tier from running even when earlier
  # tiers (BFS, sitemap, alt-paths) returned 0 links. Combine with
  # always_sitemap_supplement when the sitemap is reliable and browser is blocked.
  skip_browser_discovery: false

  # ── Always use browser for every course ──────────────────────────────────
  # When true, every discovered URL is fetched via Playwright instead of
  # plain HTTP, even when the initial static fetch succeeded. Use for sites
  # where JavaScript populates the fee / IELTS panels.
  always_browser_discover: false

  # ── Stealth browser ───────────────────────────────────────────────────────
  # Use Playwright with stealth headers to avoid Cloudflare detection.
  use_stealth_browser: false

  # ── Browser time budget ───────────────────────────────────────────────────
  # Total seconds the browser discovery phase may run before it is stopped
  # early and whatever links were found so far are used. Default: 300.
  browser_time_budget_s: 300

  # ── Browser early-stop course count ──────────────────────────────────────
  # Stop browser discovery once this many course URLs have been found.
  # Prevents runaway crawls on very large catalogues.
  browser_early_stop_courses: null
  #   browser_early_stop_courses: 300

  # ── Wayback Machine fallback ──────────────────────────────────────────────
  # Fall back to Wayback Machine CDX API when all live-site discovery fails.
  use_wayback: false


# ── EXTRACTION ────────────────────────────────────────────────────────────────
# Per-field extraction overrides. Only set what differs from defaults.

extraction:

  # ── Per-course concurrency cap ────────────────────────────────────────────
  # Overrides the global semaphore (default 4). Set to 1–2 for Cloudflare-
  # heavy sites where 4 parallel sessions trigger aggressive 429 responses.
  max_parallel_fetch: null
  #   max_parallel_fetch: 2

  # ── Skip browser rescue pass ──────────────────────────────────────────────
  # Set true when Cloudflare blocks Playwright too — prevents wasting 30 s/course
  # on a browser retry that always returns an empty page. Notre Dame / JCU pattern.
  skip_browser_rescue: false

  # ── Prefer blended over on-campus ────────────────────────────────────────
  # When true and the study-mode extractor emits "Online" at low confidence
  # AND a physical campus was also found, set study_mode="Blended" instead of
  # "On Campus". Use for universities that genuinely offer both on-campus and
  # online delivery on the same course page (JCU pattern).
  prefer_blended_over_on_campus: false

  # ── Default course location ───────────────────────────────────────────────
  # Written to course_location when every extractor returns empty. Prevents
  # the online-only gate from rejecting legitimately on-campus courses whose
  # location text was missing from the crawled HTML.
  default_course_location: null
  #   default_course_location: "Hobart"

  # ── Campus allowlist ──────────────────────────────────────────────────────
  # When non-empty, courses whose course_location contains none of these strings
  # are flagged as a data-quality failure.
  campus_allowlist: []
  #   - "Townsville"
  #   - "Cairns"
  #   - "Brisbane"
  #   - "Singapore"

  # ── Browser interaction actions ───────────────────────────────────────────
  # Ordered steps executed after page load, before HTML is captured.
  # Supported keys (one per list item):
  #   click_text:  str  — click element whose text matches (case-insensitive)
  #   click_css:   str  — click element matching CSS selector
  #   wait_for:    dict — {text: str} or {selector: str}
  #   expand_text: str  — click accordion / <details> matching this phrase
  #   scroll_to:   str  — scroll to a CSS selector or anchor
  # Note: "International" in click_text uses the smart JS tab toggle.
  actions: []
  #   - click_text: "International"
  #   - wait_for:
  #       text: "International Students"

  # ── URL rewriting ─────────────────────────────────────────────────────────
  # Append query parameters to each course URL before fetching.
  # Each entry is a UrlRewrite object with host, path_contains (optional), and
  # append_query (a single query string like "students=international&year=2026").
  # `host` matches both apex and www. forms.
  url_rewrites: []
  #   - host: "www.uow.edu.au"
  #     path_contains: "/courses/"
  #     append_query: "students=international&year=2026"
  #   - host: "www.une.edu.au"
  #     append_query: "international=true"

  # ── Fees ─────────────────────────────────────────────────────────────────
  fees:
    # ISO currency code. Default AUD. Set NZD for NZ universities, GBP for UK.
    default_currency: "AUD"

    # Prefer international-student fee amounts when the page shows both
    # domestic and international fees side by side.
    prefer_international: true

    # Prefer annual fee when both annual and total-course amounts are present.
    prefer_annual_over_total: true

    # Prefer year-1 fee when a table shows multiple years (year-1, year-2…).
    prefer_year_one_over_total: false

    # Append this suffix to every course URL before the fee fetch.
    # Use when the international fee tab is behind a query param (?international).
    fee_url_suffix: ""
    #   fee_url_suffix: "?international"

    # Always stage the fee from the central fees page even when a per-course
    # fee was found (useful for universities where per-course fees are unreliable).
    force_central_fee_stage: false

    # Discard any extracted Annual fee above this threshold (AUD).
    # Prevents multi-year totals misidentified as annual (e.g. 3-year total ÷ 0).
    max_annual_fee: null
    #   max_annual_fee: 80000

    # Central international-fees page URL. Scraped once and joined by course name.
    central_page: ""
    #   central_page: "https://www.uni.edu.au/fees/international/"

    # Central fees PDF URL (alternative when fees are PDF-only).
    fees_pdf_url: ""
    #   fees_pdf_url: "https://www.uni.edu.au/fees/2026_international_fee_schedule.pdf"

    # Custom regex for parsing the per-university PDF row layout.
    # Named groups: cricos, annual (required); duration, duration_unit (optional).
    # pdf_row_pattern: '\b(?P<cricos>\d{6}[A-Z])\b[\s\uf06c]*\$(?P<annual>\d[\d,]*)\s+\$\d[\d,]*'

    # Term of the dollar amount captured by pdf_row_pattern.
    pdf_fee_term: "Annual"   # or "Semester"

    # Credit points per unit for per-unit → annual fee conversion.
    credit_points_per_unit: null

    # Course-name aliases for PDF matching when the PDF uses different titles.
    course_pdf_aliases: {}
    #   "bachelor of it (cybersecurity)": "Bachelor of Information Technology (Cybersecurity)"

    # Keywords in a fee row that indicate it is domestic-only — discard that row.
    reject_keywords: []
    #   - "Commonwealth Supported"
    #   - "HECS-HELP"
    #   - "Domestic students"
    #   - "Home student"        # UK pattern
    #   - "UK student"          # UK pattern

    # Phrases that positively confirm a fee evidence snippet is international.
    # When non-empty: if the evidence contains ANY of these phrases, the fee is
    # KEPT even when a reject_keyword is also matched (international wins).
    # Use for pages that list both domestic and international fees:
    #   e.g. "UK fee: £9,250 / International fee: £15,000"
    # Emits: [FEE_KEEP] kept international fee by YAML evidence
    international_fee_keywords: []
    #   - "International"
    #   - "International student"
    #   - "International fee"
    #   - "Overseas"
    #   - "Non UK"
    #   - "EU and international"

    # Anchor text links on the course page to follow when no fee is found inline.
    follow_links: []
    #   - "fees and scholarships"
    #   - "international student fees"
    #   - "fee schedule"

  # ── English language requirements ─────────────────────────────────────────
  english:
    # Central English requirements page — fallback when per-course pages are empty.
    central_page: ""
    #   central_page: "https://www.uni.edu.au/international/english-requirements/"

    # Central English requirements PDF.
    requirements_pdf_url: ""

    # URL of the band-mapping reference page (for provenance only — logged in evidence).
    band_reference_url: ""

    # Prefer the English requirement stated on the individual course page over the
    # central-page default. Set true when courses vary in their IELTS band.
    course_english_priority: false

    # Institutional default scores — last-resort fallback when no other extractor
    # finds a value. Only set when the university publicly states a single entry
    # standard for ALL courses.
    default_ielts: null    # e.g. 6.5
    default_pte: null      # e.g. 58
    default_toefl: null    # e.g. 79

    # Per-degree-level English score overrides for universities where UG and PG
    # requirements differ (e.g. Waikato: UG IELTS 6.0, PG IELTS 6.5).
    # Keys: undergraduate / postgraduate / doctorate
    # When a postgraduate tier is configured, PG courses automatically skip the
    # flat central-page English values (pg_skip is auto-enabled) so the tier
    # default applies instead of the UG-oriented central page.
    # degree_level_defaults:
    #   undergraduate: {ielts: 6.0, pte: 50, toefl: 80}
    #   postgraduate:  {ielts: 6.5, pte: 58, toefl: 90}
    #   doctorate:     {ielts: 6.5, pte: 58, toefl: 90}

    # Disable vision OCR for English test images.
    trust_vision_ocr: true
    trust_tier1_vision_ocr_english: true

    # Tests to suppress — drop these from extracted requirements entirely.
    # Valid values: ielts, pte, toefl, cambridge, duolingo, kite
    test_blocklist: []
    #   - "kite"
    #   - "duolingo"

    # Anchor text links on the course page to follow when no English data is inline.
    follow_links: []
    #   - "english language requirements"
    #   - "admission requirements"

    # Band-name → score mapping. When the course page states a named English
    # band (e.g. "English Band 2"), look up the IELTS/PTE/TOEFL/CAE scores here.
    # Key = band label exactly as it appears on course pages.
    # Valid BandSpec fields: ielts_overall, ielts_each, pte_overall, toefl_overall,
    #   cambridge_overall, duolingo_overall.  Note: use cambridge_overall (NOT cae_overall).
    band_mapping: {}
    #   "Band 1":
    #     ielts_overall: 6.0
    #     ielts_each: 6.0
    #     pte_overall: 52
    #     toefl_overall: 74
    #     cambridge_overall: 169
    #   "Band 2":
    #     ielts_overall: 6.5
    #     ielts_each: 6.0
    #     pte_overall: 58
    #     toefl_overall: 86
    #     cambridge_overall: 176

  # ── Study mode overrides ─────────────────────────────────────────────────
  # Controls how the study-mode extractor handles the bare \bonline\b keyword.
  # Enable for universities whose pages contain "online" in nav, footer, or
  # utility copy that should NOT classify a campus course as Online.
  study_mode:
    # When True, the bare \bonline\b keyword fallback (confidence 0.5) is
    # suppressed. Only authoritative labels (data-attribute, DOM label, or
    # high-specificity phrases like "fully online", "100% online") set Online.
    online_only_requires_strong_evidence: false
    #   online_only_requires_strong_evidence: true   # Bath Spa, UK unis with "apply online" in nav

    # When True and a course_location was found on the same page, a bare-
    # keyword Online result (confidence 0.5) is suppressed — physical campus wins.
    prefer_location_over_online_keyword: false
    #   prefer_location_over_online_keyword: true    # use with online_only_requires_strong_evidence

    # Phrases counted as "strong evidence" of online-only delivery.
    # Default list covers the most common high-specificity patterns.
    # Only used when online_only_requires_strong_evidence=true.
    # strong_online_markers:
    #   - "delivered fully online"
    #   - "100% online"
    #   - "online only"
    #   - "distance learning"
    #   - "study online"
    #   - "fully online"
    #   - "entirely online"
    #   - "online delivery only"

    # Documentation-only. Lists UI sections whose text contains "online" but
    # should not trigger the Online classification (e.g. "apply online" buttons,
    # nav menus). Actual suppression uses online_only_requires_strong_evidence.
    ignore_online_keywords_in: []
    #   - "navigation"
    #   - "footer"
    #   - "apply online"

  # ── Staging filters ───────────────────────────────────────────────────────
  filters:
    domestic_only:
      # Drop courses detected as domestic-only during staging. Enable when the
      # site lists domestic courses without clearly marking them.
      enabled: false
      # Optionally require this text in main_content for a course to be international-eligible:
      # text_must_appear_in: main_content

      # When True, courses are rejected unless at least one phrase from
      # international_markers appears in the scraped page text. Stronger
      # than the default domestic-marker reject-on-match rule.
      require_international_evidence: false
      #   require_international_evidence: true

      # Phrases that positively identify the course as open to international students.
      # When present, the course is KEPT even if domestic_markers are also found.
      international_markers: []
      #   - "International students"
      #   - "International fee"
      #   - "international applicants"
      #   - "overseas students"

      # Phrases that identify the course as domestic-only. When found (and
      # enabled=True), the course is rejected.
      domestic_markers: []
      #   - "UK students only"
      #   - "Home students only"
      #   - "Domestic only"

    online_only:
      # Drop courses with all-online delivery (visa rule). Default true.
      # Set false for distance-education universities (CSU) that legitimately
      # market online courses to international students.
      enabled: true

      # When set and non-empty, only reject when study_mode exactly matches one
      # of these values (case-insensitive). When empty, any Online classification
      # triggers rejection (default behaviour).
      reject_if_mode_is_exactly: []
      #   - "Online"
      #   - "Distance learning"

      # When True (default), a course classified as Online is KEPT if a non-empty
      # course_location is also present. Prevents over-rejection of blended courses
      # whose study_mode extractor fired on nav/footer "online" text.
      keep_if_location_present: true

  # ── Intake ────────────────────────────────────────────────────────────────
  intake:
    # When true, only dates in a "start dates" section are considered (ignore
    # application-deadline dates and enrolment-deadline dates).
    start_dates_only: false

    # Characters of context around a "start" keyword to scan for month names.
    start_dates_window_chars: 300

    # Phrases that indicate rolling / continuous intake (no fixed intakes).
    # When any marker is found, intake_months is set to rolling_enrollment_label.
    rolling_enrollment_markers: []
    #   - "Rolling admissions"
    #   - "Enrol at any time"

    # Label written to intake_months when rolling enrollment is detected.
    rolling_enrollment_label: "Rolling"

    # When True and intake_months is still empty after ALL extractors (including
    # rolling_enrollment above), apply the default_by_level lookup for this
    # course's degree level. Fills the intake slot so the course is not flagged
    # as missing_intake. The evidence row is marked as yaml_default_intake (0.4
    # confidence) so reviewers can see the intake was not extracted from the page.
    use_default_when_missing: false
    #   use_default_when_missing: true   # UK unis, courses with no published intake dates

    # YAML default intake months per degree tier, applied when
    # use_default_when_missing=True. Keys: undergraduate / postgraduate / doctorate.
    # Values: list of month name strings.
    default_by_level: {}
    #   default_by_level:
    #     undergraduate:
    #       - September
    #     postgraduate:
    #       - September
    #       - January
    #     doctorate:
    #       - September

    # Evidence note written into the intake evidence row when a YAML default is
    # applied. Displayed in the admin review panel.
    default_source_note: "YAML default intake"
    #   default_source_note: "Bath Spa default intake (September)"

  # ── Course name cleaning ───────────────────────────────────────────────────
  course_name:
    # Suffixes stripped from extracted course names (case-insensitive).
    # Applied before the course name is written to the DB.
    strip_title_suffixes: []
    #   - " | Southern Cross University"
    #   - " - My University"

    # Alternative university name spellings/aliases used when matching scraped
    # course names against the DB (for deduplication + update decisions).
    university_aliases: []
    #   - "Southern Cross University"
    #   - "SCU"

  # ── Text cleaning ─────────────────────────────────────────────────────────
  text_cleaning:

    location:
      # Regex patterns stripped from raw location strings before parsing.
      # Applied left-to-right, case-insensitive.
      strip_patterns: []
      #   - '(?:^|,)\s*online\s*(?=,|$)'
      #   - '\s*\(\s*(?:online|virtual|distance|external|flexible)\s*\)'

    duration:
      # Split compound duration strings on '/' before parsing.
      # AUT example: '1 year (full-time) / 0.5 year (full-time)' → take first.
      split_on_slash: false

      # Regex patterns for sentences that contain duration-like numbers but
      # are NOT the course duration (e.g. "You have 2 years to complete...").
      # Matched sentences are dropped before duration extraction.
      reject_sentence_patterns: []
      #   - '(?i)you\s+have\s+\d+\s+year'
      #   - '(?i)maximum\s+\d+\s+year'

    # Substrings stripped from EVERY string field on the staged payload
    # immediately before DB write (case-insensitive, whitespace collapsed).
    # Use for site-wide boilerplate that pollutes multiple fields.
    global_substring_blocklist: []
    #   - "Apply Now"
    #   - "Find out more"
    #   - "Click here to enquire"

    # Per-URL hard overrides. When the course URL matches url_regex, the named
    # field is forced to the supplied value. Use sparingly — extractor/YAML
    # fixes are always preferred.
    field_overrides: []
    #   - url_regex: "/courses/data-science-honours"
    #     field: "course_location"
    #     value: "Sydney"

  # ── Staging gate ──────────────────────────────────────────────────────────
  staging:
    # Fields that must be non-empty for a staged course to pass the gate.
    # A course missing any listed field is rejected before the review table.
    reject_if_missing:
      - course_name

  # ── Degree-level canonical values (code-enforced, not YAML-configurable) ──
  # The staging pipeline accepts exactly these 10 values for degree_level.
  # Any other value is automatically cleared and re-inferred from the course
  # name using the degree_level classifier (degree_level.py).
  #
  # Valid values:
  #   "Bachelor's"          "Master's"            "Doctorate"
  #   "Graduate Certificate"                       "Graduate Diploma"
  #   "Associate Degree"    "Advanced Diploma"     "Diploma"
  #   "Certificate"         "Foundation"
  #
  # Auto-corrections applied silently at staging time:
  #   "Postgraduate Certificate"        → "Graduate Certificate"
  #   "Postgraduate Diploma"            → "Graduate Diploma"
  #   "Music Business - BA (Hons)"      → "Bachelor's"  (suffix-format name)
  #   "BBA", "BSW", "BSN"               → "Bachelor's"  (degree abbreviations)
  #   "Foundation Degree"               → "Bachelor's"  (UK sub-degree)
  #   "Master of Business Administration" → "Master's"  (full title stored)
  #
  # There is no YAML key to change or extend this list — it is enforced in
  # app/services/scraper/stage_course.py and degree_level.py.

  # ── Location garbage auto-cleaning (code-enforced, not YAML-configurable) ─
  # The staging pipeline automatically strips non-campus text from
  # course_location before writing to the DB. No YAML key is needed.
  #
  # Comma-split parts rejected automatically:
  #   • Parts > 80 characters
  #   • Date strings          — "Friday 17 July", "March 2025"
  #   • Honorific person names — "Dr Foroogh Hajiseyedjavadi", "Prof. Rice"
  #   • Person job titles     — "Professor Iain Rice", "Course Leader Smith",
  #                              "Lecturer", "Researcher", "BBC Producer"
  #   • CMS boilerplate       — "Please note", "Worried about Personal
  #                              Statements?", "Course Structure",
  #                              "EU/international students"
  #   • Credit descriptions   — "60 credits of modules", "Dissertation - 40 credits"
  #
  # If the guard incorrectly removes a legitimate campus name, use
  # text_cleaning.location.strip_patterns to pre-clean BEFORE the guard fires,
  # or text_cleaning.field_overrides to hard-set the value for specific URLs.


# ── NOTES ─────────────────────────────────────────────────────────────────────
# Document the WHY of every override so the next maintainer (or Gemini AI)
# understands what motivated each value. Include the date and issue reference.
#
# Examples:
#   bfs_page_budget: 70  — UOW catalogue has 62 listing pages; the default 25
#     burns budget on navigation pages and misses ~70% of courses. (2026-05-18)
#   fees_pdf_url: "..."  — Federation does not publish per-course international
#     fees on the course page; the central PDF is the only source. (2026-05-09)
#   allow_url_patterns: ["/courses/"] — course pages live under /courses/ not
#     /study/ (the default assumption); without this, 0 of 219 courses pass
#     the allow filter. (2026-06-01)
#   max_parallel_fetch: 2 — UTAS Cloudflare triggers aggressive 429 at 4
#     concurrent sessions; 2 eliminates the 600s cooldown stalls. (2026-05-15)
