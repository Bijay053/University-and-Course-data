AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege RDS database credential refresh for university-portal

Parameters:
  DeploymentUserName:
    Type: String
    Default: replit-production-ssm
  ProductionInstanceRoleName:
    Type: String
    Default: EC2-SystemsManager-Role
  ProductionInstanceId:
    Type: AWS::EC2::Instance::Id
  DatabaseSecretArn:
    Type: String
    Description: ARN of the existing RDS-managed master credential secret
    AllowedPattern: "^arn:[^:]+:secretsmanager:[^:]+:[0-9]+:secret:[A-Za-z0-9/_+=.@!-]+$"
  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues:
      - ENABLED
      - DISABLED
  AlertEmail:
    Type: String
    NoEcho: true
    Description: Operator email subscribed to sanitized database refresh failure alerts
  AlertDeduplicationMinutes:
    Type: Number
    Default: 60
    MinValue: 5
    MaxValue: 1440

Resources:
  DatabaseCredentialRefreshDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: university-portal-database-credential-refresh
      DocumentType: Command
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: Atomically refresh university-portal RDS credentials from its fixed secret
        mainSteps:
          - action: aws:runShellScript
            name: refreshDatabaseCredential
            inputs:
              timeoutSeconds: "300"
              runCommand:
                - !Sub |
                    set -eu
                    set +x
                    umask 077
                    env_path=/etc/university-portal/database.env
                    backup_path=/etc/university-portal/database.env.pre-refresh
                    tmp=
                    python=/opt/university-portal/backend-py/.venv/bin/python
                    workdir=/opt/university-portal/backend-py
                    region='${AWS::Region}'
                    secret_arn='${DatabaseSecretArn}'
                    lock_path=/run/lock/university-portal-database-credential-refresh.lock
                    exec 9>"$lock_path"
                    flock -x 9
                    for unit in uni-api-py uni-celery; do
                      systemctl cat "$unit" |
                        grep -Fxq 'EnvironmentFile=/etc/university-portal/database.env' ||
                        { echo "$unit is not installed with managed database credentials" >&2; exit 1; }
                    done

                    verify_services() {
                      systemctl is-active --quiet uni-api-py uni-celery
                      curl --connect-timeout 2 --max-time 10 --fail --silent --show-error \
                        http://127.0.0.1:8000/api/health >/dev/null
                      "$python" - "$env_path" <<'PY_VERIFY'
                    import os, shlex, subprocess, sys
                    expected = {}
                    with open(sys.argv[1], encoding="utf-8") as stream:
                        for raw_line in stream:
                            parsed = shlex.split(raw_line, comments=False, posix=True)
                            key, value = parsed[0].split("=", 1)
                            expected[key] = value
                    for unit in ("uni-api-py", "uni-celery"):
                        pid = subprocess.check_output(
                            ["systemctl", "show", "--property=MainPID", "--value", unit],
                            text=True,
                        ).strip()
                        assert pid and pid != "0"
                        process_env = dict(
                            item.split(b"=", 1)
                            for item in open(f"/proc/{pid}/environ", "rb").read().split(b"\0")
                            if b"=" in item
                        )
                        for key, value in expected.items():
                            assert process_env.get(key.encode()) == value.encode()
                    PY_VERIFY
                    }

                    restart_and_verify() {
                      timeout 60s systemctl restart uni-api-py uni-celery
                      sleep 8
                      verify_services
                    }

                    resume_scrape_claims() {
                      cd "$workdir"
                      PYTHONPATH=. timeout 15s "$python" -m celery \
                        -A app.tasks.celery_app control add_consumer scrape \
                        --timeout=10 >/dev/null
                    }

                    pause_and_verify_no_running_scrapes() {
                      cd "$workdir"
                      PYTHONPATH=. timeout 15s "$python" -m celery \
                        -A app.tasks.celery_app control cancel_consumer scrape \
                        --timeout=10 >/dev/null
                      PYTHONPATH=. "$python" - "$backup_path" <<'PY_IDLE'
                    import asyncio, os, shlex, sys
                    with open(sys.argv[1], encoding="utf-8") as stream:
                        for raw_line in stream:
                            parsed = shlex.split(raw_line, comments=False, posix=True)
                            key, value = parsed[0].split("=", 1)
                            os.environ[key] = value
                    from sqlalchemy import func, select
                    from app.database import AsyncSessionLocal
                    from app.models import ScrapeRuntimeJob
                    async def verify_idle():
                        async with AsyncSessionLocal() as db:
                            running = (
                                await db.execute(
                                    select(func.count())
                                    .select_from(ScrapeRuntimeJob)
                                    .where(ScrapeRuntimeJob.status == "running")
                                )
                            ).scalar_one()
                        assert int(running) == 0
                    asyncio.run(verify_idle())
                    PY_IDLE
                    }

                    restore_previous() {
                      test -f "$backup_path" || return 1
                      mv -f "$backup_path" "$env_path"
                      restart_and_verify
                    }

                    rollback_on_error() {
                      rc=$?
                      trap - EXIT
                      test -z "$tmp" || rm -f "$tmp"
                      if ! restore_previous; then
                        echo "database credential refresh and rollback failed; manual recovery required" >&2
                      fi
                      exit "$rc"
                    }

                    install -d -m 700 /etc/university-portal
                    rm -f "$backup_path"
                    if test -f "$env_path"; then
                      cp -p "$env_path" "$backup_path"
                    else
                      "$python" - "$backup_path" <<'PY_BOOTSTRAP'
                    import os, subprocess, sys
                    pid = subprocess.check_output(
                        ["systemctl", "show", "--property=MainPID", "--value", "uni-api-py"],
                        text=True,
                    ).strip()
                    assert pid and pid != "0"
                    process_env = dict(
                        item.split(b"=", 1)
                        for item in open(f"/proc/{pid}/environ", "rb").read().split(b"\0")
                        if b"=" in item
                    )
                    value = process_env[b"DATABASE_URL"].decode()
                    assert "\n" not in value and "\r" not in value
                    escaped = value.replace("\\", "\\\\").replace('"', '\\"')
                    with open(sys.argv[1], "w", encoding="utf-8") as stream:
                        stream.write(f'DATABASE_URL="{escaped}"\n')
                    os.chmod(sys.argv[1], 0o600)
                    PY_BOOTSTRAP
                    fi
                    trap rollback_on_error EXIT
                    tmp=$(mktemp /etc/university-portal/database.env.XXXXXX)
                    "$python" - "$tmp" "$region" "$secret_arn" "$backup_path" <<'PY_CONFIG'
                    import json, os, shlex, sys
                    from urllib.parse import quote, unquote, urlsplit
                    import boto3
                    response = boto3.client("secretsmanager", region_name=sys.argv[2]).get_secret_value(
                        SecretId=sys.argv[3],
                    )
                    raw = response["SecretString"]
                    config = json.loads(raw)
                    required = {"username", "password"}
                    assert required.issubset(config)
                    values = {key: config[key] for key in required}
                    for key in required:
                        assert isinstance(values[key], str) and values[key]
                        assert "\n" not in values[key] and "\r" not in values[key]
                    with open(sys.argv[4], encoding="utf-8") as stream:
                        entries = [
                            shlex.split(line, comments=False, posix=True)[0]
                            for line in stream
                            if line.strip().startswith("DATABASE_URL=")
                        ]
                    assert len(entries) == 1
                    existing_url = urlsplit(entries[0].split("=", 1)[1])
                    host = config.get("host") or existing_url.hostname
                    port = int(config.get("port") or existing_url.port or 5432)
                    dbname = config.get("dbname") or unquote(existing_url.path.lstrip("/"))
                    assert isinstance(host, str) and host
                    assert "\n" not in host and "\r" not in host
                    assert 1 <= port <= 65535
                    assert isinstance(dbname, str) and dbname
                    assert "\n" not in dbname and "\r" not in dbname
                    url = "postgresql+asyncpg://{}:{}@{}:{}/{}".format(
                        quote(values["username"], safe=""),
                        quote(values["password"], safe=""),
                        host,
                        port,
                        quote(dbname, safe=""),
                    )
                    with open(sys.argv[1], "w", encoding="utf-8") as stream:
                        escaped = url.replace("\\", "\\\\").replace('"', '\\"')
                        stream.write(f'DATABASE_URL="{escaped}"\n')
                        stream.write('DATABASE_REQUIRE_TLS="true"\n')
                        version_id = response["VersionId"]
                        stream.write(f'DATABASE_SECRET_VERSION="{version_id}"\n')
                    os.chmod(sys.argv[1], 0o600)
                    PY_CONFIG
                    if test -f "$env_path" && cmp -s "$tmp" "$env_path"; then
                      rm -f "$tmp" "$backup_path"
                      tmp=
                      trap - EXIT
                      echo database-credentials-refreshed-and-db-verified
                      exit 0
                    fi
                    if ! pause_and_verify_no_running_scrapes; then
                      trap - EXIT
                      rm -f "$tmp" "$backup_path"
                      tmp=
                      resume_scrape_claims || true
                      echo "active scrape jobs prevent database credential refresh" >&2
                      exit 1
                    fi
                    mv -f "$tmp" "$env_path"
                    tmp=
                    restart_and_verify
                    cd "$workdir"
                    PYTHONPATH=. "$python" - "$env_path" <<'PY_SMOKE'
                    import asyncio, os, shlex, sys
                    with open(sys.argv[1], encoding="utf-8") as stream:
                        for raw_line in stream:
                            parsed = shlex.split(raw_line, comments=False, posix=True)
                            key, value = parsed[0].split("=", 1)
                            os.environ[key] = value
                    from sqlalchemy import text
                    from sqlalchemy.ext.asyncio import create_async_engine
                    from app.config import settings
                    from app.database import postgres_tls_connect_args
                    async def smoke():
                        connect_args = postgres_tls_connect_args()
                        connect_args.update(timeout=10, command_timeout=10)
                        engine = create_async_engine(
                            settings.database_url,
                            connect_args=connect_args,
                            pool_size=1,
                            max_overflow=0,
                        )
                        async with engine.connect() as connection:
                            assert (await connection.execute(text("SELECT 1"))).scalar_one() == 1
                        await engine.dispose()
                    asyncio.run(asyncio.wait_for(smoke(), timeout=20))
                    PY_SMOKE
                    rm -f "$backup_path"
                    trap - EXIT
                    echo database-credentials-refreshed-and-db-verified

  ScheduledRefreshRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !GetAtt DatabaseCredentialRefreshScheduleGroup.Arn
      Policies:
        - PolicyName: invoke-fixed-database-refresh
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${ProductionInstanceId}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${DatabaseCredentialRefreshDocument}

  DatabaseCredentialRefreshScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: university-portal-database-credential-refresh

  DatabaseCredentialRefreshSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: university-portal-database-credential-auto-refresh
      GroupName: !Ref DatabaseCredentialRefreshScheduleGroup
      Description: Check the fixed RDS-managed secret version every five minutes
      State: !Ref ScheduleState
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ssm:sendCommand
        RoleArn: !GetAtt ScheduledRefreshRole.Arn
        Input: !Sub >-
          {"DocumentName":"${DatabaseCredentialRefreshDocument}","InstanceIds":["${ProductionInstanceId}"],"Comment":"Scheduled database credential refresh"}

  DatabaseRefreshAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: university-portal-database-refresh-alerts
      KmsMasterKeyId: alias/aws/sns

  DatabaseRefreshAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref DatabaseRefreshAlertTopic

  DatabaseRefreshAlertDeduplication:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: university-portal-database-refresh-alert-deduplication
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alert_key
          AttributeType: S
      KeySchema:
        - AttributeName: alert_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  DatabaseRefreshFailureNotifierRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: publish-sanitized-database-refresh-alerts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RateLimitRefreshAlerts
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt DatabaseRefreshAlertDeduplication.Arn
              - Sid: PublishRefreshAlerts
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref DatabaseRefreshAlertTopic

  DatabaseRefreshFailureNotifier:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: university-portal-database-refresh-failure-notifier
      Description: Publish sanitized, rate-limited database refresh failure alerts
      Runtime: python3.12
      Handler: index.handler
      Timeout: 15
      MemorySize: 128
      Role: !GetAtt DatabaseRefreshFailureNotifierRole.Arn
      Environment:
        Variables:
          ALERT_TOPIC_ARN: !Ref DatabaseRefreshAlertTopic
          DEDUPLICATION_TABLE: !Ref DatabaseRefreshAlertDeduplication
          DEDUPLICATION_MINUTES: !Ref AlertDeduplicationMinutes
          EXPECTED_DOCUMENT: !Ref DatabaseCredentialRefreshDocument
          EXPECTED_INSTANCE: !Ref ProductionInstanceId
      Code:
        ZipFile: |
          import json
          import os
          import re
          import time

          import boto3
          from botocore.exceptions import ClientError

          ddb = boto3.client("dynamodb")
          sns = boto3.client("sns")
          FAILURE_STATUSES = {"Failed", "TimedOut", "Cancelled"}
          ALERT_TOPIC_ARN = os.environ["ALERT_TOPIC_ARN"]
          DEDUPLICATION_TABLE = os.environ["DEDUPLICATION_TABLE"]
          DEDUPLICATION_SECONDS = int(os.environ["DEDUPLICATION_MINUTES"]) * 60
          EXPECTED_DOCUMENT = os.environ["EXPECTED_DOCUMENT"]
          EXPECTED_INSTANCE = os.environ["EXPECTED_INSTANCE"]

          def handler(event, _context):
              detail = event.get("detail") if isinstance(event, dict) else None
              detail = detail if isinstance(detail, dict) else {}
              source = event.get("source")
              detail_type = event.get("detail-type")
              instance_id = detail.get("instance-id")
              document_name = detail.get("document-name")
              status = detail.get("status")
              is_production = (
                  source == "aws.ssm"
                  and detail_type == "EC2 Command Status-change Notification"
              )
              nonce = detail.get("test-nonce")
              is_test = (
                  source == "university-portal.database-refresh-alert-test"
                  and detail_type == "Database Refresh Alert Test"
                  and isinstance(nonce, str)
                  and re.fullmatch(r"[0-9a-f]{32}", nonce) is not None
              )
              if (
                  not (is_production or is_test)
                  or
                  instance_id != EXPECTED_INSTANCE
                  or document_name != EXPECTED_DOCUMENT
                  or status not in FAILURE_STATUSES
              ):
                  return {"outcome": "ignored"}

              now = int(time.time())
              alert_key = "|".join((
                  instance_id,
                  document_name,
                  f"test:{nonce}" if is_test else "production",
              ))
              try:
                  ddb.put_item(
                      TableName=DEDUPLICATION_TABLE,
                      Item={
                          "alert_key": {"S": alert_key},
                          "expires_at": {"N": str(now + DEDUPLICATION_SECONDS)},
                      },
                      ConditionExpression=(
                          "attribute_not_exists(alert_key) OR expires_at < :now"
                      ),
                      ExpressionAttributeValues={":now": {"N": str(now)}},
                  )
              except ClientError as exc:
                  if exc.response.get("Error", {}).get("Code") == "ConditionalCheckFailedException":
                      if is_test:
                          ddb.update_item(
                              TableName=DEDUPLICATION_TABLE,
                              Key={"alert_key": {"S": alert_key}},
                              UpdateExpression=(
                                  "SET published_at = if_not_exists(published_at, :now) "
                                  "ADD suppressed_count :one"
                              ),
                              ExpressionAttributeValues={
                                  ":now": {"N": str(now)},
                                  ":one": {"N": "1"},
                              },
                          )
                      return {"outcome": "suppressed"}
                  raise

              message = {
                  "instanceId": instance_id,
                  "documentName": document_name,
                  "status": status,
              }
              try:
                  sns.publish(
                      TopicArn=ALERT_TOPIC_ARN,
                      Subject=(
                          "TEST: database credential refresh alert"
                          if is_test
                          else "Database credential refresh failed"
                      ),
                      Message=json.dumps(message, sort_keys=True),
                  )
              except Exception:
                  ddb.delete_item(
                      TableName=DEDUPLICATION_TABLE,
                      Key={"alert_key": {"S": alert_key}},
                  )
                  raise
              if is_test:
                  ddb.update_item(
                      TableName=DEDUPLICATION_TABLE,
                      Key={"alert_key": {"S": alert_key}},
                      UpdateExpression="SET published_at = :now",
                      ExpressionAttributeValues={":now": {"N": str(now)}},
                  )
              return {"outcome": "published"}

  DatabaseRefreshFailureRule:
    Type: AWS::Events::Rule
    Properties:
      Name: university-portal-database-refresh-failures
      Description: Route failed fixed database refresh commands to the sanitized notifier
      State: ENABLED
      EventPattern:
        source:
          - aws.ssm
        detail-type:
          - EC2 Command Status-change Notification
        detail:
          instance-id:
            - !Ref ProductionInstanceId
          document-name:
            - !Ref DatabaseCredentialRefreshDocument
          status:
            - Failed
            - TimedOut
            - Cancelled
      Targets:
        - Id: DatabaseRefreshFailureNotifier
          Arn: !GetAtt DatabaseRefreshFailureNotifier.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 900
            MaximumRetryAttempts: 2

  DatabaseRefreshAlertTestRule:
    Type: AWS::Events::Rule
    Properties:
      Name: university-portal-database-refresh-alert-test
      Description: Route disposable allowlisted test events through the production notifier
      State: ENABLED
      EventPattern:
        source:
          - university-portal.database-refresh-alert-test
        detail-type:
          - Database Refresh Alert Test
        detail:
          instance-id:
            - !Ref ProductionInstanceId
          document-name:
            - !Ref DatabaseCredentialRefreshDocument
          status:
            - Failed
          test-nonce:
            - exists: true
      Targets:
        - Id: DatabaseRefreshFailureNotifierTest
          Arn: !GetAtt DatabaseRefreshFailureNotifier.Arn

  AllowEventBridgeDatabaseRefreshFailureNotification:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DatabaseRefreshFailureNotifier
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DatabaseRefreshFailureRule.Arn

  AllowEventBridgeDatabaseRefreshAlertTest:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DatabaseRefreshFailureNotifier
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DatabaseRefreshAlertTestRule.Arn

  DeploymentRefreshPolicy:
    Type: AWS::IAM::UserPolicy
    Properties:
      UserName: !Ref DeploymentUserName
      PolicyName: university-portal-database-credential-refresh
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InvokeFixedCredentialRefreshDocument
            Effect: Allow
            Action: ssm:SendCommand
            Resource:
              - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${ProductionInstanceId}
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${DatabaseCredentialRefreshDocument}
          - Sid: ObserveOwnCredentialRefreshCommand
            Effect: Allow
            Action: ssm:GetCommandInvocation
            Resource: "*"
          - Sid: PublishDisposableRefreshAlertTestEvent
            Effect: Allow
            Action: events:PutEvents
            Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default
            Condition:
              StringEquals:
                events:source: university-portal.database-refresh-alert-test
                events:detail-type: Database Refresh Alert Test
          - Sid: ObserveDisposableRefreshAlertTest
            Effect: Allow
            Action: dynamodb:GetItem
            Resource: !GetAtt DatabaseRefreshAlertDeduplication.Arn

  ProductionDatabaseSecretReadPolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Ref ProductionInstanceRoleName
      PolicyName: university-portal-database-secret-read
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadOnlyFixedRdsManagedSecret
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref DatabaseSecretArn

Outputs:
  DatabaseRefreshAlertTopicArn:
    Description: SNS topic receiving sanitized, rate-limited database refresh failure alerts
    Value: !Ref DatabaseRefreshAlertTopic
  DatabaseRefreshFailureNotifierName:
    Description: Lambda function used for disposable notification-path tests
    Value: !Ref DatabaseRefreshFailureNotifier
  DatabaseRefreshAlertDeduplicationTableName:
    Description: Table observed by the disposable notification-path test
    Value: !Ref DatabaseRefreshAlertDeduplication