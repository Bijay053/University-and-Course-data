AWSTemplateFormatVersion: "2010-09-09"
Description: Isolated disposable rehearsal of the production database secret refresh transaction

Parameters:
  RehearsalId:
    Type: String
    AllowedPattern: "^[0-9a-f]{16}$"
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetId:
    Type: AWS::EC2::Subnet::Id
  SecondPrivateSubnetId:
    Type: AWS::EC2::Subnet::Id
  ExpectedAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"

Rules:
  AccountMustMatch:
    Assertions:
      - Assert: !Equals [!Ref AWS::AccountId, !Ref ExpectedAccountId]
        AssertDescription: The account must match the explicitly expected disposable account

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "up-db-refresh-${RehearsalId}"
      VpcId: !Ref VpcId
      Tags:
        - {Key: university-portal:disposable-rehearsal, Value: !Ref RehearsalId}
  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref SecurityGroup
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "up-db-refresh-${RehearsalId}"
      SubnetIds: [!Ref PrivateSubnetId, !Ref SecondPrivateSubnetId]
      Tags:
        - {Key: university-portal:disposable-rehearsal, Value: !Ref RehearsalId}
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "up-db-refresh-${RehearsalId}"
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp3
      DBName: rehearsal
      MasterUsername: rehearsaladmin
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 0
      DeletionProtection: false
      DeleteAutomatedBackups: true
      VPCSecurityGroups: [!GetAtt SecurityGroup.GroupId]
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      Tags:
        - {Key: university-portal:disposable-rehearsal, Value: !Ref RehearsalId}
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-one-rds-managed-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn
      Tags:
        - {Key: university-portal:disposable-rehearsal, Value: !Ref RehearsalId}
  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]
  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: t3.micro
      IamInstanceProfile: !Ref HostProfile
      SubnetId: !Ref PrivateSubnetId
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf -y -q install python3-pip redis6 sqlite >/dev/null
          python3 -m venv /opt/up-rehearsal/.venv
          /opt/up-rehearsal/.venv/bin/pip -q install boto3 celery redis "psycopg[binary]"
          install -d -m 700 /etc/university-portal /opt/up-rehearsal/app/tasks /var/lib/up-rehearsal
          curl --proto '=https' --tlsv1.2 --fail --silent https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o /etc/university-portal/aws-rds-global-bundle.pem
          cat /etc/pki/tls/certs/ca-bundle.crt /etc/university-portal/aws-rds-global-bundle.pem >/etc/university-portal/system-and-rds-ca-bundle.pem
          touch /opt/up-rehearsal/app/__init__.py /opt/up-rehearsal/app/tasks/__init__.py
          cat >/opt/up-rehearsal/app/tasks/celery_app.py <<'PY'
          import os, sqlite3
          from celery import Celery
          celery_app = Celery("rehearsal", broker="redis://127.0.0.1:6379/0")
          @celery_app.task(name="scrape.university")
          def scrape_university(run_id):
              path="/var/lib/up-rehearsal/executions.sqlite3"
              with sqlite3.connect(path) as db:
                  db.execute("create table if not exists executions(run_id text primary key,count integer not null)")
                  db.execute("insert into executions values(?,1) on conflict(run_id) do update set count=count+1",(run_id,))
                  db.commit()
          PY
          cat >/opt/up-rehearsal/api.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200); self.end_headers(); self.wfile.write(b"ok")
              def log_message(self, *_args): pass
          HTTPServer(("127.0.0.1",18080),Handler).serve_forever()
          PY
          cat >/etc/systemd/system/uni-api-py.service <<'UNIT'
          [Service]
          EnvironmentFile=/etc/university-portal/database.env
          WorkingDirectory=/opt/up-rehearsal
          ExecStart=/opt/up-rehearsal/.venv/bin/python /opt/up-rehearsal/api.py
          Restart=always
          UNIT
          cat >/etc/systemd/system/uni-celery.service <<'UNIT'
          [Service]
          EnvironmentFile=/etc/university-portal/database.env
          WorkingDirectory=/opt/up-rehearsal
          ExecStart=/opt/up-rehearsal/.venv/bin/celery -A app.tasks.celery_app worker -Q default --loglevel=WARNING
          Restart=always
          UNIT
          /opt/up-rehearsal/.venv/bin/python - '${Database.MasterUserSecret.SecretArn}' '${AWS::Region}' '${Database.Endpoint.Address}' '${Database.Endpoint.Port}' <<'PY'
          import json, os, sys
          from urllib.parse import quote
          import boto3
          arn,region,host,port=sys.argv[1:]
          r=boto3.client("secretsmanager",region_name=region).get_secret_value(SecretId=arn)
          s=json.loads(r["SecretString"]); assert s.get("username") and s.get("password")
          u="postgresql://{}:{}@{}:{}/rehearsal".format(quote(s["username"],safe=""),quote(s["password"],safe=""),host,port)
          open("/etc/university-portal/database.env","w").write(f'DATABASE_URL="{u}"\nDATABASE_REQUIRE_TLS="true"\nSSL_CERT_FILE="/etc/university-portal/system-and-rds-ca-bundle.pem"\nDATABASE_SECRET_VERSION="{r["VersionId"]}"\n')
          os.chmod("/etc/university-portal/database.env",0o600)
          PY
          systemctl daemon-reload
          systemctl enable --now redis6 uni-api-py uni-celery
          timeout 120 sh -c 'until cd /opt/up-rehearsal && PYTHONPATH=. .venv/bin/celery -A app.tasks.celery_app inspect ping --timeout=5 >/dev/null 2>&1; do sleep 2; done'
          touch /var/lib/up-rehearsal/bootstrap.complete
  PrepareProbeDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub "up-db-refresh-prepare-${RehearsalId}"
      DocumentType: Command
      Tags:
        - {Key: university-portal:disposable-rehearsal, Value: !Ref RehearsalId}
      Content:
        schemaVersion: "2.2"
        mainSteps:
          - action: aws:runShellScript
            name: prepareQueuedWork
            inputs:
              timeoutSeconds: "720"
              runCommand:
                - !Sub |
                    set -eu
                    cloud-init status --wait >/dev/null
                    timeout 600 sh -c 'until test -f /var/lib/up-rehearsal/bootstrap.complete; do sleep 5; done'
                    systemctl is-active --quiet redis6 uni-api-py uni-celery
                    cd /opt/up-rehearsal
                    timeout 90 sh -c 'until PYTHONPATH=. .venv/bin/celery -A app.tasks.celery_app control cancel_consumer scrape --timeout=20 >/dev/null 2>&1; do sleep 5; done'
                    PYTHONPATH=. .venv/bin/python - <<'PY'
                    import time
                    from app.tasks.celery_app import celery_app
                    deadline=time.monotonic()+90
                    while True:
                        active=celery_app.control.inspect(timeout=20).active()
                        if isinstance(active,dict) and active: break
                        if time.monotonic()>=deadline: raise RuntimeError("Celery worker did not answer active-task inspection")
                        time.sleep(5)
                    assert not [t for tasks in active.values() for t in tasks if t.get("name")=="scrape.university"]
                    celery_app.send_task("scrape.university",args=["${RehearsalId}"],queue="scrape")
                    PY
                    test "$(redis6-cli llen scrape)" = 1
                    echo rehearsal-probe-queued
  RefreshDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub "up-db-refresh-${RehearsalId}"
      DocumentType: Command
      Tags:
        - {Key: university-portal:disposable-rehearsal, Value: !Ref RehearsalId}
      Content:
        schemaVersion: "2.2"
        description: Production-parity atomic database credential refresh
        mainSteps:
          - action: aws:runShellScript
            name: refreshDatabaseCredential
            inputs:
              timeoutSeconds: "720"
              runCommand:
                - !Sub |
                    set -eu
                    set +x
                    timeout 600 sh -c 'until test -f /var/lib/up-rehearsal/bootstrap.complete; do sleep 5; done'
                    env=/etc/university-portal/database.env
                    backup=$env.pre-refresh
                    ca=/etc/university-portal/aws-rds-global-bundle.pem
                    combined=/etc/university-portal/system-and-rds-ca-bundle.pem
                    cd /opt/up-rehearsal
                    timeout 90 sh -c 'until PYTHONPATH=. .venv/bin/celery -A app.tasks.celery_app control cancel_consumer scrape --timeout=20 >/dev/null 2>&1; do sleep 5; done'
                    PYTHONPATH=. .venv/bin/python - <<'PY'
                    import time
                    from app.tasks.celery_app import celery_app
                    deadline=time.monotonic()+90
                    while True:
                        active=celery_app.control.inspect(timeout=20).active()
                        if isinstance(active,dict) and active: break
                        if time.monotonic()>=deadline: raise RuntimeError("Celery worker did not answer active-task inspection")
                        time.sleep(5)
                    assert not [t for tasks in active.values() for t in tasks if t.get("name")=="scrape.university"]
                    PY
                    curl --proto '=https' --tlsv1.2 --fail --silent https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o "$ca"
                    cat /etc/pki/tls/certs/ca-bundle.crt "$ca" >"$combined"
                    .venv/bin/python - "$env" '${Database.MasterUserSecret.SecretArn}' '${AWS::Region}' "$combined" <<'PY'
                    import json,os,ssl,sys,time
                    from urllib.parse import quote,unquote,urlsplit
                    import boto3,psycopg
                    env,arn,region,ca=sys.argv[1:]
                    r=boto3.client("secretsmanager",region_name=region).get_secret_value(SecretId=arn)
                    secret=json.loads(r["SecretString"])
                    assert all(isinstance(secret.get(k),str) and secret[k] for k in ("username","password"))
                    secret={k:secret[k] for k in ("username","password")}
                    old=urlsplit(open(env).read().split('"')[1])
                    host=secret.get("host") or old.hostname
                    port=int(secret.get("port") or old.port or 5432)
                    dbname=secret.get("dbname") or unquote(old.path.lstrip("/"))
                    ssl.create_default_context(cafile=ca)
                    url="postgresql://{}:{}@{}:{}/{}".format(quote(secret["username"],safe=""),quote(secret["password"],safe=""),host,port,quote(dbname,safe=""))
                    with open(env+".new","w") as f: f.write(f'DATABASE_URL="{url}"\nDATABASE_REQUIRE_TLS="true"\nSSL_CERT_FILE="{ca}"\nDATABASE_SECRET_VERSION="{r["VersionId"]}"\n')
                    os.chmod(env+".new",0o600)
                    deadline=time.monotonic()+120
                    while True:
                        try:
                            with psycopg.connect(host=host,port=port,user=secret["username"],password=secret["password"],dbname=dbname,sslmode="verify-full",sslrootcert=ca,connect_timeout=10) as connection:
                                assert connection.execute("SELECT 1").fetchone()[0]==1
                            break
                        except psycopg.OperationalError:
                            if time.monotonic()>=deadline: raise
                            time.sleep(5)
                    PY
                    if cmp -s "$env.new" "$env"; then rm "$env.new"; echo database-credentials-refreshed-and-db-verified; exit 0; fi
                    cp -p "$env" "$backup"
                    trap 'mv -f "$backup" "$env"; systemctl restart uni-api-py uni-celery || true' EXIT
                    mv -f "$env.new" "$env"
                    for unit in uni-api-py uni-celery; do
                      install -d "/etc/systemd/system/$unit.service.d"
                      printf '[Service]\nEnvironmentFile=/etc/university-portal/database.env\n' >"/etc/systemd/system/$unit.service.d/zz-database-credentials.conf"
                    done
                    systemctl daemon-reload
                    systemctl restart uni-api-py uni-celery
                    systemctl is-active --quiet uni-api-py uni-celery
                    curl --fail --silent http://127.0.0.1:18080/ >/dev/null
                    .venv/bin/python - "$env" <<'PY'
                    import shlex,subprocess,sys
                    expected={}
                    for line in open(sys.argv[1]):
                        key,value=shlex.split(line)[0].split("=",1); expected[key]=value
                    for unit in ("uni-api-py","uni-celery"):
                        pid=subprocess.check_output(["systemctl","show","-p","MainPID","--value",unit],text=True).strip()
                        process=dict(x.split(b"=",1) for x in open(f"/proc/{pid}/environ","rb").read().split(b"\0") if b"=" in x)
                        assert all(process.get(k.encode())==v.encode() for k,v in expected.items())
                    PY
                    timeout 90 sh -c 'until PYTHONPATH=. .venv/bin/celery -A app.tasks.celery_app control add_consumer scrape --timeout=20 >/dev/null 2>&1; do sleep 5; done'
                    timeout 60 sh -c 'until test "$(sqlite3 /var/lib/up-rehearsal/executions.sqlite3 \"select count from executions where run_id=\\\"${RehearsalId}\\\";\")" = 1; do sleep 1; done'
                    test "$(redis6-cli llen scrape)" = 0
                    test "$(sqlite3 /var/lib/up-rehearsal/executions.sqlite3 "select count from executions where run_id='${RehearsalId}';")" = 1
                    rm -f "$backup"
                    trap - EXIT
                    echo database-credentials-refreshed-and-db-verified
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/up-db-refresh-${RehearsalId}"
      Policies:
        - PolicyName: invoke-one-rehearsal-document
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Host}"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${RefreshDocument}"
  ScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub "up-db-refresh-${RehearsalId}"
      Tags:
        - {Key: university-portal:disposable-rehearsal, Value: !Ref RehearsalId}
  Schedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "up-db-refresh-${RehearsalId}"
      GroupName: !Ref ScheduleGroup
      State: DISABLED
      ScheduleExpression: rate(5 minutes)
      FlexibleTimeWindow: {Mode: "OFF"}
      Target:
        Arn: arn:aws:scheduler:::aws-sdk:ssm:sendCommand
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"DocumentName":"${RefreshDocument}","InstanceIds":["${Host}"],"Comment":"scheduler-origin disposable database refresh rehearsal"}'

Outputs:
  HostId: {Value: !Ref Host}
  DatabaseId: {Value: !Ref Database}
  DatabaseSecretArn: {Value: !GetAtt Database.MasterUserSecret.SecretArn}
  PrepareDocument: {Value: !Ref PrepareProbeDocument}
  RefreshDocument: {Value: !Ref RefreshDocument}
  ScheduleGroup: {Value: !Ref ScheduleGroup}
  ScheduleName: {Value: !Ref Schedule}